<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Ledgerly — Personal Finance</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-in">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="6.5" width="18" height="13.5" rx="2.5"></rect>
          <path d="M3 9.5h13.5a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H3"></path>
          <circle cx="15.8" cy="13" r="0.6" fill="currentColor" stroke="none"></circle>
        </svg>
      </span>
      <span class="brand-name">Ledgerly</span>
      <span class="brand-sub">Personal finance</span>
    </div>
    <div class="controls">
      <label class="field">
        <span class="field-label">Month</span>
        <select id="monthSelect" aria-label="Select month"></select>
      </label>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="kpis" id="kpiGrid" aria-label="Key monthly figures"></section>

  <section class="charts">
    <article class="card" id="catCard">
      <div class="card-head">
        <h2>Where the money went</h2>
        <p class="card-sub" id="catSub"></p>
      </div>
      <div id="catChart" class="cat-chart"></div>
    </article>

    <article class="card">
      <div class="card-head">
        <h2>Income vs spending</h2>
        <p class="card-sub">Six months, net-positive every month</p>
      </div>
      <div id="trendChart" class="trend-chart"></div>
    </article>
  </section>

  <section class="lower">
    <article class="card">
      <div class="card-head">
        <h2>Recent transactions</h2>
        <p class="card-sub" id="txSub"></p>
      </div>
      <ul class="tx-list" id="txList"></ul>
    </article>

    <article class="card">
      <div class="card-head">
        <h2>Budget progress</h2>
        <p class="card-sub" id="budgetSub"></p>
      </div>
      <div id="budgetList" class="budget-list"></div>
    </article>
  </section>
</main>

<footer class="wrap foot">Sample data for demonstration — one person, April to September 2026.</footer>

<div id="tooltip" class="tooltip" role="tooltip" hidden></div>
<script src="app.js"></script>
</body>
</html>
