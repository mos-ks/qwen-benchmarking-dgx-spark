<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>Ledger — Personal Finance</title>
<style>
  /* ------------------------------------------------------------------ *
   * Design tokens
   * ------------------------------------------------------------------ */
  :root {
    color-scheme: light dark;

    /* Typography */
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --fs-xs: .75rem;
    --fs-sm: .8125rem;
    --fs-md: .9375rem;
    --fs-lg: 1.0625rem;
    --fs-xl: 1.375rem;
    --fs-2xl: 1.75rem;
    --w-reg: 400; --w-med: 500; --w-semi: 600; --w-bold: 700;

    /* Spacing scale (4px base) */
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px;
    --sp-6: 24px; --sp-8: 32px; --sp-10: 40px; --sp-12: 48px;

    /* Radii */
    --r-1: 8px; --r-2: 12px; --r-3: 16px; --r-full: 999px;

    /* Light theme surfaces & text */
    --bg: #f4f6fb;
    --surface: #ffffff;
    --surface-2: #f7f9fc;
    --text: #0d1220;
    --muted: #5b6577;
    --faint: #8a94a6;
    --border: #e6eaf1;
    --border-strong: #d5dbe6;
    --grid: #edf0f6;
    --grid-strong: #dfe4ee;
    --sel-band: rgba(0,114,178,.07);

    /* Accent / state */
    --accent: #0072b2;
    --accent-soft: rgba(0,114,178,.12);
    --focus: #0b7fbf;
    --pos: #067647;
    --neg: #b42318;
    --warn: #b45309;
    --ok: #0f9d76;

    /* Chart / category colors (Okabe–Ito base, tuned for white) */
    --income: #0f9d76;
    --expense: #d55e00;
    --c-housing: #0072b2;
    --c-groceries: #009e73;
    --c-dining: #d55e00;
    --c-transport: #3f8fd0;
    --c-utilities: #e69f00;
    --c-entertainment: #cc79a7;
    --c-health: #149c8a;
    --c-shopping: #7a5195;
    --c-subscriptions: #5b6577;
    --c-travel: #0e7490;
    --c-other: #94a3b8;

    --chip-bg: #eef1f6;
    --tip-bg: #0d1220;
    --tip-text: #f7f9fc;
    --tip-border: rgba(255,255,255,.12);
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 2px 8px rgba(16,24,40,.06);
    --header-bg: rgba(255,255,255,.72);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0e15;
      --surface: #12161f;
      --surface-2: #161b25;
      --text: #e7ebf3;
      --muted: #9aa4b6;
      --faint: #6c7688;
      --border: #232b38;
      --border-strong: #2e3849;
      --grid: #1b212c;
      --grid-strong: #2a3341;
      --sel-band: rgba(124,199,245,.09);

      --accent: #56b4e9;
      --accent-soft: rgba(86,180,233,.16);
      --focus: #7cc7f5;
      --pos: #34c39a;
      --neg: #f87171;
      --warn: #f0b429;
      --ok: #34c39a;

      --income: #2fbf9f;
      --expense: #f4813f;
      --c-housing: #4ea1e0;
      --c-groceries: #2fbf9f;
      --c-dining: #f4813f;
      --c-transport: #7cc7f5;
      --c-utilities: #f0b429;
      --c-entertainment: #f0a6cb;
      --c-health: #34d399;
      --c-shopping: #b98ad1;
      --c-subscriptions: #9aa4b6;
      --c-travel: #22d3ee;
      --c-other: #64748b;

      --chip-bg: #1b212c;
      --tip-bg: #e7ebf3;
      --tip-text: #0b0e15;
      --tip-border: rgba(0,0,0,.15);
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35);
      --header-bg: rgba(11,14,21,.72);
    }
  }

  /* ------------------------------------------------------------------ *
   * Base
   * ------------------------------------------------------------------ */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font);
    font-size: var(--fs-md);
    line-height: 1.5;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }
  ::selection { background: var(--accent-soft); color: var(--text); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

  /* Themed scrollbars */
  * { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; border: 3px solid var(--surface); }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ------------------------------------------------------------------ *
   * Layout
   * ------------------------------------------------------------------ */
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 var(--sp-6); }

  header.app {
    position: sticky; top: 0; z-index: 20;
    background: var(--header-bg);
    backdrop-filter: saturate(180%) blur(12px);
    -webkit-backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .app-bar { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4); padding: var(--sp-4) 0; }
  .brand { display: flex; align-items: center; gap: var(--sp-3); min-width: 0; }
  .brand-mark {
    width: 38px; height: 38px; flex: none; border-radius: 11px;
    background: linear-gradient(160deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #7a5195));
    display: grid; place-items: center; color: #fff; box-shadow: var(--shadow);
  }
  .brand-mark svg { width: 22px; height: 22px; }
  .brand-text { display: flex; flex-direction: column; min-width: 0; }
  .brand-name { font-weight: var(--w-bold); font-size: var(--fs-lg); letter-spacing: -.01em; }
  .brand-sub { font-size: var(--fs-xs); color: var(--muted); }

  /* Month selector */
  .month-nav { display: flex; align-items: center; gap: var(--sp-1); flex: none; }
  .month-nav .navbtn {
    width: 38px; height: 38px; border-radius: var(--r-1); border: 1px solid var(--border);
    background: var(--surface); color: var(--text); display: grid; place-items: center; cursor: pointer;
    transition: background .16s ease, border-color .16s ease, transform .16s ease;
  }
  .month-nav .navbtn:hover:not(:disabled) { background: var(--surface-2); border-color: var(--border-strong); }
  .month-nav .navbtn:active:not(:disabled) { transform: translateY(1px); }
  .month-nav .navbtn:disabled { opacity: .4; cursor: not-allowed; }
  .month-nav .navbtn svg { width: 18px; height: 18px; }
  .month-select-wrap { position: relative; }
  select#monthSelect {
    appearance: none; -webkit-appearance: none;
    font: var(--w-semi) var(--fs-md)/1 var(--font);
    color: var(--text); background: var(--surface);
    border: 1px solid var(--border-strong); border-radius: var(--r-1);
    padding: 11px 38px 11px 14px; cursor: pointer; min-width: 168px;
    transition: border-color .16s ease, box-shadow .16s ease;
  }
  select#monthSelect:hover { border-color: var(--accent); }
  .month-select-wrap::after {
    content: ""; position: absolute; right: 14px; top: 50%; width: 9px; height: 9px;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: translateY(-65%) rotate(45deg); pointer-events: none;
  }
  .person {
    display: flex; align-items: center; gap: var(--sp-2); flex: none; padding-left: var(--sp-3);
    border-left: 1px solid var(--border);
  }
  .avatar {
    width: 36px; height: 36px; border-radius: var(--r-full); flex: none;
    background: var(--accent-soft); color: var(--accent); display: grid; place-items: center;
    font-weight: var(--w-bold); font-size: var(--fs-sm);
  }
  .person .who { font-size: var(--fs-sm); font-weight: var(--w-semi); }
  .person .plan { font-size: var(--fs-xs); color: var(--muted); }

  main { padding: var(--sp-8) 0 var(--sp-12); }
  .page-head { margin: 0 0 var(--sp-6); }
  .page-head h1 { margin: 0; font-size: var(--fs-2xl); font-weight: var(--w-bold); letter-spacing: -.02em; }
  .page-head p { margin: var(--sp-1) 0 0; color: var(--muted); font-size: var(--fs-md); }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--sp-4); margin-bottom: var(--sp-4); }
  .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-4); margin-bottom: var(--sp-4); }
  .grid-bottom { display: grid; grid-template-columns: 1.5fr 1fr; gap: var(--sp-4); }

  /* Card */
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-3);
    padding: var(--sp-5); box-shadow: var(--shadow);
  }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-3); margin-bottom: var(--sp-5); }
  .card-title { margin: 0; font-size: var(--fs-lg); font-weight: var(--w-semi); letter-spacing: -.01em; }
  .card-sub { font-size: var(--fs-xs); color: var(--muted); }

  /* KPI tile */
  .kpi { display: flex; flex-direction: column; gap: var(--sp-3); }
  .kpi-top { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); }
  .kpi-label { font-size: var(--fs-sm); color: var(--muted); font-weight: var(--w-med); }
  .kpi-ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--chip-bg); }
  .kpi-ic svg { width: 18px; height: 18px; }
  .kpi-value { font-size: var(--fs-2xl); font-weight: var(--w-bold); letter-spacing: -.02em; line-height: 1.1; }
  .kpi-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); flex-wrap: wrap; }
  .delta { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-sm); font-weight: var(--w-semi); }
  .delta svg { width: 14px; height: 14px; }
  .delta.pos { color: var(--pos); }
  .delta.neg { color: var(--neg); }
  .delta.flat { color: var(--muted); }
  .delta .vs { color: var(--muted); font-weight: var(--w-reg); }
  .spark { width: 96px; height: 30px; flex: 0 1 96px; min-width: 56px; max-width: 96px; }
  .spark path.line { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: drawIn .9s ease forwards; }
  .spark path.area { stroke: none; }
  .spark circle { stroke: var(--surface); stroke-width: 2; opacity: 0; animation: fadeIn .4s ease .6s forwards; }
  .bar { transform-box: fill-box; transform-origin: bottom center; animation: barIn .6s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes drawIn { to { stroke-dashoffset: 0; } }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes barIn { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @media (prefers-reduced-motion: reduce) {
    .spark path.line { animation-duration: 1ms; stroke-dashoffset: 0; }
    .spark circle { animation-duration: 1ms; opacity: 1; }
    .bar { animation: none; }
    .fill { transition: none; }
  }

  /* Chart legend */
  .legend { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4); }
  .legend .li { display: inline-flex; align-items: center; gap: 7px; font-size: var(--fs-sm); color: var(--muted); }
  .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }

  /* Donut layout */
  .donut-wrap { display: flex; align-items: center; gap: var(--sp-6); flex-wrap: wrap; }
  .donut-box { position: relative; flex: none; width: 188px; height: 188px; }
  .donut-box svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .donut-seg { transition: stroke-width .16s ease, opacity .16s ease; cursor: pointer; }
  .donut-seg:hover { stroke-width: 30; }
  .donut-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
  .donut-center .dc-label { font-size: var(--fs-xs); color: var(--muted); font-weight: var(--w-med); }
  .donut-center .dc-value { font-size: var(--fs-xl); font-weight: var(--w-bold); letter-spacing: -.02em; }
  .donut-legend { flex: 1 1 190px; min-width: 180px; display: flex; flex-direction: column; gap: 9px; }
  .dl-row { display: grid; grid-template-columns: 12px 1fr auto; align-items: center; gap: 10px; font-size: var(--fs-sm); }
  .dl-name { color: var(--text); }
  .dl-val { color: var(--muted); font-variant-numeric: tabular-nums; }

  /* SVG chart shared */
  .chart { width: 100%; height: auto; display: block; }
  .chart .g-grid { stroke: var(--grid); stroke-width: 1; }
  .chart .g-base { stroke: var(--grid-strong); stroke-width: 1.5; }
  .chart .g-ax { fill: var(--muted); font: var(--w-med) 11px var(--font); }
  .chart .g-band { fill: var(--sel-band); }
  .bar { transition: opacity .15s ease; }
  .bar-group { cursor: pointer; }
  .bar-group:hover .bar { opacity: .85; }
  .hit { fill: transparent; }

  /* Transactions */
  .tx-scroll { max-height: 452px; overflow-y: auto; margin: calc(var(--sp-2) * -1) calc(var(--sp-2) * -1) calc(var(--sp-2) * -1); padding: var(--sp-2); }
  .tx { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: var(--sp-3); padding: 11px var(--sp-2); border-radius: var(--r-1); }
  .tx + .tx { margin-top: 2px; }
  .tx:hover { background: var(--surface-2); }
  .icon-chip { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: var(--chip-bg); color: var(--chip, var(--muted)); }
  .icon-chip svg { width: 20px; height: 20px; }
  .tx-mid { min-width: 0; }
  .tx-desc { font-weight: var(--w-semi); font-size: var(--fs-md); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx-meta { font-size: var(--fs-xs); color: var(--muted); }
  .tx-amt { font-weight: var(--w-semi); font-variant-numeric: tabular-nums; text-align: right; }
  .tx-amt.in { color: var(--income); }
  .tx-amt.out { color: var(--text); }

  /* Budgets */
  .budget { padding: var(--sp-3) 0; }
  .budget + .budget { border-top: 1px solid var(--border); }
  .budget-top { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); margin-bottom: 9px; }
  .budget-name { display: flex; align-items: center; gap: var(--sp-2); font-weight: var(--w-semi); font-size: var(--fs-md); }
  .budget-dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .budget-nums { font-size: var(--fs-sm); color: var(--muted); font-variant-numeric: tabular-nums; }
  .budget-nums b { color: var(--text); font-weight: var(--w-semi); }
  .track { height: 8px; border-radius: 999px; background: var(--chip-bg); overflow: hidden; }
  .fill { height: 100%; border-radius: 999px; transition: width .5s cubic-bezier(.2,.7,.2,1); }
  .fill.ok { background: var(--c-housing); }
  .fill.warn { background: var(--warn); }
  .fill.over { background: var(--neg); }
  .budget-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 7px; font-size: var(--fs-xs); }
  .budget-pct { color: var(--muted); }
  .tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-weight: var(--w-semi); font-size: var(--fs-xs); }
  .tag.ok { color: var(--muted); background: transparent; }
  .tag.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .tag.over { color: var(--neg); background: color-mix(in srgb, var(--neg) 14%, transparent); }
  .tag svg { width: 12px; height: 12px; }

  .visually-hidden { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  /* Tooltip */
  #tooltip {
    position: fixed; z-index: 60; pointer-events: none; left: 0; top: 0;
    background: var(--tip-bg); color: var(--tip-text); border: 1px solid var(--tip-border);
    border-radius: 10px; padding: 9px 11px; font-size: var(--fs-sm); line-height: 1.35;
    box-shadow: var(--shadow); opacity: 0; transform: translate(-50%, calc(-100% - 12px));
    transition: opacity .12s ease; max-width: 220px;
  }
  #tooltip.show { opacity: 1; }
  #tooltip.below { transform: translate(-50%, 12px); }
  #tooltip .tt-title { font-weight: var(--w-bold); margin-bottom: 3px; display: flex; align-items: center; gap: 7px; }
  #tooltip .tt-title .swatch { width: 9px; height: 9px; border-radius: 3px; }
  #tooltip .tt-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  #tooltip .tt-row .k { opacity: .7; }

  footer.app { border-top: 1px solid var(--border); color: var(--muted); font-size: var(--fs-xs); }
  footer.app .wrap { padding-top: var(--sp-5); padding-bottom: var(--sp-5); display: flex; justify-content: space-between; gap: var(--sp-3); flex-wrap: wrap; }

  /* ------------------------------------------------------------------ *
   * Responsive
   * ------------------------------------------------------------------ */
  @media (max-width: 900px) {
    .grid-2, .grid-bottom { grid-template-columns: 1fr; }
    .donut-wrap { gap: var(--sp-5); }
  }
  @media (max-width: 560px) {
    .wrap { padding: 0 var(--sp-4); }
    .app-bar { flex-wrap: wrap; }
    .brand-sub, .person .plan { display: none; }
    .person { padding-left: var(--sp-2); }
    main { padding-top: var(--sp-6); }
    .page-head h1 { font-size: var(--fs-xl); }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .donut-box { width: 160px; height: 160px; margin: 0 auto; }
    .donut-wrap { justify-content: center; }
    .card { padding: var(--sp-4); }
  }
  @media (max-width: 360px) {
    .kpis { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: .001ms !important; }
    .fill { transition: none; }
  }
</style>
</head>
<body>
  <header class="app">
    <div class="wrap app-bar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M7 15l3.5-4 3 2.5L21 6"/></svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">Ledger</span>
          <span class="brand-sub">Personal finance</span>
        </div>
      </div>

      <nav class="month-nav" aria-label="Select month">
        <button class="navbtn" id="prevMonth" aria-label="Previous month">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span class="month-select-wrap">
          <select id="monthSelect" aria-label="Month"></select>
        </span>
        <button class="navbtn" id="nextMonth" aria-label="Next month">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </nav>

      <div class="person">
        <div class="avatar" aria-hidden="true">AR</div>
        <div>
          <div class="who">Ava Reyes</div>
          <div class="plan">Everyday checking</div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div class="page-head">
        <h1 id="greeting">Overview</h1>
        <p id="subline">Your money across the last six months.</p>
      </div>

      <!-- KPI cards -->
      <section class="kpis" id="kpis" aria-label="Key metrics"></section>

      <!-- Charts -->
      <div class="grid-2">
        <section class="card" aria-labelledby="t-cat">
          <div class="card-head">
            <h2 class="card-title" id="t-cat">Spending by category</h2>
            <span class="card-sub" id="cat-month-label"></span>
          </div>
          <div class="donut-wrap">
            <div class="donut-box">
              <div id="donut"></div>
              <div class="donut-center">
                <span class="dc-label">Total spent</span>
                <span class="dc-value num" id="donut-total"></span>
              </div>
            </div>
            <div class="donut-legend" id="donut-legend"></div>
          </div>
        </section>

        <section class="card" aria-labelledby="t-flow">
          <div class="card-head">
            <h2 class="card-title" id="t-flow">Income vs spending</h2>
            <div class="legend">
              <span class="li"><span class="swatch" style="background:var(--income)"></span>Income</span>
              <span class="li"><span class="swatch" style="background:var(--expense)"></span>Spending</span>
            </div>
          </div>
          <div id="bars"></div>
        </section>
      </div>

      <!-- Transactions + Budgets -->
      <div class="grid-bottom">
        <section class="card" aria-labelledby="t-tx">
          <div class="card-head">
            <h2 class="card-title" id="t-tx">Recent transactions</h2>
            <span class="card-sub" id="tx-count"></span>
          </div>
          <div class="tx-scroll" id="tx-list"></div>
        </section>

        <section class="card" aria-labelledby="t-budget">
          <div class="card-head">
            <h2 class="card-title" id="t-budget">Budget</h2>
            <span class="card-sub" id="budget-total"></span>
          </div>
          <div id="budgets"></div>
        </section>
      </div>
    </div>
  </main>

  <footer class="app">
    <div class="wrap">
      <span>Ledger — demo with sample data for one person.</span>
      <span>Light &amp; dark follow your system setting.</span>
    </div>
  </footer>

  <div id="tooltip" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  /* ================================================================== *
   * Deterministic sample-data model (no backend, no libraries)
   * One person, six selectable months (Apr–Sep 2026) plus a hidden
   * baseline month (Mar) so every shown month has a "vs last month".
   * ================================================================== */

  var CATS = {
    housing:       { label: "Housing",        v: "--c-housing" },
    groceries:     { label: "Groceries",      v: "--c-groceries" },
    dining:        { label: "Dining",         v: "--c-dining" },
    transport:     { label: "Transport",      v: "--c-transport" },
    utilities:     { label: "Utilities",      v: "--c-utilities" },
    entertainment: { label: "Entertainment",  v: "--c-entertainment" },
    health:        { label: "Health",         v: "--c-health" },
    shopping:      { label: "Shopping",       v: "--c-shopping" },
    subscriptions: { label: "Subscriptions",  v: "--c-subscriptions" },
    travel:        { label: "Travel",         v: "--c-travel" }
  };
  var INCOME_CATS = {
    salary:    { label: "Salary",    v: "--income" },
    freelance: { label: "Freelance", v: "--income" },
    interest:  { label: "Interest",  v: "--income" }
  };
  function catMeta(key) { return CATS[key] || INCOME_CATS[key] || { label: key, v: "--muted" }; }

  // Monthly limits per spending category (tuned against the generated data).
  var BUDGETS = {
    housing: 1850, groceries: 430, dining: 265, transport: 200, utilities: 300,
    entertainment: 150, health: 150, shopping: 380, subscriptions: 90, travel: 500
  };

  var MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var MONTH_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function buildModel() {
    var rnd = mulberry32(20261010);
    var ri = function (a, b) { return a + Math.floor(rnd() * (b - a + 1)); };
    var pick = function (arr) { return arr[Math.floor(rnd() * arr.length)]; };
    var cents = function () { return Math.round(rnd() * 99) / 100; };
    function money(base) { return Math.round((base + cents()) * 100) / 100; }

    var START_YEAR = 2026, START_M = 2 /* March, 0-based */, COUNT = 7 /* Mar..Sep */;
    var months = [];

    for (var k = 0; k < COUNT; k++) {
      var abs = START_M + k;
      var mIdx = abs % 12;
      var year = START_YEAR + Math.floor(abs / 12);
      var txns = [];

      // ---- income ----
      txns.push({ cat: "salary", desc: "Acme Corp — Salary", type: "income", amt: 4380, day: ri(1, 3) });
      if (rnd() < 0.28) txns.push({ cat: "salary", desc: "Acme Corp — Quarterly bonus", type: "income", amt: money(ri(500, 1100)), day: ri(10, 20) });
      if (rnd() < 0.55) txns.push({ cat: "freelance", desc: pick(["Freelance — Northwind", "Freelance — Toptal", "Freelance — Studio Ko"]), type: "income", amt: money(ri(280, 1150)), day: ri(5, 26) });
      if (rnd() < 0.5) txns.push({ cat: "interest", desc: "Interest — Savings", type: "income", amt: money(ri(2, 9)), day: 28 });

      // ---- housing ----
      txns.push({ cat: "housing", desc: "Monthly rent", type: "expense", amt: 1850, day: 1 });

      // ---- utilities ----
      txns.push({ cat: "utilities", desc: "PG&E — Electric", type: "expense", amt: money(ri(58, 132)), day: ri(6, 14) });
      txns.push({ cat: "utilities", desc: "Comcast — Internet", type: "expense", amt: 79, day: ri(8, 16) });
      txns.push({ cat: "utilities", desc: "AT&T — Wireless", type: "expense", amt: 65, day: ri(12, 20) });
      if (rnd() < 0.6) txns.push({ cat: "utilities", desc: "City of Oakland — Water", type: "expense", amt: money(ri(26, 52)), day: ri(15, 22) });

      // ---- groceries ----
      for (var g = 0, gn = ri(4, 6); g < gn; g++)
        txns.push({ cat: "groceries", desc: pick(["Whole Foods", "Trader Joe’s", "Safeway", "Costco", "Rainier Grocery", "Boulevard Market"]), type: "expense", amt: money(ri(24, 92)), day: ri(1, 28) });

      // ---- dining ----
      for (var d = 0, dn = ri(5, 8); d < dn; d++)
        txns.push({ cat: "dining", desc: pick(["Blue Bottle", "Sweetgreen", "Café Mailhaud", "Thai Basil", "Ramen Nagi", "La Taqueria", "Sightglass", "Nopalito", "Pho Holic", "Brenda’s"]), type: "expense", amt: money(ri(9, 58)), day: ri(1, 28) });
      if (rnd() < 0.6) txns.push({ cat: "dining", desc: pick(["Chez Panisse — date night", "Atelier Crenn", "SingleThread"]), type: "expense", amt: money(ri(120, 210)), day: ri(18, 27) });

      // ---- transport ----
      for (var t = 0, tn = ri(3, 5); t < tn; t++)
        txns.push({ cat: "transport", desc: pick(["Uber", "Lyft", "BART Clipper", "Shell", "Chevron", "SF Muni", "City Parking"]), type: "expense", amt: money(ri(6, 58)), day: ri(1, 28) });

      // ---- entertainment ----
      for (var e = 0, en = ri(2, 3); e < en; e++)
        txns.push({ cat: "entertainment", desc: pick(["AMC Theatres", "Steam", "Concert — Fox Theatre", "Bowling", "Vinyl Records", "Film at Lincoln"]), type: "expense", amt: money(ri(12, 55)), day: ri(1, 28) });

      // ---- health ----
      for (var h = 0, hn = ri(1, 2); h < hn; h++)
        txns.push({ cat: "health", desc: pick(["CVS Pharmacy", "Dental copay", "Walgreens", "Therapy — BetterHelp"]), type: "expense", amt: money(ri(18, 95)), day: ri(1, 28) });

      // ---- shopping ----
      for (var s = 0, sn = ri(2, 3); s < sn; s++)
        txns.push({ cat: "shopping", desc: pick(["Amazon", "Uniqlo", "Muji", "Best Buy", "Nordstrom", "Etsy", "REI"]), type: "expense", amt: money(ri(22, 170)), day: ri(1, 28) });
      if (rnd() < 0.45) txns.push({ cat: "shopping", desc: pick(["Apple Store", "Herman Miller", "Dyson"]), type: "expense", amt: money(ri(180, 360)), day: ri(2, 26) });

      // ---- subscriptions (fixed recurring) ----
      txns.push({ cat: "subscriptions", desc: "Netflix", type: "expense", amt: 15.49, day: 7 });
      txns.push({ cat: "subscriptions", desc: "Spotify", type: "expense", amt: 10.99, day: 12 });
      txns.push({ cat: "subscriptions", desc: "iCloud+", type: "expense", amt: 2.99, day: 3 });
      txns.push({ cat: "subscriptions", desc: "New York Times", type: "expense", amt: 8, day: 5 });
      txns.push({ cat: "subscriptions", desc: "FitLife Gym", type: "expense", amt: 39, day: 2 });

      // ---- travel (only some months) ----
      if (rnd() < 0.4) txns.push({ cat: "travel", desc: pick(["United — SFO→SEA", "Airbnb — Lake Tahoe", "Amtrak — Acela"]), type: "expense", amt: money(ri(180, 620)), day: ri(3, 24) });

      txns.sort(function (a, b) { return a.day - b.day; });

      var income = 0, expense = 0;
      for (var i = 0; i < txns.length; i++) { if (txns[i].type === "income") income += txns[i].amt; else expense += txns[i].amt; }

      months.push({
        i: k, year: year, month: mIdx,
        id: year + "-" + mIdx,
        label: MONTH_NAMES[mIdx], short: MONTH_SHORT[mIdx],
        txns: txns,
        income: Math.round(income * 100) / 100,
        expense: Math.round(expense * 100) / 100
      });
    }

    // running balance
    var bal = 8125;
    for (var j = 0; j < months.length; j++) {
      bal = Math.round((bal + months[j].income - months[j].expense) * 100) / 100;
      months[j].balance = bal;
    }

    var display = months.slice(1); // Apr..Sep (6 selectable)
    return { months: months, display: display };
  }

  var MODEL = buildModel();

  /* ================================================================== *
   * Icons (authored inline SVG, single 1.9 stroke weight)
   * ================================================================== */
  var ICONS = {
    housing: '<path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-7h6v7"/>',
    groceries: '<circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h2l2.2 11.2a1.5 1.5 0 0 0 1.5 1.2h8.4a1.5 1.5 0 0 0 1.5-1.2L21 7H5.2"/>',
    dining: '<path d="M4 3v6a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2V3"/><path d="M6.5 3v18"/><path d="M16 3c-1.4 0-2.4 2-2.4 5s1 4 2.4 4 2.4-1 2.4-4-1-5-2.4-5z"/><path d="M16 12v9"/>',
    transport: '<path d="M3 13l1.8-4.8A2 2 0 0 1 6.7 7h10.6a2 2 0 0 1 1.9 1.2L21 13v4a1 1 0 0 1-1 1h-1v-1.5H5V18H4a1 1 0 0 1-1-1z"/><path d="M3 13h18"/><circle cx="7" cy="16" r="1.1"/><circle cx="17" cy="16" r="1.1"/>',
    utilities: '<path d="M13 2 4 14h6l-1 8 9-12h-6z"/>',
    entertainment: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 9h4M3 15h4M17 9h4M17 15h4"/>',
    health: '<path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 1 0-7.1 7.1L12 21l8.8-8.3a5 5 0 0 0 0-7.1z"/>',
    shopping: '<path d="M6 8h12l-1 12H7z"/><path d="M9 8a3 3 0 0 1 6 0"/>',
    subscriptions: '<path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/>',
    travel: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/>',
    salary: '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/>',
    freelance: '<rect x="3" y="5" width="18" height="11" rx="2"/><path d="M2 20h20"/>',
    interest: '<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
    balance: '<path d="M3 6h18v12H3z"/><path d="M3 10h18"/><circle cx="17" cy="14" r="1.3"/>',
    income: '<path d="M12 19V5"/><path d="M6 11l6-6 6 6"/>',
    spending: '<path d="M12 5v14"/><path d="M6 13l6 6 6-6"/>',
    savings: '<path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M12 3v9"/>'
  };
  function icon(name) {
    var inner = ICONS[name] || ICONS.interest;
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + inner + '</svg>';
  }

  /* ================================================================== *
   * Formatting helpers
   * ================================================================== */
  function money(n, dec) {
    if (dec === undefined) dec = 2;
    return "$" + Number(n).toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec });
  }
  function money0(n) { return money(n, 0); }
  function axisFmt(n) {
    if (n >= 1000) { var v = n / 1000; return "$" + (v % 1 === 0 ? v.toFixed(0) : v.toFixed(1)) + "k"; }
    return "$" + n.toFixed(0);
  }

  /* ================================================================== *
   * Tooltip
   * ================================================================== */
  var tipEl = document.getElementById("tooltip");
  function showTip(evt, color, title, rows) {
    var html = '<div class="tt-title">' + (color ? '<span class="swatch" style="background:' + color + '"></span>' : "") + title + "</div>";
    for (var i = 0; i < rows.length; i++) html += '<div class="tt-row"><span class="k">' + rows[i][0] + "</span><span class=\"num\">" + rows[i][1] + "</span></div>";
    tipEl.innerHTML = html;
    tipEl.classList.add("show");
    moveTip(evt);
  }
  function moveTip(evt) {
    var x = evt.clientX, y = evt.clientY;
    tipEl.style.left = x + "px";
    var flip = y < 90;
    tipEl.classList.toggle("below", flip);
    tipEl.style.top = y + "px";
  }
  function hideTip() { tipEl.classList.remove("show"); }
  function bindTip(el, color, title, rows) {
    el.addEventListener("mouseenter", function (e) { showTip(e, color, title, rows); });
    el.addEventListener("mousemove", moveTip);
    el.addEventListener("mouseleave", hideTip);
  }

  /* ================================================================== *
   * State
   * ================================================================== */
  var state = { id: MODEL.display[MODEL.display.length - 1].id };
  function monthById(id) { for (var i = 0; i < MODEL.months.length; i++) if (MODEL.months[i].id === id) return MODEL.months[i]; return null; }
  function selectedMonth() { return monthById(state.id); }
  function priorMonth(mo) { return MODEL.months[mo.i - 1]; }

  /* ================================================================== *
   * Month selector
   * ================================================================== */
  var selEl = document.getElementById("monthSelect");
  MODEL.display.forEach(function (mo) {
    var o = document.createElement("option");
    o.value = mo.id; o.textContent = mo.label + " " + mo.year;
    selEl.appendChild(o);
  });
  function syncNav() {
    var di = indexOfDisplay(state.id);
    selEl.value = state.id;
    document.getElementById("prevMonth").disabled = di === 0;
    document.getElementById("nextMonth").disabled = di === MODEL.display.length - 1;
  }
  function indexOfDisplay(id) { for (var i = 0; i < MODEL.display.length; i++) if (MODEL.display[i].id === id) return i; return 0; }

  selEl.addEventListener("change", function () { state.id = selEl.value; render(); });
  document.getElementById("prevMonth").addEventListener("click", function () { step(-1); });
  document.getElementById("nextMonth").addEventListener("click", function () { step(1); });
  function step(dir) { var di = indexOfDisplay(state.id) + dir; if (di < 0 || di >= MODEL.display.length) return; state.id = MODEL.display[di].id; render(); }

  /* ================================================================== *
   * Sparkline
   * ================================================================== */
  function sparkline(values, colorVar) {
    var w = 96, h = 30, pad = 3;
    var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    var span = (max - min) || 1;
    var pts = values.map(function (v, i) {
      var x = pad + i * ((w - pad * 2) / (values.length - 1 || 1));
      var y = h - pad - ((v - min) / span) * (h - pad * 2);
      return [x, y];
    });
    var d = pts.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
    var area = d + " L" + pts[pts.length - 1][0].toFixed(1) + " " + (h - pad) + " L" + pts[0][0].toFixed(1) + " " + (h - pad) + " Z";
    var last = pts[pts.length - 1];
    return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true" preserveAspectRatio="none">' +
      '<path class="area" d="' + area + '" style="fill:' + colorVar + ';opacity:.10"/>' +
      '<path class="line" d="' + d + '" pathLength="1" style="stroke:' + colorVar + '"/>' +
      '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="2.6" style="fill:' + colorVar + '"/></svg>';
  }

  /* ================================================================== *
   * KPI cards
   * ================================================================== */
  function arrow(dir) {
    if (dir > 0) return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg>';
    if (dir < 0) return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M6 13l6 6 6-6"/></svg>';
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>';
  }
  function deltaChip(text, dir, favorable, priorLabel) {
    var cls = dir === 0 ? "flat" : (favorable ? "pos" : "neg");
    return '<span class="delta ' + cls + '">' + arrow(dir) + text + ' <span class="vs">vs ' + priorLabel + '</span></span>';
  }
  function savingsRate(mo) { return mo.income ? (mo.income - mo.expense) / mo.income * 100 : 0; }

  function renderKPIs(mo) {
    var prior = priorMonth(mo);
    var disp = MODEL.display;
    var balances = disp.map(function (m) { return m.balance; });
    var incomes = disp.map(function (m) { return m.income; });
    var expenses = disp.map(function (m) { return m.expense; });
    var rates = disp.map(savingsRate);

    function pctChange(cur, prev) { return prev ? (cur - prev) / prev * 100 : null; }

    // balance delta (currency)
    var balD = mo.balance - prior.balance;
    var balDir = Math.sign(balD);
    // income / spending pct
    var incD = pctChange(mo.income, prior.income);
    var expD = pctChange(mo.expense, prior.expense);
    var rate = savingsRate(mo), rateD = rate - savingsRate(prior);

    var cards = [
      { key: "balance", label: "Balance", icon: "balance", value: money0(mo.balance),
        chip: deltaChip((balD >= 0 ? "+" : "−") + money0(Math.abs(balD)), balDir, balD >= 0, prior.short),
        spark: sparkline(balances, "var(--c-housing)") },
      { key: "income", label: "Income", icon: "income", value: money0(mo.income),
        chip: incD === null ? deltaChip("New", 0, true, prior.short)
             : deltaChip((incD >= 0 ? "+" : "−") + Math.abs(incD).toFixed(1) + "%", Math.sign(incD), incD >= 0, prior.short),
        spark: sparkline(incomes, "var(--income)") },
      { key: "spending", label: "Spending", icon: "spending", value: money0(mo.expense),
        chip: expD === null ? deltaChip("New", 0, false, prior.short)
             : deltaChip((expD >= 0 ? "+" : "−") + Math.abs(expD).toFixed(1) + "%", Math.sign(expD), expD <= 0, prior.short),
        spark: sparkline(expenses, "var(--expense)") },
      { key: "savings", label: "Savings rate", icon: "savings", value: rate.toFixed(1) + "%",
        chip: deltaChip((rateD >= 0 ? "+" : "−") + Math.abs(rateD).toFixed(1) + " pts", Math.sign(rateD), rateD >= 0, prior.short),
        spark: sparkline(rates, "var(--ok)") }
    ];

    var html = "";
    cards.forEach(function (c) {
      html += '<article class="card kpi">' +
        '<div class="kpi-top"><span class="kpi-label">' + c.label + '</span>' +
        '<span class="kpi-ic" style="color:var(--' + iconTint(c.key) + ')">' + icon(c.icon) + '</span></div>' +
        '<div class="kpi-value num">' + c.value + '</div>' +
        '<div class="kpi-foot">' + c.chip + c.spark + '</div></article>';
    });
    document.getElementById("kpis").innerHTML = html;
  }
  function iconTint(k) {
    return { balance: "c-housing", income: "income", spending: "expense", savings: "ok" }[k] || "muted";
  }

  /* ================================================================== *
   * Donut — spending by category (top slices + Other)
   * ================================================================== */
  function renderDonut(mo) {
    var byCat = {};
    mo.txns.forEach(function (t) { if (t.type === "expense") byCat[t.cat] = (byCat[t.cat] || 0) + t.amt; });
    var entries = Object.keys(byCat).map(function (k) { return { cat: k, amt: byCat[k] }; })
      .sort(function (a, b) { return b.amt - a.amt; });
    var total = entries.reduce(function (s, e) { return s + e.amt; }, 0);
    var top = entries.slice(0, 5);
    var rest = entries.slice(5).reduce(function (s, e) { return s + e.amt; }, 0);
    if (rest > 0) top.push({ cat: "__other", amt: rest });

    document.getElementById("donut-total").textContent = money0(total);
    document.getElementById("cat-month-label").textContent = mo.label + " " + mo.year;

    var cx = 94, cy = 94, r = 74, sw = 26, C = 2 * Math.PI * r;
    var segs = "", acc = 0;
    top.forEach(function (e) {
      var frac = total ? e.amt / total : 0;
      var segLen = frac * C;
      var draw = Math.max(segLen - 2.5, 0.6);
      var colorVar = e.cat === "__other" ? "var(--c-other)" : "var(" + catMeta(e.cat).v + ")";
      var label = e.cat === "__other" ? "Other" : catMeta(e.cat).label;
      var pct = (frac * 100).toFixed(1);
      var tip = [label + " · " + pct + "%", ["Amount", money(e.amt)], ["Share", pct + "%"]];
      segs += '<circle class="donut-seg" cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" ' +
        'stroke-width="' + sw + '" stroke-dasharray="' + draw.toFixed(2) + ' ' + (C - draw).toFixed(2) + '" ' +
        'stroke-dashoffset="' + (-acc).toFixed(2) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')" ' +
        'style="stroke:' + colorVar + '" data-tip data-cat="' + e.cat + '" data-amt="' + e.amt + '" data-pct="' + pct + '"></circle>';
      acc += segLen;
    });
    var aria = "Spending by category for " + mo.label + ". " + top.map(function (e) {
      return (e.cat === "__other" ? "Other" : catMeta(e.cat).label) + " " + money0(e.amt);
    }).join(", ") + ".";
    document.getElementById("donut").innerHTML =
      '<svg viewBox="0 0 188 188" role="img" aria-label="' + aria + '">' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="var(--grid)" stroke-width="' + sw + '"/>' +
      segs + "</svg>";

    // legend
    var lg = "";
    top.forEach(function (e) {
      var colorVar = e.cat === "__other" ? "var(--c-other)" : "var(" + catMeta(e.cat).v + ")";
      var label = e.cat === "__other" ? "Other" : catMeta(e.cat).label;
      var pct = total ? (e.amt / total * 100).toFixed(0) : "0";
      lg += '<div class="dl-row"><span class="swatch" style="background:' + colorVar + '"></span>' +
        '<span class="dl-name">' + label + '</span><span class="dl-val">' + money0(e.amt) + ' · ' + pct + '%</span></div>';
    });
    document.getElementById("donut-legend").innerHTML = lg;

    // interactions
    var nodes = document.querySelectorAll(".donut-seg");
    Array.prototype.forEach.call(nodes, function (n) {
      var cat = n.getAttribute("data-cat");
      var amt = parseFloat(n.getAttribute("data-amt"));
      var pct = n.getAttribute("data-pct");
      var label = cat === "__other" ? "Other" : catMeta(cat).label;
      var colorVar = cat === "__other" ? "var(--c-other)" : "var(" + catMeta(cat).v + ")";
      bindTip(n, colorVar, label, [["Amount", money(amt)], ["Share of spending", pct + "%"]]);
    });
  }

  /* ================================================================== *
   * Grouped bar chart — income vs spending across the 6 months
   * ================================================================== */
  function niceStep(rough) {
    var pow = Math.pow(10, Math.floor(Math.log(rough) / Math.LN10));
    var n = rough / pow;
    var f = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
    return f * pow;
  }
  function renderBars(mo) {
    var disp = MODEL.display;
    var W = 680, H = 300, l = 46, r = 14, t = 16, b = 34;
    var plotW = W - l - r, plotH = H - t - b;
    var maxVal = 0;
    disp.forEach(function (m) { maxVal = Math.max(maxVal, m.income, m.expense); });
    var step = niceStep(maxVal / 4);
    var top = Math.ceil(maxVal / step) * step;

    var grid = "", ticks = top / step;
    for (var i = 0; i <= ticks; i++) {
      var val = i * step;
      var y = t + plotH - (val / top) * plotH;
      grid += '<line class="g-grid" x1="' + l + '" y1="' + y.toFixed(1) + '" x2="' + (W - r) + '" y2="' + y.toFixed(1) + '"/>';
      grid += '<text class="g-ax" x="' + (l - 8) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end">' + axisFmt(val) + '</text>';
    }
    var baseY = t + plotH;
    grid += '<line class="g-base" x1="' + l + '" y1="' + baseY + '" x2="' + (W - r) + '" y2="' + baseY + '"/>';

    var groupW = plotW / disp.length;
    var barW = Math.min(26, groupW * 0.3);
    var gap = groupW * 0.08;
    var bars = "";
    disp.forEach(function (m, idx) {
      var cxg = l + idx * groupW + groupW / 2;
      var xInc = cxg - barW - gap / 2;
      var xExp = cxg + gap / 2;
      var hInc = (m.income / top) * plotH;
      var hExp = (m.expense / top) * plotH;
      var selected = m.id === mo.id;
      if (selected) bars += '<rect class="g-band" x="' + (cxg - groupW / 2 + 4) + '" y="' + t + '" width="' + (groupW - 8) + '" height="' + plotH + '" rx="8"/>';
      bars += '<rect class="bar" x="' + xInc.toFixed(1) + '" y="' + (baseY - hInc).toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + hInc.toFixed(1) + '" rx="4" style="fill:var(--income)" pointer-events="none"/>';
      bars += '<rect class="bar" x="' + xExp.toFixed(1) + '" y="' + (baseY - hExp).toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + hExp.toFixed(1) + '" rx="4" style="fill:var(--expense)" pointer-events="none"/>';
      // hover + click target over whole group
      bars += '<rect class="bar-group hit" x="' + (cxg - groupW / 2) + '" y="' + t + '" width="' + groupW + '" height="' + plotH + '" data-month="' + m.id + '" tabindex="0" role="button" aria-label="' + m.label + ' ' + m.year + ': income ' + money0(m.income) + ', spending ' + money0(m.expense) + '"></rect>';
      bars += '<text class="g-ax" x="' + cxg.toFixed(1) + '" y="' + (H - 12) + '" text-anchor="middle"' + (selected ? ' style="fill:var(--text);font-weight:600"' : "") + '>' + m.short + '</text>';
    });

    var aria = "Income versus spending for each of the last six months. " + disp.map(function (m) {
      return m.short + " income " + money0(m.income) + ", spending " + money0(m.expense);
    }).join(". ") + ".";
    document.getElementById("bars").innerHTML =
      '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + aria + '">' + grid + bars + "</svg>";

    var groups = document.querySelectorAll(".bar-group");
    Array.prototype.forEach.call(groups, function (n) {
      var id = n.getAttribute("data-month");
      var m = monthById(id);
      bindTip(n, null, m.label + " " + m.year, [["Income", money(m.income)], ["Spending", money(m.expense)], ["Net", money(m.income - m.expense)]]);
      n.addEventListener("click", function () { if (indexOfDisplay(id) !== -1 && id !== state.id) { state.id = id; render(); } });
      n.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); state.id = id; render(); } });
    });
  }

  /* ================================================================== *
   * Transactions
   * ================================================================== */
  function renderTransactions(mo) {
    var tx = mo.txns.slice().sort(function (a, b) { return b.day - a.day; });
    var html = "";
    tx.forEach(function (t) {
      var meta = catMeta(t.cat);
      var inc = t.type === "income";
      var sign = inc ? "+" : "−";
      html += '<div class="tx">' +
        '<div class="icon-chip" style="--chip:var(' + meta.v + ')">' + icon(t.cat) + '</div>' +
        '<div class="tx-mid"><div class="tx-desc">' + t.desc + '</div>' +
        '<div class="tx-meta">' + meta.label + ' · ' + mo.short + ' ' + t.day + '</div></div>' +
        '<div class="tx-amt ' + (inc ? "in" : "out") + ' num">' + sign + money(t.amt) + '</div></div>';
    });
    document.getElementById("tx-list").innerHTML = html;
    document.getElementById("tx-count").textContent = tx.length + " transactions";
  }

  /* ================================================================== *
   * Budgets
   * ================================================================== */
  function statusOf(pct) {
    if (pct >= 100) return { cls: "over", tag: "Over budget", warn: true };
    if (pct >= 85) return { cls: "warn", tag: "Near limit" };
    return { cls: "ok", tag: "" };
  }
  function renderBudgets(mo) {
    var byCat = {};
    mo.txns.forEach(function (t) { if (t.type === "expense") byCat[t.cat] = (byCat[t.cat] || 0) + t.amt; });
    var cats = Object.keys(CATS);
    var html = "", totalBudget = 0, totalSpent = 0;
    cats.forEach(function (c) {
      var limit = BUDGETS[c]; if (!limit) return;
      var spent = byCat[c] || 0;
      totalBudget += limit; totalSpent += spent;
      var pct = limit ? spent / limit * 100 : 0;
      var st = statusOf(pct);
      var barW = Math.max(0, Math.min(100, pct));
      var remaining = limit - spent;
      var footRight;
      if (st.cls === "over") footRight = '<span class="tag over">' + warnIcon() + money0(-remaining) + ' over</span>';
      else if (st.cls === "warn") footRight = '<span class="tag warn">' + warnIcon() + money0(remaining) + ' left</span>';
      else footRight = '<span class="tag ok">' + money0(remaining) + ' left</span>';
      html += '<div class="budget">' +
        '<div class="budget-top"><span class="budget-name"><span class="budget-dot" style="background:var(' + CATS[c].v + ')"></span>' + CATS[c].label + '</span>' +
        '<span class="budget-nums num"><b>' + money0(spent) + '</b> / ' + money0(limit) + '</span></div>' +
        '<div class="track"><div class="fill ' + st.cls + '" data-w="' + barW.toFixed(1) + '" style="width:0%"></div></div>' +
        '<div class="budget-foot"><span class="budget-pct num">' + Math.round(pct) + '% used</span>' + footRight + '</div></div>';
    });
    document.getElementById("budgets").innerHTML = html;
    requestAnimationFrame(function () {
      var fills = document.querySelectorAll("#budgets .fill");
      Array.prototype.forEach.call(fills, function (f) { f.style.width = (f.getAttribute("data-w") || "0") + "%"; });
    });
    document.getElementById("budget-total").textContent = money0(totalSpent) + " of " + money0(totalBudget);
  }
  function warnIcon() {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>';
  }

  /* ================================================================== *
   * Render
   * ================================================================== */
  function render() {
    var mo = selectedMonth();
    syncNav();
    document.getElementById("greeting").textContent = "Overview · " + mo.label + " " + mo.year;
    document.getElementById("subline").textContent = "Ava, here is your money for " + mo.label + ", compared with " + priorMonth(mo).label + ".";
    renderKPIs(mo);
    renderDonut(mo);
    renderBars(mo);
    renderTransactions(mo);
    renderBudgets(mo);
  }

  render();
})();
</script>
</body>
</html>
