<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Money — Personal Finance Dashboard</title>
<style>
  /* ---------- Tokens ---------- */
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-2: #f1f3f6;
    --surface-3: #e6e9ee;
    --border: #e4e7ec;
    --fg: #101828;
    --fg-muted: #475467;
    --fg-subtle: #667085;
    --accent: #1e40af;
    --accent-soft: #e0eaff;
    --positive: #067647;
    --positive-bg: #ecfdf3;
    --negative: #b42318;
    --negative-bg: #fef3f2;
    --neutral-delta: #475467;
    --grid: #e4e7ec;
    --track: #e4e7ec;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
    --tooltip-bg: #101828;
    --tooltip-fg: #f9fafb;
    /* Categorical series — Okabe-Ito, colorblind-safe */
    --cat-housing:     #0072B2;
    --cat-food:        #E69F00;
    --cat-transport:   #D55E00;
    --cat-leisure:     #CC79A7;
    --cat-health:      #009E73;
    --cat-shopping:    #56B4E9;
    --cat-subscriptions: #6B4EFF;
    --income:   #0a8a4f;
    --spending: #d4562a;
    /* Spacing scale (4pt) */
    --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
    --sp-5: 24px; --sp-6: 32px; --sp-7: 48px;
    /* Type scale */
    --text-xs: 12px; --text-sm: 13px; --text-base: 14px;
    --text-md: 16px; --text-lg: 18px; --text-xl: 24px;
    /* Radii */
    --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-full: 999px;
    --dur: 220ms;
    --ease: cubic-bezier(.22,.61,.36,1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0e14;
      --surface: #12161f;
      --surface-2: #1a1f2b;
      --surface-3: #242b3a;
      --border: #242b38;
      --fg: #e6e9ef;
      --fg-muted: #98a2b3;
      --fg-subtle: #7b869a;
      --accent: #8fb0f5;
      --accent-soft: #1c2a4a;
      --positive: #3dd68c;
      --positive-bg: rgba(61,214,140,.10);
      --negative: #f97066;
      --negative-bg: rgba(249,112,102,.10);
      --neutral-delta: #98a2b3;
      --grid: #232a37;
      --track: #242b38;
      --shadow: 0 1px 2px rgba(0,0,0,.4);
      --tooltip-bg: #e6e9ef;
      --tooltip-fg: #101828;
      --cat-housing:     #5fb4e8;
      --cat-food:        #f0b13f;
      --cat-transport:   #ef8b52;
      --cat-leisure:     #e29cc4;
      --cat-health:      #3fc79a;
      --cat-shopping:    #85ccf2;
      --cat-subscriptions: #9c86ff;
      --income:   #35c97e;
      --spending: #ef8b52;
    }
  }

  /* ---------- Base ---------- */
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 400 var(--text-base)/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  h1, h2, p { margin: 0; }
  button { font: inherit; color: inherit; }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }
  .num { font-variant-numeric: tabular-nums; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 var(--sp-4); }
  @media (min-width: 768px) { .wrap { padding: 0 var(--sp-6); } }

  /* ---------- Header ---------- */
  .site-header {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .site-header .wrap {
    display: flex; align-items: center; justify-content: space-between;
    gap: var(--sp-3); min-height: 62px; padding-block: var(--sp-3);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { display: block; }
  .brand h1 { font-size: var(--text-md); font-weight: 650; letter-spacing: -.01em; }
  .brand .who {
    display: none; font-size: var(--text-sm); color: var(--fg-subtle);
    border-left: 1px solid var(--border); padding-left: 10px; margin-left: 2px;
  }
  @media (min-width: 768px) { .brand .who { display: block; } }

  .month-picker { display: flex; align-items: center; gap: var(--sp-2); }
  .month-picker .label {
    font-size: var(--text-sm); font-weight: 600; color: var(--fg-subtle);
    text-transform: uppercase; letter-spacing: .05em;
  }
  @media (max-width: 440px) { .month-picker .label { display: none; } }
  .seg {
    display: inline-flex; align-items: center; gap: 2px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--r-full); padding: 3px;
  }
  .nav-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border: 0; border-radius: var(--r-full);
    background: transparent; color: var(--fg-muted); cursor: pointer;
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .nav-btn:hover:not(:disabled) { background: var(--surface-3); color: var(--fg); }
  .nav-btn:disabled { opacity: .35; cursor: default; }
  .month-btn {
    min-width: 132px; min-height: 36px; padding: 0 var(--sp-4);
    border: 0; border-radius: var(--r-full); background: transparent;
    font-size: var(--text-base); font-weight: 600; cursor: pointer;
    transition: background var(--dur) var(--ease);
  }
  .month-btn:hover { background: var(--surface-3); }

  /* ---------- Layout ---------- */
  main { padding-block: var(--sp-5) var(--sp-7); }
  @media (min-width: 768px) { main { padding-block: var(--sp-6) var(--sp-7); } }
  .kpi-grid {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: var(--sp-4);
  }
  @media (max-width: 900px) { .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 440px) { .kpi-grid { grid-template-columns: 1fr; } }
  .grid-2 {
    display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
    gap: var(--sp-4); margin-top: var(--sp-4);
  }
  .grid-2.eq { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (max-width: 900px) {
    .grid-2, .grid-2.eq { grid-template-columns: 1fr; }
    .grid-2 > *, .grid-2.eq > * { min-width: 0; }
  }

  /* ---------- Cards ---------- */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-lg); box-shadow: var(--shadow);
    padding: var(--sp-5);
  }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-3); }
  .card-head h2 { font-size: var(--text-md); font-weight: 650; letter-spacing: -.01em; }
  .card-sub { font-size: var(--text-sm); color: var(--fg-subtle); }

  /* ---------- KPI cards ---------- */
  .kpi { display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-4) var(--sp-5); }
  .kpi-top { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); }
  .kpi-label { font-size: var(--text-sm); font-weight: 600; color: var(--fg-subtle); }
  .kpi-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: var(--r-sm);
    background: var(--accent-soft); color: var(--accent); flex: none;
  }
  .kpi-value {
    font-size: clamp(22px, 2.6vw, var(--text-xl)); font-weight: 675;
    letter-spacing: -.02em; line-height: 1.15;
  }
  .kpi-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); min-height: 22px; }
  .delta {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: var(--text-xs); font-weight: 650;
    padding: 2px 8px; border-radius: var(--r-full);
    background: var(--surface-2); color: var(--neutral-delta);
  }
  .delta .vs { font-weight: 500; color: var(--fg-subtle); }
  .delta.pos { background: var(--positive-bg); color: var(--positive); }
  .delta.neg { background: var(--negative-bg); color: var(--negative); }
  .spark { display: block; }
  .delta-none { font-size: var(--text-xs); color: var(--fg-subtle); padding-left: 2px; }

  /* ---------- Chart shared ---------- */
  .chart-body { position: relative; margin-top: var(--sp-3); }
  svg.chart { display: block; width: 100%; height: auto; }
  .tooltip {
    position: absolute; left: 0; top: 0; z-index: 5; pointer-events: none;
    display: flex; flex-direction: column; gap: 3px;
    background: var(--tooltip-bg); color: var(--tooltip-fg);
    font-size: var(--text-xs); line-height: 1.45;
    padding: 8px 10px; border-radius: var(--r-sm);
    box-shadow: 0 4px 14px rgba(0,0,0,.18);
    opacity: 0; transform: translate(-50%, calc(-100% - 10px)) scale(.96);
    transition: opacity 140ms var(--ease), transform 140ms var(--ease);
    white-space: nowrap;
  }
  .tooltip.below { transform: translate(-50%, 10px) scale(.96); }
  .tooltip.show { opacity: 1; transform: translate(-50%, calc(-100% - 10px)) scale(1); }
  .tooltip.below.show { transform: translate(-50%, 10px) scale(1); }
  .tt-title { font-weight: 650; margin-bottom: 2px; }
  .tt-row { display: flex; align-items: center; gap: 7px; }
  .tt-swatch { width: 8px; height: 8px; border-radius: 2px; flex: none; }

  /* Donut */
  .slice {
    cursor: pointer;
    transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
  }
  .slice.dim { opacity: .35; }
  .slice.active { transform: scale(1.035); transform-origin: center; }
  .center-label { font-size: 11px; fill: var(--fg-subtle); font-weight: 600; letter-spacing: .06em; }
  .center-value { font-size: 23px; font-weight: 675; fill: var(--fg); letter-spacing: -.02em; }
  .legend {
    list-style: none; margin: var(--sp-4) 0 0; padding: 0;
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px var(--sp-4);
  }
  @media (max-width: 420px) { .legend { grid-template-columns: 1fr; } }
  .legend li {
    display: flex; align-items: center; gap: 8px; width: 100%;
    background: none; border: 0; padding: 5px 6px; border-radius: var(--r-sm);
    font-size: var(--text-sm); cursor: pointer; text-align: left;
    transition: background var(--dur) var(--ease);
  }
  .legend li:hover, .legend li.active { background: var(--surface-2); }
  .legend .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .legend .nm { color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend .pc { margin-left: auto; color: var(--fg-subtle); font-size: var(--text-xs); }

  /* Bar chart */
  .hit { fill: transparent; cursor: pointer; }
  .hit:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .bar { transition: opacity var(--dur) var(--ease); }
  .bar-group.dim .bar { opacity: .4; }
  .axis-line { stroke: var(--border); }
  .gridline { stroke: var(--grid); }
  .tick-label { fill: var(--fg-subtle); font-size: 11px; }
  .tick-label.month { fill: var(--fg-muted); font-size: 11.5px; font-weight: 600; }
  .legend-inline { display: flex; gap: var(--sp-4); }
  .legend-inline span { display: inline-flex; align-items: center; gap: 7px; font-size: var(--text-sm); color: var(--fg-muted); }
  .legend-inline i { width: 10px; height: 10px; border-radius: 3px; }

  /* ---------- Transactions ---------- */
  .txns { list-style: none; margin: var(--sp-3) 0 0; padding: 0; }
  .txn {
    display: flex; align-items: center; gap: var(--sp-3);
    padding: 11px 4px; border-top: 1px solid var(--border);
    min-width: 0; flex-wrap: nowrap;
  }
  .txn:first-child { border-top: 0; }
  .txn-ic {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: var(--r-full); flex: 0 0 auto;
    color: var(--cat); background: color-mix(in srgb, var(--cat) 13%, transparent);
  }
  .txn-ic svg { display: block; }
  .txn-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .txn-desc { font-size: var(--text-base); font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .txn-meta { font-size: var(--text-xs); color: var(--fg-subtle); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .txn-amt { flex: 0 0 auto; margin-left: auto; font-weight: 650; white-space: nowrap; }
  .txn-amt.inc { color: var(--positive); }

  /* ---------- Budgets ---------- */
  .budget-list { list-style: none; margin: var(--sp-4) 0 0; padding: 0; display: flex; flex-direction: column; gap: var(--sp-4); }
  .budget-row { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: var(--sp-3); align-items: center; }
  .budget-head { grid-column: 2 / -1; display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-3); margin-bottom: 6px; }
  .budget-name { font-size: var(--text-sm); font-weight: 600; }
  .budget-vals { font-size: var(--text-xs); color: var(--fg-subtle); white-space: nowrap; }
  .budget-vals .spent { color: var(--fg); font-weight: 600; }
  .bar-track {
    grid-column: 2 / -1; height: 8px; border-radius: var(--r-full);
    background: var(--track); overflow: hidden;
  }
  .bar-fill {
    height: 100%; border-radius: inherit; background: var(--cat);
    transition: width 420ms var(--ease), background var(--dur) var(--ease);
  }
  .budget-row.warn .bar-fill { background: #d97706; }
  .budget-row.over .bar-fill { background: var(--negative); }
  .status {
    font-size: 11px; font-weight: 700; letter-spacing: .03em;
    padding: 2px 8px; border-radius: var(--r-full); white-space: nowrap;
    background: var(--surface-2); color: var(--fg-subtle);
  }
  .status.warn { background: rgba(217,119,6,.13); color: #b45309; }
  .status.over { background: var(--negative-bg); color: var(--negative); }
  @media (prefers-color-scheme: dark) { .status.warn { color: #f5b04c; } }
  .budget-ic {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: var(--r-sm); flex: none;
    color: var(--cat); background: color-mix(in srgb, var(--cat) 13%, transparent);
  }
  .budget-ic svg { display: block; }
  .budget-foot {
    margin-top: var(--sp-5); padding-top: var(--sp-3); border-top: 1px solid var(--border);
    font-size: var(--text-sm); color: var(--fg-subtle); display: flex; justify-content: space-between; gap: var(--sp-3);
  }
  .budget-foot strong { color: var(--fg); font-weight: 650; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }
</style>
</head>

<a class="sr-only" href="#main">Skip to main content</a>

<header class="site-header">
  <div class="wrap">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
        <rect x="1.5" y="1.5" width="25" height="25" rx="7.5" fill="var(--accent)"/>
        <path d="M8 18.5v-4M12 18.5v-7.5M16 18.5v-5M20 18.5v-9" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <h1>Money</h1>
      <span class="who">Maya Chen · Checking ••4821</span>
    </div>
    <nav class="month-picker" aria-label="Choose month">
      <span class="label">Month</span>
      <div class="seg">
        <button class="nav-btn" id="prev" aria-label="Previous month">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5 5.5 8 10 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="month-btn num" id="monthBtn" aria-live="polite">—</button>
        <button class="nav-btn" id="next" aria-label="Next month">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </nav>
  </div>
</header>

<main id="main" class="wrap">
  <section class="kpi-grid" id="kpis" aria-label="Key metrics"></section>

  <section class="grid-2">
    <div class="card">
      <div class="card-head">
        <h2 id="donutTitle">Spending by category</h2>
        <span class="card-sub" id="donutSub"></span>
      </div>
      <div class="chart-body" id="donutBody"></div>
      <ul class="legend" id="donutLegend" aria-label="Spending categories"></ul>
    </div>
    <div class="card">
      <div class="card-head">
        <h2>Income vs spending</h2>
        <div class="legend-inline" aria-hidden="true">
          <span><i style="background:var(--income)"></i>Income</span>
          <span><i style="background:var(--spending)"></i>Spending</span>
        </div>
      </div>
      <div class="chart-body" id="barBody"></div>
    </div>
  </section>

  <section class="grid-2 eq">
    <div class="card">
      <div class="card-head">
        <h2>Recent transactions</h2>
        <span class="card-sub" id="txnSub"></span>
      </div>
      <ul class="txns" id="txnList"></ul>
    </div>
    <div class="card">
      <div class="card-head">
        <h2>Budgets</h2>
        <span class="card-sub" id="budgetSub"></span>
      </div>
      <ul class="budget-list" id="budgetList"></ul>
      <div class="budget-foot" id="budgetFoot"></div>
    </div>
  </section>
</main>

<div class="tooltip" id="tip" role="status" aria-hidden="true"></div>
<div class="sr-only" id="srSummary" aria-live="polite"></div>

        '<span class="kpi-icon">' + icon(def.ic, 16) + "</span></div>" +
        '<div class="kpi-value num">' + values[def.key] + "</div>" +
        '<div class="kpi-foot">' + d + sparks[def.key] + "</div></article>";
    });
    document.getElementById("kpis").innerHTML = html;

    document.getElementById("srSummary").textContent =
      monthLabel(mi) + ": balance " + values.balance + ", income " + values.income +
      ", spending " + values.spending + ", savings rate " + values.rate + ".";
  }

  /* ================= Donut (spending by category) ================= */

  function polar(cx, cy, r, ang) {
    var rad = (ang - 90) * Math.PI / 180;
    return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
  }
  function annulusPath(cx, cy, rO, rI, a0, a1) {
    if (a1 - a0 >= 359.9) a1 = a0 + 359.99;
    var O0 = polar(cx, cy, rO, a0), O1 = polar(cx, cy, rO, a1);
    var I1 = polar(cx, cy, rI, a1), I0 = polar(cx, cy, rI, a0);
    var large = (a1 - a0) > 180 ? 1 : 0;
    function p(pt) { return pt[0].toFixed(2) + " " + pt[1].toFixed(2); }
    return "M" + p(O0) + " A" + rO + " " + rO + " 0 " + large + " 1 " + p(O1) +
      " L" + p(I1) + " A" + rI + " " + rI + " 0 " + large + " 0 " + p(I0) + " Z";
  }

  var donutState = { slices: [], cx: 0, cy: 0 };

  function renderDonut(mi, all) {
    var cur = all[mi];
    var cats = SPEND_ORDER.filter(function (c) { return cur.byCat[c] > 0; })
      .sort(function (a, b) { return cur.byCat[b] - cur.byCat[a]; });
    var total = cur.total.spending;

    document.getElementById("donutSub").textContent = monthLabel(mi);
    document.getElementById("donutTitle").textContent = "Spending by category";

    var RO = 106, RI = 78, VB = 240, C = VB / 2;
    donutState = { slices: [], cx: C, cy: C };
    var svg = '<svg class="chart" viewBox="0 0 ' + VB + " " + VB + '" role="img" aria-label="Spending by category, ' +
      monthLabel(mi) + ", total " + fmtMoney(total, false) + '">';
    svg += '<circle cx="' + C + '" cy="' + C + '" r="' + ((RO + RI) / 2) + '" fill="none" stroke="var(--surface-2)" stroke-width="' + (RO - RI) + '"/>';

    var angle = 0;
    var centerHtml = '<text class="center-label" x="' + C + '" y="' + (C - 12) + '" text-anchor="middle">TOTAL SPENT</text>' +
      '<text class="center-value num" x="' + C + '" y="' + (C + 14) + '" text-anchor="middle">' + fmtMoney(total, false) + "</text>";

    cats.forEach(function (cat) {
      var v = cur.byCat[cat];
      var sweep = total > 0 ? v / total * 360 : 0;
      if (sweep > 0.4) {
        var a0 = angle + 0.7, a1 = angle + sweep - 0.7;
        if (a1 <= a0) a1 = a0 + 0.4;
        svg += '<path class="slice" data-cat="' + cat + '" d="' + annulusPath(C, C, RO, RI, a0, a1) +
          '" fill="' + catColor(cat) + '" tabindex="0" role="button" aria-label="' +
          CATEGORIES[cat].label + ": " + fmtMoney(v, false) + ", " + Math.round(v / total * 100) + ' percent"></path>';
        donutState.slices.push({ cat: cat, mid: angle + sweep / 2, value: v });
      }
      angle += sweep;
    });
    svg += centerHtml + "</svg>";
    document.getElementById("donutBody").innerHTML = svg;

    var legend = "";
    cats.forEach(function (cat) {
      var v = cur.byCat[cat];
      legend += '<li><button data-cat="' + cat + '" aria-label="' + CATEGORIES[cat].label + ", " + fmtMoney(v, false) +
        ', ' + Math.round(v / total * 100) + ' percent"><span class="sw" style="background:' + catColor(cat) +
        '"></span><span class="nm">' + CATEGORIES[cat].label + '</span><span class="pc num">' +
        Math.round(v / total * 100) + "% · " + fmtMoney(v, false) + "</span></button></li>";
    });
    document.getElementById("donutLegend").innerHTML = legend;

    var paths = Array.prototype.slice.call(document.querySelectorAll(".slice"));
    var btns = Array.prototype.slice.call(document.querySelectorAll("#donutLegend button"));

    function highlight(cat) {
      paths.forEach(function (p) {
        var on = p.getAttribute("data-cat") === cat;
        p.classList.toggle("active", on);
        p.classList.toggle("dim", !on && cat !== null);
      });
      btns.forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-cat") === cat); });
    }
    function tipFor(cat, px, py) {
      var v = cur.byCat[cat];
      showTip('<span class="tt-title">' + CATEGORIES[cat].label + "</span>" +
        '<span class="tt-row"><span class="tt-swatch" style="background:' + catColor(cat) + '"></span>' +
        fmtMoney(v, false) + " · " + Math.round(v / total * 100) + "% of spending</span>", px, py);
    }
    function slicePoint(cat) {
      var s = donutState.slices.filter(function (x) { return x.cat === cat; })[0];
      if (!s) return null;
      var box = document.getElementById("donutBody").getBoundingClientRect();
      var pt = polar(donutState.cx, donutState.cy, (RO + RI) / 2, s.mid);
      return [box.left + pt[0] * (box.width / VB), box.top + pt[1] * (box.height / VB)];
    }
    paths.forEach(function (p) {
      var cat = p.getAttribute("data-cat");
      p.addEventListener("mousemove", function (e) { highlight(cat); tipFor(cat, e.clientX, e.clientY); });
      p.addEventListener("mouseleave", function () { highlight(null); hideTip(); });
      p.addEventListener("focus", function () {
        highlight(cat);
        var pt = slicePoint(cat);
        if (pt) tipFor(cat, pt[0], pt[1]);
      });
      p.addEventListener("blur", function () { highlight(null); hideTip(); });
      p.addEventListener("click", function (e) {
        e.stopPropagation();
        highlight(cat);
        tipFor(cat, e.clientX, e.clientY - 12);
      });
    });
    btns.forEach(function (b) {
      var cat = b.getAttribute("data-cat");
      b.addEventListener("mouseenter", function () { highlight(cat); });
      b.addEventListener("mouseleave", function () { highlight(null); });
      b.addEventListener("focus", function () {
        highlight(cat);
        var pt = slicePoint(cat);
        if (pt) tipFor(cat, pt[0], pt[1]);
      });
      b.addEventListener("blur", function () { highlight(null); hideTip(); });
      b.addEventListener("click", function () {
        var pt = slicePoint(cat);
        if (pt) tipFor(cat, pt[0], pt[1]);
      });
    });
  }

  /* ================= Bars (income vs spending) ================= */

  function niceMax(rawMax) {
    if (rawMax <= 0) return 100;
    var mag = Math.pow(10, Math.floor(Math.log(rawMax) / Math.LN10));
    var steps = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
    for (var i = 0; i < steps.length; i++) if (steps[i] * mag >= rawMax) return steps[i] * mag;
    return 10 * mag;
  }

  function renderBars(all, mi) {
    var W = 680, H = 300, mL = 50, mR = 12, mT = 14, mB = 34;
    var iw = W - mL - mR, ih = H - mT - mB;
    var max = niceMax(Math.max.apply(null, all.map(function (x) { return Math.max(x.total.income, x.total.spending); })));
    var n = all.length, step = iw / n, bw = Math.min(22, step * 0.26);

    var svg = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Income versus spending, ' +
      monthLabel(0) + " to " + monthLabel(n - 1) + '">';

    var ticks = 4;
    for (var i = 0; i <= ticks; i++) {
      var v = max / ticks * i, y = mT + ih - (v / max) * ih;
      if (i > 0) svg += '<line class="gridline" x1="' + mL + '" y1="' + y.toFixed(1) + '" x2="' + (W - mR) + '" y2="' + y.toFixed(1) + '"/>';
      svg += '<text class="tick-label num" x="' + (mL - 8) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end">' + fmtCompact(v) + "</text>";
    }
    svg += '<line class="axis-line" x1="' + mL + '" y1="' + (mT + ih) + '" x2="' + (W - mR) + '" y2="' + (mT + ih) + '"/>';

    all.forEach(function (x, i) {
      var cx = mL + step * i + step / 2;
      var hInc = (x.total.income / max) * ih, hSp = (x.total.spending / max) * ih;
      var active = i === mi;
      svg += '<g class="bar-group" data-i="' + i + '"' + (active ? ' data-active="1"' : "") + ">" +
        '<rect class="hit" x="' + (mL + step * i).toFixed(1) + '" y="' + mT + '" width="' + step.toFixed(1) + '" height="' + ih +
        '" tabindex="0" role="button" aria-label="' + monthLabel(i) + ", income " + fmtMoney(x.total.income, false) +
        ", spending " + fmtMoney(x.total.spending, false) + '"/>';
      if (active) {
        svg += '<rect x="' + (cx - step / 2 + 5).toFixed(1) + '" y="' + mT + '" width="' + (step - 10).toFixed(1) +
          '" height="' + ih + '" rx="10" fill="var(--surface-2)"/>';
      }
      svg += '<rect class="bar" x="' + (cx - bw - 3).toFixed(1) + '" y="' + (mT + ih - hInc).toFixed(1) +
        '" width="' + bw.toFixed(1) + '" height="' + Math.max(2, hInc).toFixed(1) + '" rx="4" fill="var(--income)"/>' +
        '<rect class="bar" x="' + (cx + 3).toFixed(1) + '" y="' + (mT + ih - hSp).toFixed(1) +
        '" width="' + bw.toFixed(1) + '" height="' + Math.max(2, hSp).toFixed(1) + '" rx="4" fill="var(--spending)"/>' +
        '<text class="tick-label month' + (active ? "" : '" style="opacity:.75') + '" x="' + cx.toFixed(1) + '" y="' +
        (mT + ih + 20) + '" text-anchor="middle">' + MONTH_SHORT[MONTHS[i].m - 1] + "</text></g>";
    });
    svg += "</svg>";
    var body = document.getElementById("barBody");
    body.innerHTML = svg;

    var groups = Array.prototype.slice.call(body.querySelectorAll(".bar-group"));
    function paint(activeIdx) {
      groups.forEach(function (g) {
        var on = +g.getAttribute("data-i") === activeIdx;
        g.classList.toggle("dim", activeIdx !== null && !on);
      });
    }
    function tipAt(i, px, py) {
      var x = all[i];
      showTip('<span class="tt-title">' + monthLabel(i) + "</span>" +
        '<span class="tt-row"><span class="tt-swatch" style="background:var(--income)"></span>Income ' + fmtMoney(x.total.income, false) + "</span>" +
        '<span class="tt-row"><span class="tt-swatch" style="background:var(--spending)"></span>Spending ' + fmtMoney(x.total.spending, false) + "</span>",
        px, py);
    }
    groups.forEach(function (g) {
      var i = +g.getAttribute("data-i");
      var hit = g.querySelector(".hit");
      hit.addEventListener("mousemove", function (e) { paint(i); tipAt(i, e.clientX, e.clientY); });
      hit.addEventListener("mouseleave", function () { paint(null); hideTip(); });
      hit.addEventListener("focus", function () {
        paint(i);
        var r = hit.getBoundingClientRect();
        tipAt(i, r.left + r.width / 2, r.top + r.height * 0.25);
      });
      hit.addEventListener("blur", function () { paint(null); hideTip(); });
      hit.addEventListener("click", function (e) {
        e.stopPropagation();
        paint(i);
        tipAt(i, e.clientX, e.clientY - 12);
      });
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") { paint(null); hideTip(); }
    });
  }

  /* ================= Transactions ================= */

  function renderTxns(mi) {
    var items = TXNS.filter(function (tx) { return tx.month === mi; })
      .map(function (tx) { return { tx: tx, date: dateOf(tx) }; })
      .sort(function (a, b) { return b.date - a.date || a.tx.desc.localeCompare(b.tx.desc); })
      .slice(0, 8);

    document.getElementById("txnSub").textContent = "Last " + items.length + " · " + monthLabel(mi);
    var html = "";
    items.forEach(function (it) {
      var tx = it.tx;
      var income = tx.category === "income";
      var amt = (income ? "+" : "−") + fmtMoney(Math.abs(tx.amount), true);
      html += '<li class="txn">' +
        '<span class="txn-ic" style="--cat:' + catColor(tx.category) + '">' + icon(tx.category, 17) + "</span>" +
        '<span class="txn-main"><span class="txn-desc">' + tx.desc + "</span>" +
        '<span class="txn-meta">' + CATEGORIES[tx.category].label + " · " +
        DAY_NAMES[it.date.getDay()] + ", " + MONTH_SHORT[MONTHS[mi].m - 1] + " " + tx.day + "</span></span>" +
        '<span class="txn-amt num' + (income ? " inc" : "") + '">' + amt + "</span></li>";
    });
    document.getElementById("txnList").innerHTML = html;
  }

  /* ================= Budgets ================= */

  function renderBudgets(mi, all) {
    var cur = all[mi];
    document.getElementById("budgetSub").textContent = monthLabel(mi);
    var html = "", totalSpent = 0, totalBudget = 0, overCount = 0;

    SPEND_ORDER.forEach(function (cat) {
      if (!(BUDGETS[cat] > 0)) return;
      var spent = cur.byCat[cat] || 0, budget = BUDGETS[cat];
      var pct = spent / budget * 100;
      var state = pct > 100 ? "over" : (pct >= 80 ? "warn" : "ok");
      var statusTxt = state === "over" ? "Over by " + fmtMoney(spent - budget, false)
        : state === "warn" ? "Near limit" : "On track";
      totalSpent += spent; totalBudget += budget;
      if (state === "over") overCount++;
      html += '<li class="budget-row ' + state + '" style="--cat:' + catColor(cat) + '">' +
        '<span class="budget-ic">' + icon(cat, 15) + "</span>" +
        '<div class="budget-head"><span class="budget-name">' + CATEGORIES[cat].label + "</span>" +
        '<span class="budget-vals num"><span class="spent">' + fmtMoney(spent, false) + "</span> of " + fmtMoney(budget, false) +
        ' · ' + Math.round(pct) + "%</span></div>" +
        '<div class="bar-track" role="progressbar" aria-valuenow="' + Math.round(pct) + '" aria-valuemin="0" aria-valuemax="100" aria-label="' + CATEGORIES[cat].label + ' budget ' + Math.round(pct) + ' percent used">' +
        '<div class="bar-fill" style="width:' + Math.min(100, pct).toFixed(1) + '%"></div></div>' +
        '<span class="status ' + (state === "ok" ? "" : state) + '">' + statusTxt + "</span></li>";
    });
    document.getElementById("budgetList").innerHTML = html;

    var left = totalBudget - totalSpent;
    document.getElementById("budgetFoot").innerHTML =
      "<span>Budgeted spending</span><span class=\"num\"><strong>" + fmtMoney(totalSpent, false) + "</strong> of " +
      fmtMoney(totalBudget, false) + " · " + (left >= 0 ? fmtMoney(left, false) + " left" : fmtMoney(-left, false) + " over") +
      (overCount ? " · " + overCount + (overCount === 1 ? " category over" : " categories over") : "") + "</span>";
  }

  /* ================= Render all ================= */

  var currentMi = MONTHS.length - 1;

  function render(mi) {
    currentMi = mi;
    var all = allTotals();
    document.getElementById("monthBtn").textContent = monthLabel(mi);
    document.getElementById("prev").disabled = mi === 0;
    document.getElementById("next").disabled = mi === MONTHS.length - 1;
    renderKPIs(mi, all);
    renderDonut(mi, all);
    renderBars(all, mi);
    renderTxns(mi);
    renderBudgets(mi, all);
  }

  document.getElementById("prev").addEventListener("click", function () {
    if (currentMi > 0) render(currentMi - 1);
  });
  document.getElementById("next").addEventListener("click", function () {
    if (currentMi < MONTHS.length - 1) render(currentMi + 1);
  });

  window.addEventListener("resize", function () { hideTip(); });
  document.addEventListener("scroll", function () { hideTip(); }, { passive: true });

  render(currentMi);

  if (typeof module !== "undefined" && module.exports) {
    module.exports = { TXNS: TXNS, MONTHS: MONTHS, CATEGORIES: CATEGORIES, BUDGETS: BUDGETS, allTotals: allTotals, monthLabel: monthLabel };
  }
  window.__FINANCE__ = { TXNS: TXNS, MONTHS: MONTHS, CATEGORIES: CATEGORIES, BUDGETS: BUDGETS, allTotals: allTotals, monthLabel: monthLabel };
})();
</script>
</body>
</html>
