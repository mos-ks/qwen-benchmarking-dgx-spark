<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="Personal finance dashboard — balance, income, spending, savings, budgets and transactions." />
  <title>Finance Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="app" id="app">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 7l2-3h11l3 3"/><path d="M16 12h.01"/></svg>
        </span>
        <div class="brand-text">
          <h1 class="brand-title">Ava's Finances</h1>
          <p class="brand-sub" id="header-sub">Overview</p>
        </div>
      </div>

      <div class="header-controls">
        <div class="field">
          <label class="field-label" for="month-select">Month</label>
          <div class="select-wrap">
            <select id="month-select" class="select" aria-label="Select month"></select>
            <svg class="select-caret" aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>

        <div class="theme-toggle" role="group" aria-label="Color theme">
          <button type="button" class="theme-btn is-active" data-theme-choice="system" aria-pressed="true" title="Follow system">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
            <span>Auto</span>
          </button>
          <button type="button" class="theme-btn" data-theme-choice="light" aria-pressed="false" title="Light">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <span>Light</span>
          </button>
          <button type="button" class="theme-btn" data-theme-choice="dark" aria-pressed="false" title="Dark">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <span>Dark</span>
          </button>
        </div>
      </div>
    </header>

    <main id="main" class="app-main">
      <section class="kpi-grid" id="kpi-grid" aria-label="Key metrics"></section>

      <div class="grid-2col">
        <section class="card chart-card" aria-labelledby="cat-title">
          <div class="card-head">
            <h2 class="card-title" id="cat-title">Spending by category</h2>
            <p class="card-sub" id="cat-sub"></p>
          </div>
          <div class="chart-host" id="category-chart"></div>
        </section>

        <section class="card chart-card" aria-labelledby="trend-title">
          <div class="card-head">
            <h2 class="card-title" id="trend-title">Income vs spending</h2>
            <p class="card-sub">Last 6 months</p>
          </div>
          <div class="chart-host" id="trend-chart"></div>
          <div class="legend" id="trend-legend" aria-hidden="true"></div>
        </section>
      </div>

      <div class="grid-2col grid-2col--wide-left">
        <section class="card" aria-labelledby="txns-title">
          <div class="card-head">
            <h2 class="card-title" id="txns-title">Recent transactions</h2>
            <p class="card-sub" id="txns-sub"></p>
          </div>
          <ul class="txn-list" id="txn-list"></ul>
        </section>

        <section class="card" aria-labelledby="budget-title">
          <div class="card-head">
            <h2 class="card-title" id="budget-title">Budget progress</h2>
            <p class="card-sub" id="budget-sub"></p>
          </div>
          <ul class="budget-list" id="budget-list"></ul>
        </section>
      </div>
    </main>

    <footer class="app-footer">
      <p>Sample data for demonstration · Figures in USD · Built with vanilla HTML, CSS &amp; SVG.</p>
    </footer>
  </div>

  <div class="tooltip" id="tooltip" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
</body>
</html>
