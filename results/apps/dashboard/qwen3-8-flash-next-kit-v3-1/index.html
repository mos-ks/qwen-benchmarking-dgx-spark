<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finance — Dashboard</title>
<style>
  :root {
    --bg: #f4f6fb;
    --surface: #ffffff;
    --surface-2: #eef1f7;
    --text: #0e1526;
    --muted: #5b667c;
    --line: #e3e8f0;
    --accent: #4655f5;
    --series-income: #005C90;
    --series-spend: #B26A00;
    --accent-soft: #ecefff;
    --pos: #0f8a54;
    --pos-soft: #e2f5ec;
    --neg: #cf3a3a;
    --neg-soft: #fbe9e9;
    --warn: #b26a00;
    --ink-housing: #00446B; --ink-groceries: #8A5E00; --ink-dining: #00714F; --ink-transport: #9E4E83;
    --ink-entertainment: #005E93; --ink-health: #A34A00; --ink-shopping: #563AD4; --ink-subscriptions: #475569;
    --track: #e7ebf2;
    --c1: #0072B2; --c2: #E69F00; --c3: #009E73; --c4: #CC79A7; --c5: #56B4E9; --c6: #D55E00; --c7: #7A5AF8; --c8: #64748B;
    --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
    --fs-xs: 12px; --fs-sm: 13px; --fs-md: 14px; --fs-lg: 16px; --fs-xl: 20px; --fs-2xl: 28px;
    --shadow: 0 1px 2px rgba(14,21,38,.05), 0 4px 16px rgba(14,21,38,.05);
    --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0f18;
      --surface: #131a29;
      --surface-2: #1a2334;
      --text: #e8ecf5;
      --muted: #93a0b8;
      --line: #26304a;
      --accent: #8b97ff;
      --series-income: #6FC0EE;
      --series-spend: #F2A93B;
      --accent-soft: #232c55;
      --pos: #43cf93;
      --pos-soft: #123127;
      --neg: #ff7b7b;
      --neg-soft: #3a1d24;
      --warn: #f5b04c;
      --track: #232d45;
      --c1: #56B4E9; --c2: #E69F00; --c3: #2fca9c; --c4: #E29BC0; --c5: #7CC7F0; --c6: #EF8342; --c7: #9E8CFF; --c8: #94A3B8;
      --ink-housing: #7CC7F0; --ink-groceries: #F2B441; --ink-dining: #4EDDB0; --ink-transport: #F0B8D4;
      --ink-entertainment: #9ED9F7; --ink-health: #FBA86B; --ink-shopping: #B7AAFF; --ink-subscriptions: #B9C4D8;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: var(--fs-md);
    line-height: 1.5;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: var(--sp-5) var(--sp-4) var(--sp-6); }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- header ---------- */
  .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-4); flex-wrap: wrap; margin-bottom: var(--sp-5); }
  .brand { display: flex; align-items: center; gap: var(--sp-3); }
  .logo { width: 40px; height: 40px; border-radius: var(--r-md); background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 15px; letter-spacing: .02em; flex: none; }
  .brand h1 { font-size: var(--fs-lg); font-weight: 600; letter-spacing: -0.01em; }
  .brand .who { font-size: var(--fs-sm); color: var(--muted); }
  .month-select { display: flex; align-items: center; gap: var(--sp-1); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--sp-1); box-shadow: var(--shadow); }
  .month-select button { width: 36px; height: 36px; border: 0; background: transparent; color: var(--text); opacity: .72; border-radius: var(--r-sm); cursor: pointer; display: grid; place-items: center; transition: background .15s ease, opacity .15s ease; }
  .month-select button:hover:not(:disabled) { background: var(--surface-2); opacity: 1; }
  .month-select button:active:not(:disabled) { transform: scale(.94); }
  .month-select button:disabled { opacity: .3; cursor: default; }
  .month-select select { appearance: none; border: 0; background: transparent; color: var(--text); font: 600 var(--fs-md) var(--font); padding: 0 var(--sp-2); cursor: pointer; text-align: center; }
  .month-select select:focus-visible, .month-select button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* ---------- cards ---------- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: var(--sp-5); }
  .card h2 { font-size: var(--fs-lg); font-weight: 600; letter-spacing: -0.01em; }
  .card .sub { font-size: var(--fs-sm); color: var(--muted); margin-top: 2px; }
  .card-head { margin-bottom: var(--sp-4); }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-4); margin-bottom: var(--sp-4); }
  .kpi { padding: var(--sp-4) var(--sp-5); }
  .kpi-label { font-size: var(--fs-sm); color: var(--muted); font-weight: 500; }
  .kpi-value { font-size: var(--fs-2xl); font-weight: 650; letter-spacing: -0.02em; margin: var(--sp-1) 0 var(--sp-2); }
  .delta { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-xs); font-weight: 600; padding: 3px 8px; border-radius: 999px; }
  .delta.pos { color: var(--pos); background: var(--pos-soft); }
  .delta.neg { color: var(--neg); background: var(--neg-soft); }
  .delta svg { width: 10px; height: 10px; }

  .grid-charts { display: grid; grid-template-columns: 5fr 7fr; gap: var(--sp-4); margin-bottom: var(--sp-4); }
  .grid-bottom { display: grid; grid-template-columns: 7fr 5fr; gap: var(--sp-4); }

  .chart-box { position: relative; margin-top: var(--sp-2); }
  svg.chart { display: block; width: 100%; height: auto; }
  svg.chart text { fill: var(--muted); font-family: var(--font); }
  .gridline { stroke: var(--line); stroke-width: 1; }
  .cat-seg { transition: opacity .15s ease; }
  .cat-seg.hot { opacity: .82; }
  .hit { cursor: pointer; outline: none; }
  .hit:focus-visible { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 4 3; }

  .legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: var(--sp-2) var(--sp-4); margin-top: var(--sp-3); }
  .legend .item { display: flex; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--muted); }
  .legend .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }

  .tip { position: absolute; z-index: 10; pointer-events: none; background: var(--text); color: var(--bg); font-size: var(--fs-xs); line-height: 1.45; padding: 7px 10px; border-radius: var(--r-sm); box-shadow: 0 6px 20px rgba(0,0,0,.18); white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); opacity: 0; transition: opacity .12s ease; }
  .tip.show { opacity: 1; }
  .tip b { font-weight: 650; font-variant-numeric: tabular-nums; }
  .tip .row { display: flex; align-items: center; gap: 6px; }
  .tip .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

  /* ---------- transactions ---------- */
  ul.txns { list-style: none; }
  li.txn { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) 0; border-top: 1px solid var(--line); }
  li.txn:first-child { border-top: 0; padding-top: 0; }
  .txn-ico { width: 38px; height: 38px; border-radius: var(--r-md); display: grid; place-items: center; flex: none; background: var(--surface-2); }
  .txn-ico svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .txn-info { min-width: 0; flex: 1; }
  .txn-merchant { font-weight: 550; font-size: var(--fs-md); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .txn-meta { font-size: var(--fs-xs); color: var(--muted); }
  .txn-amt { font-weight: 600; text-align: right; }
  .txn-amt.in { color: var(--pos); }

  /* ---------- budgets ---------- */
  .bud-row { padding: var(--sp-3) 0; border-top: 1px solid var(--line); }
  .bud-row:first-of-type { border-top: 0; padding-top: 0; }
  .bud-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--sp-2); margin-bottom: 6px; }
  .bud-head .name { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); font-weight: 550; }
  .bud-head .vals { font-size: var(--fs-xs); color: var(--muted); }
  .bud-head .vals .over { color: var(--neg); font-weight: 650; }
  .bud-head .vals .near { color: var(--warn); font-weight: 650; }
  .bud-track { height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .bud-fill { height: 100%; border-radius: 999px; transition: width .4s cubic-bezier(.2,.7,.3,1); }
  .bud-state { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 650; margin-top: 5px; }
  .bud-state.ok { color: var(--muted); }
  .bud-state.near { color: var(--warn); }
  .bud-state.over { color: var(--neg); }
  .bud-state svg { width: 11px; height: 11px; }

  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; clip: rect(0 0 0 0); overflow: hidden; white-space: nowrap; }
  .foot { margin-top: var(--sp-5); font-size: var(--fs-xs); color: var(--muted); text-align: center; }

  @media (min-width: 1100px) {
    .cat-layout { display: grid; grid-template-columns: minmax(0, 1fr) 130px; gap: var(--sp-4); align-items: center; }
    .cat-layout .legend { grid-template-columns: 1fr; margin-top: 0; }
  }
  @media (max-width: 980px) {
    .grid-charts, .grid-bottom { grid-template-columns: 1fr; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 560px) {
    .wrap { padding: var(--sp-4) var(--sp-3) var(--sp-5); }
    .topbar { flex-direction: column; align-items: stretch; }
    .month-select { justify-content: space-between; }
    .month-select button { width: 44px; height: 44px; }
    .card { padding: var(--sp-4); }
    .kpi { padding: var(--sp-4); }
    .kpi-value { font-size: var(--fs-xl); }
    .kpis { gap: var(--sp-3); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, .bud-fill, .cat-seg, .tip, .kpi, .card { transition: none !important; animation: none !important; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .kpi, .card { animation: card-in .25s ease-out backwards; }
    .kpis .kpi:nth-child(2) { animation-delay: 40ms; }
    .kpis .kpi:nth-child(3) { animation-delay: 80ms; }
    .kpis .kpi:nth-child(4) { animation-delay: 120ms; }
    .grid-charts .card:nth-child(2) { animation-delay: 60ms; }
    .grid-bottom .card:nth-child(2) { animation-delay: 60ms; }
    @keyframes card-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>

<main class="wrap">
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">MF</div>
      <div>
        <h1>Money at a glance</h1>
        <div class="who">Maya Fischer · Personal finance</div>
      </div>
    </div>
    <div class="month-select" role="group" aria-label="Month selector">
      <button id="prevMonth" aria-label="Previous month">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <select id="monthSelect" aria-label="Select month"></select>
      <button id="nextMonth" aria-label="Next month">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
  </header>

  <section class="kpis" id="kpis" aria-label="Key metrics"></section>

  <section class="grid-charts">
    <div class="card">
      <div class="card-head">
        <h2 id="catTitle">Where the money went</h2>
        <p class="sub" id="catSub"></p>
      </div>
      <div class="cat-layout">
        <div class="chart-box">
          <svg class="chart" id="catChart" role="img"></svg>
          <div class="tip" id="catTip"></div>
        </div>
        <div class="legend" id="catLegend"></div>
      </div>
      <table class="sr-only" id="catTable"></table>
    </div>
    <div class="card">
      <div class="card-head">
        <h2>Income vs spending</h2>
        <p class="sub" id="ivSub"></p>
      </div>
      <div class="chart-box">
        <svg class="chart" id="ivChart" role="img"></svg>
        <div class="tip" id="ivTip"></div>
      </div>
      <div class="legend" id="ivLegend"></div>
      <table class="sr-only" id="ivTable"></table>
    </div>
  </section>

  <section class="grid-bottom">
    <div class="card">
      <div class="card-head">
        <h2 id="txTitle">Recent transactions</h2>
        <p class="sub" id="txSub"></p>
      </div>
      <ul class="txns" id="txns"></ul>
    </div>
    <div class="card">
      <div class="card-head">
        <h2>Budgets</h2>
        <p class="sub" id="budSub"></p>
      </div>
      <div id="budgets"></div>
    </div>
  </section>

  <p class="foot">Sample data · Figures in USD · Front-end demo, nothing is stored.</p>
</main>

      var valS = txt(svgEl, cx + barW / 2 + gap / 2, padT + ih - hS - 6, moneyK(s.spend), 10, "middle", "600");
      [valI, valS].forEach(function (t) { t.setAttribute("pointer-events", "none"); t.style.opacity = s.sel ? 1 : 0; t.style.transition = "opacity .15s ease"; });
      if (idx > 0) svg("line", { x1: padL + groupW * idx, y1: padT, x2: padL + groupW * idx, y2: padT + ih, stroke: "var(--line)", "stroke-dasharray": "2 4", opacity: .55 }, svgEl);

      var hit = svg("rect", { x: padL + groupW * idx, y: padT, width: groupW, height: ih + padB, fill: "transparent", "class": "hit", tabindex: 0, role: "button", "aria-label": s.label + ": income " + money(s.income, 0) + ", spending " + money(s.spend, 0) + ". Activate to view this month." }, svgEl);
      function ivTipHtml() {
        return s.label +
          '<br><span class="row"><span class="dot" style="background:var(--series-income)"></span>Income <b>' + money(s.income, 0) + "</b></span>" +
          '<span class="row"><span class="dot" style="background:var(--series-spend)"></span>Spending <b>' + money(s.spend, 0) + "</b></span>" +
          '<br>Net <b>' + money(s.income - s.spend, 0) + "</b>" +
          (s.sel ? "" : '<br><span style="opacity:.75">Click to view month</span>');
      }
      function ivShow(x, y) {
        tip.innerHTML = ivTipHtml();
        placeTip(box, tip, { clientX: x, clientY: y });
      }
      function ivHover(on) {
        barI.setAttribute("opacity", on ? 1 : (s.sel ? 1 : .45));
        barS.setAttribute("opacity", on ? 1 : (s.sel ? 1 : .45));
        valI.style.opacity = (on || s.sel) ? 1 : 0;
        valS.style.opacity = (on || s.sel) ? 1 : 0;
      }
      hit.addEventListener("pointerenter", function () { tip.innerHTML = ivTipHtml(); ivHover(true); });
      hit.addEventListener("pointermove", function (e) { placeTip(box, tip, e); });
      hit.addEventListener("pointerleave", function () { hideTip(tip); ivHover(false); });
      hit.addEventListener("click", function (e) {
        if (!s.sel) { state.month = idx; render(); return; }
        ivShow(e.clientX, e.clientY);
      });
      hit.addEventListener("focus", function () {
        ivHover(true);
        var br = svgEl.getBoundingClientRect();
        ivShow(br.left + (padL + groupW * idx + groupW / 2) * (br.width / W), br.top + (padT + 20) * (br.height / H));
      });
      hit.addEventListener("blur", function () { hideTip(tip); ivHover(false); });
      hit.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); if (!s.sel) { state.month = idx; render(); } }
      });
    });

    var legend = document.getElementById("ivLegend");
    clear(legend);
    [["Income", "--series-income"], ["Spending", "--series-spend"]].forEach(function (p) {
      var d = document.createElement("div");
      d.className = "item";
      d.innerHTML = '<span class="sw" style="background:var(' + p[1] + ')"></span>' + p[0];
      legend.appendChild(d);
    });

    var tbl = document.getElementById("ivTable");
    clear(tbl);
    tbl.innerHTML = "<caption>Income vs spending by month</caption>" +
      "<tr><th>Month</th><th>Income</th><th>Spending</th></tr>" +
      series.map(function (s) { return "<tr><th>" + s.label + "</th><td>" + money(s.income) + "</td><td>" + money(s.spend) + "</td></tr>"; }).join("");
  }

  /* ---------- transactions ---------- */
  function isoDay(monthKey, day) {
    return monthKey + "-" + String(day).padStart(2, "0");
  }
  function daySort(a, b) {
    return (b.day - a.day) || (a.seq - b.seq);
  }
  function renderTxns(i) {
    var ul = document.getElementById("txns");
    clear(ul);
    var txns = monthTx(i).slice().map(function (t, idx) { t.seq = idx; return t; })
      .sort(daySort).slice(0, 9);
    document.getElementById("txTitle").textContent = "Recent transactions";
    document.getElementById("txSub").textContent = "Latest " + txns.length + " in " + MONTHS[i].label;
    txns.forEach(function (t) {
      var cat = t.cat === "income" ? { id: "income", name: "Income", color: "--pos" } : CAT_BY_ID[t.cat];
      var li = document.createElement("li");
      li.className = "txn";
      var date = new Date(isoDay(MONTHS[i].key, t.day) + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric", weekday: "short" });
      li.innerHTML =
        '<span class="txn-ico" style="color:var(--ink-' + t.cat + ')">' + iconSvg(t.cat) + "</span>" +
        '<span class="txn-info"><span class="txn-merchant">' + t.merchant + "</span>" +
        '<br><span class="txn-meta">' + date + " · " + cat.name + (t.detail ? " · " + t.detail : "") + "</span></span>" +
        '<span class="txn-amt num' + (t.cat === "income" ? " in" : "") + '">' + (t.cat === "income" ? "+" : "−") + money(t.amount) + "</span>";
      ul.appendChild(li);
    });
  }

  /* ---------- budgets ---------- */
  function warnIcon() {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>';
  }
  function renderBudgets(i) {
    var el = document.getElementById("budgets");
    clear(el);
    var spend = spendingByCat(i);
    document.getElementById("budSub").textContent = "Spending vs monthly limits · " + MONTHS[i].label;
    var sorted = CATS.slice().sort(function (a, b) { return (spend[b.id] / BUDGETS[b.id]) - (spend[a.id] / BUDGETS[a.id]); });
    sorted.forEach(function (c) {
      var spent = spend[c.id], limit = BUDGETS[c.id];
      var ratio = spent / limit;
      var over = ratio > 1, near = !over && ratio >= 0.85;
      var row = document.createElement("div");
      row.className = "bud-row";
      var fill = over ? "var(--neg)" : near ? "var(--warn)" : "var(" + c.color + ")";
      var stateHtml = over
        ? '<span class="bud-state over">' + warnIcon() + "Over budget by " + money(spent - limit) + "</span>"
        : near ? '<span class="bud-state near">' + warnIcon() + "Near limit" + "</span>"
        : '<span class="bud-state ok">' + money(Math.max(0, limit - spent), 0) + " left</span>";
      row.innerHTML =
        '<div class="bud-head"><span class="name">' + c.name + "</span>" +
        '<span class="vals num">' + money(spent, 0) + " of " + money(limit, 0) +
        (over ? ' · <span class="over">' + Math.round(ratio * 100) + "%</span>" : near ? ' · <span class="near">' + Math.round(ratio * 100) + "%</span>" : "") +
        "</span></div>" +
        '<div class="bud-track" role="progressbar" aria-valuemin="0" aria-valuemax="' + limit + '" aria-valuenow="' + Math.round(spent) + '" aria-label="' + c.name + ' budget"><div class="bud-fill" style="width:0%;background:' + fill + '"></div></div>' +
        stateHtml;
      el.appendChild(row);
      var bar = row.querySelector(".bud-fill");
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { bar.style.width = Math.min(ratio, 1) * 100 + "%"; });
      });
    });
  }

  /* ---------- wiring ---------- */
  var select = document.getElementById("monthSelect");
  var prevBtn = document.getElementById("prevMonth");
  var nextBtn = document.getElementById("nextMonth");

  MONTHS.forEach(function (m, i) {
    var o = document.createElement("option");
    o.value = i;
    o.textContent = m.label;
    select.appendChild(o);
  });

  function render() {
    select.value = state.month;
    prevBtn.disabled = state.month === 0;
    nextBtn.disabled = state.month === MONTHS.length - 1;
    renderKPIs(state.month);
    renderCatChart(state.month);
    renderIVChart(0, state.month);
    renderTxns(state.month);
    renderBudgets(state.month);
  }

  select.addEventListener("change", function () { state.month = +select.value; render(); });
  prevBtn.addEventListener("click", function () { if (state.month > 0) { state.month--; render(); } });
  nextBtn.addEventListener("click", function () { if (state.month < MONTHS.length - 1) { state.month++; render(); } });

  render();
})();
</script>
</body>
</html>
