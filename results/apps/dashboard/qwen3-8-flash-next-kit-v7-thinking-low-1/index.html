<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Aster — Personal Finance</title>
<style>
  /* ---------- Design tokens ---------- */
  :root {
    color-scheme: light dark;

    /* Neutrals */
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-2: #f0f2f5;
    --surface-3: #e7eaef;
    --text: #16181d;
    --text-muted: #5b6472;
    --text-faint: #8a92a1;
    --border: #e4e7ec;
    --border-strong: #d4d9e0;

    /* Brand + semantic */
    --accent: #2f6fed;
    --accent-soft: #eaf0fe;
    --positive: #0f9d6b;
    --positive-soft: #e4f6ee;
    --negative: #d92d2d;
    --negative-soft: #fdeaea;
    --warning: #c9740a;
    --warning-soft: #fbefdc;

    /* Chart series */
    --income: #0f9d6b;
    --expense: #e8590c;
    --grid: #edeff3;
    --axis: #b9c0cb;

    /* Category hues (Okabe–Ito derived, colorblind-safe) */
    --cat-housing: #2f6bce;
    --cat-groceries: #009e73;
    --cat-dining: #e69f00;
    --cat-transport: #b5539b;
    --cat-utilities: #4aa3df;
    --cat-lifestyle: #d55e00;
    --cat-income: #0f9d6b;
    --neutral: #9ca3af;

    --ring: rgba(47, 111, 237, .45);

    /* Spacing scale */
    --gap: 20px;
    --gap-sm: 12px;
    --gap-xs: 8px;
    --pad: 22px;
    --radius: 16px;
    --radius-sm: 10px;
    --maxw: 1220px;

    /* Type scale */
    --fs-display: clamp(1.6rem, 1.2rem + 1.4vw, 2.1rem);
    --fs-h2: 1.05rem;
    --fs-kpi: clamp(1.55rem, 1.2rem + 1.5vw, 2rem);
    --fs-body: .9rem;
    --fs-sm: .8rem;
    --fs-xs: .72rem;

    --shadow-sm: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
    --shadow: 0 4px 14px rgba(16,24,40,.06), 0 2px 6px rgba(16,24,40,.06);
    --ease: cubic-bezier(.16, 1, .3, 1);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0f14;
      --surface: #14181f;
      --surface-2: #1a1f28;
      --surface-3: #232a35;
      --text: #eef1f5;
      --text-muted: #a2abba;
      --text-faint: #717b8b;
      --border: #262d38;
      --border-strong: #333c4a;

      --accent: #5b93ff;
      --accent-soft: #16233d;
      --positive: #34c48a;
      --positive-soft: #10281f;
      --negative: #ff6b6b;
      --negative-soft: #2a1416;
      --warning: #e9a83c;
      --warning-soft: #2a2110;

      --income: #34c48a;
      --expense: #ff8a4c;
      --grid: #1c222c;
      --axis: #3a4350;

      --cat-housing: #6ba3ff;
      --cat-groceries: #38d39f;
      --cat-dining: #f2b340;
      --cat-transport: #e08ac6;
      --cat-utilities: #6fc0f2;
      --cat-lifestyle: #ff8a4c;
      --cat-income: #34c48a;
      --neutral: #6b7686;

      --ring: rgba(91, 147, 255, .5);

      --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
      --shadow: 0 8px 24px rgba(0,0,0,.35);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: var(--fs-body);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
    overflow-x: hidden;
  }

  ::selection { background: var(--accent); color: #fff; }

  /* Themed scrollbars */
  * { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }
  *::-webkit-scrollbar-track { background: transparent; }

  a { color: var(--accent); text-underline-offset: 3px; }

  :focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring); border-radius: 8px; }

  .wrap { max-width: var(--maxw); margin: 0 auto; padding: clamp(16px, 3vw, 32px); }

  /* ---------- Header ---------- */
  header.top {
    display: flex; align-items: center; justify-content: space-between;
    gap: var(--gap); flex-wrap: wrap; margin-bottom: var(--gap);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .logo {
    width: 40px; height: 40px; border-radius: 12px; flex: none;
    display: grid; place-items: center; color: #fff;
    background: linear-gradient(150deg, var(--accent), #7a4df0);
    box-shadow: var(--shadow-sm);
  }
  .brand .name { font-weight: 700; font-size: 1.02rem; letter-spacing: -.01em; }
  .brand .who { color: var(--text-muted); font-size: var(--fs-sm); }

  /* Month selector */
  .months {
    display: flex; gap: 4px; padding: 5px; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 999px; overflow-x: auto;
    scrollbar-width: none; max-width: 100%; min-width: 0;
    scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch;
  }
  .months::-webkit-scrollbar { display: none; }
  .months button {
    appearance: none; border: 0; background: transparent; cursor: pointer;
    color: var(--text-muted); font: inherit; font-size: var(--fs-sm); font-weight: 600;
    padding: 8px 14px; border-radius: 999px; white-space: nowrap; scroll-snap-align: center;
    transition: color .2s var(--ease), background .2s var(--ease), box-shadow .2s var(--ease);
  }
  .months button:hover { color: var(--text); }
  .months button[aria-pressed="true"] {
    background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm);
  }
  @media (prefers-color-scheme: dark) {
    .months button[aria-pressed="true"] { background: var(--surface-3); }
  }

  /* ---------- Cards ---------- */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .card-pad { padding: var(--pad); }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--gap-sm); margin-bottom: 4px; }
  .card-head h2 { margin: 0; font-size: var(--fs-h2); font-weight: 650; letter-spacing: -.01em; }
  .card-head .sub { color: var(--text-faint); font-size: var(--fs-xs); font-weight: 500; }

  /* ---------- KPI grid ---------- */
  .kpi-grid {
    display: grid; gap: var(--gap);
    grid-template-columns: repeat(4, minmax(0, 1fr));
    margin-bottom: var(--gap);
  }
  .kpi { padding: var(--pad); display: flex; flex-direction: column; gap: 14px; min-height: 132px; min-width: 0; }
  .kpi .label { color: var(--text-muted); font-size: var(--fs-sm); font-weight: 600; letter-spacing: .01em; display: flex; align-items: center; gap: 8px; }
  .kpi .ico { width: 18px; height: 18px; color: var(--text-faint); flex: none; }
  .kpi .value { font-size: var(--fs-kpi); font-weight: 750; letter-spacing: -.025em; line-height: 1; }
  .kpi .foot { margin-top: auto; display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); }
  .delta { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; padding: 3px 8px 3px 6px; border-radius: 999px; font-size: var(--fs-xs); }
  .delta svg { width: 13px; height: 13px; }
  .delta.good { color: var(--positive); background: var(--positive-soft); }
  .delta.bad { color: var(--negative); background: var(--negative-soft); }
  .delta.flat { color: var(--text-muted); background: var(--surface-2); }
  .kpi .vs { color: var(--text-faint); font-size: var(--fs-xs); }

  /* ---------- Charts grid ---------- */
  .grid-2 { display: grid; gap: var(--gap); grid-template-columns: 1.15fr .85fr; align-items: stretch; margin-bottom: var(--gap); }
  .chart-host { position: relative; width: 100%; margin-top: 12px; }
  .chart-host svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart-host svg .bar { transform-box: fill-box; }
  .chart-host svg .bar.anim { transition: width .7s var(--ease), height .7s var(--ease), y .7s var(--ease); }
  .chart-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; font-size: var(--fs-sm); color: var(--text-muted); }
  .chart-legend span { display: inline-flex; align-items: center; gap: 7px; }
  .chart-legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }

  /* ---------- Bottom grid ---------- */
  .grid-2b { display: grid; gap: var(--gap); grid-template-columns: 1fr 1fr; }

  /* Transactions */
  .tx-list { list-style: none; margin: 8px 0 0; padding: 4px; max-height: 430px; overflow-y: auto; }
  .tx { display: flex; align-items: center; gap: 14px; padding: 11px 10px; border-radius: var(--radius-sm); }
  .tx + .tx { margin-top: 2px; }
  .tx:hover { background: var(--surface-2); }
  .tx .ci { width: 40px; height: 40px; border-radius: 11px; flex: none; display: grid; place-items: center; background: var(--surface-2); color: var(--cat, var(--text-muted)); }
  .tx .ci svg { width: 20px; height: 20px; }
  .tx .meta { min-width: 0; flex: 1; }
  .tx .m-name { font-weight: 600; font-size: var(--fs-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx .m-sub { color: var(--text-faint); font-size: var(--fs-xs); }
  .tx .amt { font-weight: 700; font-size: var(--fs-body); white-space: nowrap; }
  .tx .amt.in { color: var(--positive); }
  .tx .amt.out { color: var(--text); }

  /* Budget */
  .bud { display: flex; flex-direction: column; gap: 17px; margin-top: 12px; }
  .bud .row .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 7px; }
  .bud .row .name { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: var(--fs-sm); }
  .bud .row .name .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .bud .row .name .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bud .row .nums { font-size: var(--fs-xs); color: var(--text-muted); white-space: nowrap; }
  .bud .row .nums b { color: var(--text); font-weight: 700; }
  .track { position: relative; height: 9px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
  .track .fill { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--accent); width: 0; transition: width .7s var(--ease), background .3s var(--ease); }
  .track .fill.ok { background: var(--accent); }
  .track .fill.warn { background: var(--warning); }
  .track .fill.over { background: var(--negative); }
  .bud .pill { font-size: var(--fs-xs); font-weight: 700; padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
  .bud .pill.ok { color: var(--text-muted); background: var(--surface-2); }
  .bud .pill.warn { color: var(--warning); background: var(--warning-soft); }
  .bud .pill.over { color: var(--negative); background: var(--negative-soft); }

  /* Tooltip */
  #tip {
    position: fixed; z-index: 50; pointer-events: none; opacity: 0;
    transform: translate(-50%, -118%);
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border-strong); border-radius: 10px;
    box-shadow: var(--shadow); padding: 9px 11px; font-size: var(--fs-sm);
    transition: opacity .12s var(--ease); max-width: 220px;
  }
  #tip .t-title { font-weight: 700; margin-bottom: 3px; }
  #tip .t-line { display: flex; align-items: center; gap: 7px; color: var(--text-muted); }
  #tip .t-line b { color: var(--text); margin-left: auto; font-weight: 700; padding-left: 12px; }
  #tip .t-dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }

  footer.foot { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--border); color: var(--text-faint); font-size: var(--fs-xs); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

  .empty { color: var(--text-faint); font-size: var(--fs-sm); padding: 24px 4px; text-align: center; }

  /* Reveal */
  @keyframes rise { from { opacity: .001; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .reveal { animation: rise .55s var(--ease) both; }

  /* ---------- Responsive ---------- */
  @media (max-width: 900px) {
    .grid-2, .grid-2b { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    :root { --gap: 14px; --pad: 16px; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .kpi { min-height: 112px; }
    header.top { align-items: flex-start; }
  }
  @media (max-width: 460px) {
    .kpi-grid { grid-template-columns: 1fr; }
    .kpi { min-height: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
</style>
</head>

      ["08-02","Polar Electric","Utilities",-156],
      ["08-02","Fiberlink Internet","Utilities",-62],
      ["08-04","Marlow & Sons Grocer","Groceries",-99.6],
      ["08-05","Weekend trip · Train","Transport",-118],
      ["08-08","Corner Bistro","Dining",-52.3],
      ["08-09","Pulse Fitness","Lifestyle",-39],
      ["08-11","Marlow & Sons Grocer","Groceries",-88.4],
      ["08-13","New sneakers","Lifestyle",-142],
      ["08-15","Umami Ramen","Dining",-41],
      ["08-18","Vero Mobile","Utilities",-45],
      ["08-20","Harvest Market","Groceries",-76.5],
      ["08-22","Slate Coffee","Dining",-10.8],
      ["08-24","Rideshare","Transport",-24.4],
      ["08-28","Freelance · Retainer","Income",900]
    ],
    "2026-09": [
      ["09-01","Greenline Apartments","Housing",-1850],
      ["09-01","Northwind Studio · Salary","Income",5200],
      ["09-02","Polar Electric","Utilities",-121],
      ["09-02","Fiberlink Internet","Utilities",-62],
      ["09-03","Marlow & Sons Grocer","Groceries",-128.2],
      ["09-04","Rideshare","Transport",-33.5],
      ["09-05","Corner Bistro","Dining",-72.4],
      ["09-07","Marlow & Sons Grocer","Groceries",-117.9],
      ["09-08","Pulse Fitness","Lifestyle",-39],
      ["09-09","Umami Ramen","Dining",-44.8],
      ["09-11","Marlow & Sons Grocer","Groceries",-104.6],
      ["09-12","New headphones","Lifestyle",-189],
      ["09-14","Vero Mobile","Utilities",-45],
      ["09-16","Harvest Market","Groceries",-63.4],
      ["09-18","Taco Libre","Dining",-26.3],
      ["09-19","Rideshare","Transport",-27.1],
      ["09-21","Concert · Downtown","Lifestyle",-85],
      ["09-23","Slate Coffee","Dining",-9.7],
      ["09-25","Northwind Studio · Bonus","Income",700]
    ]
  };

  // Build typed transactions
  const TX = {};
  Object.keys(RAW).forEach(m => {
    TX[m] = RAW[m].map(r => ({ date: r[0], merchant: r[1], cat: r[2], amt: r[3] }));
  });

  /* ================= Helpers ================= */
  const fmtCur = (n, cents) =>
    new Intl.NumberFormat("en-US", { style: "currency", currency: "USD",
      minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: cents ? 2 : 0 }).format(n);
  const fmtShort = n => {
    const a = Math.abs(n);
    if (a >= 1000) return (n < 0 ? "-$" : "$") + (a / 1000).toFixed(a >= 10000 ? 0 : 1).replace(/\.0$/, "") + "k";
    return fmtCur(n);
  };
  const catColor = c => c === INCOME_CAT ? "var(--cat-income)" : `var(${CATS[c].token})`;

  const REDUCE = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const fmtByKind = (kind, v) => kind === "pct" ? v.toFixed(0) + "%" : fmtCur(v);
  function countUp(el) {
    const target = parseFloat(el.dataset.target);
    const kind = el.dataset.kind || "cur";
    if (REDUCE || !isFinite(target) || target === 0) { el.textContent = fmtByKind(kind, target || 0); return; }
    const dur = 720, t0 = performance.now();
    (function step(now) {
      const p = Math.min(1, (now - t0) / dur);
      el.textContent = fmtByKind(kind, target * easeOut(p));
      if (p < 1) requestAnimationFrame(step);
      else el.textContent = fmtByKind(kind, target);
    })(t0);
  }
  function finalizeBars(host, animate) {
    if (!animate || REDUCE) return;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      host.querySelectorAll(".bar.anim").forEach(el => {
        if (el.dataset.w !== undefined) el.setAttribute("width", el.dataset.w);
        if (el.dataset.h !== undefined) el.setAttribute("height", el.dataset.h);
        if (el.dataset.y !== undefined) el.setAttribute("y", el.dataset.y);
      });
    }));
  }

  function monthTx(key) { return TX[key] || []; }
  function sums(key) {
    let income = 0, expense = 0; const byCat = {};
    monthTx(key).forEach(t => {
      if (t.amt >= 0) { income += t.amt; }
      else { expense += -t.amt; byCat[t.cat] = (byCat[t.cat] || 0) + -t.amt; }
    });
    return { income, expense, net: income - expense, byCat };
  }
  // cumulative net up to and including month index
  const OPENING = 8250; // start of April balance
  function balanceAt(idx) {
    let b = OPENING;
    for (let i = 0; i <= idx; i++) b += sums(MONTHS[i].key).net;
    return b;
  }

  /* ================= Tooltip ================= */
  const tip = document.getElementById("tip");
  function showTip(html, x, y) {
    tip.innerHTML = html;
    tip.style.left = x + "px";
    tip.style.top = y + "px";
    tip.style.opacity = "1";
    tip.setAttribute("aria-hidden", "false");
  }
  function hideTip() { tip.style.opacity = "0"; tip.setAttribute("aria-hidden", "true"); }
  document.addEventListener("scroll", hideTip, true);
  window.addEventListener("resize", hideTip);

  /* ================= Month selector ================= */
  const monthsEl = document.getElementById("months");
  let active = MONTHS.length - 1; // latest month = September

  MONTHS.forEach((m, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = m.short;
    b.setAttribute("aria-pressed", String(i === active));
    b.dataset.i = i;
    b.addEventListener("click", () => { setActive(i); });
    monthsEl.appendChild(b);
  });
  function setActive(i) {
    active = i;
    [...monthsEl.children].forEach((b, j) => b.setAttribute("aria-pressed", String(j === i)));
    render();
  }

  /* ================= KPI cards ================= */
  const KPI_ICONS = {
    balance: '<path d="M3 7a2 2 0 012-2h13a1 1 0 011 1v2"/><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2v-3h-5a3 3 0 010-6h5V8"/>',
    income: '<path d="M12 19V5"/><path d="M6 11l6-6 6 6"/>',
    expense: '<path d="M12 5v14"/><path d="M6 13l6 6 6-6"/>',
    savings: '<path d="M19 5L5 19"/><path d="M6.5 6.5h.01M17.5 17.5h.01"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="7" r="2"/>'
  };
  const kpisEl = document.getElementById("kpis");

  function deltaEl(cur, prev, { goodWhenUp = true, pct = true } = {}) {
    const diff = cur - prev;
    const isFlat = Math.abs(diff) < (pct ? 0.05 : 0.005);
    let cls = "flat", arrow;
    if (!isFlat) {
      const up = diff > 0;
      cls = (up === goodWhenUp) ? "good" : "bad";
      arrow = up ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>'
                 : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
    } else {
      arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 12h12"/></svg>';
    }
    let txt;
    if (pct) {
      const p = prev !== 0 ? Math.abs(diff / prev) * 100 : 0;
      txt = isFlat ? "no change" : (Math.abs(diff) < (1e-9) ? "no change" : p.toFixed(0) + "%");
    } else {
      txt = isFlat ? "no change" : fmtCur(Math.abs(diff));
    }
    return `<span class="delta ${cls}">${arrow}${txt}</span>`;
  }

  function renderKPIs() {
    const cur = sums(MONTHS[active].key);
    const prev = active > 0 ? sums(MONTHS[active - 1].key) : null;
    const bal = balanceAt(active);
    const prevBal = active > 0 ? balanceAt(active - 1) : null;
    const sr = cur.income ? (cur.net / cur.income) * 100 : 0;
    const prevSr = prev && prev.income ? (prev.net / prev.income) * 100 : null;

    const cards = [
      { label: "Balance", ico: KPI_ICONS.balance, target: bal, kind: "cur",
        delta: prevBal != null ? deltaEl(bal, prevBal, { goodWhenUp: true }) : "", vs: "vs last month" },
      { label: "Income", ico: KPI_ICONS.income, target: cur.income, kind: "cur",
        delta: prev ? deltaEl(cur.income, prev.income, { goodWhenUp: true }) : "", vs: "vs last month" },
      { label: "Spending", ico: KPI_ICONS.expense, target: cur.expense, kind: "cur",
        delta: prev ? deltaEl(cur.expense, prev.expense, { goodWhenUp: false }) : "", vs: "vs last month" },
      { label: "Savings rate", ico: KPI_ICONS.savings, target: sr, kind: "pct",
        delta: prevSr != null ? deltaEl(sr, prevSr, { goodWhenUp: true, pct: true }) : "", vs: "vs last month" }
    ];

    kpisEl.innerHTML = cards.map((c, i) => `
      <div class="card kpi reveal" style="animation-delay:${i * 60}ms">
        <div class="label"><span class="ico"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${c.ico}</svg></span>${c.label}</div>
        <div class="value" data-target="${c.target}" data-kind="${c.kind}">${fmtByKind(c.kind, c.target)}</div>
        <div class="foot">${c.delta}<span class="vs">${c.vs}</span></div>
      </div>`).join("");

    kpisEl.querySelectorAll(".value").forEach(countUp);
  }

  /* ================= Chart: income vs spending (grouped columns) ================= */
  const trendHost = document.getElementById("chart-trend");
  function drawTrend(animate) {
    const W = Math.max(320, trendHost.clientWidth);
    const H = 268;
    const padL = 52, padR = 12, padT = 14, padB = 30;
    const plotW = W - padL - padR, plotH = H - padT - padB;
    const data = MONTHS.map((m, i) => { const s = sums(m.key); return { short: m.short, income: s.income, expense: s.expense }; });
    const maxV = Math.max(...data.flatMap(d => [d.income, d.expense])) * 1.1;
    const ticks = niceTicks(0, maxV, 4);
    const top = ticks[ticks.length - 1];
    const y = v => padT + plotH - (v / top) * plotH;

    let g = "";
    // grid + y labels
    ticks.forEach(t => {
      const yy = y(t);
      g += `<line x1="${padL}" y1="${yy}" x2="${W - padR}" y2="${yy}" stroke="var(--grid)" stroke-width="1"/>`;
      g += `<text x="${padL - 9}" y="${yy + 4}" text-anchor="end" font-size="11" fill="var(--text-faint)">${fmtShort(t)}</text>`;
    });
    g += `<line x1="${padL}" y1="${padT + plotH}" x2="${W - padR}" y2="${padT + plotH}" stroke="var(--axis)" stroke-width="1"/>`;

    const groupW = plotW / data.length;
    const barW = Math.min(24, groupW * 0.3);
    const gap = 5;

    data.forEach((d, i) => {
      const cx = padL + groupW * i + groupW / 2;
      const bars = [
        { v: d.income, color: "var(--income)", off: -(barW / 2) - gap / 2, kind: "Income", i },
        { v: d.expense, color: "var(--expense)", off: (barW / 2) + gap / 2, kind: "Spending", i }
      ];
      bars.forEach(b => {
        const bh = Math.max(0, (b.v / top) * plotH);
        const x = cx + b.off - barW / 2;
        const yy = padT + plotH - bh;
        const baseline = padT + plotH;
        const anim = animate && !REDUCE;
        const attrY = anim ? baseline : yy.toFixed(1);
        const attrH = anim ? 0 : bh.toFixed(1);
        const cls = anim ? "bar anim" : "bar";
        const dAnim = anim ? ` data-h="${bh.toFixed(1)}" data-y="${yy.toFixed(1)}"` : "";
        g += `<rect class="${cls}" x="${x.toFixed(1)}" y="${attrY}" width="${barW}" height="${attrH}" rx="4" fill="${b.color}"${dAnim}
                data-tip='${JSON.stringify({ title: MONTHS[b.i].full, lines: [["Income", "var(--income)", d.income], ["Spending", "var(--expense)", d.expense]] })}'></rect>`;
      });
      g += `<text x="${cx}" y="${H - 9}" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--text-muted)">${d.short}</text>`;
    });

    trendHost.innerHTML = svgWrap(W, H, g);
    trendHost.setAttribute("aria-label",
      "Income versus spending across six months. " + data.map(d => `${d.short}: income ${fmtCur(d.income)}, spending ${fmtCur(d.expense)}`).join(". "));

    // hidden table
    document.getElementById("trend-table").innerHTML =
      "<table><caption>Income vs spending by month</caption><thead><tr><th>Month</th><th>Income</th><th>Spending</th></tr></thead><tbody>" +
      data.map(d => `<tr><td>${d.short}</td><td>${fmtCur(d.income)}</td><td>${fmtCur(d.expense)}</td></tr>`).join("") + "</tbody></table>";

    finalizeBars(trendHost, animate);
    wireTips(trendHost);
  }

  /* ================= Chart: spending by category (horizontal bars) ================= */
  const catHost = document.getElementById("chart-category");
  function drawCategory(animate) {
    const s = sums(MONTHS[active].key);
    const entries = Object.entries(s.byCat).filter(e => e[1] > 0).sort((a, b) => b[1] - a[1]);
    const total = entries.reduce((a, e) => a + e[1], 0);

    if (!entries.length) {
      catHost.innerHTML = `<div class="empty">No spending recorded this month.</div>`;
      document.getElementById("cat-table").innerHTML = "";
      return;
    }

    const W = Math.max(300, catHost.clientWidth);
    const rowH = 40, padTop = 6, padBottom = 26, padL = 108, padR = 62;
    const H = padTop + entries.length * rowH + padBottom;
    const plotW = W - padL - padR;
    const maxV = Math.max(...entries.map(e => e[1])) * 1.08;
    const x = v => padL + (v / maxV) * plotW;

    let g = "";
    // x gridlines
    const ticks = niceTicks(0, maxV, 3);
    ticks.forEach(t => {
      const xx = x(t);
      g += `<line x1="${xx}" y1="${padTop}" x2="${xx}" y2="${padTop + entries.length * rowH}" stroke="var(--grid)" stroke-width="1"/>`;
      g += `<text x="${xx}" y="${H - 8}" text-anchor="middle" font-size="10.5" fill="var(--text-faint)">${fmtShort(t)}</text>`;
    });

    entries.forEach((e, idx) => {
      const [name, val] = e;
      const yy = padTop + idx * rowH + rowH / 2;
      const bw = Math.max(2, (val / maxV) * plotW);
      const col = catColor(name);
      g += `<text x="${padL - 12}" y="${yy + 4}" text-anchor="end" font-size="12" font-weight="600" fill="var(--text)">${name}</text>`;
      g += `<rect x="${padL}" y="${yy - 11}" width="${plotW}" height="22" rx="6" fill="var(--surface-2)"/>`;
      const anim = animate && !REDUCE;
      const attrW = anim ? 0 : bw.toFixed(1);
      const cls = anim ? "bar anim" : "bar";
      const dAnim = anim ? ` data-w="${bw.toFixed(1)}"` : "";
      g += `<rect class="${cls}" x="${padL}" y="${yy - 11}" width="${attrW}" height="22" rx="6" fill="${col}"${dAnim}
              data-tip='${JSON.stringify({ title: name, lines: [[MONTHS[active].short + " spend", col, val], ["Share", "var(--neutral)", total ? (val / total * 100) : 0]] })}'></rect>`;
      g += `<text x="${(padL + bw + 8).toFixed(1)}" y="${yy + 4}" font-size="11.5" font-weight="700" fill="var(--text-muted)">${fmtShort(val)}</text>`;
    });

    catHost.innerHTML = svgWrap(W, H, g);
    catHost.setAttribute("aria-label",
      "Spending by category for " + MONTHS[active].full + ", total " + fmtCur(total) + ". " +
      entries.map(e => `${e[0]} ${fmtCur(e[1])}`).join(", "));

    document.getElementById("cat-sub").textContent = "Total " + fmtCur(total);
    document.getElementById("cat-table").innerHTML =
      "<table><caption>Spending by category " + MONTHS[active].full + "</caption><thead><tr><th>Category</th><th>Amount</th></tr></thead><tbody>" +
      entries.map(e => `<tr><td>${e[0]}</td><td>${fmtCur(e[1])}</td></tr>`).join("") + "</tbody></table>";

    finalizeBars(catHost, animate);
    wireTips(catHost);
  }

  /* ================= Transactions ================= */
  const txList = document.getElementById("tx-list");
  function renderTx() {
    const list = [...monthTx(MONTHS[active].key)].sort((a, b) => a.date < b.date ? 1 : -1);
    document.getElementById("tx-sub").textContent = MONTHS[active].full;
    if (!list.length) { txList.innerHTML = `<li class="empty">No transactions this month.</li>`; return; }
    txList.innerHTML = list.map(t => {
      const inc = t.amt >= 0;
      const col = catColor(t.cat);
      const label = fmtCur(Math.abs(t.amt), true);
      const day = String(+t.date.slice(-2));
      const dateStr = MONTHS[active].short + " " + day;
      return `<li class="tx">
        <span class="ci" style="--cat:${col}"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[t.cat]}</svg></span>
        <span class="meta"><span class="m-name">${t.merchant}</span><span class="m-sub">${t.cat} · ${dateStr}</span></span>
        <span class="amt ${inc ? "in" : "out"}">${inc ? "+" : "−"}${label}</span>
      </li>`;
    }).join("");
  }

  /* ================= Budget ================= */
  const budList = document.getElementById("bud-list");
  function renderBudget() {
    const s = sums(MONTHS[active].key);
    document.getElementById("bud-sub").textContent = MONTHS[active].full;
    budList.innerHTML = Object.entries(CATS).map(([name, c]) => {
      const spent = s.byCat[name] || 0;
      const pct = c.budget ? (spent / c.budget) * 100 : 0;
      let state = "ok";
      if (pct >= 100) state = "over"; else if (pct >= 80) state = "warn";
      const fillW = Math.min(100, pct);
      const col = catColor(name);
      let pill, note;
      if (state === "over") { pill = `<span class="pill over">${Math.round(pct)}% · over by ${fmtShort(spent - c.budget)}</span>`; }
      else if (state === "warn") { pill = `<span class="pill warn">${Math.round(pct)}% · near limit</span>`; }
      else { pill = `<span class="pill ok">${Math.round(pct)}%</span>`; }
      return `<div class="row">
        <div class="top">
          <span class="name"><span class="dot" style="background:${col}"></span><span class="nm">${name}</span></span>
          ${pill}
        </div>
        <div class="track"><span class="fill ${state}" data-w="${fillW}" style="width:${REDUCE ? fillW : 0}%"></span></div>
        <div class="nums" style="margin-top:6px"><b>${fmtCur(spent)}</b> of ${fmtCur(c.budget)} budget</div>
      </div>`;
    }).join("");
    // animate fills after layout
    requestAnimationFrame(() => requestAnimationFrame(() => {
      budList.querySelectorAll(".fill").forEach((f, idx) => {
        if (REDUCE) { f.style.width = f.dataset.w + "%"; return; }
        f.style.transitionDelay = (idx * 55) + "ms";
        f.style.width = f.dataset.w + "%";
      });
    }));
  }

  /* ================= Shared SVG / ticks / tips ================= */
  function svgWrap(w, h, inner) {
    return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
  }
  function niceTicks(min, max, count) {
    const span = max - min;
    const step0 = span / count;
    const mag = Math.pow(10, Math.floor(Math.log10(step0)));
    const norm = step0 / mag;
    const step = (norm >= 5 ? 5 : norm >= 2 ? 2 : 1) * mag;
    const out = [];
    for (let v = 0; v <= max + step * 0.001; v += step) out.push(Math.round(v * 100) / 100);
    return out;
  }

  function wireTips(host) {
    host.querySelectorAll(".bar").forEach(el => {
      el.style.cursor = "pointer";
      el.addEventListener("pointerenter", ev => {
        const data = JSON.parse(el.getAttribute("data-tip"));
        let rows = `<div class="t-title">${data.title}</div>`;
        data.lines.forEach(l => {
          const val = typeof l[2] === "number" && l[0].match(/share|%/i) ? l[2].toFixed(0) + "%" : fmtCur(l[2]);
          rows += `<div class="t-line"><span class="t-dot" style="background:${l[1]}"></span>${l[0]}<b>${val}</b></div>`;
        });
        const r = el.getBoundingClientRect();
        showTip(rows, r.left + r.width / 2, r.top);
      });
      el.addEventListener("pointerleave", hideTip);
      el.addEventListener("pointerdown", ev => {
        const r = el.getBoundingClientRect();
        const data = JSON.parse(el.getAttribute("data-tip"));
        let rows = `<div class="t-title">${data.title}</div>`;
        data.lines.forEach(l => {
          const val = typeof l[2] === "number" && l[0].match(/share|%/i) ? l[2].toFixed(0) + "%" : fmtCur(l[2]);
          rows += `<div class="t-line"><span class="t-dot" style="background:${l[1]}"></span>${l[0]}<b>${val}</b></div>`;
        });
        showTip(rows, r.left + r.width / 2, r.top);
        ev.stopPropagation();
      });
    });
  }
  document.addEventListener("pointerdown", e => { if (!e.target.closest(".bar")) hideTip(); });

  /* ================= Render all ================= */
  function render() {
    renderKPIs();
    drawTrend(true);
    drawCategory(true);
    renderTx();
    renderBudget();
  }

  // redraw charts on resize (debounced), keeping fonts crisp at any width
  let rAF, roFirst = true;
  const ro = new ResizeObserver(() => {
    if (roFirst) { roFirst = false; return; }
    cancelAnimationFrame(rAF);
    rAF = requestAnimationFrame(() => { drawTrend(false); drawCategory(false); });
  });
  ro.observe(document.body);

  render();
})();
</script>
</body>
</html>
