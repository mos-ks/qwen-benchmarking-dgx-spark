<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Ledgerly — Personal Finance</title>
<link rel="stylesheet" href="styles.css">
<script>
try {
  var saved = localStorage.getItem("ledgerly-theme");
  if (saved === "dark" || (!saved && matchMedia("(prefers-color-scheme: dark)").matches))
    document.documentElement.classList.add("dark");
} catch (e) {}
</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="wrap header-inner">
    <div class="brand" aria-label="Ledgerly, personal finance">
      <span class="brand-mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="1.5" y="1.5" width="17" height="17" rx="5" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 12.5 8.5 9l2.5 2.5L14.5 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="brand-name">Ledgerly</span>
    </div>
    <div class="header-tools">
      <label class="month-label" for="monthSelect">Viewing</label>
      <div class="select-wrap">
        <select id="monthSelect" class="month-select" aria-label="Select month"></select>
        <svg class="select-chevron" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M3.5 5.5 7 9l3.5-3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch to dark theme">
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13.5A8.5 8.5 0 0 1 10.5 4 8.5 8.5 0 1 0 20 13.5z"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="main" class="wrap">
  <p class="sr-only" role="status" id="liveStatus"></p>

  <section class="kpis" aria-label="Key financial indicators">
    <article class="card kpi-card">
      <div class="kpi-top">
        <span class="kpi-icon" aria-hidden="true" data-accent="brand"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><rect x="2.5" y="5" width="15" height="11" rx="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M2.5 8.5h15" stroke="currentColor" stroke-width="1.6"/><circle cx="13.5" cy="12.5" r="1.2" fill="currentColor"/></svg></span>
        <h2 class="kpi-title">Balance</h2>
      </div>
      <p class="kpi-value" id="kpiBalance">—</p>
      <p class="kpi-delta" id="kpiBalanceDelta"></p>
    </article>
    <article class="card kpi-card">
      <div class="kpi-top">
        <span class="kpi-icon" aria-hidden="true" data-accent="pos"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M10 15.5v-11m0 0L5.5 9M10 4.5 14.5 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <h2 class="kpi-title">Income</h2>
      </div>
      <p class="kpi-value" id="kpiIncome">—</p>
      <p class="kpi-delta" id="kpiIncomeDelta"></p>
    </article>
    <article class="card kpi-card">
      <div class="kpi-top">
        <span class="kpi-icon" aria-hidden="true" data-accent="neg"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M10 4.5v11m0 0L5.5 11M10 15.5 14.5 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <h2 class="kpi-title">Spending</h2>
      </div>
      <p class="kpi-value" id="kpiSpending">—</p>
      <p class="kpi-delta" id="kpiSpendingDelta"></p>
    </article>
    <article class="card kpi-card">
      <div class="kpi-top">
        <span class="kpi-icon" aria-hidden="true" data-accent="info"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M4 15.5 8 11l2.5 2.5L16 6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.5 6.5H16V10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <h2 class="kpi-title">Savings rate</h2>
      </div>
      <p class="kpi-value" id="kpiSavings">—</p>
      <p class="kpi-delta" id="kpiSavingsDelta"></p>
    </article>
  </section>

  <section class="charts" aria-label="Spending analytics">
    <article class="card chart-card" id="categoryCard">
      <header class="card-head">
        <div>
          <h2 class="card-title">Spending by category</h2>
          <p class="card-sub" id="categorySub"></p>
        </div>
      </header>
      <div class="chart-host" id="categoryChartHost"></div>
    </article>

    <article class="card chart-card" id="trendCard">
      <header class="card-head">
        <div>
          <h2 class="card-title">Income vs spending</h2>
          <p class="card-sub">Last 6 months, monthly totals</p>
        </div>
        <div class="legend" role="list" aria-label="Chart legend">
          <span class="legend-item" role="listitem"><span class="legend-swatch" data-series="income" aria-hidden="true"></span>Income</span>
          <span class="legend-item" role="listitem"><span class="legend-swatch" data-series="spending" aria-hidden="true"></span>Spending</span>
        </div>
      </header>
      <div class="chart-host" id="trendChartHost"></div>
    </article>
  </section>

  <section class="bottom" aria-label="Transactions and budgets">
    <article class="card list-card">
      <header class="card-head">
        <div>
          <h2 class="card-title">Recent transactions</h2>
          <p class="card-sub" id="txSub"></p>
        </div>
      </header>
      <ul class="tx-list" id="txList"></ul>
    </article>

    <article class="card budget-card">
      <header class="card-head">
        <div>
          <h2 class="card-title">Budget progress</h2>
          <p class="card-sub" id="budgetSub"></p>
        </div>
      </header>
      <ul class="budget-list" id="budgetList"></ul>
    </article>
  </section>
</main>

<div class="chart-tooltip" id="chartTooltip" role="tooltip" hidden></div>

<script src="data.js"></script>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
