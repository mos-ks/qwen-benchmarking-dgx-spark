<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Ledger · Personal finance</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand">
        <svg class="brand__mark" viewBox="0 0 28 28" aria-hidden="true">
          <defs>
            <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#4a3aa7"/>
              <stop offset="1" stop-color="#2a78d6"/>
            </linearGradient>
          </defs>
          <rect width="28" height="28" rx="8" fill="url(#brandGrad)"/>
          <path d="M8 18.5v-5M12.7 18.5v-8M17.3 18.5v-6M22 18.5V8.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
        <span class="brand__name">Ledger</span>
      </div>

      <nav class="month-picker" aria-label="Select month">
        <button class="icon-btn" id="prevMonth" type="button" aria-label="Previous month">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <label class="month-select">
          <span class="visually-hidden">Month</span>
          <select id="monthSelect"></select>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </label>
        <button class="icon-btn" id="nextMonth" type="button" aria-label="Next month">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </nav>

      <div class="avatar" aria-hidden="true">MC</div>
    </div>
  </header>

  <main class="page">
    <div class="page-head">
      <div>
        <h1 id="greeting">Overview</h1>
        <p id="pageSub"></p>
      </div>
      <div class="page-head__meta">Checking + savings · USD</div>
    </div>

    <div class="grid">
      <section class="kpis" id="kpis" aria-label="Key figures"></section>

      <section class="card span-7" aria-labelledby="flowTitle">
        <div class="card__head">
          <div>
            <h2 class="card__title" id="flowTitle">Income vs spending</h2>
            <p class="card__sub">Last 6 months · select a month to drill in</p>
          </div>
          <div class="segmented" role="group" aria-label="View as">
            <button type="button" data-view="chart" aria-pressed="true">Chart</button>
            <button type="button" data-view="table" aria-pressed="false">Table</button>
          </div>
        </div>
        <div class="legend" id="flowLegend">
          <span class="legend__item"><span class="swatch" style="--swatch: var(--series-income)"></span>Income</span>
          <span class="legend__item"><span class="swatch" style="--swatch: var(--series-spend)"></span>Spending</span>
        </div>
        <div class="chart" id="flowChart"></div>
        <div id="flowTable" hidden></div>
        <div class="chart-summary" id="flowSummary"></div>
      </section>

      <section class="card span-5" aria-labelledby="catTitle">
        <div class="card__head">
          <div>
            <h2 class="card__title" id="catTitle">Spending by category</h2>
            <p class="card__sub" id="catSub"></p>
          </div>
        </div>
        <div class="donut-layout">
          <div class="donut chart" id="donut"></div>
          <ul class="cat-legend" id="catLegend" aria-label="Categories, select one to filter transactions"></ul>
        </div>
        <div class="chart-summary" id="catInsights"></div>
      </section>

      <section class="card span-7" aria-labelledby="txTitle">
        <div class="card__head">
          <div>
            <h2 class="card__title" id="txTitle">Recent transactions</h2>
            <p class="card__sub" id="txSub"></p>
          </div>
          <div class="tx-tools" id="txTools"></div>
        </div>
        <div id="txList"></div>
      </section>

      <section class="card span-5" aria-labelledby="budgetTitle">
        <div class="card__head">
          <div>
            <h2 class="card__title" id="budgetTitle">Budgets</h2>
            <p class="card__sub" id="budgetSub"></p>
          </div>
          <div class="status-legend" aria-hidden="true">
            <span><i style="background: var(--accent)"></i>On track</span>
            <span><i style="background: var(--warning)"></i>85%+</span>
            <span><i style="background: var(--critical)"></i>Over</span>
          </div>
        </div>
        <div id="budgets"></div>
      </section>
    </div>
  </main>

  <div class="tooltip" id="tooltip" role="tooltip" aria-hidden="true"></div>

  <script src="app.js"></script>
</body>
</html>
