<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>Maya Chen · Finances</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<!-- Icon sprite: category / type icons, drawn as inline SVG -->
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <defs>
    <g id="ic-housing" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 10.5 12 3l9 7.5" />
      <path d="M5.5 9.2V20h13V9.2" />
      <path d="M9.5 20v-5.2h5V20" />
    </g>
    <g id="ic-groceries" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 4h2l1.7 10.3a1 1 0 0 0 1 .8h8.1a1 1 0 0 0 1-.8L19 7H6" />
      <circle cx="9" cy="19.5" r="1.4" />
      <circle cx="16.5" cy="19.5" r="1.4" />
    </g>
    <g id="ic-dining" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 3v5.5a2.2 2.2 0 0 0 4.4 0V3" />
      <path d="M8.2 11V21" />
      <path d="M17 3c1.7 1.6 2.3 4.4 1 6.9-.5 1-1.3 1.4-1.3 3.1V21" />
    </g>
    <g id="ic-transport" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.5 11.5 6.1 7.2A2 2 0 0 1 8 6h8a2 2 0 0 1 1.9 1.2l1.6 4.3" />
      <path d="M3.5 11.5h17v4.5h-17z" />
      <circle cx="7.5" cy="16.5" r="1.5" />
      <circle cx="16.5" cy="16.5" r="1.5" />
    </g>
    <g id="ic-utilities" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 2.5 5 13h5l-1 8.5L17 10h-5z" />
    </g>
    <g id="ic-entertainment" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="8.5" />
      <path d="M10.2 8.8 15.5 12l-5.3 3.2z" />
    </g>
    <g id="ic-shopping" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 8h12l-1 12.5H7z" />
      <path d="M9 8a3 3 0 0 1 6 0" />
    </g>
    <g id="ic-salary" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="6.5" width="18" height="11" rx="2.2" />
      <circle cx="12" cy="12" r="2.6" />
      <path d="M6.5 9.5v5M17.5 9.5v5" />
    </g>
    <g id="ic-freelance" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="8" width="18" height="11" rx="2.2" />
      <path d="M8.5 8V6.2A2 2 0 0 1 10.5 4.2h3a2 2 0 0 1 2 2V8" />
      <path d="M3 12.8h18" />
    </g>
    <g id="ic-arrow" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 19V5" />
      <path d="M6 11l6-6 6 6" />
    </g>
  </defs>
</svg>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 28 28" width="28" height="28"><rect width="28" height="28" rx="8" fill="var(--accent)"/><path d="M8 18.5 12 13l3 3 5-6.5" fill="none" stroke="var(--accent-fg)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="brand-text">
        <strong>Maya Chen</strong>
        <span class="brand-sub" id="greeting">Personal finances</span>
      </span>
    </div>
    <div class="controls">
      <label class="month-field">
        <span class="sr-only">Choose month</span>
        <svg class="month-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"/></svg>
        <select id="monthSelect" aria-label="Choose month"></select>
      </label>
    </div>
  </header>

  <main id="main">
    <p class="eyebrow" id="periodLine">Overview</p>

    <section class="kpis" id="kpis" aria-label="Key metrics" aria-live="polite"></section>

    <div class="grid-2">
      <section class="card chart-card" aria-labelledby="trendTitle">
        <div class="card-head">
          <h2 id="trendTitle">Income vs spending</h2>
          <p class="card-sub" id="trendSub">Last 6 months</p>
        </div>
        <div class="chart-body" id="trendChart" role="img" aria-label="Income versus spending across the last six months"></div>
      </section>

      <section class="card chart-card" aria-labelledby="catTitle">
        <div class="card-head">
          <h2 id="catTitle">Spending by category</h2>
          <p class="card-sub" id="catSub">Share of spend</p>
        </div>
        <div class="donut-wrap">
          <div class="donut-chart" id="catChart" role="img" aria-label="Spending by category for the selected month"></div>
          <ul class="legend" id="catLegend"></ul>
        </div>
      </section>
    </div>

    <div class="grid-2">
      <section class="card" aria-labelledby="budgetTitle">
        <div class="card-head">
          <h2 id="budgetTitle">Budgets</h2>
          <p class="card-sub" id="budgetSub">Monthly limits</p>
        </div>
        <div class="budgets" id="budgets"></div>
      </section>

      <section class="card" aria-labelledby="txTitle">
        <div class="card-head">
          <h2 id="txTitle">Recent transactions</h2>
          <p class="card-sub" id="txSub">This month</p>
        </div>
        <ul class="tx-list" id="txList"></ul>
      </section>
    </div>
  </main>

  <footer class="foot">
    <span>Sample data for demonstration · Figures are illustrative.</span>
    <span class="foot-theme" id="themeNote">Theme follows your system.</span>
  </footer>
</div>

<div id="tooltip" class="tooltip" role="status" aria-live="polite" aria-hidden="true"></div>

<script src="app.js"></script>
</body>
</html>
