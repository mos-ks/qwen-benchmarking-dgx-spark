<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bonsai — Wind</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0b0d1f;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const W = 160, H = 120;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = W;
canvas.height = H;
ctx.imageSmoothingEnabled = false;

let scale = 1;
function fit() {
  scale = Math.max(1, Math.floor(Math.min(innerWidth / W, innerHeight / H)));
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
fit();
addEventListener('resize', fit);

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function mulberry32(a) {
  return () => {
    a |= 0;
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(42);

const SKY = ['#0b0d1f', '#161a3a', '#262b5c', '#3b3f7a', '#5a6aa0'];
const FOLIAGE = ['#1d3b2a', '#2f5d34', '#4a8a3c', '#78b84a', '#b8e070'];
const BARK = ['#1a0f0a', '#3d2018', '#5a3828', '#7a4e38', '#9a6a48'];
const POT = ['#2a1414', '#4a2626', '#6a3838', '#8a4e4e', '#b06868'];
const SOIL = ['#14100e', '#241a16', '#3a2c24'];
const LEAF_COLORS = ['#4a8a3c', '#78b84a', '#b8e070'];

const px = (x, y, c) => {
  const ix = Math.round(x), iy = Math.round(y);
  if (ix >= 0 && ix < W && iy >= 0 && iy < H) {
    ctx.fillStyle = c;
    ctx.fillRect(ix, iy, 1, 1);
  }
};
function disc(cx, cy, r, c) {
  for (let y = -r; y <= r; y++)
    for (let x = -r; x <= r; x++)
      if (x * x + y * y <= r * r + r * 0.8)
        px(cx + x, cy + y, c);
}
function ellipse(cx, cy, rx, ry, c) {
  for (let y = -ry; y <= ry; y++)
    for (let x = -rx; x <= rx; x++)
      if ((x * x) / (rx * rx) + (y * y) / (ry * ry) <= 1.0)
        px(cx + x, cy + y, c);
}
function taper(x0, y0, cx, cy, x1, y1, w0, w1, c) {
  const steps = Math.ceil(Math.hypot(x1 - x0, y1 - y0)) * 2;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps, u = 1 - t;
    const x = u * u * x0 + 2 * u * t * cx + t * t * x1;
    const y = u * u * y0 + 2 * u * t * cy + t * t * y1;
    disc(x, y, Math.max(0, Math.round((w0 + (w1 - w0) * t) / 2)), c);
  }
}

function drawSky() {
  for (let y = 0; y < H; y++) {
    const t = y / H;
    const idx = Math.min(SKY.length - 1, Math.floor(t * SKY.length));
    ctx.fillStyle = SKY[idx];
    ctx.fillRect(0, y, W, 1);
  }
  const mx = 128, my = 22;
  disc(mx, my, 6, '#d8dce8');
  disc(mx - 1, my - 1, 5, '#eef0f8');
  disc(mx + 2, my - 1, 4, '#c8ccd8');
  disc(mx - 1, my, 5, '#eef0f8');
  disc(mx, my + 1, 5, '#d0d4e0');
  for (let i = 0; i < 25; i++) {
    const r = rand();
    if (r < 0.5) {
      const sx = Math.round(rand() * W);
      const sy = Math.round(rand() * 50);
      if (sy > 10 && sy < 50) {
        px(sx, sy, rand() < 0.3 ? '#ffffff' : '#c8d0e8');
      }
    }
  }
}

function drawGround() {
  const groundTop = H - 12;
  for (let y = groundTop; y < H; y++) {
    const t = (y - groundTop) / (H - groundTop);
    ctx.fillStyle = t < 0.3 ? SKY[3] : SKY[4];
    ctx.fillRect(0, y, W, 1);
  }
  for (let x = 56; x < 104; x++) {
    for (let y = groundTop - 1; y < groundTop + 2; y++) {
      if ((x + y) % 2 === 0) px(x, y, 'rgba(0,0,0,0.25)');
    }
  }
}

function drawPot() {
  const potTop = H - 22;
  const potBot = H - 12;
  const potL = 66, potR = 94;
  const rimL = 60, rimR = 100;
  const rimTop = potTop - 3;

  for (let y = potTop; y < potBot; y++) {
    const t = (y - potTop) / (potBot - potTop);
    const l = Math.round(potL + (rimL - potL) * t);
    const r = Math.round(potR + (rimR - potR) * t);
    for (let x = l; x < r; x++) {
      const mid = (l + r) / 2;
      if (x < mid - 2) px(x, y, POT[4]);
      else if (x > mid + 2) px(x, y, POT[2]);
      else px(x, y, POT[3]);
    }
  }
  for (let y = rimTop; y < potTop; y++) {
    for (let x = rimL; x < rimR; x++) {
      px(x, y, y < rimTop + 1 ? POT[4] : POT[3]);
    }
  }
  for (let y = rimTop; y < potTop; y++) {
    for (let x = rimL; x < rimL + 2; x++) px(x, y, POT[4]);
  }
  for (let y = rimTop; y < potTop; y++) {
    for (let x = rimR - 2; x < rimR; x++) px(x, y, POT[1]);
  }
  for (let y = potTop; y < potBot; y++) {
    const t = (y - potTop) / (potBot - potTop);
    const r = Math.round(potR + (rimR - potR) * t);
    for (let x = r - 2; x < r; x++) px(x, y, POT[1]);
  }
  for (let y = potTop; y < potBot; y++) {
    const t = (y - potTop) / (potBot - potTop);
    const l = Math.round(potL + (rimL - potL) * t);
    for (let x = l; x < l + 2; x++) px(x, y, POT[4]);
  }
  for (let y = rimTop + 1; y < potTop; y++) {
    for (let x = rimL + 1; x < rimR - 1; x++) {
      px(x, y, SOIL[(x + y) % 3 === 0 ? 0 : 1]);
    }
  }
}

function drawTrunk(t) {
  const amp = reduced ? 0 : 1;
  const sway = Math.round(Math.sin(t * 0.7) * 0.8) * amp;
  const baseX = 80, baseY = H - 22;
  const midX = 72 + sway, midY = H - 48;
  const topX = 76 + Math.round(sway * 1.5), topY = H - 64;

  taper(baseX + 1, baseY, midX + 1, midY, topX + 1, topY, 9, 3, BARK[0]);
  taper(baseX, baseY, midX, midY, topX, topY, 9, 3, BARK[2]);
  taper(baseX - 1, baseY, midX - 1, midY, topX - 1, topY, 8, 2, BARK[4]);

  taper(baseX - 5, baseY, baseX - 9, baseY + 2, baseX - 12, baseY + 3, 4, 1, BARK[1]);
  taper(baseX + 5, baseY, baseX + 9, baseY + 2, baseX + 12, baseY + 3, 4, 1, BARK[1]);

  for (let i = 0; i < 18; i++) {
    const r = rand();
    if (r < 0.4) {
      const bx = Math.round(baseX + (rand() - 0.5) * 8);
      const by = Math.round(baseY - rand() * 30);
      px(bx, by, BARK[3]);
    }
  }

  const b1x = 68 + Math.round(sway * 0.8), b1y = H - 44;
  taper(b1x, b1y, b1x - 14, b1y - 10, b1x - 22, b1y - 18, 4, 1, BARK[0]);
  taper(b1x, b1y, b1x - 13, b1y - 9, b1x - 21, b1y - 17, 4, 1, BARK[2]);
  taper(b1x, b1y, b1x - 12, b1y - 8, b1x - 20, b1y - 16, 3, 1, BARK[4]);

  const b2x = 84 + Math.round(sway * 1.2), b2y = H - 54;
  taper(b2x, b2y, b2x + 16, b2y - 12, b2x + 26, b2y - 22, 4, 1, BARK[0]);
  taper(b2x, b2y, b2x + 15, b2y - 11, b2x + 25, b2y - 21, 4, 1, BARK[2]);
  taper(b2x, b2y, b2x + 14, b2y - 10, b2x + 24, b2y - 20, 3, 1, BARK[4]);

  const b3x = 75 + Math.round(sway * 1.5), b3y = H - 62;
  taper(b3x, b3y, b3x - 3, b3y - 14, b3x - 6, b3y - 24, 4, 1, BARK[0]);
  taper(b3x, b3y, b3x - 3, b3y - 13, b3x - 6, b3y - 23, 4, 1, BARK[2]);
  taper(b3x, b3y, b3x - 3, b3y - 12, b3x - 5, b3y - 22, 3, 1, BARK[4]);

  return {
    trunkTop: { x: topX, y: topY },
    b1: { x: b1x - 22, y: b1y - 18 },
    b2: { x: b2x + 26, y: b2y - 22 },
    b3: { x: b3x - 6, y: b3y - 24 },
    sway
  };
}

function drawFoliage(t, trunk) {
  const amp = reduced ? 0 : 1;
  const sway = trunk.sway;
  const phase = t * 0.6;
  const pads = [
    { cx: trunk.trunkTop.x, cy: trunk.trunkTop.y - 6, rx: 13, ry: 8, sf: 1.3 },
    { cx: trunk.b1.x + 3, cy: trunk.b1.y - 3, rx: 11, ry: 7, sf: 0.7 },
    { cx: trunk.b2.x - 3, cy: trunk.b2.y - 3, rx: 11, ry: 7, sf: 0.8 },
    { cx: trunk.b3.x, cy: trunk.b3.y - 3, rx: 10, ry: 6, sf: 1.1 },
    { cx: 78 + Math.round(sway * 1.1), cy: H - 48, rx: 12, ry: 7, sf: 0.9 },
    { cx: 60, cy: H - 38, rx: 14, ry: 9, sf: 0.6 },
    { cx: 94, cy: H - 34, rx: 13, ry: 8, sf: 0.7 },
  ];
  for (const pad of pads) {
    const ps = Math.round(Math.sin(phase + pad.cx * 0.3) * pad.sf * 1.2) * amp;
    const cx = pad.cx + ps + (sway || 0);
    const cy = pad.cy;
    const rx = pad.rx, ry = pad.ry;
    ellipse(cx + 1, cy + 2, rx, ry, FOLIAGE[0]);
    ellipse(cx, cy, rx, ry, FOLIAGE[2]);
    ellipse(cx - 1, cy - 1, Math.max(1, rx - 1), Math.max(1, ry - 1), FOLIAGE[3]);
    ellipse(cx - 2, cy - 2, Math.max(1, rx - 3), Math.max(1, ry - 2), FOLIAGE[4]);
    for (let i = 0; i < 8; i++) {
      const r = rand();
      if (r < 0.5) {
        const dx = Math.round((rand() - 0.5) * rx * 1.6);
        const dy = Math.round((rand() - 0.5) * ry * 1.6);
        if ((dx * dx) / (rx * rx) + (dy * dy) / (ry * ry) <= 1.0) {
          const shade = r < 0.25 ? FOLIAGE[4] : (r < 0.5 ? FOLIAGE[1] : FOLIAGE[0]);
          px(cx + dx, cy + dy, shade);
        }
      }
    }
  }
}

function drawFoliage(t, trunk) {
  const amp = reduced ? 0 : 1;
  const sway = trunk.sway;
  const phase = t * 0.6;
  const pads = [
    { cx: trunk.trunkTop.x, cy: trunk.trunkTop.y - 6, rx: 13, ry: 8, sf: 1.3 },
    { cx: trunk.b1.x + 3, cy: trunk.b1.y - 3, rx: 11, ry: 7, sf: 0.7 },
    { cx: trunk.b2.x - 3, cy: trunk.b2.y - 3, rx: 11, ry: 7, sf: 0.8 },
    { cx: trunk.b3.x, cy: trunk.b3.y - 3, rx: 10, ry: 6, sf: 1.1 },
    { cx: 78 + Math.round(sway * 1.1), cy: H - 48, rx: 12, ry: 7, sf: 0.9 },
    { cx: 60, cy: H - 38, rx: 14, ry: 9, sf: 0.6 },
    { cx: 94, cy: H - 34, rx: 13, ry: 8, sf: 0.7 },
  ];
  for (const pad of pads) {
    const ps = Math.round(Math.sin(phase + pad.cx * 0.3) * pad.sf * 1.2) * amp;
    const cx = pad.cx + ps + (sway || 0);
    const cy = pad.cy;
    const rx = pad.rx, ry = pad.ry;

    ellipse(cx + 1, cy + 2, rx, ry, FOLIAGE[0]);
    ellipse(cx, cy, rx, ry, FOLIAGE[2]);
    ellipse(cx - 1, cy - 1, Math.max(1, rx - 1), Math.max(1, ry - 1), FOLIAGE[3]);
    ellipse(cx - 2, cy - 2, Math.max(1, rx - 3), Math.max(1, ry - 2), FOLIAGE[4]);

    for (let i = 0; i < 10; i++) {
      const r = rand();
      if (r < 0.5) {
        const dx = Math.round((rand() - 0.5) * rx * 1.6);
        const dy = Math.round((rand() - 0.5) * ry * 1.6);
        if ((dx * dx) / (rx * rx) + (dy * dy) / (ry * ry) <= 1.0) {
          const shade = r < 0.25 ? FOLIAGE[4] : (r < 0.5 ? FOLIAGE[1] : FOLIAGE[0]);
          px(cx + dx, cy + dy, shade);
        }
      }
    }
  }
}

const particles = [];
function initParticles() {
  for (let i = 0; i < 30; i++) {
    particles.push({
      type: 'leaf',
      x: Math.random() * W,
      y: Math.random() * H,
      vx: 0.15 + Math.random() * 0.25,
      vy: (Math.random() - 0.3) * 0.08,
      shade: Math.floor(Math.random() * 3),
      size: Math.random() < 0.5 ? 1 : 2,
      life: 100 + Math.random() * 200,
    });
  }
  for (let i = 0; i < 15; i++) {
    particles.push({
      type: 'wind',
      x: Math.random() * W,
      y: 15 + Math.random() * 90,
      vx: 0.4 + Math.random() * 0.6,
      vy: (Math.random() - 0.5) * 0.08,
      len: 4 + Math.floor(Math.random() * 8),
      alpha: 0.08 + Math.random() * 0.12,
    });
  }
}
initParticles();

function updateParticles(dt) {
  for (const p of particles) {
    if (p.type === 'leaf') {
      p.x += p.vx * dt * 60;
      p.y += p.vy * dt * 60;
      p.life -= dt * 60;
      if (p.x > W + 5) {
        p.x = -5;
        p.y = Math.random() * H;
        p.life = 100 + Math.random() * 200;
        p.shade = Math.floor(Math.random() * 3);
        p.size = Math.random() < 0.5 ? 1 : 2;
      }
      if (p.y < -5) p.y = H + 5;
      if (p.y > H + 5) p.y = -5;
      if (p.life <= 0) {
        p.x = -5;
        p.y = Math.random() * H;
        p.life = 100 + Math.random() * 200;
        p.shade = Math.floor(Math.random() * 3);
        p.size = Math.random() < 0.5 ? 1 : 2;
      }
    } else {
      p.x += p.vx * dt * 60;
      p.y += p.vy * dt * 60;
      if (p.x > W + 10) {
        p.x = -Math.random() * 20;
        p.y = 15 + Math.random() * 90;
      }
      if (p.y < -5) p.y = H + 5;
      if (p.y > H + 5) p.y = -5;
    }
  }
}

function drawParticles() {
  for (const p of particles) {
    if (p.type === 'leaf') {
      const c = LEAF_COLORS[p.shade];
      if (p.size === 1) {
        px(p.x, p.y, c);
      } else {
        px(p.x, p.y, c);
        px(p.x + 1, p.y, c);
        px(p.x, p.y + 1, c);
        const hc = LEAF_COLORS[Math.min(LEAF_COLORS.length - 1, p.shade + 1)];
        px(p.x + 1, p.y + 1, hc);
      }
    } else {
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = '#ffffff';
      const y = Math.round(p.y);
      for (let i = 0; i < p.len; i++) {
        ctx.fillRect(Math.round(p.x) + i, y, 1, 1);
      }
      ctx.globalAlpha = 1;
    }
  }
}

let lastTime = 0;
function frame(ts) {
  const dt = lastTime ? Math.min((ts - lastTime) / 1000, 0.05) : 0.016;
  lastTime = ts;
  const t = ts / 1000;
  ctx.clearRect(0, 0, W, H);
  drawSky();
  drawGround();
  drawPot();
  const trunk = drawTrunk(t);
  drawFoliage(t, trunk);
  updateParticles(dt);
  drawParticles();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
