<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Bonsai</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #a0c0e8 0%, #8ab0d8 100%);
            font-family: sans-serif;
        }

        .scene {
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }

        .canvas-container {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        canvas {
            display: block;
            width: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .controls {
            text-align: center;
            margin-top: 16px;
            color: #4a5a6a;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="canvas-container">
            <canvas id="bonsaiCanvas" width="400" height="600"></canvas>
        </div>
        <div class="controls">Wind Bonsai — Pixel Art</div>
    </div>

    <script>
        const canvas = document.getElementById('bonsaiCanvas');
        const ctx = canvas.getContext('2d');

        const WIND_DIRECTIONS = { left: -1, right: 1 };
        const DIRECTIONS = Object.values(WIND_DIRECTIONS);
        const wind = { x: 0, y: 0, target: { x: -0.3, y: 0.1 }, strength: 0 };

        const colors = {
            barkDark: '#5d4037',
            barkMid: '#795548',
            barkLight: '#a1887f',
            soilDark: '#3e2723',
            soilMid: '#5d4037',
            soilLight: '#8d6e63',
            foliageDark: '#2e7d32',
            foliageMid: '#4caf50',
            foliageLight: '#81c784',
            foliageHighlight: '#c8e6c9'
        };

        const windLeaves = [];
        const WIND_STREAKS = [];

        class WindLeaf {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speed = Math.random() * 2 + 1;
                this.direction = Math.random() > 0.5 ? 1 : -1;
                this.opacity = Math.random() * 0.5 + 0.2;
                this.angle = Math.random() * Math.PI * 2;
                this.oscillation = Math.random() * 0.05;
            }

            update() {
                this.x += this.speed * wind.direction * this.direction + this.oscillation;
                this.y -= this.speed * 0.3;
                this.angle += 0.2;

                if (this.x > canvas.width + 10 || this.x < -10 || this.y < -10) {
                    this.reset();
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(-this.size, -this.size, this.size * 2, this.size * 2);
                ctx.restore();
            }
        }

        class WindStreak {
            constructor() {
                this.reset();
            }

            reset() {
                this.y = Math.random() * canvas.height;
                this.width = Math.random() * 15 + 5;
                this.length = Math.random() * 40 + 20;
                this.speed = Math.random() * 1 + 0.5;
                this.direction = Math.random() > 0.5 ? 1 : -1;
                this.x = this.direction === 1 ? -this.length : canvas.width + this.length;
                this.opacity = Math.random() * 0.15 + 0.05;
            }

            update() {
                this.x += this.speed * this.direction;

                if (this.direction === 1 && this.x > canvas.width + this.length) {
                    this.reset();
                } else if (this.direction === -1 && this.x < -this.length) {
                    this.reset();
                }
            }

            draw(ctx) {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.fillRect(this.x, this.y, this.length, this.width);
            }
        }

        function initWind() {
            for (let i = 0; i < 15; i++) {
                windLeaves.push(new WindLeaf());
            }

            for (let i = 0; i < 8; i++) {
                WIND_STREAKS.push(new WindStreak());
            }
        }

        function drawPixelRect(ctx, x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
        }

        function drawPixelCircle(ctx, cx, cy, r, color) {
            ctx.fillStyle = color;
            for (let y = -r; y <= r; y++) {
                for (let x = -r; x <= r; x++) {
                    if (x * x + y * y <= r * r) {
                        ctx.fillRect(cx + x, cy + y, 1, 1);
                    }
                }
            }
        }

        function drawFoliagePad(ctx, x, y, radius, colorBase, colorShadow, colorHighlight) {
            const r = Math.round(radius);

            for (let dy = -r; dy <= r; dy++) {
                for (let dx = -r; dx <= r; dx++) {
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist <= r) {
                        const edge = dist > r * 0.7;
                        const highlight = dx > 0 && dy < 0 && dist < r * 0.6;

                        if (highlight) {
                            drawPixelRect(ctx, x + dx, y + dy, 1, 1, colorHighlight);
                        } else if (edge) {
                            drawPixelRect(ctx, x + dx, y + dy, 1, 1, colorShadow);
                        } else {
                            drawPixelRect(ctx, x + dx, y + dy, 1, 1, colorBase);
                        }
                    }
                }
            }
        }

        function drawPot(ctx) {
            const centerX = canvas.width / 2;
            const bottomY = canvas.height - 20;

            drawPixelRect(ctx, centerX - 60, bottomY, 120, 8, colors.soilDark);
            drawPixelRect(ctx, centerX - 58, bottomY + 8, 116, 12, colors.soilMid);
            drawPixelRect(ctx, centerX - 56, bottomY + 20, 112, 6, colors.soilLight);
            drawPixelRect(ctx, centerX - 60, bottomY + 26, 120, 6, colors.soilDark);
            drawPixelRect(ctx, centerX - 62, bottomY + 32, 124, 4, colors.soilDark);
        }

        function drawTrunk(ctx, swayOffset) {
            const centerX = canvas.width / 2;
            const bottomY = canvas.height - 30;
            let x = centerX;
            let y = bottomY;
            let width = 16;

            const segments = 25;
            const segmentHeight = 10;
            const curveAmount = 40 + swayOffset;

            ctx.fillStyle = colors.barkMid;
            const points = [];

            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const progress = t;
                
                const curveX = Math.sin(t * Math.PI * 0.5) * curveAmount;
                const curveY = t * (250 - segmentHeight);

                const currentX = centerX + curveX;
                const currentY = bottomY - curveY;

                points.push({ x: currentX, y: currentY, width: width });

                if (i > 0) {
                    const prev = points[points.length - 2];
                    const dx = currentX - prev.x;
                    const dy = currentY - prev.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const steps = Math.ceil(dist);

                    for (let s = 0; s < steps; s++) {
                        const t2 = s / steps;
                        const px = prev.x + dx * t2;
                        const py = prev.y + dy * t2;
                        const pixelWidth = Math.round(width * (0.4 + 0.6 * (1 - progress)));

                        if (Math.random() > 0.3) {
                            drawPixelRect(ctx, px, py, pixelWidth, pixelWidth, colors.barkDark);
                        } else {
                            drawPixelRect(ctx, px, py, pixelWidth, pixelWidth, colors.barkMid);
                        }
                    }
                }

                width = 16 * (0.3 + 0.7 * (1 - t));
            }

            return points;
        }

        function drawBranch(ctx, startX, startY, length, angle, sway, depth) {
            const points = [];
            let x = startX;
            let y = startY;
            const branchWidth = Math.max(2, 4 - depth);

            const numSegments = Math.ceil(length / 8);
            
            for (let i = 0; i <= numSegments; i++) {
                const t = i / numSegments;
                const currentLength = t * length;
                const currentAngle = angle + sway * t;
                
                const dx = Math.cos(currentAngle) * currentLength;
                const dy = Math.sin(currentAngle) * currentLength;
                
                const px = x + dx;
                const py = y + dy;
                
                points.push({ x: px, y: py });

                if (i > 0) {
                    const prev = points[i - 1];
                    const segmentX = prev.x;
                    const segmentY = prev.y;
                    const segDX = px - prev.x;
                    const segDY = py - prev.y;
                    const segDist = Math.sqrt(segDX * segDX + segDY * segDY);
                    const segSteps = Math.ceil(segDist);

                    for (let s = 0; s < segSteps; s++) {
                        const t2 = s / segSteps;
                        const sx = segmentX + segDX * t2;
                        const sy = segmentY + segDY * t2;

                        if (Math.random() > 0.2) {
                            drawPixelRect(ctx, sx, sy, branchWidth, branchWidth, colors.barkMid);
                        } else {
                            drawPixelRect(ctx, sx, sy, branchWidth, branchWidth, colors.barkDark);
                        }
                    }
                }
            }

            return points[points.length - 1];
        }

        function drawBranches(ctx, trunkPoints, swayOffset) {
            const branchConfig = [
                { offset: 0.25, length: 70, angle: -Math.PI / 3, sway: 0.1 },
                { offset: 0.45, length: 60, angle: -Math.PI / 4, sway: -0.15 },
                { offset: 0.65, length: 50, angle: -Math.PI / 2.5, sway: 0.08 },
                { offset: 0.85, length: 45, angle: -Math.PI / 3.5, sway: -0.12 }
            ];

            branchConfig.forEach(config => {
                const idx = Math.floor(config.offset * trunkPoints.length);
                if (idx < trunkPoints.length) {
                    const start = trunkPoints[idx];
                    const end = drawBranch(ctx, start.x, start.y, config.length, config.angle, config.sway * swayOffset, 0);

                    if (end) {
                        drawBranch(ctx, end.x, end.y, config.length * 0.6, config.angle + Math.PI / 6, config.sway * swayOffset * 0.5, 1);
                    }
                }
            });
        }

        function drawTree(ctx, swayOffset) {
            const trunkPoints = drawTrunk(ctx, swayOffset);
            drawBranches(ctx, trunkPoints, swayOffset);

            const foliagePositions = [
                { x: 140, y: 180, r: 35 },
                { x: 260, y: 160, r: 32 },
                { x: 200, y: 130, r: 28 },
                { x: 280, y: 220, r: 25 },
                { x: 120, y: 220, r: 28 }
            ];

            foliagePositions.forEach(pos => {
                drawFoliagePad(
                    ctx, 
                    pos.x, 
                    pos.y + swayOffset * 10, 
                    pos.r, 
                    colors.foliageMid, 
                    colors.foliageDark, 
                    colors.foliageHighlight
                );
            });

            const additionalPads = [
                { x: 170, y: 260, r: 22 },
                { x: 230, y: 250, r: 20 }
            ];

            additionalPads.forEach(pos => {
                drawFoliagePad(
                    ctx, 
                    pos.x, 
                    pos.y + swayOffset * 8, 
                    pos.r, 
                    colors.foliageMid, 
                    colors.foliageDark, 
                    colors.foliageHighlight
                );
            });
        }

        function drawScene(swayOffset) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawPot(ctx);
            drawTree(ctx, swayOffset);

            windLeaves.forEach(leaf => leaf.update());
            windLeaves.forEach(leaf => leaf.draw(ctx));

            WIND_STREAKS.forEach(streak => streak.update());
            WIND_STREAKS.forEach(streak => streak.draw(ctx));
        }

        let swayPhase = 0;
        let frameCount = 0;

        function animate() {
            swayPhase += 0.02;
            const swayOffset = Math.sin(swayPhase) * 5;

            drawScene(swayOffset);

            frameCount++;
            requestAnimationFrame(animate);
        }

        initWind();
        animate();

        window.addEventListener('resize', () => {
            const container = canvas.parentElement;
            canvas.width = 400;
            canvas.height = 600;
        });
    </script>
</body>
</html>
