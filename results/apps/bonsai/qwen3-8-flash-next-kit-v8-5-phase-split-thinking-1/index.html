<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bonsai · floating wind</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1e2350; }
  canvas { display: block; }
  .cap {
    position: fixed; left: 0; right: 0; bottom: max(10px, env(safe-area-inset-bottom));
    text-align: center; pointer-events: none;
    font: 500 11px/1.5 system-ui, -apple-system, sans-serif;
    letter-spacing: 0.35em; text-transform: uppercase;
    color: rgba(255, 232, 210, 0.72); text-shadow: 0 1px 0 rgba(20, 16, 40, 0.7);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap">Bonsai — floating wind</div>
<script src="pixel-kit.js"></script>
<script>
"use strict";
const R = PK.ramps;
const leafRamp  = ["#16281f", "#28512f", "#3f7a3a", "#699b46", "#a6c95f"];
const soil      = "#33220f", soilLit = "#4a3118";
const terrace   = "#2a2133", terraceHi = "#574063", terraceEdge = "#3a2b44";
const terraceSeam = "#191324", terraceSpeck = "#3a2c46", terraceDeep = "#211a2c";

const wind   = PK.drift({ n: 36, seed: 3,  area: [0, 0, 200, 200], vx: [30, 52],  vy: [-2, 2], len: [5, 9] });
const clouds = PK.drift({ n: 7,  seed: 8,  area: [0, 0, 200, 200], vx: [2.5, 4.5], vy: [0, 0], len: [8, 16] });
const leaves = PK.drift({ n: 22, seed: 21, area: [0, 0, 200, 200], vx: [10, 26],  vy: [-5, 5], len: [1, 1] });

let bg = null, L = null;

function q(a, c, b, t) {
  const u = 1 - t;
  return { x: u * u * a.x + 2 * u * t * c.x + t * t * b.x,
           y: u * u * a.y + 2 * u * t * c.y + t * t * b.y };
}

function layout(v) {
  const W = v.W, H = v.H;
  const U = Math.min(H, W * 1.15);
  const groundY = Math.round(H * 0.78);
  const cx = Math.round(W / 2);
  const slabH = 3, legH = Math.max(5, Math.round(U * 0.045));
  const slabY = groundY - legH;
  const potW = Math.max(22, Math.round(U * 0.32));
  const potH = Math.max(9, Math.round(U * 0.10));
  const potY = slabY - potH;
  const standW = potW + Math.max(4, Math.round(U * 0.05));
  const baseX = cx + Math.round(potW * 0.07), baseY = potY - 1;
  const hT = Math.max(16, Math.round(U * 0.30));
  const w0 = Math.max(4, Math.round(U * 0.06));
  const knee   = { x: cx + Math.round(U * 0.10), y: baseY - Math.round(hT * 0.42) };
  const c1     = { x: baseX + Math.round(U * 0.13), y: baseY - Math.round(hT * 0.12) };
  const c2     = { x: cx + Math.round(U * 0.12), y: baseY - Math.round(hT * 0.72) };
  const apex   = { x: cx - Math.round(U * 0.03), y: baseY - hT };
  const branches = [
    { f: 0.44, side: -1, len: Math.round(U * 0.17), dy: -Math.round(U * 0.02),
      w: Math.max(2, Math.round(w0 * 0.42)), rx: Math.round(U * 0.16), seed: 31, ph: 0.3 },
    { f: 0.62, side:  1, len: Math.round(U * 0.14), dy: -Math.round(U * 0.01),
      w: Math.max(2, Math.round(w0 * 0.36)), rx: Math.round(U * 0.12), seed: 32, ph: 2.1 },
    { f: 0.76, side: -1, len: Math.round(U * 0.09), dy: -Math.round(U * 0.015),
      w: Math.max(2, Math.round(w0 * 0.30)), rx: Math.round(U * 0.09), seed: 33, ph: 4.0 },
  ];
  const trunkAt = (f) => f < 0.45 ? q({ x: baseX, y: baseY }, c1, knee, f / 0.45)
                                  : q(knee, c2, apex, (f - 0.45) / 0.55);
  const rnd = PK.rng(19);
  const seams = [];
  for (let x = Math.round(W * 0.06); x < W; x += Math.round(U * 0.24))
    seams.push(x + Math.round(rnd() * 4 - 2));
  const tufts = [
    { x: cx - Math.round(standW / 2) - Math.round(U * 0.12), seed: 2 },
    { x: cx + Math.round(standW / 2) + Math.round(U * 0.05), seed: 5 },
    { x: cx + Math.round(standW / 2) + Math.round(U * 0.24), seed: 9 },
  ];
  return {
    W, H, U, groundY, cx, slabH, legH, slabY, potW, potH, potY, standW,
    baseX, baseY, hT, w0, knee, c1, c2, apex, branches, trunkAt, seams, tufts,
    sunX: Math.round(W * 0.24), sunY: Math.round(H * 0.19), sunR: Math.max(4, Math.round(U * 0.05)),
    h1x: Math.round(W * 0.18), h1rx: Math.round(W * 0.34), h1r: Math.max(4, Math.round(U * 0.09)),
    h2x: Math.round(W * 0.85), h2rx: Math.round(W * 0.30), h2r: Math.max(5, Math.round(U * 0.13)),
    rockL: cx - Math.round(standW / 2) - Math.round(U * 0.13),
    rockR: cx + Math.round(standW / 2) + Math.round(U * 0.16),
  };
}

function drawPot(l) {
  const g = R.glaze;
  for (let y = l.potY; y < l.potY + l.potH; y++) {
    const t = (y - l.potY) / (l.potH - 1);
    let hw = Math.round(l.potW / 2 - t * l.potW * 0.15);
    if (y < l.potY + 2) hw = Math.round(l.potW / 2);
    const x0 = l.cx - hw, x1 = l.cx + hw;
    for (let x = x0; x <= x1; x++) {
      const rel = (x - x0) / Math.max(1, x1 - x0);
      let c;
      if (y < l.potY + 1)       c = rel < 0.8 ? g[3] : g[1];
      else if (y < l.potY + 2)  c = rel < 0.12 ? "#9cc0e8" : rel < 0.55 ? g[3] : rel < 0.85 ? g[2] : g[0];
      else if (y >= l.potY + l.potH - 2) c = rel < 0.5 ? g[1] : g[0];
      else c = rel < 0.25 ? g[3] : rel < 0.7 ? g[2] : rel < 0.86 ? g[1] : g[0];
      PK.px(x, y, c);
    }
  }
  const by = l.potY + Math.round(l.potH * 0.58);
  const bt = (by - l.potY) / (l.potH - 1);
  const bhw = Math.round(l.potW / 2 - bt * l.potW * 0.15);
  for (let x = l.cx - bhw; x <= l.cx + bhw; x++) {
    const rel = (x - (l.cx - bhw)) / Math.max(1, bhw * 2);
    if (rel < 0.1 || rel > 0.92) continue;
    PK.px(x, by, rel < 0.26 ? g[3] : rel > 0.8 ? g[0] : g[1]);
  }
  const spk = PK.rng(71);
  for (let i = 0; i < 3; i++)
    PK.px(l.cx - Math.round(l.potW * 0.42) + Math.round(spk() * l.potW * 0.2),
          l.potY + 1 + Math.round(spk() * l.potH * 0.25), "#9cc0e8");
  const sw = l.potW - 6;
  PK.rect(l.cx - (sw >> 1), l.potY - 2, sw, 2, soil);
  PK.rect(l.cx - (sw >> 1), l.potY - 2, Math.round(sw * 0.5), 1, soilLit);
  const rnd = PK.rng(77);
  for (let i = 0; i < sw; i++)
    if (rnd() < 0.2) PK.px(l.cx - (sw >> 1) + i, l.potY - 2 + (rnd() < 0.5 ? 0 : 1), rnd() < 0.5 ? soilLit : "#241708");
}

function drawStand(l) {
  PK.rect(l.cx - Math.round(l.standW / 2), l.slabY, l.standW, l.slabH, "#4a2c1f");
  PK.rect(l.cx - Math.round(l.standW / 2), l.slabY, l.standW, 1, "#9a6646");
  PK.rect(l.cx - Math.round(l.standW / 2), l.slabY + l.slabH - 1, l.standW, 1, "#241009");
  PK.rect(l.cx - Math.round(l.standW / 2) + 3, l.slabY + l.slabH, l.standW - 6, 2, "#33200f");
  const lx1 = l.cx - Math.round(l.standW / 2) + 2;
  const lx2 = l.cx + Math.round(l.standW / 2) - 5;
  for (const lx of [lx1, lx2]) {
    const h = l.groundY + 1 - l.slabY - l.slabH;
    PK.rect(lx, l.slabY + l.slabH, 3, h, "#3f2418");
    PK.rect(lx, l.slabY + l.slabH, 1, h, "#6e4430");
    PK.rect(lx + 2, l.slabY + l.slabH, 1, h, "#241009");
    PK.rect(lx, l.groundY + 1, 3, 1, "#241009");
  }
}

function drawTrunk(l) {
  for (const dir of [-1, 1])
    PK.limb(l.baseX, l.baseY - 1, l.baseX + dir * Math.round(l.U * 0.035), l.baseY,
            l.baseX + dir * Math.round(l.U * 0.055), l.baseY + 2,
            Math.max(2, Math.round(l.w0 * 0.5)), 2, R.bark, 9 + dir);
  PK.limb(l.baseX, l.baseY, l.c1.x, l.c1.y, l.knee.x, l.knee.y,
          l.w0, Math.max(3, Math.round(l.w0 * 0.72)), R.bark, 7);
  PK.limb(l.knee.x, l.knee.y, l.c2.x, l.c2.y, l.apex.x, l.apex.y,
          Math.max(2, Math.round(l.w0 * 0.72)), Math.max(2, Math.round(l.w0 * 0.32)), R.bark, 8);
  const rnd = PK.rng(55);
  for (let s = 0.06; s < 0.97; s += 0.05) {
    if (rnd() < 0.3) continue;
    const p = l.trunkAt(s);
    const off = Math.round((rnd() * 2 - 1) * Math.max(1, (l.w0 / 2) * (1 - s * 0.6)));
    PK.px(p.x + off, p.y, rnd() < 0.65 ? R.bark[0] : R.bark[4]);
    if (rnd() < 0.3) PK.px(p.x + off, p.y + 1, R.bark[0]);
  }
  for (const s of [0.28, 0.62]) {
    const p = l.trunkAt(s);
    PK.px(p.x - 1, p.y, R.bark[0]); PK.px(p.x + 1, p.y, R.bark[0]);
    PK.px(p.x, p.y - 1, R.bark[0]); PK.px(p.x, p.y + 1, R.bark[0]);
    PK.px(p.x, p.y, R.bark[2]);
  }
}

function drawStatic(l, v) {
  PK.gradient(0, 0, v.W, l.groundY + 1, PK.skies.dusk);
  PK.glow(l.sunX, l.sunY, Math.round(l.sunR * 3.2), "#f2a33a", 0.5, 5);
  PK.disc(l.sunX, l.sunY, l.sunR + 1, "#c4612a");
  PK.disc(l.sunX, l.sunY, l.sunR, "#f2a33a");
  PK.disc(l.sunX - 1, l.sunY - 1, Math.max(1, l.sunR - 2), "#ffd56a");

  PK.ellipse(l.h1x, l.groundY + l.h1r, l.h1rx, l.h1r, "#7c4f68");
  const hs = PK.rng(12);
  for (let i = 0; i < 26; i++)
    PK.px(l.h1x - Math.round(hs() * l.h1rx) + Math.round(hs() * 4), l.groundY - Math.round(hs() * l.h1r * 0.7), "#8a5a74");
  PK.ellipse(l.h2x, l.groundY + l.h2r, l.h2rx, l.h2r, "#69405f");

  PK.rect(0, l.groundY, v.W, v.H - l.groundY, terrace);
  PK.rect(0, l.groundY, v.W, 1, terraceHi);
  PK.rect(0, l.groundY + 1, v.W, 1, terraceEdge);
  for (const x of l.seams) PK.line(x, l.groundY + 3, x + 2, v.H - 1, terraceSeam);
  const hy = l.groundY + Math.max(2, Math.round((v.H - l.groundY) * 0.55));
  for (let x = 0; x < v.W; x += 3) PK.px(x, hy, terraceSeam);
  const sp = PK.rng(9);
  const area = v.W * (v.H - l.groundY);
  for (let i = 0; i < Math.round(area * 0.05); i++) {
    const x = Math.floor(sp() * v.W), y = l.groundY + 3 + Math.floor(sp() * Math.max(1, v.H - l.groundY - 4));
    PK.px(x, y, (y - l.groundY) / Math.max(1, v.H - l.groundY) > sp() ? terraceSpeck : terraceDeep);
  }
  const fl = PK.rng(31);
  for (let i = 0; i < 6; i++) {
    const x = Math.floor(fl() * (v.W - 8)) + 4;
    const y = l.groundY + 3 + Math.floor(fl() * Math.max(1, v.H - l.groundY - 5));
    if (Math.abs(x - l.cx) < Math.round(l.standW * 0.6)) continue;
    PK.rect(x, y, 2, 1, leafRamp[2 + Math.floor(fl() * 3)]);
  }

  PK.ellipse(l.cx + 3, l.groundY + 2, Math.round(l.standW * 0.72), 2, "#140e1e");
  for (let x = l.cx - Math.round(l.standW * 0.72); x < l.cx + Math.round(l.standW * 0.72); x++) {
    if (PK.bayer(x, l.groundY + 4) < 0.6) PK.px(x, l.groundY + 4, "#140e1e");
    if (PK.bayer(x + 1, l.groundY + 5) < 0.3) PK.px(x, l.groundY + 5, "#140e1e");
  }

  PK.rock(l.rockL, l.groundY + 1, Math.max(5, Math.round(l.U * 0.09)), Math.max(3, Math.round(l.U * 0.035)), R.stone, { seed: 44, rough: 2 });
  PK.rock(l.rockR, l.groundY + 1, Math.max(4, Math.round(l.U * 0.07)), Math.max(3, Math.round(l.U * 0.028)), R.stone, { seed: 47, rough: 2 });

  drawStand(l);
  drawPot(l);
  drawTrunk(l);
}

const shadeRamp = [leafRamp[0], leafRamp[0], leafRamp[1], leafRamp[1], leafRamp[2]];

function padPair(cx, cy, rx, ry, seed) {
  const rnd = PK.rng(seed + 7);
  PK.ellipse(cx + 1, cy + Math.max(2, Math.round(ry * 0.55)), Math.round(rx * 0.9),
             Math.max(2, Math.round(ry * 0.6)), leafRamp[0]);
  PK.pad(cx + 1, cy + Math.max(2, Math.round(ry * 0.5)), Math.max(3, Math.round(rx * 0.8)),
         Math.max(2, Math.round(ry * 0.5)), shadeRamp, { seed: seed + 50 });
  PK.pad(cx, cy, rx, ry, leafRamp, { seed });
  for (let i = 0; i < 4; i++)
    PK.px(cx - Math.round(rx * (0.15 + rnd() * 0.4)), cy - Math.round(ry * (0.25 + rnd() * 0.45)),
          rnd() < 0.5 ? leafRamp[4] : leafRamp[3]);
}

function drawTree(l, t) {
  const gust = 0.75 + 0.25 * Math.sin(t * 0.23);
  for (const b of l.branches) {
    const P = l.trunkAt(b.f);
    const amp = (0.8 + b.f * 2.2) * gust;
    const sw = Math.round(Math.sin(t * 1.25 + b.ph) * amp);
    const tipX = Math.round(P.x) + b.side * b.len + sw;
    const tipY = Math.round(P.y) + b.dy;
    PK.limb(P.x, P.y, P.x + b.side * b.len * 0.5, P.y + Math.round(l.U * 0.015),
            tipX, tipY, b.w, 1, R.bark, b.seed);
    const rx = b.rx, ry = Math.max(3, Math.round(rx * 0.45));
    padPair(tipX + Math.round(b.side * rx * 0.15), tipY - Math.round(ry * 0.45), rx, ry, b.seed + 90);
  }
  const csw = Math.round(Math.sin(t * 1.15 + 1.3) * 2 * gust);
  PK.limb(l.apex.x, l.apex.y, l.apex.x + csw * 0.5, l.apex.y - 1,
          l.apex.x + csw, l.apex.y - Math.round(l.U * 0.02),
          Math.max(2, Math.round(l.w0 * 0.3)), 1, R.bark, 40);
  const crx = Math.max(5, Math.round(l.U * 0.12)), cry = Math.max(3, Math.round(crx * 0.5));
  padPair(l.apex.x + csw, l.apex.y - Math.round(l.U * 0.02) - Math.round(cry * 0.5), crx, cry, 129);
}

function drawLeaves(dp, t) {
  for (const p of dp.particles) {
    const y = p.y + Math.round(Math.sin(t * 1.6 + p.k * 6.28) * 1.5);
    const c = p.k > 0.75 ? leafRamp[4] : p.k > 0.45 ? leafRamp[3] : leafRamp[2];
    if (p.k > 0.6) PK.rect(p.x, y, 2, 1, c);
    else PK.px(p.x, y, c);
  }
}

function drawWind(dp) {
  for (const p of dp.particles) {
    const sp = Math.hypot(p.vx, p.vy) || 1;
    PK.rect(p.x - 1, p.y, 2, 1, "rgba(255,247,235,0.65)");
    for (let s = 2; s < p.len; s += 2) {
      const tx = Math.round(p.x - (p.vx / sp) * s), ty = Math.round(p.y - (p.vy / sp) * s);
      if (PK.bayer(tx, ty) < 0.7) PK.rect(tx, ty, 2, 1, "rgba(255,240,222,0.34)");
      if (PK.bayer(tx + 1, ty) < 0.4) PK.px(tx, ty + 1, "rgba(255,240,222,0.2)");
    }
  }
}

function drawGrass(l, t) {
  for (const g of l.tufts) {
    const n = 3 + (g.seed % 2);
    for (let i = 0; i < n; i++) {
      const x = g.x + i;
      const h = 3 + ((i * 5 + g.seed) % 4);
      const bend = Math.round(Math.sin(t * 2.3 + i * 1.9 + g.seed) * 1.2) + (i - 1);
      PK.line(x, l.groundY, x + bend, l.groundY - h, i % 2 ? leafRamp[2] : leafRamp[1]);
    }
  }
}

const view = PK.fit(document.getElementById("c"), 140, (v) => {
  L = layout(v);
  bg = PK.layer(v.W, v.H, () => drawStatic(L, v));
  wind.setArea([-10, 0, v.W + 10, v.H]);
  clouds.setArea([-20, Math.round(v.H * 0.06), v.W + 20, Math.round(v.H * 0.42)]);
  leaves.setArea([-4, Math.round(v.H * 0.08), v.W + 4, Math.round(v.H * 0.94)]);
});

PK.loop((t, dt) => {
  PK.blit(bg);
  clouds.step(dt);
  clouds.streaks(["rgba(228,140,110,0.35)", "rgba(246,176,130,0.7)"]);
  drawGrass(L, t);
  drawTree(L, t);
  leaves.step(dt);
  drawLeaves(leaves, t);
  wind.step(dt);
  drawWind(wind);
});
</script>
</body>
</html>
