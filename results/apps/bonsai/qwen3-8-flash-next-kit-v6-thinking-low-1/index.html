<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Bonsai in the Wind</title>
<style>
  html, body { margin: 0; height: 100%; background: #4f8fd0; overflow: hidden; }
  canvas { display: block; }
  #cap {
    position: fixed; top: max(14px, 4vh); left: 0; right: 0;
    text-align: center; font: 11px/1 ui-monospace, "Courier New", monospace;
    letter-spacing: .38em; text-transform: uppercase; color: #26425e;
    opacity: .55; pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cap">Bonsai in the Wind</div>
<script src="pixel-kit.js"></script>
<script>
(() => {
"use strict";
const R = PK.ramps;
const canvas = document.getElementById("c");
let geo = null, bg = null;

const windFar  = PK.drift({ n: 15, seed: 21, area: [0, 0, 1, 1], vx: [-36, -22], vy: [-0.3, 0.3], len: [5, 9] });
const windNear = PK.drift({ n: 8,  seed: 37, area: [0, 0, 1, 1], vx: [-52, -34], vy: [-0.3, 0.3], len: [6, 10] });
const leaves   = PK.drift({ n: 26, seed: 7,  area: [0, 0, 1, 1], vx: [-17, -8],  vy: [-2.5, 3],    len: [1, 1] });

PK.fit(canvas, 150, (v) => {
  geo = layout(v);
  windFar.setArea([0, Math.max(0, geo.groundY - Math.round(62 * geo.u)), v.W, geo.groundY - 2]);
  windNear.setArea([0, 0, v.W, geo.groundY]);
  leaves.setArea([0, 0, v.W, v.H]);
  bg = buildStatic(v, geo);
});

function layout(v) {
  const r = Math.round;
  const u = Math.max(1, Math.min(v.H / 145, v.W / 120));
  const cx = r(v.W / 2);
  const groundY = r(v.H * (v.portrait ? 0.8 : 0.84));
  const rimTop = groundY - r(15 * u);
  const soilY = rimTop + 1;
  const topRef = soilY - r(52 * u);
  const g = { u, cx, groundY, rimTop, soilY, pw: r(16 * u) };

  const B = (o) => Object.assign({ hn: (soilY - o.ty) / (soilY - topRef) }, o);
  g.branches = [
    B({ ax: cx + r(4 * u),  ay: soilY - r(10 * u), ccx: cx + r(13 * u), ccy: soilY - r(7 * u),
        tx: cx + r(20 * u), ty: soilY - r(15 * u), w0: Math.max(2, r(3.2 * u)), w1: Math.max(1, r(0.9 * u)),
        seed: 31, padx: cx + r(22 * u), pady: soilY - r(17 * u), prx: r(11 * u), pry: Math.max(3, r(5 * u)), phase: 0.4 }),
    B({ ax: cx + r(1 * u),  ay: soilY - r(27 * u), ccx: cx - r(8 * u),  ccy: soilY - r(24 * u),
        tx: cx - r(17 * u), ty: soilY - r(31 * u), w0: Math.max(2, r(3 * u)),   w1: Math.max(1, r(0.9 * u)),
        seed: 47, padx: cx - r(19 * u), pady: soilY - r(33 * u), prx: r(11 * u), pry: Math.max(3, r(5 * u)), phase: 2.1 }),
    B({ ax: cx - r(2 * u),  ay: soilY - r(38 * u), ccx: cx + r(7 * u),  ccy: soilY - r(35 * u),
        tx: cx + r(12 * u), ty: soilY - r(40 * u), w0: Math.max(2, r(2.6 * u)), w1: Math.max(1, r(0.8 * u)),
        seed: 53, padx: cx + r(13 * u), pady: soilY - r(42 * u), prx: r(9 * u),  pry: Math.max(3, r(4 * u)), phase: 3.6 }),
    B({ ax: cx - r(2 * u),  ay: soilY - r(43 * u), ccx: cx + r(2 * u),  ccy: soilY - r(44 * u),
        tx: cx + r(u),      ty: soilY - r(46 * u), w0: Math.max(2, r(2 * u)),   w1: 1,
        seed: 67, padx: cx, pady: soilY - r(49 * u), prx: r(10 * u), pry: Math.max(3, r(4.5 * u)), phase: 5.0 }),
  ];
  return g;
}

function sway(t, b) {
  const hn = Math.max(0, Math.min(1, b.hn));
  const s = Math.sin(t * 0.85 + b.phase) * 1.6 + Math.sin(t * 2.2 + b.phase * 1.7) * 0.6 - 0.9;
  return Math.round(s * geo.u * hn);
}

function buildStatic(v, g) {
  const r = Math.round;
  const { u, cx, groundY, rimTop, soilY, pw } = g;
  return PK.layer(v.W, v.H, () => {
    PK.gradient(0, 0, v.W, groundY, PK.skies.day);
    PK.glow(r(v.W * 0.15), r(v.H * 0.16), r(13 * u), "#fff4cc", 0.5);
    hill(cx - r(v.W * 0.3), r(v.W * 0.72), r(16 * u), groundY, "#b7cfe2");
    hill(cx + r(v.W * 0.34), r(v.W * 0.8), r(12 * u), groundY, "#c3d8e8");
    PK.rect(0, groundY, v.W, v.H - groundY, R.sand[1]);
    PK.rect(0, groundY, v.W, 1, R.sand[2]);
    const rnd = PK.rng(5);
    for (let i = 0; i < v.W * (v.H - groundY) * 0.02; i++) {
      const x = r(rnd() * v.W), y = groundY + 1 + r(rnd() * (v.H - groundY - 1));
      PK.px(x, y, rnd() < 0.5 ? R.sand[0] : R.sand[2]);
    }
    stone(r(cx - 30 * u), groundY, 3 * u);
    stone(r(cx + 27 * u), groundY, 4 * u);
    stone(r(cx + 35 * u), groundY, 2.5 * u);
    tuft(cx - r(23 * u), groundY);
    tuft(cx + r(21 * u), groundY);
    tuft(cx - r(34 * u), groundY);
    const deco = PK.rng(77);
    for (let i = 0; i < 9; i++) {
      const x = r(deco() * v.W);
      if (Math.abs(x - cx) < pw + r(4 * u)) continue;
      deco() < 0.5 ? stone(x, groundY, 1.5 + deco() * 3 * u) : tuft(x, groundY);
    }
    PK.rect(cx - pw - 1, groundY, 2 * pw + 2, 2, "#513926");
    pot(g);
    soil(g);
    trunk(g);
  });
}

function hill(x0, w, h, gy, color) {
  const r = Math.round;
  const pts = [[x0, gy + 1]];
  const steps = Math.max(6, r(w / 2));
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    pts.push([x0 + t * w, gy + 1 - h * Math.pow(Math.sin(Math.PI * t), 1.4)]);
  }
  pts.push([x0 + w, gy + 1]);
  PK.poly(pts, color);
}

function stone(x, gy, rad) {
  const r = Math.round;
  rad = Math.max(2, r(rad));
  PK.disc(x, gy - 1, rad, R.stone[1]);
  PK.disc(x - 1, gy - 2, rad - 1, R.stone[2]);
  PK.px(x - 1, gy - rad, R.stone[3]);
  PK.px(x + 1, gy - 1, R.stone[0]);
}

function tuft(x, gy) {
  PK.line(x, gy - 1, x - 1, gy - 3, R.foliage[2]);
  PK.line(x + 1, gy - 1, x + 1, gy - 4, R.foliage[1]);
  PK.line(x + 2, gy - 1, x + 3, gy - 3, R.foliage[3]);
}

function pot(g) {
  const r = Math.round;
  const { u, cx, groundY, rimTop, pw } = g;
  const hRim = Math.max(2, r(3 * u));
  const footH = Math.max(1, r(2 * u));
  const bodyTop = rimTop + hRim + 1;
  const bodyBot = groundY - footH;
  PK.poly([[cx - pw + 1, bodyTop], [cx + pw - 1, bodyTop], [cx + pw - r(4 * u), bodyBot], [cx - pw + r(4 * u), bodyBot]], R.clay[2]);
  PK.poly([[cx - pw + 1, bodyTop], [cx - r(6 * u), bodyTop], [cx - pw + r(9 * u), bodyBot], [cx - pw + r(4 * u), bodyBot]], R.clay[3]);
  PK.poly([[cx + r(6 * u), bodyTop], [cx + pw - 1, bodyTop], [cx + pw - r(4 * u), bodyBot], [cx + r(3 * u), bodyBot]], R.clay[1]);
  PK.rect(cx - pw + r(4 * u), bodyBot - 1, 2 * (pw - r(4 * u)), 1, R.clay[0]);
  PK.rect(cx - pw + r(5 * u), bodyTop + r(4 * u), 2 * pw - r(10 * u), 1, R.clay[0]);
  PK.rect(cx - pw + r(5 * u), bodyTop + r(4 * u) + 1, 2 * pw - r(10 * u), 1, R.clay[3]);
  PK.rect(cx - pw, rimTop, 2 * pw, hRim, R.clay[3]);
  PK.rect(cx - pw, rimTop, r(pw * 1.2), 1, R.clay[4]);
  PK.rect(cx + r(pw * 0.2), rimTop, pw - r(pw * 0.2), 1, R.clay[3]);
  PK.rect(cx - pw, rimTop + hRim, 2 * pw, 1, R.clay[0]);
  PK.px(cx - pw, rimTop, R.clay[1]);
  const fx = r(4 * u);
  PK.rect(cx - pw + r(3 * u), bodyBot, fx, footH, R.clay[1]);
  PK.rect(cx + pw - r(3 * u) - fx, bodyBot, fx, footH, R.clay[1]);
  PK.rect(cx - pw + r(3 * u), groundY - 1, fx, 1, R.clay[0]);
  PK.rect(cx + pw - r(3 * u) - fx, groundY - 1, fx, 1, R.clay[0]);
}

function soil(g) {
  const r = Math.round;
  const { u, cx, rimTop, pw } = g;
  PK.ellipse(cx, rimTop + 1, pw - 2, Math.max(1, r(1.6 * u)), "#241a10");
  PK.ellipse(cx, rimTop, pw - 3, Math.max(1, r(u)), "#3a2a18");
  const rnd = PK.rng(9);
  for (let i = 0; i < 12; i++) {
    PK.px(cx - pw + 3 + r(rnd() * (2 * pw - 6)), rimTop + (rnd() < 0.5 ? 0 : 1),
          rnd() < 0.5 ? R.foliage[1] : R.foliage[2]);
  }
}

function trunk(g) {
  const r = Math.round;
  const { u, cx, soilY } = g;
  PK.limb(cx - r(6 * u), soilY + 1, cx - r(4 * u), soilY - r(2 * u), cx - r(u), soilY - r(4 * u),
          Math.max(2, r(2.6 * u)), Math.max(1, r(0.8 * u)), R.bark, 21);
  PK.limb(cx + r(6 * u), soilY + 1, cx + r(4 * u), soilY - r(2 * u), cx + r(u), soilY - r(3 * u),
          Math.max(2, r(2.6 * u)), Math.max(1, r(0.8 * u)), R.bark, 22);
  PK.limb(cx + r(u), soilY + 1, cx + r(3 * u), soilY - r(2 * u), cx + r(2 * u), soilY - r(6 * u),
          Math.max(2, r(2.2 * u)), Math.max(1, r(0.7 * u)), R.bark, 23);
  PK.limb(cx, soilY, cx + r(9 * u), soilY - r(13 * u), cx + r(3 * u), soilY - r(26 * u),
          Math.max(4, r(9 * u)), Math.max(2, r(5.5 * u)), R.bark, 11);
  PK.limb(cx + r(3 * u), soilY - r(26 * u), cx - r(7 * u), soilY - r(35 * u), cx - r(u), soilY - r(44 * u),
          Math.max(2, r(5.5 * u)), Math.max(1, r(2.2 * u)), R.bark, 12);
  PK.taper(cx - r(3 * u), soilY - r(3 * u), cx + r(3 * u), soilY - r(13 * u), cx - r(3 * u), soilY - r(23 * u),
           Math.max(1, r(1.6 * u)), 1, R.bark[3]);
  PK.taper(cx - r(2 * u), soilY - r(5 * u), cx + r(2 * u), soilY - r(13 * u), cx - r(4 * u), soilY - r(22 * u),
           Math.max(1, r(u)), 1, R.bark[4]);
  PK.taper(cx + r(u), soilY - r(28 * u), cx - r(4 * u), soilY - r(34 * u), cx - r(3 * u), soilY - r(42 * u),
           Math.max(1, r(1.2 * u)), 1, R.bark[3]);
}

function foliagePad(cx, cy, rx, ry, seed) {
  const r = Math.round, rnd = PK.rng(seed), F = R.foliage;
  const n = 5;
  const bumps = [];
  for (let i = 0; i < n; i++) {
    const a = -Math.PI * (0.12 + 0.76 * (i / (n - 1)));
    bumps.push({ x: cx + Math.cos(a) * (rx - r(2 * rx / 9)) + r(rnd() * 2 - 1),
                 y: cy + Math.sin(a) * (ry - 1), br: Math.max(2, r(ry * (0.55 + rnd() * 0.4))) });
  }
  for (const b of bumps) PK.disc(b.x, b.y, b.br + 1, F[0]);
  for (const b of bumps) PK.disc(b.x, b.y, b.br, F[1]);
  for (const b of bumps) PK.disc(b.x - 1, b.y - 1, Math.max(0, b.br - 1), F[2]);
  for (const b of bumps) PK.disc(b.x - 2, b.y - 2, Math.max(0, b.br - 2), F[3]);
  PK.ellipse(cx, cy, rx, ry, F[0]);
  PK.ellipse(cx, cy - 1, rx - 1, Math.max(1, ry - 2), F[1]);
  PK.ellipse(cx - r(rx * 0.18), cy - 2, Math.max(1, rx - r(rx * 0.32)), Math.max(1, ry - 3), F[2]);
  PK.ellipse(cx - r(rx * 0.28), cy - r(ry * 0.45), Math.max(1, rx - r(rx * 0.55)), Math.max(1, r(ry * 0.35)), F[3]);
  for (let i = 0; i < Math.max(3, rx * 0.4); i++) {
    PK.px(cx - r(rx * (0.05 + rnd() * 0.55)), cy - r(ry * (0.25 + rnd() * 0.65)),
          rnd() < 0.6 ? F[4] : F[3]);
  }
}

function drawCanopy(t) {
  for (const b of geo.branches) {
    const dx = sway(t, b);
    PK.limb(b.ax, b.ay, b.ccx, b.ccy, b.tx + dx, b.ty, b.w0, b.w1, R.bark, b.seed);
    foliagePad(b.padx + dx, b.pady, b.prx, b.pry, b.seed + 1);
  }
}

function drawLeaves() {
  for (const p of leaves.particles) {
    const c = p.k < 0.4 ? R.foliage[1] : p.k < 0.72 ? R.foliage[2] : R.foliage[3];
    PK.px(p.x, p.y, c);
    if (p.k < 0.35) {
      PK.px(p.x + 1, p.y, R.foliage[3]);
      PK.px(p.x + 2, p.y, R.foliage[2]);
    } else if (p.k > 0.82) {
      PK.px(p.x, p.y + 1, R.foliage[4]);
    } else {
      PK.px(p.x + 1, p.y, R.foliage[4]);
    }
  }
}

PK.loop((t, dt) => {
  if (!bg) return;
  PK.blit(bg);
  windFar.step(dt);
  windFar.streaks(["#b9d2e6", "#eef7fd"]);
  drawCanopy(t);
  windNear.step(dt);
  windNear.streaks(["#d8e9f5", "#ffffff"]);
  leaves.step(dt);
  drawLeaves();
});
})();
</script>
</body>
</html>
