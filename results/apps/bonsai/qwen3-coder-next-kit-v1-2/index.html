<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Art Bonsai with Wind</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(180deg, #e0e0e0 0%, #d0d0d0 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      max-width: 100%;
      max-height: 90vh;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      border-radius: 4px;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <canvas id="scene" width="600" height="400"></canvas>

  <script>
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');

    const WIND_SPEED = 1.5;
    const SWAY_SPEED = 0.03;
    const LEAF_COUNT = 40;
    const WIND_STREAKS = 15;

    let time = 0;
    let leaves = [];
    let windStreaks = [];

    function init() {
      for (let i = 0; i < LEAF_COUNT; i++) {
        leaves.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 3 + 2,
          speed: Math.random() * 2 + 1,
          phase: Math.random() * Math.PI * 2
        });
      }

      for (let i = 0; i < WIND_STREAKS; i++) {
        windStreaks.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          length: Math.random() * 20 + 10,
          opacity: Math.random() * 0.5 + 0.1,
          angle: -Math.PI / 4
        });
      }
    }

    function drawPixelLeaf(x, y, size, color) {
      ctx.fillStyle = color;
      for (let i = 0; i < size; i++) {
        for (let j = 0; j < size; j++) {
          if (Math.random() > 0.3) {
            ctx.fillRect(x + i, y + j, 1, 1);
          }
        }
      }
    }

    function drawFoliagePad(x, y, baseSize, color1, color2, color3, swayOffset) {
      const base = baseSize + swayOffset;
      
      for (let i = 0; i < base * 3; i++) {
        for (let j = 0; j < base * 3; j++) {
          const dist = Math.sqrt((i - base * 1.5) ** 2 + (j - base * 1.5) ** 2);
          if (dist < base * 1.5) {
            let shade = 0;
            if (dist > base * 0.7) shade = 0.15;
            else if (dist > base * 0.4) shade = 0.08;
            
            const noise = Math.random() * 0.1;
            const brightness = 1 - shade + noise;
            
            ctx.fillStyle = color1;
            ctx.fillRect(x + i, y + j, 1, 1);
          }
        }
      }
    }

    function drawPot(x, y, width, height) {
      const gradient = ctx.createLinearGradient(x, y, x + width, y);
      gradient.addColorStop(0, '#8b5a2b');
      gradient.addColorStop(0.3, '#a06b3a');
      gradient.addColorStop(0.7, '#6b421e');
      gradient.addColorStop(1, '#5c3819');
      
      ctx.fillStyle = gradient;
      ctx.fillRect(x, y, width, height);
      
      ctx.fillStyle = '#4a3014';
      ctx.fillRect(x, y, width, 6);
      ctx.fillRect(x, y + height - 6, width, 6);
      
      ctx.fillStyle = '#a06b3a';
      ctx.fillRect(x - 6, y + height - 10, 6, 14);
      ctx.fillRect(x + width, y + height - 10, 6, 14);
    }

    function drawTrunk(x, y, width, height, sway) {
      const gradient = ctx.createLinearGradient(x, y, x + width, y);
      gradient.addColorStop(0, '#5c3819');
      gradient.addColorStop(0.3, '#7a4f26');
      gradient.addColorStop(0.7, '#4a3014');
      gradient.addColorStop(1, '#3d2710');
      
      ctx.fillStyle = gradient;
      
      let curX = x;
      let curY = y;
      const segments = 20;
      
      for (let i = 0; i < segments; i++) {
        const t = i / segments;
        const swayAmt = sway * Math.sin(t * Math.PI);
        const nextX = x + (width - 10) * t + swayAmt;
        const nextY = y + height * t;
        const lineWidth = width * (1 - t * 0.7);
        
        ctx.fillRect(Math.floor(nextX), Math.floor(nextY), Math.floor(lineWidth), 2);
      }
    }

    function drawBranch(x, y, length, angle, sway) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle + sway);
      
      const gradient = ctx.createLinearGradient(0, 0, length, 0);
      gradient.addColorStop(0, '#5c3819');
      gradient.addColorStop(0.5, '#7a4f26');
      gradient.addColorStop(1, '#4a3014');
      
      ctx.fillStyle = gradient;
      
      for (let i = 0; i < length; i++) {
        const yOffset = Math.sin(i * 0.3) * 2;
        ctx.fillRect(i, yOffset, 3, 2);
      }
      
      ctx.restore();
    }

    function drawWindStreak(streak, swayAmount) {
      const swayOffset = Math.sin(time * SWAY_SPEED + streak.phase) * swayAmount * 0.5;
      const drawAngle = streak.angle + swayOffset;
      
      ctx.strokeStyle = `rgba(255, 255, 255, ${streak.opacity})`;
      ctx.lineWidth = 1;
      
      const endX = streak.x + Math.cos(drawAngle) * streak.length;
      const endY = streak.y + Math.sin(drawAngle) * streak.length;
      
      ctx.beginPath();
      ctx.moveTo(streak.x, streak.y);
      ctx.lineTo(endX, endY);
      ctx.stroke();
    }

    function drawLeaf(leaf, swayAmount) {
      const swayOffset = Math.sin(time * SWAY_SPEED + leaf.phase) * swayAmount;
      const drawX = leaf.x + swayOffset + Math.cos(time * 0.05 + leaf.phase) * 5;
      const drawY = leaf.y + Math.sin(time * 0.05 + leaf.phase) * 5;
      
      const colors = ['#6b8c42', '#7da64f', '#5c7a37', '#8ca652'];
      const color = colors[Math.floor(Math.random() * colors.length)];
      
      drawPixelLeaf(drawX, drawY, leaf.size, color);
    }

    function drawScene(swayAmount) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      drawPot(250, 280, 100, 60);
      
      drawTrunk(300, 220, 20, 80, swayAmount * 0.3);
      
      drawBranch(305, 200, 40, -0.5, swayAmount * 0.4);
      drawFoliagePad(320, 160, 25, '#6b8c42', '#7da64f', '#5c7a37', swayAmount * 0.3);
      
      drawBranch(295, 180, 35, -2.5, swayAmount * 0.4);
      drawFoliagePad(270, 150, 20, '#6b8c42', '#7da64f', '#5c7a37', swayAmount * 0.3);
      
      drawBranch(308, 160, 30, -1.0, swayAmount * 0.5);
      drawFoliagePad(315, 130, 18, '#6b8c42', '#7da64f', '#5c7a37', swayAmount * 0.3);
      
      drawBranch(292, 150, 30, -2.0, swayAmount * 0.5);
      drawFoliagePad(275, 110, 15, '#6b8c42', '#7da64f', '#5c7a37', swayAmount * 0.3);
      
      for (let streak of windStreaks) {
        drawWindStreak(streak, swayAmount);
      }
      
      for (let leaf of leaves) {
        drawLeaf(leaf, swayAmount);
      }
    }

    function update() {
      time += 1;
      
      const swayAmount = Math.sin(time * SWAY_SPEED) * 5;
      
      for (let leaf of leaves) {
        leaf.x -= leaf.speed;
        if (leaf.x < -10) {
          leaf.x = canvas.width + 10;
          leaf.y = Math.random() * canvas.height;
        }
      }
      
      for (let streak of windStreaks) {
        streak.x -= WIND_SPEED;
        streak.phase += 0.1;
        if (streak.x < -30) {
          streak.x = canvas.width + 30;
          streak.y = Math.random() * canvas.height;
        }
      }
      
      drawScene(swayAmount);
      
      requestAnimationFrame(update);
    }

    init();
    update();
  </script>
</body>
</html>
