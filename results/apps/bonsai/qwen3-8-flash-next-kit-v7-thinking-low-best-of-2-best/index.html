<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bonsai in the Wind</title>
<style>
  html, body { margin: 0; height: 100%; background: #243156; overflow: hidden; }
  #c { display: block; }
  #cap {
    position: fixed; right: 12px; bottom: 10px;
    font: 11px/1.4 ui-monospace, Menlo, Consolas, monospace;
    color: #f2e6d8; opacity: .5; letter-spacing: .1em;
    user-select: none; pointer-events: none; text-shadow: 0 1px 0 rgba(0,0,0,.45);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cap">bonsai &middot; pixel garden &middot; light wind</div>
<script src="pixel-kit.js"></script>
<script>
(function () {
  "use strict";
  var R = PK.ramps;
  var dirt = ["#241609", "#33210f", "#452c17", "#5a3a20"];
  var soil = ["#1d1206", "#2e1d0e", "#432b16", "#5a3a20"];
  var hill = ["#3f3f6e", "#4b4a7a", "#575586", "#636192", "#6f6d9e"];
  var leafCols = ["#2f5d34", "#4a8a3c", "#c4612a", "#ee8a3a"];
  var cloudBody = "#a58fa0", cloudLit = "#e6c3ae";

  var view = { W: 0, H: 0, gy: 0, cx: 0, s: 1, treeH: 66 };

  var clouds = PK.drift({ n: 5, seed: 3, area: [0, 0, 1, 1], vx: [3, 7], vy: [0, 0], len: [1, 1] });
  var streaks = PK.drift({ n: 26, seed: 14, area: [0, 0, 1, 1], vx: [26, 46], vy: [-1.5, 1.5], len: [4, 9] });
  var streaksHi = PK.drift({ n: 10, seed: 15, area: [0, 0, 1, 1], vx: [32, 52], vy: [0, 0], len: [6, 10] });
  var leaves = PK.drift({ n: 26, seed: 16, area: [0, 0, 1, 1], vx: [10, 22], vy: [3, 7], len: [1, 1] });
  var birds = [{ x: 0, y: 0, sp: 9, ph: 0 }, { x: 0, y: 0, sp: 7, ph: 2 }];
  var tufts = [];
  var bg = null;

  function U(v) { return Math.max(1, Math.round(v * view.s)); }
  function X(o) { return Math.round(view.cx + o * view.s); }
  function Y(o) { return view.gy - Math.round(o * view.s); }

  // ---- static scenery -------------------------------------------------------

  function drawPot() {
    var pw = U(13), ph = Math.max(6, U(9));
    var rimH = Math.max(2, Math.round(ph * 0.3));
    var footHalf = Math.round(U(7));
    for (var y = 0; y < ph - 1; y++) {
      var yy = view.gy - ph + y;
      var half = y < rimH ? pw : Math.round(pw - ((y - rimH) * (pw - footHalf)) / Math.max(1, ph - 2 - rimH));
      for (var i = -half; i <= half; i++) {
        var c = R.clay[2];
        if (y === 0) c = i > half - 2 ? R.clay[2] : R.clay[3];
        else if (y === rimH - 1) c = R.clay[1];
        else if (i >= half - 1) c = R.clay[1];
        else if (i <= -half + 2 && y >= rimH) c = R.clay[3];
        if (y >= rimH && y <= rimH + 2) c = i <= 0 ? R.clay[3] : (i >= half - 1 ? R.clay[1] : R.clay[2]);
        PK.px(view.cx + i, yy, c);
      }
    }
    var by = view.gy - 1, half = footHalf;
    for (var i = -half; i <= half; i++) {
      var foot = i <= -half + 2 || i >= half - 2;
      if (foot) PK.px(view.cx + i, by, R.clay[0]);
    }
    // soil mound inside the rim
    PK.ellipse(view.cx, view.gy - ph - 1, U(11), Math.max(2, U(2.4)), soil[1]);
    PK.ellipse(view.cx, view.gy - ph - 2, U(9), Math.max(1, U(1.4)), soil[2]);
    var rnd = PK.rng(41);
    for (var k = 0; k < U(9); k++) {
      var sx = view.cx + Math.round((rnd() * 2 - 1) * U(9));
      var sy = view.gy - ph - 1 + Math.round(rnd() * 2 - 1);
      PK.px(sx, sy, rnd() < 0.6 ? R.foliage[1] : R.foliage[2]);
    }
  }

  function drawScenery() {
    var W = view.W, H = view.H, gy = view.gy, cx = view.cx;
    // sky
    PK.gradient(0, 0, W, gy - U(6), PK.skies.dawn);
    // low haze toward the horizon
    for (var y = gy - U(16); y < gy - U(5); y++)
      for (var x = 0; x < W; x++) if (PK.bayer(x, y) < 0.28) PK.px(x, y, "#f8d0a0");
    // sun (top-left, the key light)
    PK.glow(Math.round(W * 0.2), Math.round(H * 0.12), U(11), "#f2c090", 0.7);
    PK.glow(Math.round(W * 0.2), Math.round(H * 0.12), U(7), "#ffd9a8", 0.85);
    PK.disc(Math.round(W * 0.2), Math.round(H * 0.12), U(4), "#ffe9c8");
    // far hills
    PK.rock(cx - U(96), gy, U(74), U(12), hill, { profile: "mound", seed: 31, rough: 3 });
    PK.rock(cx + U(34), gy, U(58), U(9), hill, { profile: "mound", seed: 32, rough: 2 });
    // grass band at the ground line, then earth below
    PK.gradient(0, gy - 3, W, gy + 1, ["#1d3b2a", "#2f5d34", "#2f5d34"]);
    PK.gradient(0, gy + 1, W, H, dirt);
    var rnd = PK.rng(77);
    for (var i = 0; i < W / 2; i++) {
      var gx = Math.floor(rnd() * W);
      var gyy = gy - 3 + Math.floor(rnd() * 4);
      PK.px(gx, gyy, rnd() < 0.5 ? "#24421f" : "#38662f");
    }
    for (var i = 0; i < W / 6; i++) {
      var dx = Math.floor(rnd() * W);
      var dyy = gy + 2 + Math.floor(rnd() * (H - gy - 3));
      PK.px(dx, dyy, rnd() < 0.6 ? dirt[0] : dirt[3]);
    }
    // pebbles
    var rnd2 = PK.rng(88);
    for (var i = 0; i < 5; i++) {
      var px0 = cx + Math.round((rnd2() * 2 - 1) * U(46));
      if (Math.abs(px0 - cx) < U(15)) px0 += (px0 < cx ? -1 : 1) * U(16);
      var pr = 1 + (rnd2() < 0.4 ? 1 : 0);
      PK.disc(px0, gy - 1, pr, R.stone[2]);
      PK.px(px0 - 1, gy - 2, R.stone[3]);
      PK.px(px0, gy, R.stone[0]);
    }
    // contact shadow + pot + soil
    PK.ellipse(cx, gy + 1, U(15), Math.max(1, U(1.4)), dirt[0]);
    drawPot();
    var base = U(10); // trunk sits in the soil
    // root flare
    PK.limb(X(0), Y(9.5), X(-3), Y(11), X(-6.5), Y(12), U(3.4), U(1.2), R.bark, 21);
    PK.limb(X(0), Y(9.5), X(3), Y(11), X(6.5), Y(12), U(3.4), U(1.2), R.bark, 22);
    PK.limb(X(0), Y(10), X(-1), Y(12), X(-2), Y(13.5), U(3), U(1.4), R.bark, 23);
    // trunk: thick S-curve with taper
    PK.limb(X(0), Y(9.5), X(-4), Y(20), X(-6), Y(31), U(8), U(5), R.bark, 1);
    PK.limb(X(-6), Y(31), X(-6.5), Y(42), X(-1), Y(52), U(5), U(2.6), R.bark, 2);
    PK.limb(X(-1), Y(52), X(1), Y(56), X(2), Y(60), U(2.6), U(1.2), R.bark, 3);
    // branches to the pads
    PK.limb(X(-5), Y(24), X(-11), Y(29), X(-17), Y(33.5), U(3.4), U(1.4), R.bark, 4);
    PK.limb(X(-5.5), Y(40), X(4), Y(43), X(12), Y(47.5), U(3.2), U(1.3), R.bark, 5);
    PK.limb(X(-2), Y(16), X(5), Y(17.5), X(10), Y(21.5), U(2.8), U(1.2), R.bark, 6);
    PK.limb(X(-4), Y(45.5), X(-7), Y(49), X(-8.5), Y(51.5), U(2.4), U(1.1), R.bark, 7);
  }

  // foliage pads: drawn every frame so they can sway
  var pads = [
    { ox: -11, oy: 22, rx: 7, ry: 4, seed: 51 },
    { ox: -18, oy: 35, rx: 10, ry: 5, seed: 52 },
    { ox: 13, oy: 49, rx: 9, ry: 4, seed: 53 },
    { ox: -9, oy: 52, rx: 6, ry: 3, seed: 54 },
    { ox: 6, oy: 58.5, rx: 7, ry: 4, seed: 56 },
    { ox: 2, oy: 61, rx: 12, ry: 6, seed: 55 }
  ];

  // ---- resize ----------------------------------------------------------------

  var canvas = document.getElementById("c");
  var fit = PK.fit(canvas, 140, function (v) {
    Object.assign(view, { W: v.W, H: v.H });
    view.gy = Math.round(v.H * (v.portrait ? 0.84 : 0.8));
    view.cx = Math.round(v.W / 2);
    view.treeH = Math.round(Math.min(v.H * 0.5, v.W * 0.85, 130));
    view.s = view.treeH / 66;
    bg = PK.layer(v.W, v.H, drawScenery);
    clouds.setArea([-U(10), Math.round(v.H * 0.06), v.W + U(10), Math.round(v.H * 0.34)]);
    streaks.setArea([0, view.gy - U(76), v.W, view.gy + U(2)]);
    streaksHi.setArea([0, Math.round(v.H * 0.05), v.W, Math.round(v.H * 0.3)]);
    leaves.setArea([-2, view.gy - U(84), v.W + 2, view.gy + U(4)]);
    birds[0].x = v.W * 0.25; birds[0].y = Math.round(v.H * 0.16);
    birds[1].x = v.W * 0.65; birds[1].y = Math.round(v.H * 0.23);
    tufts = [];
    var rnd = PK.rng(64);
    for (var i = 0; i < 9; i++) {
      var tx = view.cx + Math.round((rnd() * 2 - 1) * U(60));
      if (Math.abs(tx - view.cx) < U(15)) tx += (tx < view.cx ? -1 : 1) * U(16);
      tufts.push({ x: tx, h: 2 + Math.floor(rnd() * 3), ph: rnd() * 6.28 });
    }
  });

  // ---- frame -----------------------------------------------------------------

  PK.loop(function (t, dt) {
    PK.blit(bg);

    // clouds
    clouds.step(dt);
    for (var i = 0; i < clouds.particles.length; i++) {
      var p = clouds.particles[i];
      PK.disc(p.x, p.y, U(3) + (p.k > 0.5 ? 1 : 0), cloudBody);
      PK.disc(p.x + U(4), p.y + 1, U(2.2), cloudBody);
      PK.disc(p.x - U(4), p.y + 1, U(2), cloudBody);
      PK.px(p.x - 1, p.y - U(3) - 1, cloudLit);
      PK.px(p.x + 1, p.y - U(3), cloudLit);
    }

    // birds
    for (var i = 0; i < birds.length; i++) {
      var b = birds[i];
      b.x += b.sp * dt;
      if (b.x > view.W + 3) b.x = -3;
      var flap = Math.sin(t * 7 + b.ph) > 0 ? -1 : 0;
      PK.px(b.x, b.y, "#39405f");
      PK.px(b.x - 1, b.y + flap, "#39405f");
      PK.px(b.x + 1, b.y + flap, "#39405f");
    }

    // wind streaks behind the foliage
    streaksHi.step(dt);
    streaksHi.streaks(["#8a7f9c", "#c8bcd0"]);
    streaks.step(dt);
    streaks.streaks(["#a8907e", "#f4e6da"]);

    // swaying grass tufts
    for (var i = 0; i < tufts.length; i++) {
      var g = tufts[i];
      for (var k = 0; k < 3; k++) {
        var off = Math.round(Math.sin(t * 1.6 + g.ph + k) * 1.2 + Math.sin(t * 3.3 + g.ph) * 0.6);
        PK.line(g.x + k - 1, view.gy - 1, g.x + k - 1 + off, view.gy - 1 - g.h - k, k === 1 ? "#4a8a3c" : "#2f5d34");
      }
    }

    // foliage pads, swaying: higher pads move more
    for (var i = 0; i < pads.length; i++) {
      var p = pads[i];
      var f = (view.gy - Y(p.oy)) / view.treeH;
      var offX = Math.round(Math.sin(t * 1.25 + p.seed) * 1.8 * f + Math.sin(t * 2.9 + p.seed * 1.7) * 0.9 * f);
      PK.pad(X(p.ox + offX), Y(p.oy), U(p.rx), Math.max(2, U(p.ry)), R.foliage, { seed: p.seed });
    }

    // drifting leaves in front
    leaves.step(dt);
    for (var i = 0; i < leaves.particles.length; i++) {
      var p = leaves.particles[i];
      var x = Math.round(p.x + Math.sin(t * 2.2 + p.k * 40) * 1.4);
      var y = Math.round(p.y);
      var c1 = leafCols[Math.min(3, Math.floor(p.k * 4))];
      var c2 = leafCols[Math.max(0, Math.min(3, Math.floor(p.k * 4)) - 1)];
      if (p.k < 0.5) { PK.px(x, y, c1); PK.px(x + 1, y, c2); }
      else { PK.px(x, y, c1); PK.px(x, y + 1, c2); }
    }
  });
})();
</script>
</body>
</html>
