<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bonsai in the Wind — pixel art</title>
<style>
  :root { color-scheme: light; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #131a26;
    background: radial-gradient(120% 90% at 50% 30%, #223047 0%, #16202f 55%, #10161f 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 20px 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    overflow: hidden;
  }
  #stage {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    flex: 1;
    min-height: 0;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.06);
  }
  h1 {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #7d8ba1;
    user-select: none;
  }
  h1 span { color: #4a8a3c; }
</style>
</head>
<body>
<div id="stage"><canvas id="scene" aria-label="Pixel art of a bonsai tree swaying in the wind"></canvas></div>
<h1>Bonsai <span>&#9670;</span> in the wind</h1>
<script>
(function () {
  "use strict";

  var W = 160, H = 120;
  var canvas = document.getElementById("scene");
  var ctx = canvas.getContext("2d");
  canvas.width = W;
  canvas.height = H;
  ctx.imageSmoothingEnabled = false;

  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- palette (16 colors) ---------- */
  var SKY = ["#bcdcea", "#d6e9f2", "#ecf4f7"];
  var FAR = "#a9c2cf";
  var CLOUD = ["#dbeaf1", "#eef6fa"];
  var MNT = ["#7d97ad", "#9db3c4", "#5d768c"];
  var GND = ["#6f9a5c", "#88b26e", "#a3c985", "#5d8450"];
  var POT = ["#2e3d52", "#3f566f", "#5a7893", "#7f9db5", "#a9c4d8"];
  var SOIL = ["#2b1d13", "#432c1c", "#5b3d27"];
  var BARK = ["#2b1a14", "#4a2c1f", "#6e4430", "#9a6646", "#c79a6b"];
  var LEAF = ["#1d3b2a", "#2f5d34", "#4a8a3c", "#78b84a", "#b8e070"];
  var M = Math.PI / 180;

  /* ---------- pixel helpers ---------- */
  var pxs = [];
  var windPxs = [];
  function px(x, y, c) { pxs.push(Math.round(x), Math.round(y), c); }
  function pxw(x, y, c) { windPxs.push(Math.round(x), Math.round(y), c); }
  function disc(cx, cy, r, c) {
    cx = Math.round(cx); cy = Math.round(cy);
    for (var y = -r; y <= r; y++) for (var x = -r; x <= r; x++)
      if (x * x + y * y <= r * r + r * 0.8) px(cx + x, cy + y, c);
  }
  function taper(x0, y0, cx, cy, x1, y1, w0, w1, c) {
    var steps = Math.max(2, Math.ceil(Math.hypot(x1 - x0, y1 - y0)) * 2);
    for (var i = 0; i <= steps; i++) {
      var t = i / steps, u = 1 - t;
      var x = u * u * x0 + 2 * u * t * cx + t * t * x1;
      var y = u * u * y0 + 2 * u * t * cy + t * t * y1;
      disc(x, y, Math.max(0, Math.round((w0 + (w1 - w0) * t) / 2)), c);
    }
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294927296 / 4294927296 * 4294927296;
    };
  }
  function rnd32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* ---------- static background (baked once) ---------- */
  function bakeBackground() {
    var r = rnd32(7);
    var b = document.createElement("canvas");
    b.width = W; b.height = H;
    var g = b.getContext("2d");

    // sky bands with dithered transitions
    var bounds = [0, 26, 58, 82];
    for (var y = 0; y < 82; y++) {
      var band = y < bounds[1] ? 0 : (y < bounds[2] ? 1 : 2);
      var prev = y < bounds[1] ? 0 : (y < bounds[2] ? 0 : 1);
      for (var x = 0; x < W; x++) {
        var edge = y < bounds[1] ? bounds[1] : (y < bounds[2] ? bounds[2] : bounds[3]);
        var nearEdge = Math.abs(y - edge) < 2;
        var c = SKY[band];
        if (nearEdge && ((x + y) & 1)) c = SKY[prev];
        g.fillStyle = c; g.fillRect(x, y, 1, 1);
      }
    }
    // sun (top-left)
    disc(27, 21, 9, CLOUD[0]);
    disc(27, 21, 6, CLOUD[1]);
    for (var i = 0; i < 42; i++) {
      var a = r() * Math.PI * 2, d = 11 + Math.floor(r() * 6);
      g.fillStyle = CLOUD[0];
      g.fillRect(Math.round(27 + Math.cos(a) * d), Math.round(21 + Math.sin(a) * d), 1, 1);
    }

    // clouds (baked, drift happens via overlay clouds)
    function cloud(cx, cy, s) {
      var puffs = [[-3 * s, 0, 2 * s], [0, -1 * s, 2.4 * s], [3 * s, 0, 2 * s], [1 * s, 0.8 * s, 2.2 * s]];
      for (var k = 0; k < puffs.length; k++) {
        var p = puffs[k];
        var rr = Math.max(1, Math.round(p[2]));
        for (var yy = -rr; yy <= rr; yy++) for (var xx = -rr; xx <= rr; xx++) {
          if (xx * xx + yy * yy <= rr * rr + rr * 0.8) {
            g.fillStyle = (yy > 0 && ((xx + yy) & 1)) ? CLOUD[0] : CLOUD[1];
            g.fillRect(Math.round(cx + p[0] + xx), Math.round(cy + p[1] + yy), 1, 1);
          }
        }
      }
    }
    cloud(52, 17, 2); cloud(120, 26, 2.5); cloud(96, 11, 1.6);

    // far mountains
    var base = 82, x2, y2;
    var peak1 = [[30, 62], [46, 54], [64, 60], [78, 67]];
    var peak2 = [[92, 66], [110, 55], [128, 61], [146, 68]];
    function mountain(pts) {
      for (var xx = 0; xx < W; xx++) {
        var top = null;
        for (var k = 0; k < pts.length - 1; k++) {
          var a = pts[k], b2 = pts[k + 1];
          if (xx >= a[0] && xx <= b2[0]) {
            top = a[1] + (b2[1] - a[1]) * (xx - a[0]) / (b2[0] - a[0]);
          }
        }
        if (top === null) continue;
        top = Math.round(top + (r() < 0.3 ? 1 : 0));
        for (var yy = top; yy <= base; yy++) {
          var lit = yy <= top + 2 || (yy < top + 5 && ((xx + yy) & 1) === 0);
          var c = lit ? MNT[1] : MNT[0];
          if (yy >= base - 2) c = ((xx + yy) & 1) ? MNT[2] : MNT[0];   // base shadow band
          g.fillStyle = c;
          g.fillRect(xx, yy, 1, 1);
        }
      }
    }
    mountain(peak1); mountain(peak2);

    // ground
    for (var yy2 = 82; yy2 < H; yy2++) {
      for (var xx2 = 0; xx2 < W; xx2++) {
        var c2;
        if (yy2 < 85) c2 = GND[2];
        else if (yy2 < 95) c2 = GND[1];
        else if (yy2 < 108) c2 = ((xx2 + yy2) & 1) && r() < 0.5 ? GND[1] : GND[0];
        else c2 = ((xx2 + yy2) & 1) && r() < 0.5 ? GND[0] : GND[3];
        g.fillStyle = c2; g.fillRect(xx2, yy2, 1, 1);
      }
    }
    // grass tufts + pebbles
    for (i = 0; i < 60; i++) {
      var gx = Math.floor(r() * W), gy = 83 + Math.floor(r() * (H - 84));
      if (Math.abs(gx - 80) < 24 && gy > 90 && gy < 116) continue;
      g.fillStyle = r() < 0.5 ? GND[2] : GND[0];
      g.fillRect(gx, gy, 1, 1);
      if (r() < 0.4) g.fillRect(gx + 1, gy - 1, 1, 1);
    }
    for (i = 0; i < 6; i++) {
      var pxx = 8 + Math.floor(r() * 144), pyy = 100 + Math.floor(r() * 16);
      if (Math.abs(pxx - 80) < 26) continue;
      g.fillStyle = "#8b90a6"; g.fillRect(pxx, pyy, 2, 1);
      g.fillStyle = "#c2c7d6"; g.fillRect(pxx, pyy, 1, 1);
    }
    return b;
  }
  var bg = bakeBackground();

  /* ---------- drifting foreground clouds ---------- */
  var clouds = [
    { x: 20, y: 40, s: 2.2, v: 2.1 },
    { x: 100, y: 48, s: 1.8, v: 3.0 },
    { x: 140, y: 34, s: 1.5, v: 1.5 }
  ];
  function drawClouds(t) {
    for (var i = 0; i < clouds.length; i++) {
      var c = clouds[i];
      var cx = ((c.x + t * c.v) % (W + 40)) - 20;
      var puffs = [[-2 * c.s, 0], [0, -1], [2 * c.s, 0], [0.5, 1]];
      for (var k = 0; k < puffs.length; k++) {
        var rr = Math.max(1, Math.round(c.s * (k === 1 ? 1.2 : 0.9)));
        for (var yy = -rr; yy <= rr; yy++) for (var xx = -rr; xx <= rr; xx++) {
          if (xx * xx + yy * yy <= rr * rr + rr * 0.8) {
            var gx = Math.round(cx + puffs[k][0] + xx), gy = Math.round(c.y + puffs[k][1] + yy);
            if (gx >= 0 && gx < W && gy >= 0 && gy < 60) {
              px(gx, gy, (yy > 0 && ((gx + gy) & 1)) ? CLOUD[0] : CLOUD[1]);
            }
          }
        }
      }
    }
  }

  /* ---------- bonsai geometry (logical, unscaled) ---------- */
  var BASE = { x: 80, y: 96 };          // trunk base, pot rim top y=100
  var POT_TOP = 100, POT_BOTTOM = 113, RIM_Y = 97, RIM_H = 3;
  var GROUND_Y = 114;

  // trunk as quadratic segments (width tapers), from base upward
  var trunkSegs = [
    { x0: 79.5, y0: 97, cx: 75.5, cy: 93, x1: 76, y1: 89, w0: 12, w1: 8 },
    { x0: 76, y0: 89, cx: 78, cy: 84, x1: 82, y1: 81, w0: 8, w1: 6 },
    { x0: 82, y0: 81, cx: 86, cy: 78, x1: 86, y1: 74, w0: 6, w1: 4 },
    { x0: 86, y0: 74, cx: 85, cy: 70, x1: 82, y1: 68, w0: 4, w1: 2.5 },
    { x0: 82, y0: 68, cx: 79.5, cy: 65.5, x1: 78.5, y1: 62, w0: 2.5, w1: 1 }
  ];
  // branches: from anchor on trunk outward/up; apex = foliage attach point
  var branches = [
    { x0: 77, y0: 89, cx: 69, cy: 89, x1: 60, y1: 85, w0: 4, w1: 1.2, apex: [60, 84], pad: "lower", side: -1 },
    { x0: 83, y0: 81, cx: 91, cy: 81, x1: 99, y1: 77, w0: 3.5, w1: 1.2, apex: [99, 76], pad: "mid", side: 1 },
    { x0: 86, y0: 75, cx: 80, cy: 74, x1: 71, y1: 70, w0: 2.6, w1: 1, apex: [71, 69], pad: "small", side: -1 },
    { x0: 81, y0: 66, cx: 86, cy: 64, x1: 92, y1: 60, w0: 2, w1: 1, apex: [92, 59], pad: "small2", side: 1 },
    { x0: 79, y0: 64, cx: 78, cy: 61, x1: 77.5, y1: 57, w0: 1.6, w1: 1, apex: [77.5, 56], pad: "crown", side: 0 }
  ];

  // foliage pads: cluster of ellipse specs {ox, oy, rx, ry} relative to apex
  var padDefs = {
    lower:  [{ ox: -7, oy: 0, rx: 8, ry: 5 }, { ox: 0, oy: -4, rx: 10, ry: 6 }, { ox: 7, oy: 0, rx: 8, ry: 5 }, { ox: -3, oy: 2, rx: 10, ry: 4.5 }, { ox: 4, oy: 2, rx: 10, ry: 4.5 }],
    mid:    [{ ox: -6, oy: 0, rx: 7, ry: 4.5 }, { ox: 1, oy: -4, rx: 9, ry: 5.5 }, { ox: 7, oy: 0, rx: 7, ry: 4.5 }, { ox: 0, oy: 2, rx: 9, ry: 4 }],
    small:  [{ ox: -5, oy: 0, rx: 6, ry: 4 }, { ox: 2, oy: -3, rx: 7, ry: 4.5 }, { ox: 5, oy: 1, rx: 6, ry: 3.5 }, { ox: 0, oy: 2, rx: 7, ry: 3.5 }],
    small2: [{ ox: -4, oy: 0, rx: 5.5, ry: 3.5 }, { ox: 2, oy: -2, rx: 6.5, ry: 4 }, { ox: 0, oy: 2, rx: 6.5, ry: 3.5 }],
    crown:  [{ ox: -8, oy: 1, rx: 9, ry: 5.5 }, { ox: 0, oy: -4, rx: 12, ry: 7 }, { ox: 8, oy: 1, rx: 9, ry: 5.5 }, { ox: -4, oy: 4, rx: 11, ry: 4.5 }, { ox: 4, oy: 4, rx: 11, ry: 4.5 }]
  };
  var pads = [];
  for (var bi = 0; bi < branches.length; bi++) {
    var b = branches[bi];
    pads.push({
      key: b.pad,
      apex: b.apex,
      hfac: 0.45 + 0.55 * (BASE.y - b.apex[1]) / (BASE.y - 55),
      phase: bi * 1.37 + 0.4
    });
  }

  function wind(t) { return reduced ? 0.25 : (1.35 + 0.65 * Math.sin(t * 0.5 + 1.2) * Math.sin(t * 0.17)); }

  function padOffset(p, t) {
    var w = wind(t);
    var s = Math.sin(t * 1.0 + p.phase) + 0.4 * Math.sin(t * 2.3 + p.phase * 2.3);
    var dxr = w * p.hfac * (3 + 2 * s);
    return {
      dx: Math.round(dxr),
      dx2: dxr - Math.round(dxr),
      dy: Math.round(w * p.hfac * 0.8 * Math.sin(t * 1.6 + p.phase * 1.9))
    };
  }

  /* ---------- foliage rendering ---------- */
  var leafTex = [];
  (function () {
    var r = rnd32(21);
    for (var k = 0; k < 3; k++) {
      var tex = [];
      for (var i = 0; i < 40; i++) {
        var ang = r() * Math.PI * 2, rad = Math.sqrt(r());
        var lx = Math.round(Math.cos(ang) * rad * 9);
        var ly = Math.round(Math.sin(ang) * rad * 4.5);
        var c = r() < 0.09 ? LEAF[4] : (r() < 0.22 ? LEAF[1] : LEAF[2]);
        tex.push([lx, ly, c]);
      }
      leafTex.push(tex);
    }
  })();

  function drawPad(p, t) {
    var off = padOffset(p, t);
    var ax = p.apex[0] + off.dx, ay = p.apex[1] + off.dy;
    var frac = Math.abs(off.dx2);
    var def = padDefs[p.key];
    var i, k;

    // pass 1: silhouette in darkest leaf tone
    for (k = 0; k < def.length; k++) {
      var d = def[k];
      ellipseFill(ax + d.ox, ay + d.oy, Math.round(d.rx), Math.round(d.ry), LEAF[0]);
    }
    // pass 2: mid tone body, shifted slightly toward light
    for (k = 0; k < def.length; k++) {
      var d2 = def[k];
      ellipseFill(ax + d2.ox, ay + d2.oy, Math.round(d2.rx) - 1, Math.max(1, Math.round(d2.ry) - 1), LEAF[2]);
    }
    // pass 2b: shadow crescent on the bottom-right of every lobe
    for (k = 0; k < def.length; k++) {
      var d2b = def[k];
      ellipseFill(ax + d2b.ox + 1.5, ay + d2b.oy + 1, Math.max(1, Math.round(d2b.rx) - 2), Math.max(1, Math.round(d2b.ry) - 2), LEAF[1]);
    }
    // pass 3: lit top-left cap in mid-light tone
    for (k = 0; k < def.length; k++) {
      var d3 = def[k];
      ellipseFill(ax + d3.ox - 2, ay + d3.oy - 2, Math.max(1, Math.round(d3.rx) - 3), Math.max(1, Math.round(d3.ry) - 3), LEAF[3]);
    }
    // pass 4: bright edge highlights along the very top of each lobe
    for (k = 0; k < def.length; k++) {
      var d4 = def[k];
      ellipseFill(ax + d4.ox - 2, ay + d4.oy - Math.round(d4.ry) + 1, Math.max(1, Math.round(d4.rx) - 3), 1, LEAF[4]);
    }
    // leading-edge sparkle: fractionally-moving pixels read as continuous motion
    if (frac > 0.25) {
      var dir = off.dx >= 0 ? 1 : -1;
      var r3 = rnd32(Math.round(p.apex[0] * 31 + p.apex[1] * 7) + (frac > 0.65 ? 100 : 0));
      for (i = 0; i < 5; i++) {
        var pick3 = def[Math.floor(r3() * def.length)];
        px(ax + pick3.ox + dir * pick3.rx, ay + pick3.oy + Math.round((r3() - 0.5) * pick3.ry), r3() < 0.6 ? LEAF[3] : LEAF[1]);
      }
    }
    // speckle texture (stable per pad)
    var r2 = rnd32(Math.round(p.apex[0] * 7 + p.apex[1] * 13));
    var def2 = def;
    for (i = 0; i < 26; i++) {
      var ang = r2() * Math.PI * 2, rad = Math.sqrt(r2());
      var pick = def2[Math.floor(r2() * def2.length)];
      var lx = ax + pick.ox + Math.round(Math.cos(ang) * rad * pick.rx);
      var ly = ay + pick.oy + Math.round(Math.sin(ang) * rad * pick.ry);
      if (inPad(def, lx - ax, ly - ay)) px(lx, ly, r2() < 0.5 ? LEAF[4] : LEAF[1]);
    }
  }

  function inPad(def, dx, dy) {
    for (var k = 0; k < def.length; k++) {
      var d = def[k], ex = dx - d.ox, ey = dy - d.oy;
      if ((ex * ex) / (d.rx * d.rx) + (ey * ey) / (d.ry * d.ry) <= 1.05) return true;
    }
    return false;
  }

  function ellipseFill(cx, cy, rx, ry, c) {
    if (rx < 1 || ry < 1) return;
    for (var y = -ry; y <= ry; y++) for (var x = -rx; x <= rx; x++) {
      if ((x * x) / (rx * rx) + (y * y) / (ry * ry) <= 1.0) px(cx + x, cy + y, c);
    }
  }

  /* ---------- trunk & branches ---------- */
  function drawWood(t) {
    var w = wind(t);
    function bend(pt) {
      var hf = (BASE.y - pt[1]) / (BASE.y - 55);
      return [pt[0] + Math.round(w * hf * 0.8), pt[1]];
    }
    // trunk: outline then body then lit edge then bark streaks
    var i, s;
    for (i = 0; i < trunkSegs.length; i++) {
      s = trunkSegs[i];
      var p0 = bend([s.x0, s.y0]), p1 = bend([s.x1, s.y1]), pc = bend([s.cx, s.cy]);
      taper(p0[0] - 1, p0[1], pc[0] - 1, pc[1], p1[0] - 1, p1[1], s.w0 + 2, s.w1 + 2, BARK[0]);
    }
    for (i = 0; i < trunkSegs.length; i++) {
      s = trunkSegs[i];
      p0 = bend([s.x0, s.y0]); p1 = bend([s.x1, s.y1]); pc = bend([s.cx, s.cy]);
      taper(p0[0], p0[1], pc[0], pc[1], p1[0], p1[1], s.w0, s.w1, BARK[2]);
    }
    // deep bark notches cutting across the trunk curve
    var notches = [[76, 94, 4, 1], [79, 87, 3, 1], [84, 80, 3, 1], [85, 73, 2, 1], [80, 67, 2, 1]];
    for (i = 0; i < notches.length; i++) {
      var nt = notches[i];
      var nb = bend([nt[0], nt[1]]);
      for (var nx = 0; nx < nt[2]; nx++) px(nb[0] + nx - Math.floor(nt[2] / 2), nb[1] + (nx & 1 ? 1 : 0), BARK[0]);
      px(nb[0] - Math.floor(nt[2] / 2) - 1, nb[1], BARK[1]);
    }
    // lit left edge (light from top-left)
    for (i = 0; i < trunkSegs.length; i++) {
      s = trunkSegs[i];
      p0 = bend([s.x0, s.y0]); p1 = bend([s.x1, s.y1]); pc = bend([s.cx, s.cy]);
      taper(p0[0] - Math.round(s.w0 / 2) + 1, p0[1], pc[0] - Math.round(s.w0 / 2) + 1, pc[1],
            p1[0] - Math.round(s.w1 / 2), p1[1], Math.max(0.5, s.w0 * 0.28), Math.max(0.4, s.w1 * 0.3), BARK[3]);
    }
    // bark grain: dense vertical streaks in dark and light bark tones
    var r = rnd32(99);
    for (i = 0; i < 30; i++) {
      var si = Math.floor(r() * trunkSegs.length);
      s = trunkSegs[si];
      var tt = 0.1 + r() * 0.8;
      var u = 1 - tt;
      var bx = u * u * s.x0 + 2 * u * tt * s.cx + tt * tt * s.x1;
      var by = u * u * s.y0 + 2 * u * tt * s.cy + tt * tt * s.y1;
      var bnd = bend([bx, by]);
      var wmid = Math.max(1, (s.w0 + (s.w1 - s.w0) * tt) / 2) - 1;
      var ox = Math.floor((r() - 0.5) * 2 * wmid);
      var dark = r() < 0.6;
      var len = 3 + Math.floor(r() * 4);
      for (var li = 0; li < len; li++) {
        px(bnd[0] + ox, bnd[1] + li, dark ? BARK[1] : BARK[4]);
      }
    }
    // root flare into soil
    taper(78, 95, 74.5, 97, 72, 98, 6, 1, BARK[1]);
    taper(81.5, 95, 85.5, 97, 88, 98, 6, 1, BARK[1]);
    taper(79.5, 95, 79.5, 97, 80, 98, 5, 1, BARK[2]);

    // branches: outline, body, lit edge
    for (i = 0; i < branches.length; i++) {
      var b = branches[i];
      var a0 = bend([b.x0, b.y0]), a1 = bend([b.x1, b.y1]), ac = bend([b.cx, b.cy]);
      taper(a0[0], a0[1] - 1, ac[0], ac[1] - 1, a1[0], a1[1] - 1, b.w0 + 2, b.w1 + 1, BARK[0]);
    }
    for (i = 0; i < branches.length; i++) {
      var b2 = branches[i];
      a0 = bend([b2.x0, b2.y0]); a1 = bend([b2.x1, b2.y1]); ac = bend([b2.cx, b2.cy]);
      taper(a0[0], a0[1], ac[0], ac[1], a1[0], a1[1], b2.w0, b2.w1, BARK[2]);
      taper(a0[0], a0[1] - Math.round(b2.w0 / 2), ac[0], ac[1] - Math.round(b2.w0 / 2),
            a1[0], a1[1] - Math.round(b2.w1 / 2), Math.max(0.5, b2.w0 * 0.3), 0.5, BARK[3]);
    }
  }

  /* ---------- pot ---------- */
  function drawPot() {
    var cx = 80;
    // contact shadow
    ellipseFill(cx, GROUND_Y + 1, 22, 2, GND[3]);
    for (var x = cx - 19; x <= cx + 19; x++) px(x, GROUND_Y, GND[3]);

    // rim (y 97..99): lit top face, mid front, dark underside
    var y, x2;
    for (y = RIM_Y; y < RIM_Y + RIM_H; y++) {
      for (x2 = cx - 24; x2 <= cx + 24; x2++) {
        var c;
        if (x2 <= cx - 23 || x2 >= cx + 23) c = POT[0];                 // rim end caps dark
        else if (y === RIM_Y) c = (x2 < cx) ? POT[4] : POT[3];          // lit top face
        else if (y === RIM_Y + 1) c = (x2 < cx - 4) ? POT[3] : ((x2 > cx + 10) ? POT[1] : POT[2]);
        else c = (x2 > cx + 12) ? POT[0] : POT[1];                      // rim underside shadow
        px(x2, y, c);
      }
    }
    // soil under rim, behind trunk
    ellipseFill(cx, RIM_Y + 0.5, 22, 1, SOIL[1]);
    for (var sx2 = cx - 21; sx2 <= cx + 21; sx2++) px(sx2, RIM_Y, ((sx2 & 1) ? SOIL[2] : SOIL[1]));
    px(cx - 18, RIM_Y, SOIL[2]); px(cx - 12, RIM_Y, SOIL[0]);
    px(cx + 9, RIM_Y, SOIL[0]); px(cx + 16, RIM_Y, SOIL[2]);

    // tapered body y 100..113, shaded top-to-bottom and left-to-right
    for (y = 100; y <= POT_BOTTOM; y++) {
      var tt = (y - 100) / (POT_BOTTOM - 100);
      var hw = Math.round(22 - 8 * tt);
      for (x2 = cx - hw; x2 <= cx + hw; x2++) {
        var lx = x2 - (cx - hw), rx = (cx + hw) - x2;
        var idx;
        if (lx === 0 || rx === 0) idx = 0;                                // silhouette outline
        else if (rx <= 1) idx = 0;                                        // dark right edge
        else if (rx <= 3) idx = 1;                                        // shadow side
        else if (rx <= 5) idx = 2;
        else if (lx <= 2) idx = 4;                                        // bright lit edge
        else if (lx <= 5) idx = 3;                                        // lit side
        else idx = 2;
        idx = Math.max(0, idx - (tt < 0.25 ? 1 : 0) + (tt > 0.7 ? 1 : 0)); // lighter top, darker foot
        idx = Math.min(4, Math.max(0, idx));
        if (y >= POT_BOTTOM - 1 && (lx <= 2 || rx <= 2)) idx = 0;         // foot shadow
        px(x2, y, POT[idx]);
      }
    }
    // foot + contact darkening
    for (x2 = cx - 14; x2 <= cx + 14; x2++) px(x2, POT_BOTTOM + 1, POT[0]);
    for (x2 = cx - 12; x2 <= cx + 12; x2++) px(x2, POT_BOTTOM + 2, GND[3]);

    // glaze speckle + drip highlight
    var r = rnd32(5);
    for (var i = 0; i < 18; i++) {
      var yy = 101 + Math.floor(r() * 10);
      var tt2 = (yy - 100) / (POT_BOTTOM - 100);
      var hw2 = Math.round(22 - 8 * tt2);
      var xx = cx - hw2 + 3 + Math.floor(r() * (hw2 * 2 - 5));
      px(xx, yy, r() < 0.5 ? POT[0] : POT[2]);
    }
    for (y = 100; y <= 111; y++) px(cx - 16 + Math.round((y - 100) * 0.35), y, POT[4]);
    // rim feet nubs
    px(cx - 15, POT_BOTTOM + 2, POT[1]); px(cx + 15, POT_BOTTOM + 2, POT[1]);
  }

  /* ---------- particles ---------- */
  var leaves = [], streaks = [];
  var lr = rnd32(1337);
  function newLeaf(seeded) {
    return {
      x: seeded ? lr() * W : -3 - lr() * 10,
      y: seeded ? lr() * 108 : 30 + lr() * 75,
      vx: 10 + lr() * 16,
      vy: 3 + lr() * 5,
      sz: lr() < 0.55 ? 2 : 3,
      sw: 1.5 + lr() * 2.5,
      ph: lr() * 6.283,
      c1: lr() < 0.5 ? LEAF[3] : LEAF[2],
      c2: lr() < 0.5 ? LEAF[4] : LEAF[1]
    };
  }
  function newStreak(seeded) {
    return {
      x: seeded ? lr() * W : -24 - lr() * 50,
      y: 6 + lr() * 104,
      v: 34 + lr() * 40,
      len: 6 + Math.floor(lr() * 9),
      c: lr() < 0.5 ? "#dfeaf2" : "#c6d8e4"
    };
  }
  for (var i = 0; i < 46; i++) leaves.push(newLeaf(true));
  for (i = 0; i < 24; i++) streaks.push(newStreak(true));

  function updateParticles(dt, t) {
    var w = wind(t);
    var sp = reduced ? 0.25 : 1;
    var i, p;
    for (i = 0; i < leaves.length; i++) {
      p = leaves[i];
      p.x += (p.vx + w * 14) * sp * dt;
      p.y += (p.vy + w * 2 + Math.sin(t * p.sw + p.ph) * 6) * sp * dt;
      if (p.x > W + 4 || p.y > H + 3) leaves[i] = newLeaf(false);
    }
    for (i = 0; i < streaks.length; i++) {
      p = streaks[i];
      p.x += (p.v + w * 30) * sp * dt;
      if (p.x > W + 14) streaks[i] = newStreak(false);
    }
  }

  function drawParticles(t) {
    var i, p;
    var bright = 0.85 + 0.15 * Math.sin(t * 0.9);
    for (i = 0; i < streaks.length; i++) {
      p = streaks[i];
      var x = Math.round(p.x), y = Math.round(p.y);
      for (var sx = 0; sx <= p.len; sx++) {
        var fade = sx <= 1 || sx >= p.len - 1;
        pxw(x + sx, y, (sx & 1) ? "#ffffff" : p.c);
        if (fade) pxw(x + sx, y, "#c6d8e4");
      }
      pxw(x + 2, y - 1, "#ffffff");
      pxw(x + p.len - 2, y + 1, "#eef6fa");
      pxw(x + Math.round(p.len / 2), y + 2, "#dfeaf2");
    }
    ctx.globalAlpha = bright;
    for (i = 0; i < windPxs.length; i += 3) ctx.fillStyle = windPxs[i + 2], ctx.fillRect(windPxs[i], windPxs[i + 1], 1, 1);
    ctx.globalAlpha = 1;
    for (i = 0; i < leaves.length; i++) {
      p = leaves[i];
      var lx = Math.round(p.x), ly = Math.round(p.y);
      var wob = Math.sin(p.x * 0.3 + p.ph) > 0;
      if (p.sz === 2) {
        px(lx, ly, p.c1); px(lx + 1, ly, p.c2);
        px(lx, ly + 1, p.c2); px(lx + 1, ly + 1, p.c1);
      } else {
        px(lx, ly, p.c1); px(lx + 1, ly, p.c2); px(lx + 2, ly, p.c1);
        px(lx + 1, ly + 1, p.c1); px(lx + 2, ly + 1, p.c2);
        px(lx + 2, ly + 2, p.c2); px(lx + 3, ly + (wob ? 1 : 2), p.c1);
      }
    }
  }

  /* ---------- scaling ---------- */
  function fit() {
    var availW = Math.min(window.innerWidth, 720) - 16;
    var availH = window.innerHeight - 64;
    var scale = Math.max(2, Math.floor(Math.min(availW / W, availH / H)));
    canvas.style.width = W * scale + "px";
    canvas.style.height = H * scale + "px";
  }
  window.addEventListener("resize", fit);
  fit();

  /* ---------- main loop ---------- */
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    var t = now / 1000;

    pxs.length = 0;
    windPxs.length = 0;
    drawClouds(t);
    drawPot();
    drawWood(t);
    for (var k = 0; k < pads.length; k++) drawPad(pads[k], t);
    updateParticles(dt, t);
    drawParticles(t);

    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(bg, 0, 0);
    for (var i = 0; i < pxs.length; i += 3) ctx.fillStyle = pxs[i + 2], ctx.fillRect(pxs[i], pxs[i + 1], 1, 1);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
