<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lighthouse at Night</title>
<style>
  html, body { margin: 0; height: 100%; background: #06071a; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="Animated pixel art: a striped lighthouse on a rocky cliff by the sea at night, its beam sweeping across the sky while rain falls and waves break against the rocks under a moon behind drifting clouds."></canvas>
<script src="pixel-kit.js"></script>
<script>
"use strict";
const R = PK.ramps;

// ---- palette (night, moon top-left, ~24 colors) --------------------------------------------
const CLOUD    = ["#141a30", "#232b4c", "#39426c", "#586288"];
const MOON     = { body: "#d8d2b6", lit: "#f2ecd6", mid: "#bfb996", dark: "#a8a28a" };
const ROCK     = R.nightStone;               // cliff + gallery + tower frame
const RED      = R.brickRed;                 // tower stripes, roof accents
const WHITE    = R.whitePaint;               // tower stripes
const WATER    = R.nightWater;               // sea bands
const WARM     = R.warmLight;                // lantern, windows
const FOAM     = ["#cfe8f2", "#ffffff"];
const RAIN     = ["#3a4a7a", "#9cb4e0"];

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

// ---- persistent state (declared before fit; fit rebuilds layers on resize) ------------------
const view = { W: 0, H: 0 };
let skyLayer, terrainLayer, clouds = [], geom = null;

// rain: falls at a slight angle (wind drifting left)
const rain = PK.drift({
  n: 105, seed: 21, area: [0, 0, 1, 1],
  vx: [-30, -22], vy: [95, 125], len: [3, 5],
});

// sea spray thrown up where waves hit the rocks
const spray = { parts: [], timer: 0 };
function spawnSpray(x, y, n) {
  for (let i = 0; i < n; i++) {
    if (spray.parts.length > 90) break;
    spray.parts.push({
      x: x + (Math.random() * 4 - 2),
      y,
      vx: (Math.random() * 2 - 1) * 12,
      vy: -(35 + Math.random() * 55),
      life: 0.4 + Math.random() * 0.45,
    });
  }
}

// ---- builders --------------------------------------------------------------------------------
function buildSky(v) {
  return PK.layer(v.W, v.H, () => {
    PK.gradient(0, 0, v.W, geom.horizon + 2, PK.skies.night);
    // moon with dithered halo and crater shading
    const { mx, my, mr } = geom.moon;
    PK.glow(mx, my, mr + 10, "#5a6494", 0.16);
    PK.glow(mx, my, mr + 5, "#8a90c0", 0.3);
    PK.disc(mx, my, mr, MOON.body);
    PK.disc(mx - Math.round(mr * 0.35), my - Math.round(mr * 0.35), Math.max(1, mr - 2), MOON.lit);
    const rnd = PK.rng(77);
    for (let i = 0; i < 9; i++) { // dithered crater tones
      const a = rnd() * Math.PI * 2, d = Math.sqrt(rnd()) * (mr - 1);
      const cx = mx + Math.round(Math.cos(a) * d), cy = my + Math.round(Math.sin(a) * d);
      PK.disc(cx, cy, rnd() < 0.4 ? 1 : 0, rnd() < 0.5 ? MOON.dark : MOON.mid);
      if (rnd() < 0.4) PK.px(cx + 1, cy + 1, MOON.mid);
    }
    PK.disc(mx + Math.round(mr * 0.4), my + Math.round(mr * 0.45), Math.max(1, Math.round(mr * 0.45)), MOON.dark);
    PK.disc(mx + Math.round(mr * 0.4) - 1, my + Math.round(mr * 0.45) - 1, Math.max(1, Math.round(mr * 0.25)), MOON.mid);
    // faint moon glint on the sea under the moon
    for (let i = 0; i < 9; i++) {
      const x = mx + Math.round((PK.bayer(i, 3) - 0.5) * mr * 2.2);
      const y = geom.horizon + 1 + i;
      if (y < v.H) PK.px(x, y, i % 2 ? WATER[3] : WATER[4]);
    }
  });
}

// One drifting cloud: flattened shaded clumps with dithered edges.
function buildCloud(w, h, seed) {
  return PK.layer(w, h, () => {
    const rnd = PK.rng(seed);
    const blobs = [];
    const n = Math.max(4, Math.round(w / (h * 0.55)));
    for (let i = 0; i < n; i++) {
      const bx = 2 + rnd() * (w - 4);
      const by = h * 0.42 + rnd() * h * 0.35;
      const r = h * 0.3 + rnd() * h * 0.3;
      blobs.push({ x: Math.round(bx), y: Math.round(by), r: Math.max(2, Math.round(r)) });
    }
    for (const b of blobs) PK.disc(b.x + 1, b.y + 1, b.r + 1, CLOUD[0]);
    for (const b of blobs) PK.disc(b.x, b.y, b.r, CLOUD[1]);
    for (const b of blobs) PK.disc(b.x - 1, b.y - 1, Math.max(0, b.r - 1), CLOUD[2]);
    for (const b of blobs) {
      const top = b.y - b.r;
      for (let k = 0; k < b.r + 1; k++) {
        const hx = b.x - 1 + Math.round((rnd() * 2 - 1) * (b.r - 1));
        PK.px(hx, top + (rnd() < 0.6 ? 0 : 1), rnd() < 0.5 ? CLOUD[3] : CLOUD[2]);
      }
    }
    // roughen the silhouette so it never reads as a flat blob
    for (let i = 0; i < w * h * 0.04; i++) {
      const b = blobs[Math.floor(rnd() * blobs.length)];
      const a = rnd() * Math.PI * 2;
      PK.px(b.x + Math.cos(a) * (b.r + 1), b.y + Math.sin(a) * (b.r + 1), CLOUD[1]);
    }
  });
}

function buildTerrain(v) {
  return PK.layer(v.W, v.H, () => {
    const g = geom;

    // main cliff: trapezoid profile with a plateau on top for tower + house
    const cliff = PK.rock(g.cliffX0, g.cliffBaseY, g.cliffW, g.cliffH, ROCK, {
      seed: 42,
      rough: Math.max(2, Math.round(g.cliffH * 0.1)),
      profile: (u) => clamp(Math.min(u / 0.28, (1 - u) / 0.26), 0, 1),
    });
    g.foamZones = [
      [g.cliffX0 - 2, g.cliffX0 + g.cliffW + 2, g.cliffBaseY + 1],
    ];

    // keeper's house on the left of the plateau
    const houseX = g.cliffX0 + Math.round(g.cliffW * 0.24);
    const houseBaseY = cliff.top(houseX);
    drawHouse(houseX, houseBaseY);

    // lighthouse right of center on the plateau
    const tx = g.cliffX0 + Math.round(g.cliffW * 0.56);
    const towerBaseY = cliff.top(tx);
    drawTower(tx, towerBaseY);

    // guard rocks so the base reads as jagged; each gets its own breaking foam
    const rocks = [
      { x: g.cliffX0 - Math.round(v.W * 0.10), w: Math.round(v.W * 0.11), h: Math.round(v.H * 0.06), y: g.cliffBaseY + Math.round(v.H * 0.015), s: 7 },
      { x: g.cliffX0 + g.cliffW + Math.round(v.W * 0.015), w: Math.round(v.W * 0.10), h: Math.round(v.H * 0.07), y: g.cliffBaseY + Math.round(v.H * 0.02), s: 17 },
      { x: Math.round(v.W * 0.72), w: Math.round(v.W * 0.13), h: Math.round(v.H * 0.09), y: Math.round(v.H * 0.87), s: 29 },
    ];
    for (const r of rocks) {
      PK.rock(r.x, r.y, r.w, r.h, ROCK, { seed: r.s, rough: 3 });
      g.foamZones.push([r.x - 1, r.x + r.w + 1, r.y + 1]);
    }

    // ---- the keeper's house: gabled roof, lit windows, chimney --------------------------------
    function drawHouse(cx, baseY) {
      const short = Math.min(v.W, v.H);
      const hw = clamp(Math.round(short * 0.17), 12, 22);
      const x0 = cx - Math.round(hw / 2);
      const wallH = Math.round(hw * 0.48);
      const wallTop = baseY - wallH;
      const roofH = Math.max(4, Math.round(hw * 0.46));
      const WALL = ["#211d2c", "#332c40", "#4a4058", "#665a72"];
      const ROOF = ["#141020", "#201a30", "#312844", "#453a58"];
      // contact shadow on the rock
      for (let x = x0 - 1; x <= x0 + hw; x++) if (x > 0 && x < v.W) PK.px(x, baseY, ROCK[0]);
      // walls, lit left / shaded right — clearly lighter than the rock behind
      PK.rect(x0, wallTop, hw, wallH, WALL[2]);
      PK.rect(x0, wallTop, 2, wallH, WALL[3]);
      PK.rect(x0 + hw - 2, wallTop, 2, wallH, WALL[1]);
      PK.rect(x0, baseY - 1, hw, 1, WALL[0]); // base course
      const rnd = PK.rng(91);
      for (let i = 0; i < hw * wallH * 0.08; i++) {
        PK.px(x0 + Math.floor(rnd() * hw), wallTop + 1 + Math.floor(rnd() * (wallH - 2)), rnd() < 0.6 ? WALL[1] : WALL[3]);
      }
      // chimney rising from the right slope (drawn before the roof so its base is buried)
      const chx = cx + Math.round(hw * 0.18);
      PK.rect(chx, wallTop - Math.round(roofH * 0.6) - 2, 3, 6, WALL[0]);
      PK.rect(chx, wallTop - Math.round(roofH * 0.6) - 2, 3, 1, WALL[2]);
      // gabled roof: lit left slope, dark right slope, outlined silhouette
      for (let k = 0; k <= roofH; k++) {
        const inset = Math.round((k / roofH) * (hw / 2));
        const y = wallTop - roofH + k;
        const xl = x0 - 1 + inset, xr = x0 + hw + 1 - inset;
        if (xr - xl < 1) { PK.px(cx, y, ROOF[2]); continue; }
        const mid = Math.round((xl + xr) / 2);
        if (k === 0) { PK.rect(xl, y, xr - xl + 1, 1, ROOF[0]); continue; } // eave
        PK.rect(xl, y, mid - xl, 1, ROOF[2]);
        PK.rect(mid, y, xr - mid + 1, 1, ROOF[1]);
        PK.px(xl, y, ROOF[3]); // lit edge facing the moon
        PK.px(xr, y, ROOF[0]); // silhouette on the shaded side
      }
      // door on the lit side, two warm windows
      PK.rect(x0 + Math.round(hw * 0.18), baseY - 4, 2, 4, "#120e1e");
      PK.px(x0 + Math.round(hw * 0.18), baseY - 4, WALL[3]);
      const winY = wallTop + Math.round(wallH * 0.35);
      for (const wx of [x0 + Math.round(hw * 0.45), x0 + hw - 4]) {
        PK.rect(wx - 1, winY - 1, 4, 4, WALL[0]);
        PK.rect(wx, winY, 2, 2, WARM[3]);
        PK.px(wx, winY, WARM[4]);
      }
    }

    // ---- the lighthouse: striped tapered tower, gallery, railing, lantern room ------------------
    function drawTower(tx, baseY) {
      const short = Math.min(v.W, v.H);
      const towerH = clamp(Math.round(v.H * 0.26), 26, 86);
      const topY = baseY - towerH;
      const baseHalf = clamp(Math.round(short * 0.055), 5, 11);
      const topHalf = Math.max(3, baseHalf - 2);
      const stripeH = Math.max(3, Math.round(towerH / 8));
      // contact shadow
      for (let x = tx - baseHalf - 1; x <= tx + baseHalf + 1; x++) if (x > 0 && x < v.W) PK.px(x, baseY, ROCK[0]);
      const rnd = PK.rng(55);
      for (let y = topY; y < baseY; y++) {
        const t = (y - topY) / towerH;
        const half = Math.round(topHalf + (baseHalf - topHalf) * t);
        const red = Math.floor((y - topY) / stripeH) % 2 === 0;
        const ramp = red ? RED : WHITE;
        PK.rect(tx - half, y, half * 2 + 1, 1, ramp[2]);
        PK.rect(tx - half, y, Math.max(1, Math.round(half * 0.45)), 1, ramp[3]); // moonlit left
        PK.rect(tx + half - Math.max(1, Math.round(half * 0.35)), y, Math.max(1, Math.round(half * 0.35)), 1, ramp[1]); // shaded right
        PK.px(tx + half, y, ramp[0]);                                             // outline on shadow side
        if (rnd() < 0.18) PK.px(tx - half + Math.floor(rnd() * (half * 2)), y, ramp[1]); // speckle
      }
      // mortar seams on the white stripes for texture
      for (let y = topY + 1; y < baseY - 1; y++) {
        const t = (y - topY) / towerH;
        const half = Math.round(topHalf + (baseHalf - topHalf) * t);
        const red = Math.floor((y - topY) / stripeH) % 2 === 0;
        if (!red && y % 2 === 0) PK.px(tx - half + 1 + Math.floor(rnd() * 2), y, WHITE[1]);
      }
      // door at the base with a lamp above it
      PK.rect(tx - 1, baseY - 5, 3, 5, "#191426");
      PK.px(tx - 1, baseY - 5, WHITE[0]); PK.px(tx + 1, baseY - 5, WHITE[0]); PK.px(tx, baseY - 6, WHITE[0]);
      PK.rect(tx - 2, baseY - 1, 5, 1, ROCK[2]); // step
      PK.px(tx, baseY - 7, WARM[3]);
      // two lit windows up the shaft
      for (const f of [0.32, 0.62]) {
        const wy = topY + Math.round(towerH * f);
        PK.rect(tx - 1, wy - 1, 3, 4, WHITE[0]);
        PK.rect(tx, wy, 1, 2, WARM[3]);
        PK.px(tx, wy, WARM[4]);
      }
      // gallery deck
      const deckW = topHalf + 3;
      PK.rect(tx - deckW, topY - 1, deckW * 2 + 1, 2, ROCK[2]);
      PK.rect(tx - deckW, topY + 1, deckW * 2 + 1, 1, ROCK[0]);
      PK.line(tx - deckW + 1, topY - 1, tx + deckW - 1, topY - 1, ROCK[3]);
      // railing: posts plus two rails
      for (let x = tx - deckW + 1; x <= tx + deckW - 1; x += 2) PK.px(x, topY - 5, ROCK[3]);
      PK.line(tx - deckW + 1, topY - 5, tx + deckW - 1, topY - 5, ROCK[3]);
      PK.line(tx - deckW + 1, topY - 3, tx + deckW - 1, topY - 3, ROCK[2]);
      // lantern room: dark frame, glowing mullioned glass
      const lw = topHalf + 1;
      const lanTop = topY - 12;
      PK.rect(tx - lw, lanTop, lw * 2 + 1, 11, ROCK[1]);
      PK.rect(tx - lw + 1, lanTop + 1, lw * 2 - 1, 9, WARM[3]);
      for (let x = tx - lw + 2; x < tx + lw - 1; x += 2) PK.px(x, lanTop + 1, ROCK[1]); // mullions
      for (let y = lanTop + 3; y < lanTop + 10; y += 3) PK.line(tx - lw + 1, y, tx + lw - 1, y, WARM[2]);
      PK.rect(tx - 1, lanTop + 3, 3, 5, WARM[4]); // hot core of the lamp
      PK.rect(tx - lw, lanTop + 10, lw * 2 + 1, 1, ROCK[0]);
      // dome + finial
      for (let k = 0; k < 4; k++) {
        const half = Math.max(0, lw - 1 - k);
        PK.rect(tx - half, lanTop - 1 - k, half * 2 + 1, 1, k === 0 ? ROCK[0] : ROCK[1]);
      }
      PK.rect(tx, lanTop - 6, 1, 2, ROCK[3]);
      PK.px(tx, lanTop - 7, WHITE[3]);
      g.beamX = tx;
      g.beamY = lanTop + 5;
    }
  });
}

// ---- resize: recompute layout then rebuild all static layers ---------------------------------
PK.fit(document.getElementById("c"), 140, (v) => {
  view.W = v.W; view.H = v.H;
  const short = Math.min(v.W, v.H);
  geom = {
    horizon: Math.round(v.H * 0.52),
    cliffBaseY: Math.round(v.H * 0.66),
    cliffX0: Math.round(v.W * 0.27),
    cliffW: Math.round(v.W * 0.46),
    cliffH: Math.round(v.H * 0.30),
    moon: { mx: Math.round(v.W * 0.22), my: Math.round(v.H * 0.20), mr: clamp(Math.round(short * 0.10), 5, 13) },
    foamZones: [],
  };
  skyLayer = buildSky(v);
  terrainLayer = buildTerrain(v);
  const cw = clamp(Math.round(short * 0.34), 18, 64);
  clouds = [
    { img: buildCloud(cw, Math.max(6, Math.round(cw * 0.22)), 3), y: geom.moon.my - 7, speed: 3.2, phase: cw * 0.4 },
    { img: buildCloud(Math.round(cw * 0.8), Math.max(6, Math.round(cw * 0.17)), 11), y: Math.round(v.H * 0.09), speed: 5.0, phase: cw * 1.7 },
    { img: buildCloud(Math.round(cw * 1.15), Math.max(7, Math.round(cw * 0.26)), 23), y: Math.round(v.H * 0.30), speed: 2.3, phase: cw * 0.1 },
    { img: buildCloud(Math.round(cw * 0.7), Math.max(6, Math.round(cw * 0.18)), 31), y: Math.round(v.H * 0.40), speed: 4.1, phase: cw * 2.6 },
  ];
  rain.setArea([0, -8, v.W, v.H]);
  rain.particles.length && rain.particles.forEach((p) => { if (p.y > v.H) p.y -= v.H + 8; });
});

// ---- frame loop -------------------------------------------------------------------------------
PK.loop((t, dt) => {
  const v = view;
  PK.blit(skyLayer);

  // stars twinkle; keep them above the horizon
  PK.stars(1, 2, v.W - 1, geom.horizon - 3, 34, t, ["#8a90c0", "#ffffff"], 11);

  // clouds drift, one lane crossing the moon
  for (const c of clouds) {
    const w = c.img.width;
    const x = ((c.phase + t * c.speed) % (v.W + w + 24)) - w - 12;
    PK.blit(c.img, x, c.y);
  }

  // twin beams sweeping slowly (full turn ~14 s); terrain and tower, drawn after, occlude them
  const ang = t * 0.45;
  const len = Math.hypot(v.W, v.H);
  const beamCols = ["#2c3157", "#4f4d70", "#9a8f78"];
  PK.beam(geom.beamX, geom.beamY, ang, len, 0.12, beamCols, 0.4);
  PK.beam(geom.beamX, geom.beamY, ang + Math.PI, len, 0.12, beamCols, 0.4);

  // sea with rolling crests
  PK.sea(0, geom.horizon, v.W, v.H, t, WATER, 7);
  PK.rect(0, geom.horizon, v.W, 1, WATER[1]); // dark far trough for depth
  // breaking swells heaving in front of every rock base
  for (const [x0, x1, y] of geom.foamZones) {
    for (let x = Math.max(0, Math.round(x0)); x < Math.min(v.W, x1); x++) {
      const s = Math.sin(x * 0.55 + t * 3.6) * 0.5 + 0.5;
      if (s < 0.35) continue;
      const h = 1 + Math.round(s * 4);
      PK.px(x, y - h - 1, s > 0.8 ? FOAM[0] : WATER[4]);
      if (s > 0.6) PK.px(x + 1, y - Math.max(1, h - 2), WATER[3]);
    }
  }

  // cliff, rocks, house, tower (static)
  PK.blit(terrainLayer);

  // lantern pulse on top of the tower pixels
  const pulse = 0.42 + 0.14 * Math.sin(t * 2.4);
  PK.glow(geom.beamX, geom.beamY, Math.max(6, Math.round(Math.min(v.W, v.H) * 0.09)), "#f2a33a", pulse);
  PK.glow(geom.beamX, geom.beamY, Math.max(4, Math.round(Math.min(v.W, v.H) * 0.045)), "#ffe08a", pulse + 0.25);

  // foam surging against every rock base
  for (const [x0, x1, y] of geom.foamZones) PK.foam(clamp(x0, 0, v.W), clamp(x1, 0, v.W), y, t, FOAM, 9);

  // spray bursts rising off the foam
  spray.timer -= dt;
  if (spray.timer <= 0) {
    spray.timer = 0.22 + Math.random() * 0.3;
    const z = geom.foamZones[Math.floor(Math.random() * geom.foamZones.length)];
    spawnSpray(z[0] + Math.random() * (z[1] - z[0]), z[2] - 1, 4 + Math.floor(Math.random() * 5));
  }
  for (let i = spray.parts.length - 1; i >= 0; i--) {
    const p = spray.parts[i];
    p.life -= dt;
    if (p.life <= 0 || p.y > v.H) { spray.parts.splice(i, 1); continue; }
    p.vy += 120 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    PK.px(p.x, p.y, p.life > 0.25 ? FOAM[1] : FOAM[0]);
  }

  // rain, slanted with the wind
  rain.step(dt);
  rain.streaks(RAIN);

});
</script>
</body>
</html>
