<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lighthouse at Night</title>
<style>
  html, body { margin: 0; height: 100%; background: #06071a; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" aria-label="Pixel-art lighthouse on a rocky cliff at night with a sweeping light beam, rain, waves and drifting clouds" role="img"></canvas>
<script src="pixel-kit.js"></script>
<script>
"use strict";
const R = PK.ramps, S = PK.skies;
PK.light = { x: 1, y: -1 }; // key light from the moon, top-right

let bgSky, bgFore, W = 0, H = 0, horizonY = 0;
let lanternX = 0, lanternY = 0;
let foamTargets = [];

const clouds = [
  { fx: 0.58, fy: 0.13, s: 1.0, spd: 2.4 },
  { fx: 0.15, fy: 0.08, s: 0.8, spd: 1.5 },
  { fx: 0.34, fy: 0.26, s: 0.7, spd: 3.0 },
  { fx: 0.86, fy: 0.31, s: 0.6, spd: 1.9 },
];
const cloudBlobs = [
  { dx: -9, dy: 2, r: 4 }, { dx: -4, dy: 0, r: 5 }, { dx: 1, dy: -1, r: 5 },
  { dx: 6, dy: 0, r: 4 }, { dx: 10, dy: 2, r: 3 }, { dx: -1, dy: 3, r: 4 },
];

const rain = PK.drift({
  n: 70, seed: 21, area: [0, 0, 1, 1],
  vx: [-16, -10], vy: [92, 132], len: [3, 5],
});
const smoke = PK.drift({
  n: 9, seed: 55, area: [0, 0, 1, 1],
  vx: [-9, -4], vy: [-7, -3], len: [1, 1],
});

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function drawMoon(mnX, mnY, mnR) {
  PK.glow(mnX, mnY, Math.round(mnR * 3.0), "#20294e", 0.5);
  PK.glow(mnX, mnY, Math.round(mnR * 1.7), "#3d4a7d", 0.4);
  PK.disc(mnX, mnY, mnR, R.snow[2]);
  PK.disc(mnX + 1, mnY - 1, mnR - 2, R.snow[3]);
  PK.disc(mnX + 2, mnY - 2, Math.max(1, mnR - 4), R.snow[4]);
  const rnd = PK.rng(77);
  for (let i = 0; i < 9; i++) {
    const a = rnd() * Math.PI * 2, d = rnd() * (mnR - 2);
    const cx = mnX + Math.cos(a) * d, cy = mnY + Math.sin(a) * d;
    PK.px(cx, cy, R.snow[1]);
    if (rnd() < 0.6) PK.px(cx + 1, cy, R.snow[1]);
    if (rnd() < 0.35) PK.px(cx, cy + 1, R.snow[1]);
  }
  for (let i = 0; i < mnR * 2; i++) {
    const a = 0.9 + (i / (mnR * 2)) * 1.9;
    PK.px(mnX + Math.cos(a) * (mnR - 1), mnY + Math.sin(a) * (mnR - 1), R.snow[1]);
    if (i % 2) PK.px(mnX + Math.cos(a) * (mnR - 2), mnY + Math.sin(a) * (mnR - 2), R.snow[1]);
  }
}

function drawTower(cx, baseY, th) {
  const wb = 5, wt = 3;
  for (let row = 0; row < th; row++) {
    const y = baseY - row;
    const hw = Math.round(wb + (wt - wb) * (row / th));
    const ramp = Math.floor(row / 4) % 2 === 0 ? R.brickRed : R.whitePaint;
    for (let dx = -hw; dx <= hw; dx++) {
      let c = ramp[2];
      if (dx >= hw - 1) c = ramp[3];
      if (dx === hw) c = ramp[4];
      if (dx <= -hw + 1) c = ramp[1];
      if (dx === -hw) c = ramp[0];
      PK.px(cx + dx, y, c);
    }
  }
  const topY = baseY - th + 1;
  // door and windows
  PK.rect(cx - 1, baseY - 3, 3, 4, R.nightStone[1]);
  PK.rect(cx - 1, baseY - 4, 3, 1, R.nightStone[0]);
  PK.px(cx + 1, topY + Math.round(th * 0.42), R.warmLight[3]);
  PK.px(cx + 1, topY + Math.round(th * 0.42) - 1, R.warmLight[4]);
  PK.px(cx, topY + Math.round(th * 0.7), R.warmLight[2]);
  // gallery deck + railing
  PK.rect(cx - wt - 2, topY - 2, (wt + 2) * 2 + 1, 2, R.nightStone[1]);
  PK.rect(cx - wt - 2, topY - 2, (wt + 2) * 2 + 1, 1, R.nightStone[3]);
  for (let rx = cx - wt - 2; rx <= cx + wt + 2; rx += 2) {
    PK.px(rx, topY - 3, R.nightStone[1]);
    PK.px(rx, topY - 4, R.nightStone[1]);
  }
  PK.line(cx - wt - 2, topY - 5, cx + wt + 2, topY - 5, R.nightStone[1]);
  PK.line(cx - wt - 2, topY - 6, cx + wt + 2, topY - 6, R.nightStone[3]);
  // lantern room
  PK.rect(cx - 3, topY - 7, 7, 1, R.nightStone[0]);
  PK.rect(cx - 3, topY - 12, 7, 5, R.nightStone[0]);
  PK.rect(cx - 2, topY - 11, 5, 3, R.warmLight[2]);
  PK.rect(cx - 1, topY - 11, 3, 3, R.warmLight[3]);
  PK.px(cx, topY - 10, R.warmLight[4]);
  PK.px(cx - 1, topY - 10, R.warmLight[4]);
  // cap + finial
  PK.poly([[cx - 4, topY - 12], [cx + 4, topY - 12], [cx + 2, topY - 15], [cx - 2, topY - 15]], R.nightStone[1]);
  PK.line(cx - 2, topY - 15, cx + 2, topY - 15, R.nightStone[2]);
  PK.px(cx, topY - 16, R.nightStone[2]);
  PK.px(cx, topY - 17, R.warmLight[1]);
  return { x: cx, y: topY - 10 };
}

function drawHouse(cx, baseY) {
  PK.rect(cx - 7, baseY, 15, 1, R.nightStone[0]); // contact shadow
  PK.rect(cx - 6, baseY - 7, 12, 7, R.nightStone[2]);
  PK.rect(cx - 6, baseY - 7, 3, 7, R.nightStone[1]);   // shaded left
  PK.rect(cx + 4, baseY - 7, 2, 7, R.nightStone[3]);   // moonlit right
  const rnd = PK.rng(31);
  for (let i = 0; i < 10; i++) {
    const wx = cx - 5 + Math.floor(rnd() * 10);
    const wy = baseY - 6 + Math.floor(rnd() * 5);
    PK.px(wx, wy, rnd() < 0.6 ? R.nightStone[1] : R.nightStone[3]);
  }
  // roof + chimney
  PK.poly([[cx - 7, baseY - 7], [cx + 7, baseY - 7], [cx + 4, baseY - 11], [cx - 4, baseY - 11]], R.nightStone[1]);
  PK.rect(cx - 4, baseY - 11, 8, 1, R.nightStone[2]);
  PK.line(cx + 4, baseY - 11, cx + 7, baseY - 7, R.nightStone[2]);
  PK.rect(cx - 7, baseY - 7, 15, 1, R.nightStone[0]);
  PK.rect(cx + 3, baseY - 14, 2, 4, R.nightStone[1]);
  PK.px(cx + 4, baseY - 13, R.nightStone[3]);
  PK.px(cx + 3, baseY - 14, R.nightStone[0]);
  PK.px(cx + 4, baseY - 14, R.nightStone[0]);
  // lit windows + door
  for (const wx of [cx - 4, cx + 2]) {
    PK.rect(wx, baseY - 5, 2, 2, R.warmLight[2]);
    PK.px(wx + 1, baseY - 5, R.warmLight[3]);
    PK.px(wx, baseY - 4, R.warmLight[1]);
  }
  PK.rect(cx - 1, baseY - 3, 2, 3, R.nightStone[0]);
}

const view = PK.fit(document.getElementById("c"), 140, (v) => {
  W = v.W; H = v.H;
  horizonY = Math.round(H * 0.56);
  rain.setArea([0, -10, W, H]);

  const mnX = Math.round(W * 0.76), mnY = Math.round(H * 0.2), mnR = clamp(Math.round(Math.min(W, H) * 0.055), 5, 10);

  bgSky = PK.layer(W, H, () => {
    PK.gradient(0, 0, W, horizonY, S.night);
    // distant headland on the horizon
    PK.disc(W * 0.14, horizonY, 8, "#171d40");
    PK.disc(W * 0.22, horizonY, 5, "#171d40");
    PK.disc(W * 0.06, horizonY, 5, "#141a3a");
    drawMoon(mnX, mnY, mnR);
  });

  bgFore = PK.layer(W, H, () => {
    const cliffW = clamp(Math.round(W * 0.5), 60, 150);
    const cx = Math.round(W * 0.5);
    const cliffX = cx - Math.round(cliffW / 2);
    const cliffBaseY = Math.round(H * 0.86);
    const cliffTopY = Math.round(H * 0.5);
    const cliff = PK.rock(cliffX, cliffBaseY, cliffW, cliffBaseY - cliffTopY, R.nightStone, {
      seed: 4, rough: 2, ledges: 5, cracks: Math.round(cliffW / 14),
      profile: (u) => Math.min(1, u / 0.22, (1 - u) / 0.2),
    });
    // two jagged tiers on the cliff face so the stone reads as layered
    PK.rock(cliffX + 5, cliffTopY + 17, Math.round(cliffW * 0.24), 10, R.nightStone, { seed: 5, rough: 2, ledges: 2 });
    PK.rock(cliffX + Math.round(cliffW * 0.7), cliffTopY + 19, Math.round(cliffW * 0.22), 9, R.nightStone, { seed: 6, rough: 2, ledges: 2 });
    const flatTop = (x0, x1) => {
      let m = 0;
      for (let x = x0; x <= x1; x++) m = Math.max(m, cliff.top(x));
      return m;
    };
    const th = clamp(Math.round(H * 0.3), 34, 62);
    const lt = drawTower(cx, flatTop(cx - 5, cx + 5) + 1, th);
    lanternX = lt.x;
    lanternY = lt.y;
    const houseX = cx - Math.round(cliffW * 0.28);
    const houseBase = flatTop(houseX - 7, houseX + 7) + 1;
    drawHouse(houseX, houseBase);
    smoke.setArea([houseX + 1, houseBase - 25, houseX + 10, houseBase - 13]);

    // jagged rocks around the base, each with its own waterline for foam
    const near = R.nightStone;
    const rocks = [
      PK.rock(cliffX - 16, Math.round(H * 0.82), 18, 13, near, { seed: 8 }),
      PK.rock(cliffX - 4, Math.round(H * 0.845), 11, 7, near, { seed: 9, rough: 1 }),
      PK.rock(cliffX + cliffW - 2, Math.round(H * 0.83), 15, 10, near, { seed: 10 }),
      PK.rock(cliffX + cliffW + 11, Math.round(H * 0.8), 10, 8, near, { seed: 12 }),
    ];
    foamTargets = [
      [cliffX, cliffX + cliffW, cliffBaseY, 9],
      ...rocks.map((r, i) => [r.x, r.x + r.w, r.baseY, 10 + i]),
    ];
  });
});

PK.loop((t, dt) => {
  PK.blit(bgSky);
  PK.stars(0, 0, W, horizonY - 4, 55, t);

  for (const c of clouds) {
    const x = (((c.fx * W + t * c.spd) % (W + 60)) + W + 60) % (W + 60) - 30;
    const y = Math.round(c.fy * H);
    for (const b of cloudBlobs) {
      PK.disc(x + b.dx * c.s, y + b.dy * c.s + 1, b.r * c.s + 1, "#10142c");
      PK.disc(x + b.dx * c.s, y + b.dy * c.s, b.r * c.s, "#1c2244");
    }
    for (const b of cloudBlobs) {
      if (b.r * c.s > 2) PK.disc(x + b.dx * c.s + 1, y + b.dy * c.s - 1, b.r * c.s - 2, "#2e3866");
    }
  }

  PK.sea(0, horizonY, W, H, t, R.nightWater);

  // sweeping lantern beam, behind the tower and rocks
  const angle = -Math.PI / 2 + Math.sin(t * 0.32) * 1.22;
  const len = Math.max(W, H) * 0.75;
  const beamCols = [R.warmLight[1], R.warmLight[2], R.warmLight[4]];
  PK.beam(lanternX, lanternY, angle, len, 0.11, beamCols, 0.38);
  PK.beam(lanternX, lanternY, angle, len * 0.45, 0.045, [R.warmLight[3], R.warmLight[4]], 0.5);
  PK.beam(lanternX, lanternY, angle + Math.PI, len * 0.8, 0.11, beamCols, 0.18);

  PK.blit(bgFore);

  for (const [x0, x1, y, seed] of foamTargets) PK.foam(x0, x1, y, t, ["#cfe8f2", "#ffffff"], seed);
  PK.foam(W * 0.06, W * 0.26, Math.round(H * 0.74), t, ["#9cc0e8", "#d8e8f8"], 33);
  PK.foam(W * 0.74, W * 0.94, Math.round(H * 0.68), t, ["#9cc0e8", "#d8e8f8"], 41);

  // lantern glow pulse
  const pulse = 0.35 + 0.15 * Math.sin(t * 2.6);
  PK.glow(lanternX, lanternY, 9, R.warmLight[1], pulse * 0.5);
  PK.glow(lanternX, lanternY, 6, R.warmLight[2], pulse * 0.7);
  PK.glow(lanternX, lanternY, 3, R.warmLight[3], pulse);

  smoke.step(dt);
  smoke.dots(["#242b4c", "#313c62"]);

  rain.step(dt);
  rain.streaks(["#2c3b66", "#9fb4e0"]);
});
</script>
</body>
</html>
