<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lighthouse at Night</title>
<style>
  html, body { margin: 0; height: 100%; background: #070a1a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
// landscape crop for desktop, portrait crop (sky + sea foreground) for phones
const LAND = { W: 160, H: 100, SEA_Y: 66 };
const PORT = { W: 110, H: 150, SEA_Y: 84 };
let W, H, SEA_Y, LANDSCAPE;
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const TAU = Math.PI * 2, HALF_PI = Math.PI / 2;

// ---- palette (cool night, warm lamp, cool moon) -----------------------------
const C = {
  sky:    ["#070a1a", "#0c1128", "#141b3e", "#1e2652"],
  star:   ["#8fa0cc", "#c9d4ee", "#fff6cf"],
  cloud:  ["#141a3a", "#2b345e", "#414a7c", "#5e6796"],
  moonDk: "#8a90a8", moon: "#c3c9d8", moonHi: "#f2f4ea",
  sea:    ["#0a1830", "#122a4e", "#1d4478", "#2f6aa0"],
  foam:   ["#9fc6dd", "#d6eefb"],
  wet:    "#1a2138",
  rockDk: "#171a2b", rock: "#2b2e47", rockLi: "#454a68", rockHi: "#666d8e", crack: "#10121f",
  redDk:  "#7e1f1f", red: "#c2453c", redHi: "#e0776a",
  whiteDk:"#5a627f", white: "#aeb8d2", whiteHi: "#e4eaf5",
  metal:  "#3a4058", metalHi: "#78809c", dark: "#20263c",
  wall:   "#2a2f45", wallLi: "#3d435f", roof: "#1b1f33", roofLi: "#31364f",
  win:    "#f2a33a", winHi: "#ffe08a",
  lamp:   ["#7a3b1e", "#c4612a", "#f2a33a", "#ffe08a"],
  rain:   ["#7d97c0", "#a8c0dd", "#d3e4f5"],
};
const LAMP_RGB = [255, 224, 138], SKY_RGB = [20, 27, 62], SEA_RGB = [18, 42, 78];

// ---- pixel helpers ----------------------------------------------------------
function px(x, y, c) {
  x = Math.round(x); y = Math.round(y);
  if (x < 0 || y < 0 || x >= W || y >= H) return;
  ctx.fillStyle = c; ctx.fillRect(x, y, 1, 1);
}
function disc(cx, cy, r, c) {
  for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++)
    if (x * x + y * y <= r * r + r * 0.8) px(cx + x, cy + y, c);
}
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function mix(a, b, k) {
  const v = a.map((ai, i) => Math.max(0, Math.min(255, Math.round(ai + (b[i] - ai) * k))));
  return "#" + v.map(x => x.toString(16).padStart(2, "0")).join("");
}
function mulberry32(a) {
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ---- scene geometry (landscape; portrait = same cliff, taller crop) ---------
const TB = 80, TT = 38, PAD_Y = 71, BAND = 4;
function towerHW(y) { return Math.round(7 - 3 * (PAD_Y - y) / (PAD_Y - TT)); }
const LAMP_X = TB + 0.5, LAMP_Y = TT + 3.5;   // beam origin: middle of the lantern glass
const HOUSE = { x0: 92, y0: 66, w: 15, h: 5 };
const MOON = { x: 32, y: 14, r: 11 };

// ---- static scene data (seeded, identical every frame) ----------------------
const rock = (() => {
  const r = mulberry32(1337);
  const top = new Array(LAND.W);
  const pts = [[0, 81], [10, 80], [18, 77], [26, 78], [34, 75], [38, 73], [46, 74],
               [52, 72], [58, 71], [66, 71], [70, 74], [74, 71], [91, 71],
               [96, 73], [104, 75], [112, 77], [116, 75], [124, 76], [130, 78], [138, 77], [148, 79], [160, 80]];
  for (let x = 0; x < LAND.W; x++) {
    let i = 0;
    while (i < pts.length - 2 && pts[i + 1][0] <= x) i++;
    const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
    let y = y0 + (y1 - y0) * (x - x0) / (x1 - x0);
    y += Math.floor(r() * 3) - 1;                                  // jagged steps
    top[x] = Math.round(Math.max(66, Math.min(84, y)));
  }
  for (let x = 72; x <= 92; x++) top[x] = PAD_Y;                   // flat pad under tower
  const tex = [];
  for (let x = 0; x < LAND.W; x++) for (let y = top[x]; y < LAND.H; y++)
    if (r() < 0.05) tex.push([x, y, r() < 0.5 ? C.rockDk : C.rockLi]);
  // angular facets: lit faces slope left, shadowed faces slope right
  const facets = [];
  for (let x = 0; x < LAND.W; x++) {
    const d = top[Math.min(LAND.W - 1, x + 2)] - top[x];
    if (d <= -2) facets.push([x, top[x] + 2 + (x % 3), C.rockLi]);
    if (d >= 2) facets.push([x, top[x] + 2 + (x % 3), C.rockDk]);
  }
  const cracks = [];
  for (let i = 0; i < 7; i++) {
    let x = 6 + Math.floor(r() * 148), y = top[x] + 1 + Math.floor(r() * 3);
    const len = 5 + Math.floor(r() * 7);
    for (let s = 0; s < len; s++) { cracks.push([x, y]); x += r() < 0.5 ? 0 : (r() < 0.5 ? 1 : -1); y += 1; }
  }
  return { top, tex, facets, cracks };
})();
// sea-facing rock walls: where the cliff drops to the water, white water surges up
const SURGE = [];
for (let x = 0; x < LAND.W - 1; x++)
  if (rock.top[x] <= LAND.SEA_Y + 5 && rock.top[x + 1] >= rock.top[x] + 2) SURGE.push(x);
const wetRow = x => rock.top[x] + 1 + (x % 2);

const stars = (() => {
  const r = mulberry32(7), out = [];
  for (let i = 0; i < 70; i++) {
    const x = Math.floor(r() * LAND.W), y = Math.floor(r() * 58);
    if (Math.hypot(x - MOON.x, y - MOON.y) < MOON.r + 4) continue;   // keep clear of the moon
    out.push({ x, y, p: r() * TAU, s: 0.8 + r() * 2, c: Math.floor(r() * 3) });
  }
  return out;
})();

const cloudPuffs = (() => {
  const r = mulberry32(21), out = [];
  const rows = [[10, 30], [27, 44], [35, 58]];
  for (const [cy, spd] of rows) {
    let x = Math.floor(r() * -60);
    while (x < LAND.W + 40) {
      const n = 5 + Math.floor(r() * 4);
      for (let i = 0; i < n; i++)
        out.push({
          ox: x + i * (4 + Math.floor(r() * 4)) - 10,
          oy: cy + Math.floor(r() * 7) - 3,
          rx: 7 + Math.floor(r() * 9), ry: 3 + Math.floor(r() * 2),
          spd, ph: r() * TAU,
        });
      x += 80 + Math.floor(r() * 70);
    }
  }
  return out;
})();

// breakers: crests that roll toward the cliff and burst into a cap
const breakers = (() => {
  const r = mulberry32(55), out = [];
  const lanes = [1, 4, 7, 10, 13];
  lanes.forEach((lane, i) => {
    const n = 2 + Math.floor(r() * 2);
    for (let j = 0; j < n; j++)
      out.push({ base: r() * LAND.W, spd: 9 + r() * 6, lane, ph: i * 2.4 + j * 3.1 });
  });
  return out;
})();

const drops = (() => {
  const r = mulberry32(99), out = [];
  for (let i = 0; i < 200; i++)
    out.push({ x: r() * (LAND.W + 30), y: r() * 160, sp: 55 + r() * 35, len: r() < 0.4 ? 4 : 3 });
  return out;
})();

// ---- draw layers ------------------------------------------------------------
function drawSky() {
  for (let y = 0; y < SEA_Y; y++) {
    const f = y / SEA_Y;
    const c = f < 0.12 ? C.sky[0] : f < 0.26 ? C.sky[1] : f < 0.46 ? C.sky[2] : C.sky[3];
    rect(0, y, W, 1, c);
  }
  for (const s of stars) {
    if (Math.sin(t * s.s + s.p) < -0.3) continue;
    px(s.x, s.y, C.star[s.c]);
  }
}

function drawMoon() {
  const { x: cx, y: cy, r } = MOON;
  disc(cx, cy, r, C.moonDk);
  disc(cx - 1, cy - 1, r - 1, C.moon);
  for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++)
    if (x * x + y * y <= (r - 3) * (r - 3) && x + y < -5) px(cx + x, cy + y, C.moonHi);
  disc(cx - 4, cy - 4, 1, C.moonDk);
  disc(cx + 4, cy + 2, 3, C.moonDk);
  disc(cx - 1, cy + 5, 2, C.moonDk);
  disc(cx + 2, cy - 5, 1, C.moonDk);
  px(cx + 4, cy + 2, C.moon); px(cx - 4, cy - 4, C.moon);
}

function puffShape(cx, cy, rx, ry, c) {
  for (let y = -ry; y <= ry; y++) for (let x = -rx; x <= rx; x++)
    if ((x * x) / (rx * rx) + (y * y) / (ry * ry) <= 1.05) px(cx + x, cy + y, c);
}
// shaded puff: dark rim below, mid body, light top toward the moon
function shadePuff(cx, cy, rx, ry) {
  puffShape(cx, cy + 1, rx, ry, C.cloud[0]);
  puffShape(cx, cy, rx, ry, C.cloud[1]);
  puffShape(cx - 1, cy - 1, Math.max(2, rx - 1), Math.max(1, ry - 1), C.cloud[2]);
  puffShape(cx - 2, cy - 1, Math.max(2, rx - 3), Math.max(1, ry - 2), C.cloud[3]);
}

function drawSea() {
  for (let y = SEA_Y; y < H; y++)
    rect(0, y, W, 1, y < SEA_Y + 5 ? C.sea[1] : y < SEA_Y + 14 ? C.sea[2] : C.sea[0]);
  // rolling swell bands: crest line with sparkle caps, trough with dark backs
  for (let i = 0; i < 6; i++) {
    const yy = SEA_Y + 2 + i * 3;
    const ph = t * (0.5 + i * 0.12) + i * 1.7;
    for (let x = 0; x < W; x++) {
      const v = Math.sin(x * 0.21 + ph) + Math.sin(x * 0.09 - ph * 0.6);
      if (v > 1.5) px(x, yy, v > 1.85 ? C.foam[0] : C.sea[3]);
      if (v < -1.5) px(x, yy, C.sea[0]);
    }
  }
  // breakers: crests travel toward the cliff, then burst into a foam cap and respawn
  for (const b of breakers) {
    const period = (W + 12) / b.spd;
    const p = ((t + b.ph) % period) / period;
    const x = Math.round(b.base + p * (W + 12)) % (W + 12) - 6;
    const yy = SEA_Y + b.lane;
    if (p < 0.82) {                                    // rolling crest
      px(x - 2, yy, C.sea[3]); px(x - 1, yy, C.foam[0]); px(x, yy, C.foam[1]);
      px(x + 1, yy + 1, C.sea[3]); px(x - 3, yy + 1, C.sea[3]);
    } else {                                           // bursting cap
      const pop = Math.round((p - 0.82) / 0.18 * 4);
      for (let k = 0; k < 4; k++) {
        px(x + k - 2, yy - (k === 1 || k === 2 ? 1 : 0), C.foam[k < 2 ? 1 : 0]);
        px(x + k - 2, yy + 1, C.foam[0]);
      }
      px(x - 3, yy - pop, C.foam[0]); px(x + 3, yy - pop, C.foam[0]);
    }
  }
  // moon glitter path on the water
  const gx = LANDSCAPE ? MOON.x : W - 22;
  for (let y = SEA_Y + 1; y < H - 2; y++)
    for (let x = gx - 5; x < gx + 6; x++)
      if ((x + y) % 2 === 0 && ((x * 7 + y * 13 + Math.floor(t * 3)) % 11) < 3) px(x, y, C.foam[0]);
}

function drawRocks() {
  for (let x = 0; x < W; x++) {
    for (let y = rock.top[x]; y < H; y++) {
      let c = y < rock.top[x] + 2 ? C.rockLi : C.rock;
      if (y > H - 7) c = C.rockDk;
      px(x, y, c);
    }
    px(x, rock.top[x], C.rockHi);
  }
  for (const [x, y, c] of rock.tex) px(x, y, c);
  for (const [x, y, c] of rock.facets) if (y > rock.top[x] + 1) px(x, y, c);
  for (const [x, y] of rock.cracks) if (y > rock.top[x] + 1) px(x, y, C.crack);
  // wet sheen at the waterline
  for (let x = 0; x < W; x++)
    if (rock.top[x] < SEA_Y + 10 && (x + rock.top[x]) % 2 === 0) px(x, wetRow(x), C.wet);
}

function drawFoam() {
  // dense rolling foam line where water meets rock
  for (let x = 0; x < W; x++) {
    if (rock.top[x] > SEA_Y + 9) continue;
    const wob = Math.round(Math.sin(t * 1.2 + x * 0.35) + Math.sin(t * 2.3 + x));
    const y = rock.top[x] + 1;
    if (wob >= 1) px(x, y - 1, C.foam[wob === 2 ? 1 : 0]);
    if (wob >= 0) px(x, y, C.foam[0]);
  }
  // white water surging up sea-facing rock walls
  for (const x of SURGE) {
    const climb = Math.max(1, Math.round((Math.sin(t * 1.4 + x * 0.45) + 1) * 3));
    for (let k = 0; k < climb; k++)
      px(x, rock.top[x] + 1 + k, k === climb - 1 ? C.foam[1] : C.foam[0]);
  }
  // splash plumes erupting where the swell hits the reef
  for (const sx of [20, 41, 55, 63, 116, 125]) {
    const k = Math.abs(Math.sin(t * 1.5 + sx * 0.7));
    if (k < 0.35) continue;
    const ry = rock.top[sx], h = Math.round(k * 6);
    for (let i = 0; i < 4; i++)
      px(sx + Math.round(Math.sin(t * 5 + i * 2.1 + sx) * 2),
         ry - i * 2 - Math.round(h / 2), C.foam[k > 0.8 && i < 2 ? 1 : 0]);
    px(sx - 3, ry - Math.round(h / 3), C.foam[0]);
    px(sx + 3, ry - Math.round(h / 3) - 1, C.foam[0]);
  }
}

function drawTower() {
  for (let y = TT; y < PAD_Y; y++) {
    const hw = towerHW(y);
    const x0 = TB - hw, x1 = TB + hw - 1, w = x1 - x0 + 1;
    const band = Math.floor((y - TT) / BAND) % 2;
    rect(x0, y, w, 1, band ? C.red : C.white);
    px(x0, y, band ? C.redDk : C.whiteDk);                    // shadow side
    px(x1, y, band ? C.redHi : C.whiteHi);                    // light side
    if ((y * 31 + x0) % 7 === 0) px(x0 + 1, y, band ? C.redDk : C.whiteDk);
  }
  rect(TB - 8, PAD_Y, 16, 1, C.rockDk);                       // contact shadow on the pad
  rect(TB - 1, PAD_Y - 5, 2, 5, C.dark);                      // door
  px(TB - 1, PAD_Y - 6, C.whiteDk); px(TB, PAD_Y - 6, C.whiteDk);
  for (const wy of [59, 51]) {                                // lit windows
    px(TB, wy, C.whiteDk); px(TB + 1, wy, C.whiteDk);
    px(TB, wy + 1, C.win); px(TB + 1, wy + 1, C.winHi);
  }
}

function drawLanternRoom() {
  const hw = towerHW(TT), x0 = TB - hw, x1 = TB + hw - 1;
  rect(TB - 4, TT, 8, 6, C.dark);                       // room frame
  rect(TB - 3, TT + 1, 6, 4, "#131a30");                // glass
  rect(TB - 2, TT + 1, 4, 4, C.lamp[2]);                // optic
  rect(TB - 1, TT + 1, 2, 4, C.lamp[3]);                // hottest core
  for (let d = 0; d < 4; d++) {                         // stepped dome
    const w = 7 - d * 2;
    rect(TB - (w >> 1), TT - 4 + d, w, 1, C.metal);
    px(TB - (w >> 1), TT - 4 + d, C.metalHi);
  }
  px(TB, TT - 8, C.metalHi); px(TB, TT - 9, C.metal);   // finial
  // gallery deck + railing, drawn last so the posts read on top of the glass
  rect(x0 - 2, TT - 1, (x1 - x0) + 5, 1, C.metal);
  px(x0 - 2, TT - 1, C.metalHi); px(x1 + 2, TT - 1, C.metalHi);
  for (let x = x0 - 2; x <= x1 + 2; x += 2) px(x, TT - 2, C.metalHi);   // vertical posts
  for (let x = x0 - 2; x <= x1 + 2; x++) px(x, TT - 3, C.metalHi);      // handrail
}

function drawHouse() {
  const { x0, y0, w, h } = HOUSE;
  for (let y = y0; y < y0 + h; y++) {
    rect(x0, y, w, 1, y % 2 ? C.wall : C.wallLi);
    px(x0, y, C.dark);
  }
  for (let i = 0; i < 7; i++) px(x0 + 2 + i * 2, y0 + 1, C.dark);                 // timber
  for (let i = 0; i < 6; i++) {                                                    // stepped gable roof
    const rw = w - i * 2 + 2;
    rect(x0 - 1 + i, y0 - 1 - i, rw, 1, C.roof);
    rect(x0 - 1 + i, y0 - 1 - i, Math.max(1, rw >> 1), 1, C.roofLi);
  }
  rect(x0 + 11, y0 - 5, 2, 3, C.roof); px(x0 + 11, y0 - 5, C.roofLi);             // chimney
  px(x0 + 3, y0 + 1, C.dark); px(x0 + 4, y0 + 1, C.dark);
  px(x0 + 3, y0 + 2, C.win); px(x0 + 4, y0 + 2, C.winHi);                         // lit window
  rect(x0 + 10, y0 + 1, 2, 4, C.dark);                                             // door
  for (let x = 88; x < 92; x++) px(x, PAD_Y, C.rockLi);                           // path to tower
}

// hard-edged wedge, rasterized per pixel; brightness falls off with distance
// and edges are checkerboard-dithered, so it stays crisp like the rest of the art
function drawBeam() {
  const A = Math.sin(t * 0.4) * 1.2, half = 0.12;
  for (let y = 0; y < SEA_Y + 6; y++) {
    const bg = y < SEA_Y ? SKY_RGB : SEA_RGB;
    for (let x = 0; x < W; x++) {
      const dx = x + 0.5 - LAMP_X, dy = y + 0.5 - LAMP_Y;
      let d = Math.atan2(dy, dx) - (A - HALF_PI - half);
      while (d > Math.PI) d -= TAU;
      while (d < -Math.PI) d += TAU;
      if (d < 0 || d > half * 2) continue;
      const edge = Math.min(d, half * 2 - d) / half;
      if (edge < 0.4 && (x + y) % 2) continue;                    // dithered border
      const dist = Math.hypot(dx, dy);
      const core = 1 - Math.abs(d - half) / half;                 // 1 on the axis
      let k = (0.30 + 0.45 * core) * (1 - dist / 175);
      if (k <= 0.05) continue;
      px(x, y, mix(bg, LAMP_RGB, k));
    }
  }
  // halo around the lantern, dithered in steps so it stays crisp
  for (let dy = -8; dy <= 8; dy++) for (let dx = -8; dx <= 8; dx++) {
    const dist = Math.hypot(dx, dy);
    if (dist > 8) continue;
    const k = 0.55 * (1 - dist / 9);
    if ((dx + dy) % 2 === 0 || dist < 3)
      px(LAMP_X + dx, LAMP_Y + dy, mix(SKY_RGB, LAMP_RGB, k));
  }
}

function drawClouds() {
  for (const p of cloudPuffs) {
    const x = ((p.ox + t * p.spd + Math.sin(t * 0.3 + p.ph) * 2) % (W + 90) + W + 90) % (W + 90) - 45;
    shadePuff(x, p.oy, p.rx, p.ry);
  }
  // persistent banks: one across the lower left, one crossing the moon's middle,
  // one clipping the upper right of the disc -> moon clearly ~half behind cloud
  shadePuff(16 + Math.sin(t * 0.15) * 2, 22, 14, 4);
  shadePuff(31 + Math.sin(t * 0.12 + 2) * 2, 18, 12, 5);
  shadePuff(43 + Math.sin(t * 0.1 + 1) * 2, 11, 7, 3);
}

function drawRain(dt) {
  for (const d of drops) {
    if (!reduced) {
      d.y += d.sp * dt; d.x -= d.sp * 0.3 * dt;
      if (d.y > H) { d.y = -5; d.x = Math.random() * (W + 30); }
      if (d.x < -5) d.x += W + 30;
    }
    for (let k = 0; k < d.len; k++)
      px(d.x + Math.round(k / 2), d.y + k, k === d.len - 1 ? C.rain[2] : C.rain[k]);
  }
}

// ---- scaling: fill the viewport as far as square pixels allow ---------------
function fit() {
  LANDSCAPE = innerWidth >= innerHeight;
  const g = LANDSCAPE ? LAND : PORT;
  W = g.W; H = g.H; SEA_Y = g.SEA_Y;
  let s = Math.min(innerWidth / W, innerHeight / H);
  const cover = Math.max(innerWidth / W, innerHeight / H);
  if (s < 1 && cover >= 2) s = 2;          // prefer filling the phone over a 1px strip
  s = Math.max(1, s);
  canvas.width = W; canvas.height = H;
  canvas.style.width = W * s + "px";
  canvas.style.height = H * s + "px";
  ctx.imageSmoothingEnabled = false;
}
addEventListener("resize", fit);
fit();

let last = 0, t = 0;
function frame(ms) {
  t = reduced ? 12 : ms / 1000;
  const dt = Math.min(0.05, (ms - last) / 1000); last = ms;
  drawSky();
  drawMoon();
  drawBeam();
  drawClouds();
  drawSea();
  drawRocks();
  drawFoam();
  drawHouse();
  drawTower();
  drawLanternRoom();
  drawRain(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
