<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lighthouse at Night</title>
<style>
  html, body { margin: 0; height: 100%; background: #06071a; overflow: hidden; }
  canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="pixel-kit.js"></script>
<script>
"use strict";
const R = PK.ramps, SK = PK.skies;
const NS = R.nightStone;
const CLOUD = ["#0d1126", "#161c38", "#232b50", "#39426c"];
const FOAM = ["#cfe0f0", "#ffffff"];
const canvas = document.getElementById("c");

let bgSky, fg, rain, smoke, chimney = {}, starsArr = [], cloudsArr = [], windows = [];
let mainRock, fgRocks = [], lantern = {}, horizonY, moon = {};

function build(v) {
  const W = v.W, H = v.H;
  horizonY = Math.round(H * 0.56);
  moon = { x: Math.round(W * 0.2), y: Math.round(H * 0.16), r: Math.max(6, Math.round(Math.min(W, H) * 0.055)) };

  // ---- static sky: banded night gradient + moon ----
  bgSky = PK.layer(W, H, () => {
    PK.gradient(0, 0, W, horizonY, SK.night, 3);
    PK.glow(moon.x, moon.y, Math.round(moon.r * 2.8), "#aab6e8", 0.4, 5);
    PK.disc(moon.x, moon.y, moon.r, "#d7def2");
    const cr = (dx, dy, f, c) => PK.disc(moon.x + Math.round(moon.r * dx), moon.y + Math.round(moon.r * dy), Math.max(1, Math.round(moon.r * f)), c);
    cr(-0.35, 0.15, 0.2, "#b4bfe0");
    cr(0.3, 0.35, 0.15, "#b4bfe0");
    cr(0.15, -0.4, 0.13, "#c2cbe8");
    cr(0.45, 0.45, 0.28, "#bcc6e4"); // mare shading, lower-right
  });

  // stars, kept clear of the moon disc
  const rnd = PK.rng(31);
  starsArr = [];
  const nStars = Math.max(24, Math.round(W * H / 620));
  for (let i = 0; i < nStars; i++) {
    const x = 1 + Math.floor(rnd() * (W - 2));
    const y = 2 + Math.floor(rnd() * (horizonY - 6));
    if (Math.hypot(x - moon.x, y - moon.y) < moon.r + 5) continue;
    starsArr.push({ x, y, ph: rnd() * 6.28, sp: 0.8 + rnd() * 2, big: rnd() < 0.18 });
  }

  // clouds: one passes across the moon, the rest fill the upper sky
  const cr2 = PK.rng(57);
  cloudsArr = [];
  const cloudSpecs = [
    { y: moon.y + 2, sp: 2.1 },
    { y: Math.round(H * 0.08), sp: 1.5 },
    { y: Math.round(H * 0.25), sp: 2.7 },
    { y: Math.round(H * 0.36), sp: 1.9 },
  ];
  for (const cs of cloudSpecs) {
    const blobs = [];
    const n = 4 + Math.floor(cr2() * 3);
    let dx = 0;
    for (let i = 0; i < n; i++) {
      const r = 3 + Math.floor(cr2() * 4);
      blobs.push({ dx: dx + Math.round(cr2() * 3), dy: Math.round(cr2() * 3 - 1), r });
      dx += r + 2;
    }
    const w = dx + 6;
    cloudsArr.push({ x: Math.round(cr2() * (W + w * 2)) - w, y: cs.y + Math.round(cr2() * 4 - 2), sp: cs.sp, w, blobs });
  }

  // ---- static foreground: rock island, buildings, foreground boulders ----
  const rockW = Math.round(W * 0.62);
  const rockX = Math.round(W * 0.52 - rockW / 2);
  const rockBaseY = Math.round(H * 0.86);
  const rockH = Math.round(H * 0.42);
  const profile = (u) => Math.max(0.07, Math.min(1,
    0.9 * Math.exp(-Math.pow((u - 0.62) / 0.24, 2)) +
    0.52 * Math.exp(-Math.pow((u - 0.27) / 0.15, 2))));
  // PK.rock paints immediately; compute geometry against a scratch ctx, then repaint into fg.
  const scratch = document.createElement("canvas");
  scratch.width = 1; scratch.height = 1;
  PK.use(scratch.getContext("2d"));
  let rockOpts = { profile: profile, seed: 7, rough: Math.max(2, Math.round(rockH * 0.09)),
    ledges: Math.max(4, Math.round(rockH / 11)), cracks: Math.max(6, Math.round(rockW / 16)) };
  mainRock = PK.rock(rockX, rockBaseY, rockW, rockH, NS, rockOpts);
  const fgRockSpecs = [
    [Math.round(W * 0.01), Math.round(H * 0.95), Math.max(10, Math.round(W * 0.2)), Math.max(6, Math.round(H * 0.09)), 41],
    [Math.round(W * 0.85), Math.round(H * 0.99), Math.max(9, Math.round(W * 0.16)), Math.max(5, Math.round(H * 0.075)), 77],
  ];
  fgRocks = fgRockSpecs.map((s) => PK.rock(s[0], s[1], s[2], s[3], NS, { profile: "mound", seed: s[4] }));
  PK.use(canvas.getContext("2d"));

  const towerX = rockX + Math.round(rockW * 0.62);
  const towerBaseY = mainRock.top(towerX) + 2;
  // keep the 14px lantern head plus margin fully inside the frame
  const towerH = Math.max(24, Math.min(Math.round(H * 0.32), Math.round(W * 0.34), 60, towerBaseY - 20));

  const houseCX = rockX + Math.round(rockW * 0.27);
  const houseW = Math.max(12, Math.min(22, Math.round(towerH * 0.52)));
  const houseH = Math.max(6, Math.round(houseW * 0.55));
  let houseTop = 0;
  for (let gx = houseCX - Math.round(houseW / 2); gx <= houseCX + Math.round(houseW / 2); gx++)
    houseTop = Math.max(houseTop, mainRock.top(gx)); // sit on the lowest point so the rock never hides the walls
  const houseBaseY = houseTop + 1;

  windows = [];
  fg = PK.layer(W, H, () => {
    PK.rock(rockX, rockBaseY, rockW, rockH, NS, rockOpts); // same seed => identical silhouette
    // moon-side highlight clusters and lee-side shadow clusters on the cliff face
    const tr = PK.rng(5);
    for (let gx = rockX; gx < rockX + rockW; gx++) {
      const side = (gx - rockX) / rockW;
      const t = mainRock.top(gx);
      for (let k = 1; k < 7; k++) {
        if (tr() < (side < 0.45 ? 0.12 : 0.08)) PK.px(gx, t + k, side < 0.45 ? NS[3] : NS[0]);
      }
      if (side < 0.5 && tr() < 0.25 && t + 10 < rockBaseY) PK.px(gx, t + 8 + Math.round(tr() * 4), NS[2]);
    }
    for (const s of fgRockSpecs) PK.rock(s[0], s[1], s[2], s[3], NS, { profile: "mound", seed: s[4] });
    // flagstone path from the cottage door to the tower base
    const tp = PK.rng(19);
    for (let gx = houseCX + 2; gx < towerX - 2; gx++) {
      if (tp() < 0.45) continue;
      const y = mainRock.top(gx) + 1;
      PK.px(gx, y, tp() < 0.5 ? NS[2] : NS[3]);
      if (tp() < 0.3) PK.px(gx + 1, y, NS[1]);
    }
    drawTower(towerX, towerBaseY, towerH);
    chimney = drawHouse(houseCX, houseBaseY, houseW, houseH);
  });

  smoke = PK.drift({ n: 7, seed: 13, area: [chimney.x - 2, chimney.y - 13, chimney.x + 5, chimney.y - 1],
    vx: [-3.2, -0.6], vy: [-7, -3], len: [1, 1] });

  lantern = { x: towerX, y: towerBaseY - towerH - 6, flick: 0 };
  rain = PK.drift({ n: Math.max(40, Math.min(90, Math.round(W * H / 260))), seed: 23, area: [0, -6, W, H], vx: [-13, -9], vy: [85, 115], len: [3, 4] });
}

function drawTower(cx, baseY, h) {
  const topHalf = Math.max(3, Math.round(h * 0.085));
  const baseHalf = Math.max(5, Math.round(h * 0.155));
  const ty = baseY - h;
  const stripeH = Math.max(3, Math.round(h / 6.5));
  const rnd = PK.rng(91);
  for (let y = ty; y < baseY; y++) {
    const f = (y - ty) / h;
    const half = Math.round(topHalf + (baseHalf - topHalf) * f);
    const red = Math.floor((y - ty) / stripeH) % 2 === 0;
    const ramp = red ? R.brickRed : R.whitePaint;
    const bandEdge = (y - ty) % stripeH === 0;
    for (let x = -half; x <= half; x++) {
      let c;
      if (x === -half) c = ramp[4];
      else if (x === half) c = ramp[1];
      else if (bandEdge) c = ramp[1];
      else if (x < 0) c = ramp[3];
      else c = ramp[2];
      if (y >= baseY - 1) c = ramp[1];
      if (rnd() < 0.035) c = ramp[Math.max(0, (x < 0 ? 2 : 1))];
      PK.px(cx + x, y, c);
    }
    if (half > 3) PK.px(cx + half - 1, y, ramp[1]); // shade column under the lit edge on the right
  }
  // door
  PK.rect(cx - 1, baseY - 4, 2, 4, "#191320");
  PK.px(cx - 1, baseY - 4, "#2c2338");
  // tower windows (static base; flickered each frame)
  const w1y = baseY - Math.round(h * 0.36), w2y = baseY - Math.round(h * 0.64);
  for (const wy of [w1y, w2y]) {
    PK.px(cx, wy, R.warmLight[2]);
    PK.px(cx, wy - 1, NS[0]);
    windows.push({ x: cx, y: wy, ph: rnd() * 6.28 });
  }
  // gallery deck
  const gw = topHalf * 2 + 6;
  PK.rect(cx - Math.round(gw / 2), ty - 2, gw, 2, NS[2]);
  PK.rect(cx - Math.round(gw / 2), ty - 1, gw, 1, NS[0]);
  PK.line(cx - Math.round(gw / 2), ty - 2, cx + Math.round(gw / 2), ty - 2, NS[3]); // lit deck top
  // lantern room
  const lw = topHalf * 2 - 1;
  for (let y = ty - 9; y <= ty - 3; y++) {
    for (let x = -lw; x <= lw; x++) {
      let c;
      if (x === -lw || x === lw) c = NS[0];
      else if (x % 3 === 0) c = NS[1]; // glazing bars
      else if (Math.abs(x) <= 2) c = R.warmLight[4];
      else c = R.warmLight[3];
      PK.px(cx + x, y, c);
    }
  }
  PK.rect(cx - lw - 1, ty - 10, lw * 2 + 3, 1, NS[1]); // eaves above the glass
  // stepped dome: widest row at the bottom, narrowing upward, then a finial
  const roofRows = [[lw + 4, NS[2]], [lw + 1, NS[2]], [Math.max(1, lw - 3), NS[1]]];
  roofRows.forEach((rr, k) => {
    const rw = Math.max(1, rr[0]);
    const y = ty - 11 - k;
    PK.rect(cx - Math.round(rw / 2), y, rw, 1, rr[1]);
    PK.px(cx - Math.round(rw / 2), y, NS[0]);
    PK.px(cx + Math.round(rw / 2), y, NS[0]);
    PK.px(cx - Math.round(rw / 2) + 1, y, NS[3]); // lit upper-left edge
  });
  PK.px(cx, ty - 14, NS[3]);
  PK.px(cx, ty - 15, NS[4]); // finial tip
  // gallery railing crossing in front of the glass (the iconic silhouette)
  const gx0 = cx - Math.round(gw / 2), gx1 = cx + Math.round(gw / 2);
  PK.line(gx0, ty - 5, gx1, ty - 5, NS[4]);
  PK.line(gx0, ty - 6, gx1, ty - 6, NS[3]);
  for (let x = gx0; x <= gx1; x += 2) { PK.px(x, ty - 4, NS[4]); PK.px(x, ty - 5, NS[4]); }
}

function drawHouse(hxc, baseY, w, h) {
  const x0 = hxc - Math.round(w / 2);
  const top = baseY - h;
  const rnd = PK.rng(63);
  for (let y = top; y < baseY; y++) {
    for (let x = 0; x < w; x++) {
      const edgeL = x === 0, edgeR = x === w - 1;
      const bottom = y >= baseY - 1;
      let c = edgeL ? R.whitePaint[4] : edgeR ? R.whitePaint[1] : x < w / 2 ? R.whitePaint[3] : R.whitePaint[2];
      if (bottom) c = R.whitePaint[0];
      if (!edgeL && !edgeR && !bottom && rnd() < 0.05) c = R.whitePaint[1];
      PK.px(x0 + x, y, c);
    }
  }
  // gabled roof
  const roofH = Math.max(3, Math.round(w * 0.3));
  for (let k = 0; k < roofH; k++) {
    const rw = Math.max(2, w + 2 - 2 * (roofH - 1 - k));
    const y = top - roofH + k;
    const c = k < roofH / 2 ? R.brickRed[3] : R.brickRed[1];
    PK.rect(hxc - Math.round(rw / 2), y, rw, 1, c);
    PK.px(hxc - Math.round(rw / 2), y, R.brickRed[4]);
    PK.px(hxc + Math.round(rw / 2), y, R.brickRed[0]);
  }
  // chimney on the right slope
  const chx = hxc + Math.round(w * 0.28);
  PK.rect(chx, top - roofH + 1, 2, roofH, NS[1]);
  PK.px(chx, top - roofH + 1, NS[3]);
  PK.rect(chx - 1, top - roofH, 4, 1, NS[3]);
  // door with frame and warm step of light + lit windows
  PK.rect(hxc - 2, baseY - 4, 1, 4, NS[1]);
  PK.rect(hxc + 2, baseY - 4, 1, 4, NS[1]);
  PK.rect(hxc - 1, baseY - 3, 2, 3, "#241a22");
  PK.px(hxc - 1, baseY - 3, "#3a2a48");
  PK.px(hxc, baseY - 1, R.warmLight[1]);
  const winY = top + Math.max(2, Math.round(h * 0.35));
  for (const wx of [x0 + 2, x0 + w - 4]) {
    PK.rect(wx, winY, 2, 2, R.warmLight[3]);
    PK.px(wx, winY - 1, NS[0]);
    windows.push({ x: wx, y: winY, block: true, ph: rnd() * 6.28 });
  }
  return { x: chx, y: top - roofH - 1 };
}

const view = PK.fit(canvas, 140, (v) => build(v));

PK.loop((t, dt) => {
  const W = view.W, H = view.H;
  PK.blit(bgSky);

  for (const s of starsArr) {
    const tw = Math.sin(t * s.sp + s.ph);
    PK.px(s.x, s.y, tw > 0.45 ? "#ffffff" : "#7c86b8");
    if (s.big && tw > 0.9) { PK.px(s.x - 1, s.y, "#7c86b8"); PK.px(s.x + 1, s.y, "#7c86b8"); }
  }

  for (const c of cloudsArr) {
    c.x += c.sp * dt;
    if (c.x - 8 > W) c.x = -c.w - 8;
    for (const b of c.blobs) PK.disc(c.x + b.dx, c.y + b.dy + 1, b.r, CLOUD[0]);
    for (const b of c.blobs) PK.disc(c.x + b.dx, c.y + b.dy, b.r, CLOUD[1]);
    for (const b of c.blobs) if (b.r > 1) PK.disc(c.x + b.dx - 1, c.y + b.dy - 1, b.r - 1, CLOUD[2]);
    for (const b of c.blobs) if (b.r > 3) PK.disc(c.x + b.dx - 2, c.y + b.dy - 2, b.r - 3, CLOUD[3]);
  }

  PK.sea(0, horizonY, W, H, t, R.nightWater, 5);
  // broken moon glitter on the water
  for (let y = horizonY + 2; y < H - 1; y += 2) {
    if (Math.sin(t * 1.7 + y * 1.3) < 0.3) continue;
    const x = moon.x + Math.round(Math.sin(t * 1.1 + y * 0.8) * 2);
    PK.px(x, y, (y % 4 === 0) ? R.nightWater[4] : R.nightWater[3]);
  }

  PK.blit(fg);
  smoke.step(dt);
  smoke.dots([CLOUD[2], CLOUD[3]]);
  PK.rockFoam(mainRock, mainRock.baseY - 1, t, FOAM, 17);
  for (const rk of fgRocks) PK.rockFoam(rk, rk.baseY - 1, t, FOAM, 29);

  // sweeping beam from the lantern, slow pass across the sky
  const angle = -Math.PI / 2 + Math.sin(t * 0.55) * 1.22;
  const reach = Math.max(W, H) * 1.05;
  PK.beam(lantern.x, lantern.y, angle, reach, 0.15, ["#4a4666", "#8f7a68", "#e8c078"], 0.2);
  PK.beam(lantern.x, lantern.y, angle, reach, 0.05, ["#b08a58", "#ffe08a", "#fff6cc"], 0.38);
  const fl = 0.4 + 0.07 * Math.sin(t * 7.3) + 0.05 * Math.sin(t * 12.7);
  PK.glow(lantern.x, lantern.y, Math.round(H * 0.045) + 4, "#ffd56a", fl, 4);

  for (const w of windows) {
    const on = Math.sin(t * 3 + w.ph) > -0.7;
    const c = on ? R.warmLight[3] : R.warmLight[2];
    if (w.block) PK.rect(w.x, w.y, 2, 2, c);
    else PK.px(w.x, w.y, c);
  }

  rain.step(dt);
  rain.streaks(["#28356a", "#7f92c8"]);
});
</script>
</body>
</html>
