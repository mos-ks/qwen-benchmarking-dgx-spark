<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>Lighthouse at Night</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070f;
  }
  #scene {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: block;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
  }
  noscript {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    color: #c3cbe6;
    font: 16px/1.4 system-ui, sans-serif;
  }
</style>
</head>
<body>
<canvas id="scene" role="img" aria-label="Pixel-art lighthouse on a rocky cliff at night: a sweeping beam, rain, breaking waves and a moon behind drifting clouds"></canvas>
<noscript>This scene is drawn with JavaScript.</noscript>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });

  // ---------- colour helpers (pixels are packed little-endian ABGR) ----------
  const rgb = (h) => {
    const n = parseInt(h.slice(1), 16);
    return (0xff000000 | ((n & 255) << 16) | (n & 0xff00) | ((n >>> 16) & 255)) >>> 0;
  };
  const mix = (a, b, t) => {
    const ar = a & 255, ag = (a >>> 8) & 255, ab = (a >>> 16) & 255;
    const r = (ar + ((b & 255) - ar) * t) | 0;
    const g = (ag + (((b >>> 8) & 255) - ag) * t) | 0;
    const bl = (ab + (((b >>> 16) & 255) - ab) * t) | 0;
    return (0xff000000 | (bl << 16) | (g << 8) | r) >>> 0;
  };
  const pal = (list) => list.map(rgb);

  const C = {
    sky: pal(['#05070f', '#080b18', '#0b1021', '#0f162b', '#141d36', '#1a2542', '#212e4f', '#2a385c']),
    sea: pal(['#22314f', '#1a2742', '#142036', '#10192c', '#0c1423', '#09101c']),
    horizon: rgb('#3a4d74'),
    wave: pal(['#1c2f4f', '#2a4166', '#3a567d', '#4f6d95']),
    trough: rgb('#060b16'),
    glint: pal(['#6f83a8', '#b8c5da', '#eef2f6']),
    foam: pal(['#eef4f8', '#b6c7d5', '#6a829d']),
    moon: pal(['#fffbea', '#f1ecd2', '#d6cfae', '#aea684']),
    moonGlow: rgb('#8c9bc4'),
    star: pal(['#4d5884', '#a9b4dc', '#f4f6ff']),
    cloudFar: pal(['#0f1528', '#171f38', '#212b49', '#2e3a5c']),
    cloudNear: pal(['#151b31', '#222b4a', '#334067', '#4c5a86']),
    silver: pal(['#7d8ab2', '#c3cbe6']),
    rock: pal(['#07080e', '#151926', '#232a3a', '#343c50', '#4a546c', '#6a7591']),
    grass: pal(['#12221a', '#1d3729', '#2c5139', '#42704d']),
    white: pal(['#ece9df', '#c8c4b8', '#8e8b88', '#56555e']),
    red: pal(['#d24a4b', '#a5313a', '#71222c', '#43161f']),
    stone: pal(['#8a8d98', '#666a77', '#474b57', '#2c2f39']),
    metal: pal(['#64667a', '#3a3a46', '#24242d', '#131318']),
    dome: pal(['#a23f40', '#6c2730', '#43171f']),
    glass: pal(['#fffbe8', '#ffeaa3', '#f5c75e', '#b9822f']),
    wall: pal(['#c2bcae', '#a39e92', '#7b776f', '#4f4c48']),
    roof: pal(['#7c3c38', '#5c2a2c', '#3f1d21', '#26121a']),
    wood: pal(['#6a4630', '#45301f', '#2a1c14']),
    win: pal(['#fff2c0', '#ffd57a', '#e8a64a', '#a86a2c']),
    beam: rgb('#ffe9a8'),
    rain: rgb('#8b9cc4'),
    rainLit: rgb('#fff3c8'),
    smoke: rgb('#5a627c'),
    black: rgb('#000000'),
  };

  // ---------- deterministic noise ----------
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16);
  const bayer = (x, y) => BAYER[((y & 3) << 2) | (x & 3)];

  function hash2(x, y, s = 0) {
    let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1442695041)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  function vnoise(x, s) {
    const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
    return hash2(i, 0, s) * (1 - u) + hash2(i + 1, 0, s) * u;
  }
  function mulberry32(a) {
    return () => {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const angDiff = (a, b) => ((a - b + Math.PI * 3) % (Math.PI * 2)) - Math.PI;

  // ---------- scene state ----------
  let W = 0, H = 0;
  let frame, image, sky, fg, fgIdx, rock, bottom, tip, foam, foamTmp, surge, vignette;
  const L = {};
  let stars = [], clouds = [], drops = [], spray = [], ripples = [], smoke = [];
  let lanternGlass = [], windowGlass = [];
  let crestPrev = [];
  let smokeTimer = 0;
  const B = { c: 1, s: 0, ang: 0, half: 0.1, vlen: 1, power: 1 };

  // ---------- layout ----------
  function computeLayout() {
    const k = clamp((W / H - 0.75) / (1.6 - 0.75), 0, 1);   // 0 = portrait, 1 = landscape
    L.horizon = Math.round(H * lerp(0.64, 0.6, k));
    L.plateau = L.horizon - Math.round(lerp(12, 9, k));
    const cliffH = clamp(Math.round(H * 0.3), 34, 60);
    L.base = Math.min(H - Math.round(H * lerp(0.12, 0.14, k)), L.plateau + cliffH);
    L.tx = Math.round(W * lerp(0.5, 0.6, k)) - 12;
    L.moonR = 9;
    L.moonX = Math.round(W * lerp(0.25, 0.22, k));
    L.moonY = Math.round(H * lerp(0.14, 0.2, k));
  }

  // ---------- sky + sea base + moon (static) ----------
  function buildSky() {
    sky = new Uint32Array(W * H);
    const hz = L.horizon;
    for (let y = 0; y < H; y++) {
      const list = y < hz ? C.sky : C.sea;
      const f = y < hz
        ? Math.pow(y / hz, 1.25) * (list.length - 1)
        : Math.pow((y - hz) / (H - hz), 0.65) * (list.length - 1);
      const i = Math.floor(f), fr = f - i;
      for (let x = 0; x < W; x++) {
        sky[y * W + x] = list[Math.min(list.length - 1, fr > bayer(x, y) ? i + 1 : i)];
      }
    }
    for (let x = 0; x < W; x++) {
      sky[hz * W + x] = C.horizon;
      sky[(hz - 1) * W + x] = mix(sky[(hz - 1) * W + x], C.horizon, bayer(x, 0) < 0.5 ? 0.45 : 0.2);
    }
    drawMoon();
  }

  function drawMoon() {
    const { moonX: mx, moonY: my, moonR: R } = L;
    const craters = [[-3, -2, 1.9], [3, 2, 1.5], [-1, 4, 1.2], [4, -4, 1.0], [-5, 2, 1.0], [1, -5, 0.8]];
    for (let dy = -R - 14; dy <= R + 14; dy++) {
      for (let dx = -R - 14; dx <= R + 14; dx++) {
        const x = mx + dx, y = my + dy;
        if (x < 0 || y < 0 || x >= W || y >= L.horizon) continue;
        const d = Math.hypot(dx + 0.5, dy + 0.5);
        const i = y * W + x;
        if (d <= R) {
          const shade = ((dx + 0.5) * 0.6 + (dy + 0.5) * 0.5) / R;
          let col = C.moon[1];
          if (shade < -0.35) col = C.moon[0];
          if (shade > 0.42 + (bayer(x, y) - 0.5) * 0.3) col = C.moon[2];
          if (d > R - 1.1) col = shade > 0 ? C.moon[3] : C.moon[2];
          for (const [cx, cy, cr] of craters) {
            const cd = Math.hypot(dx + 0.5 - cx, dy + 0.5 - cy);
            if (cd < cr) col = cd < cr * 0.5 ? C.moon[3] : C.moon[2];
          }
          sky[i] = col;
        } else {
          const g = d - R;
          const a = g < 4 ? 0.34 * (1 - g / 4.6) : 0.11 * (1 - (g - 4) / 10);
          if (a <= 0) continue;
          const lv = Math.floor(a * 8 + bayer(x, y)) / 8;
          if (lv > 0) sky[i] = mix(sky[i], C.moonGlow, lv);
        }
      }
    }
  }

  function buildStars(rng) {
    stars = [];
    const n = Math.round((W * L.horizon) / 190);
    for (let k = 0; k < n; k++) {
      const x = Math.floor(rng() * W), y = Math.floor(rng() * (L.horizon - 14));
      if (Math.hypot(x - L.moonX, y - L.moonY) < L.moonR + 14) continue;
      const r = rng();
      stars.push({ x, y, kind: r < 0.06 ? 2 : r < 0.35 ? 1 : 0, ph: rng() * 6.28, sp: 0.6 + rng() * 2.2 });
    }
  }

  // ---------- clouds ----------
  function makeCloud(rng, w, h, palette, x, y, speed) {
    const tone = new Uint8Array(w * h);
    const puffs = [];
    const n = 4 + Math.floor(rng() * 3) + Math.floor(w / 14);
    for (let k = 0; k < n; k++) {
      const r = h * (0.3 + rng() * 0.38);
      const cx = r + rng() * Math.max(1, w - 2 * r);
      const cy = h - r * 0.7 - rng() * h * 0.12;
      puffs.push([cx, cy, r]);
    }
    for (let py = 0; py < h; py++) {
      for (let px = 0; px < w; px++) {
        let best = 0, nx = 0, ny = 0;
        for (const [cx, cy, r] of puffs) {
          const dx = (px + 0.5 - cx) / r, dy = ((py + 0.5 - cy) * 1.25) / r;
          const depth = 1 - (dx * dx + dy * dy);
          if (depth > best) { best = depth; nx = dx; ny = dy; }
        }
        if (best <= 0) continue;
        let v = 0.5 - 0.5 * ny - 0.22 * nx;
        if (py >= h - 2) v -= 0.3;
        const t = clamp(Math.floor(v * 3.6 + bayer(px, py) - 0.3), 0, 3);
        tone[py * w + px] = t + 1;
      }
    }
    const edge = new Uint8Array(w * h);
    for (let py = 0; py < h; py++) {
      for (let px = 0; px < w; px++) {
        const i = py * w + px;
        if (!tone[i]) continue;
        const out = (qx, qy) => qx < 0 || qy < 0 || qx >= w || qy >= h || !tone[qy * w + qx];
        if (out(px, py - 1)) { edge[i] = 2; tone[i] = Math.max(tone[i], 3); }
        else if (out(px - 1, py) || out(px + 1, py) || out(px, py + 1)) edge[i] = 1;
      }
    }
    return { w, h, tone, edge, pal: palette, x, y, speed, drift: null };
  }

  function buildClouds(rng) {
    clouds = [];
    const hz = L.horizon, my = L.moonY, R = L.moonR;
    const bandTop = my - R - 3, bandBottom = my + R + 3;
    const pickY = (h) => {
      const above = bandTop - h;            // fully above the moon
      const below0 = bandBottom, below1 = Math.round(hz * 0.62) - h;
      if (above >= -3 && (rng() < 0.45 || below1 < below0)) return Math.round(-3 + rng() * (above + 3));
      return Math.round(below0 + rng() * Math.max(0, below1 - below0));
    };
    const skyArea = W * hz;
    const nFar = Math.ceil(skyArea / 5000), nNear = Math.ceil(skyArea / 7500);
    for (let k = 0; k < nFar; k++) {
      const w = 24 + Math.floor(rng() * 34), h = 7 + Math.floor(rng() * 5);
      clouds.push(makeCloud(rng, w, h, C.cloudFar, rng() * (W + 40) - 20, pickY(h), 1.1 + rng() * 1.3));
    }
    for (let k = 0; k < nNear; k++) {
      const w = 40 + Math.floor(rng() * 46), h = 11 + Math.floor(rng() * 7);
      clouds.push(makeCloud(rng, w, h, C.cloudNear, rng() * (W + 60) - 30, pickY(h), 2.6 + rng() * 2.4));
    }
    // A slow bank that always hides the lower part of the moon, plus a thin wisp across it.
    const bank = makeCloud(mulberry32(7), 40, 13, C.cloudNear, 0, 0, 0);
    let topRow = 0;
    while (topRow < bank.h && !bank.tone.subarray(topRow * bank.w, (topRow + 1) * bank.w).some(Boolean)) topRow++;
    bank.drift = { x: L.moonX - 26, y: L.moonY + 1 - topRow, amp: 7, rate: 0.09, ph: 0 };
    const wisp = makeCloud(mulberry32(11), 30, 5, C.cloudFar, 0, 0, 0);
    wisp.drift = { x: L.moonX - 8, y: L.moonY - 6, amp: 12, rate: 0.05, ph: 2.1 };
    clouds.push(wisp, bank);
  }

  function updateClouds(dt, t) {
    for (const c of clouds) {
      if (c.drift) {
        c.x = c.drift.x + Math.sin(t * c.drift.rate + c.drift.ph) * c.drift.amp;
        c.y = c.drift.y;
        continue;
      }
      c.x -= c.speed * dt;
      if (c.x + c.w < -4) c.x = W + 4 + Math.random() * 30;
    }
  }

  function drawCloud(c) {
    const ox = Math.round(c.x), oy = Math.round(c.y);
    const { moonX: mx, moonY: my, moonR: R } = L;
    const rim2 = (R + 7) * (R + 7), disc2 = (R + 1) * (R + 1);
    for (let py = 0; py < c.h; py++) {
      const y = oy + py;
      if (y < 0 || y >= L.horizon) continue;
      for (let px = 0; px < c.w; px++) {
        const t = c.tone[py * c.w + px];
        if (!t) continue;
        const x = ox + px;
        if (x < 0 || x >= W) continue;
        let col = c.pal[t - 1];
        const e = c.edge[py * c.w + px];
        const d2 = (x - mx) * (x - mx) + (y - my) * (y - my);
        if (d2 < rim2) {
          if (e && d2 < disc2) col = C.silver[1];
          else if (e === 2) col = C.silver[0];
          else if (d2 < disc2 && t >= 3) col = C.silver[0];
        }
        frame[y * W + x] = col;
      }
    }
  }

  function drawStars(t) {
    for (const s of stars) {
      const b = 0.5 + 0.5 * Math.sin(t * s.sp + s.ph);
      const i = s.y * W + s.x;
      if (s.kind === 2) {
        frame[i] = C.star[2];
        if (b > 0.45) {
          if (s.x > 0) frame[i - 1] = C.star[0];
          if (s.x < W - 1) frame[i + 1] = C.star[0];
          if (s.y > 0) frame[i - W] = C.star[0];
          frame[i + W] = C.star[0];
        }
      } else if (s.kind === 1) {
        frame[i] = b > 0.3 ? C.star[1] : C.star[0];
      } else if (b > 0.25) {
        frame[i] = C.star[0];
      }
    }
  }

  // ---------- rocks, lighthouse, keeper's house (static foreground) ----------
  function buildForeground() {
    fg = new Uint32Array(W * H);
    rock = new Uint8Array(W * H);
    bottom = new Int16Array(W).fill(-1);
    lanternGlass = [];
    windowGlass = [];
    const rng = mulberry32(90210);
    const { tx, plateau: pl, base } = L;
    const plL = tx - 18, plR = tx + 42;
    const cliffH = base - pl;
    const sL = Math.round(cliffH * 0.24 + 9), sR = Math.round(cliffH * 0.2 + 7);
    const set = (x, y, col) => { if (x >= 0 && y >= 0 && x < W && y < H) fg[y * W + x] = col; };
    const fillCol = (x, y0, y1) => {
      if (x < 0 || x >= W) return;
      for (let y = Math.max(0, y0); y <= y1 && y < H; y++) rock[y * W + x] = 1;
    };

    // headland: flat plateau, jagged slopes falling to the sea
    for (let x = plL - sL; x <= plR + sR; x++) {
      if (x < 0 || x >= W) continue;
      let y;
      if (x >= plL && x <= plR) {
        y = pl + (hash2(x, 3) < 0.1 ? 1 : 0);
      } else {
        const u = x < plL ? (plL - x) / sL : (x - plR) / sR;
        const ramp = Math.min(1, u * 4);
        const jag = (vnoise(x * 0.3, 5) - 0.5) * 15 * ramp + (hash2(x, 9) - 0.5) * 4 * ramp;
        const ledge = Math.floor(x / 5);
        y = pl + cliffH * Math.pow(u, 0.8) + jag;
        y = Math.round(y / 5) * 5 + Math.floor(hash2(ledge, 4) * 4) - 1;   // stepped ledges
        y = Math.max(pl + (u < 0.08 ? 0 : 1), y);
      }
      if (y >= base - 1) continue;
      fillCol(x, y, base + (hash2(x, 13) < 0.5 ? 0 : 1));
    }

    const spire = (cx, by, w, h, seed) => {
      const half = w / 2;
      for (let x = Math.floor(cx - half); x <= Math.ceil(cx + half); x++) {
        const u = Math.abs(x + 0.5 - cx) / half;
        if (u > 1) continue;
        const jag = (hash2(x, seed) - 0.5) * 3;
        const top = Math.round(by - h * (1 - Math.pow(u, 1.6)) + jag * u);
        fillCol(x, Math.min(top, by - 1), by);
      }
    };
    const footL = plL - sL + 6, footR = plR + sR - 6;
    for (let k = 0; k < 7; k++) {
      const cx = footL + rng() * (footR - footL);
      spire(cx, base + 2 + Math.floor(rng() * 3), 6 + rng() * 8, 4 + rng() * 6, 40 + k);
    }
    const stackL = plL - sL - 14;
    if (stackL > 7) {
      spire(stackL, base + 6, 12, 24, 71);
      spire(stackL + 7, base + 6, 8, 11, 72);
      spire(stackL - 6, base + 7, 5, 4, 73);
    }
    const stackR = plR + sR + 11;
    if (stackR < W - 6) {
      spire(stackR, base + 4, 9, 14, 74);
      spire(stackR + 5, base + 4, 5, 5, 75);
    }

    for (let x = 0; x < W; x++) {
      for (let y = H - 1; y >= 0; y--) if (rock[y * W + x]) { bottom[x] = y; break; }
    }
    tip = new Uint8Array(W);
    for (let x = 0; x < W; x++) {
      if (bottom[x] < 0) continue;
      let peak = true;
      for (let d = -3; d <= 3 && peak; d++) {
        const n = x + d;
        if (d === 0 || n < 0 || n >= W) continue;
        if (bottom[n] > bottom[x] || (d > 0 && bottom[n] === bottom[x])) peak = false;
      }
      if (peak && bottom[x] >= base + 2) tip[x] = 1;
    }

    // faceted rock shading: anisotropic Voronoi slabs lit from the moon (upper left)
    let minX = W, maxX = -1, minY = H, maxY = -1, area = 0;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        if (!rock[y * W + x]) continue;
        area++;
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
    const seeds = [];
    const nSeeds = Math.max(14, Math.round(area / 55));
    for (let k = 0; k < nSeeds; k++) {
      const sx = minX + rng() * (maxX - minX + 1), sy = minY + rng() * (maxY - minY + 1);
      let tone = 1 + Math.floor(rng() * 3);
      if (sx < tx - 4 && rng() < 0.45) tone++;      // moon-facing side
      if (sx > tx + 28) tone--;                      // side turned away from the moon
      if (sy > base - 8 && rng() < 0.5) tone--;
      seeds.push([sx, sy, clamp(tone, 1, 4)]);
    }
    const label = new Int16Array(W * H).fill(-1);
    for (let y = minY; y <= maxY; y++) {
      for (let x = minX; x <= maxX; x++) {
        const i = y * W + x;
        if (!rock[i]) continue;
        let best = 1e9, bi = 0;
        for (let k = 0; k < seeds.length; k++) {
          const dx = (x - seeds[k][0]) * 0.7, dy = (y - seeds[k][1]) * 1.1;
          const d = dx * dx + dy * dy;
          if (d < best) { best = d; bi = k; }
        }
        label[i] = bi;
      }
    }
    for (let y = minY; y <= maxY; y++) {
      for (let x = minX; x <= maxX; x++) {
        const i = y * W + x;
        if (!rock[i]) continue;
        const l = label[i];
        let t = seeds[l][2];
        const up = y > 0 && rock[i - W], left = x > 0 && rock[i - 1];
        const right = x < W - 1 && rock[i + 1], down = y < H - 1 && rock[i + W];
        if (!up) t = x < tx + 20 ? 5 : 3;
        else if (!left) t = Math.min(5, t + 2);
        else if (label[i - W] !== l) t = Math.min(5, t + 1);
        else if (down && label[i + W] !== l) t = hash2(x, y, 25) < 0.85 ? 0 : t - 1;
        else if (right && label[i + 1] !== l) t = Math.max(0, t - 1);
        else if (!right) t = Math.max(0, t - 2);
        if (t > 0 && t < 5) {
          const across = (x - (plL - sL)) / (sL + sR + plR - plL);
          if (across > 0.72 && t > 1) t--;
          else if (across < 0.3 && t < 4 && up && left) t++;
          if (y > base - (base - pl) * 0.3 && t > 1 && hash2(x, y, 27) < 0.6) t--;
        }
        if (t > 0 && t < 4 && hash2(x, y, 21) < 0.06) t--;
        if (!up && y > pl + 3 && y < base - 6 && hash2(x, 29) < 0.4) { fg[i] = C.grass[x < tx ? 2 : 1]; continue; }
        if (y >= bottom[x] - 2 && t > 0) t = hash2(x, y, 23) < 0.12 ? 4 : Math.max(1, t - 1);
        fg[i] = C.rock[t];
      }
    }

    // grass cap on the plateau
    for (let x = plL - 8; x <= plR + 6; x++) {
      if (x < 0 || x >= W) continue;
      let y = -1;
      for (let yy = pl - 1; yy < pl + 10 && yy < H; yy++) if (rock[yy * W + x]) { y = yy; break; }
      if (y < 0 || y > pl + 5) continue;
      set(x, y, x < tx + 6 ? C.grass[3] : C.grass[2]);
      set(x, y + 1, C.grass[1]);
      if (hash2(x, 17) < 0.55) set(x, y + 2, C.grass[0]);
      if (hash2(x, 19) < 0.35) set(x, y - 1, C.grass[2]);
    }

    drawHouse(set);
    drawTower(set);

    const idx = [];
    for (let i = 0; i < W * H; i++) if (fg[i]) idx.push(i);
    fgIdx = Int32Array.from(idx);
  }

  function cylTone(u, b) {
    const v = u + (b - 0.5) * 0.14;
    return v < 0.2 ? 0 : v < 0.56 ? 1 : v < 0.83 ? 2 : 3;
  }

  function drawTower(set) {
    const { tx, plateau: pl } = L;
    const TH = 45, BAND = 9;
    // plinth
    for (let y = pl - 2; y <= pl; y++) {
      for (let x = tx - 9; x <= tx + 8; x++) {
        let t = cylTone((x - (tx - 9) + 0.5) / 18, bayer(x, y));
        if (y === pl - 2) t = Math.max(0, t - 1);
        if (y === pl && hash2(x, y, 5) < 0.3) t = Math.min(3, t + 1);
        set(x, y, C.stone[t]);
      }
    }
    // striped, tapering tower
    for (let r = 0; r < TH; r++) {
      const y = pl - 3 - r;
      const hw = Math.round(7 - (2 * r) / (TH - 1));
      for (let x = tx - hw; x < tx + hw; x++) {
        const u = (x - (tx - hw) + 0.5) / (2 * hw);
        const bow = u < 0.16 || u > 0.84 ? 1 : 0;      // stripes curve around the cylinder
        const band = Math.floor((r + bow) / BAND) % 2;
        set(x, y, (band ? C.white : C.red)[cylTone(u, bayer(x, y))]);
      }
    }
    // door with stone step
    for (let y = pl - 8; y <= pl - 3; y++) {
      for (let x = tx - 2; x <= tx + 1; x++) {
        if (y === pl - 8 && (x === tx - 2 || x === tx + 1)) continue;
        set(x, y, x === tx - 2 ? C.wood[1] : C.wood[2]);
      }
    }
    set(tx + 1, pl - 5, C.glass[2]);
    for (let x = tx - 3; x <= tx + 2; x++) set(x, pl - 2, C.stone[x < tx ? 0 : 1]);
    // two small windows, the lower one lit from inside
    const win = (y0, lit) => {
      for (let y = y0; y < y0 + 3; y++) {
        for (let x = tx - 2; x <= tx - 1; x++) {
          const col = lit ? (y === y0 ? C.win[2] : C.win[1]) : (y === y0 ? C.metal[3] : C.metal[2]);
          set(x, y, col);
          if (lit) windowGlass.push([x, y, y === y0 ? 2 : 1]);
        }
      }
      set(tx - 2, y0 + 3, C.white[0]);
      set(tx - 1, y0 + 3, C.white[1]);
    };
    win(pl - 3 - 14, true);
    win(pl - 3 - 32, false);

    const ytop = pl - 2 - TH;          // first row above the tower body
    L.lx = tx;
    L.ly = ytop - 6;
    // lantern room
    for (let y = ytop - 10; y <= ytop - 3; y++) {
      for (let x = tx - 4; x <= tx + 3; x++) {
        let col;
        if (y === ytop - 10 || y === ytop - 3) col = C.metal[x < tx - 1 ? 1 : 2];
        else if (x === tx - 4 || x === tx + 3) col = C.metal[2];
        else if (x === tx + 1) col = C.glass[3];
        else {
          const core = (x === tx - 1 || x === tx) && y >= ytop - 8 && y <= ytop - 5;
          const outer = y === ytop - 9 || y === ytop - 4 || x === tx - 3 || x === tx + 2;
          const tone = core ? 0 : outer ? 2 : 1;
          col = C.glass[tone];
          lanternGlass.push([x, y, tone]);
        }
        set(x, y, col);
      }
    }
    // gallery deck, brackets and railing
    for (let x = tx - 8; x <= tx + 7; x++) {
      set(x, ytop - 1, C.metal[2]);
      set(x, ytop - 2, x < tx - 2 ? C.metal[0] : C.metal[1]);
    }
    for (const bx of [tx - 6, tx - 3, tx + 2, tx + 5]) set(bx, ytop, C.metal[3]);
    for (let x = tx - 8; x <= tx + 7; x++) {
      set(x, ytop - 5, x < tx - 3 ? C.metal[0] : C.metal[2]);
      if ((x - tx) % 2 === 0 || x === tx + 7) {
        set(x, ytop - 3, C.metal[3]);
        set(x, ytop - 4, C.metal[3]);
      }
    }
    // domed roof, ventilator ball and lightning rod
    for (let k = 0; k < 5; k++) {
      const y = ytop - 11 - k, hw = 6 - k;
      for (let x = tx - hw; x < tx + hw; x++) {
        const u = (x - (tx - hw) + 0.5) / (2 * hw);
        let col;
        if (k === 0) col = C.metal[u < 0.4 ? 1 : 3];
        else col = C.dome[u < 0.3 ? 0 : u < 0.68 ? 1 : 2];
        set(x, y, col);
      }
    }
    set(tx - 1, ytop - 16, C.metal[0]); set(tx, ytop - 16, C.metal[2]);
    set(tx - 1, ytop - 17, C.metal[1]); set(tx, ytop - 17, C.metal[3]);
    set(tx - 1, ytop - 18, C.metal[0]); set(tx - 1, ytop - 19, C.metal[0]);
  }

  function drawHouse(set) {
    const { tx, plateau: pl } = L;
    const hx0 = tx + 11, HW = 25, hx1 = hx0 + HW - 1;
    // walls
    for (let y = pl - 9; y <= pl; y++) {
      for (let x = hx0; x <= hx1; x++) {
        let t = x - hx0 < 2 ? 0 : x > hx1 - 3 ? 2 : 1;
        if (y === pl - 9) t = 3;
        else if (y === pl) t = 2;
        else if (hash2(x, y, 41) < 0.09) t = Math.min(3, t + 1);
        set(x, y, C.wall[t]);
      }
    }
    // door
    for (let y = pl - 6; y <= pl - 1; y++) {
      for (let x = hx0 + 3; x <= hx0 + 6; x++) {
        if (y === pl - 6 && (x === hx0 + 3 || x === hx0 + 6)) continue;
        set(x, y, x === hx0 + 3 ? C.wood[0] : x === hx0 + 5 ? C.wood[2] : C.wood[1]);
      }
    }
    set(hx0 + 6, pl - 3, C.glass[2]);
    // warm window with glow on the wall around it
    const wx0 = hx0 + 12, wx1 = hx0 + 18, wy0 = pl - 7, wy1 = pl - 2;
    for (let y = wy0 - 2; y <= wy1 + 1; y++) {
      for (let x = wx0 - 2; x <= wx1 + 2; x++) {
        if (y < pl - 8 || y > pl - 1) continue;
        const i = y * W + x;
        if (fg[i] && (x < wx0 || x > wx1 || y < wy0 || y > wy1)) fg[i] = mix(fg[i], C.win[2], bayer(x, y) < 0.5 ? 0.35 : 0.18);
      }
    }
    for (let y = wy0; y <= wy1; y++) {
      for (let x = wx0; x <= wx1; x++) {
        if (y === wy1) { set(x, y, C.wall[0]); continue; }
        if (x === wx0 || x === wx1 || y === wy0) { set(x, y, C.wood[2]); continue; }
        if (x === wx0 + 3 || y === wy0 + 2) { set(x, y, C.wood[1]); continue; }
        const tone = (x < wx0 + 3 && y < wy0 + 2) ? 0 : (x > wx0 + 3 && y > wy0 + 2) ? 2 : 1;
        set(x, y, C.win[tone]);
        windowGlass.push([x, y, tone]);
      }
    }
    // hipped roof with shingle courses
    for (let k = 0; k <= 6; k++) {
      const y = pl - 10 - k, x0 = hx0 - 2 + k, x1 = hx1 + 2 - k;
      for (let x = x0; x <= x1; x++) {
        let col;
        if (k === 0) col = C.roof[3];
        else if (k === 6) col = x < x0 + (x1 - x0) * 0.6 ? C.roof[0] : C.roof[1];
        else if (x - x0 < 2) col = C.roof[0];
        else if (x1 - x < 2) col = C.roof[3];
        else if (k % 2 === 0 && (x + k) % 4 === 0) col = C.roof[3];
        else col = k % 2 ? C.roof[1] : C.roof[2];
        set(x, y, col);
      }
    }
    // chimney
    const cx = hx1 - 6;
    for (let y = pl - 20; y <= pl - 13; y++) {
      for (let x = cx; x <= cx + 2; x++) set(x, y, C.stone[x === cx ? 0 : x === cx + 1 ? 1 : 2]);
    }
    for (let x = cx - 1; x <= cx + 3; x++) set(x, pl - 21, C.stone[x < cx + 1 ? 1 : 3]);
    L.smokeX = cx + 1;
    L.smokeY = pl - 22;
  }

  // ---------- lighthouse beam ----------
  // The lamp turns in 3D; its projection onto the screen points along
  // (F cos phi, -h sin phi), so it swings across the sky when facing us and
  // shrinks toward the horizon when facing away.
  const BEAM_PERIOD = 12;
  function updateBeam(t) {
    const phi = (t * Math.PI * 2) / BEAM_PERIOD + 0.4;
    const hp = L.horizon - L.ly, F = hp * 2.4, a = 0.12;
    B.c = Math.cos(phi);
    B.s = Math.sin(phi);
    const vx = F * B.c, vy = -hp * B.s;
    B.vlen = Math.hypot(vx, vy);
    B.ang = Math.atan2(vy, vx);
    const e1 = Math.atan2(-hp * Math.sin(phi - a), F * Math.cos(phi - a));
    const e2 = Math.atan2(-hp * Math.sin(phi + a), F * Math.cos(phi + a));
    B.half = Math.max(Math.abs(angDiff(e1, B.ang)), Math.abs(angDiff(e2, B.ang)), 0.02);
    B.power = 0.62 + 0.38 * B.s;
  }

  function beamAt(x, y) {
    const px = x + 0.5 - L.lx, py = y + 0.5 - L.ly;
    const r = Math.hypot(px, py);
    if (r < 1.5) return B.power;
    const ad = Math.abs(angDiff(Math.atan2(py, px), B.ang));
    if (ad > Math.PI / 2) return 0;
    let e = ad / B.half;
    if (e >= 1) {
      if (r * Math.sin(ad) < 1.1) e = 0.8;
      else return 0;
    }
    const q = (r * Math.cos(ad)) / B.vlen;
    const den = 1 + q * B.s;
    if (den <= 0.04) return 0;
    const u = q / den;
    return B.power * Math.exp(-u * 0.55) * (1 - e * e * e);
  }

  const BEAM_ALPHA = [0, 0.12, 0.23, 0.36, 0.52];
  function drawBeam() {
    for (let y = 0; y < L.horizon; y++) {
      for (let x = 0; x < W; x++) {
        const I = beamAt(x, y);
        if (I <= 0.02) continue;
        const lv = Math.min(4, Math.floor(I * 4.3 + bayer(x, y) - 0.2));
        if (lv <= 0) continue;
        const i = y * W + x;
        frame[i] = mix(frame[i], C.beam, BEAM_ALPHA[lv]);
      }
    }
  }

  function drawLanternGlow() {
    const flash = Math.pow(Math.max(0, B.s), 10);
    for (const [x, y, tone] of lanternGlass) {
      frame[y * W + x] = C.glass[flash > 0.4 ? 0 : tone];
    }
    const R = 5 + flash * 15, cx = L.lx, cy = L.ly;
    const strength = 0.32 + 0.6 * flash;
    for (let y = Math.floor(cy - R); y <= Math.ceil(cy + R); y++) {
      if (y < 0 || y >= H) continue;
      for (let x = Math.floor(cx - R); x <= Math.ceil(cx + R); x++) {
        if (x < 0 || x >= W) continue;
        const d = Math.hypot(x + 0.5 - cx, y + 0.5 - cy);
        if (d >= R) continue;
        const a = (1 - d / R) * (1 - d / R) * strength;
        const lv = Math.floor(a * 5 + bayer(x, y) - 0.2) / 5;
        if (lv > 0) frame[y * W + x] = mix(frame[y * W + x], C.beam, Math.min(0.85, lv));
      }
    }
  }

  // ---------- sea ----------
  function drawSea(t) {
    const hz = L.horizon, span = H - hz, mx = L.moonX, flick = Math.floor(t * 5);
    let prevBand = -1, rowInBand = 0;
    for (let y = hz + 1; y < H; y++) {
      const d = (y - hz) / span;
      const band = Math.floor(Math.pow(d, 0.6) * 40);
      if (band !== prevBand) { prevBand = band; rowInBand = 0; } else rowInBand++;
      const dq = Math.pow((band + 0.5) / 40, 1 / 0.6);
      const ph = hash2(band, 77) * 6.283;
      const f1 = 0.62 - 0.5 * dq, f2 = f1 * 0.43;
      const sp = 0.7 + 1.7 * dq;
      const hi = d < 0.35 ? C.wave[2] : C.wave[3];
      const reflHalf = 1.5 + d * 8;
      const brightCap = d < 0.45 ? 2 : 1;
      const wob = Math.sin(band * 0.9 + t * 1.6) * (0.6 + d * 1.5);
      const row = y * W;
      for (let x = 0; x < W; x++) {
        const v = Math.sin(x * f1 + t * sp + ph) + 0.75 * Math.sin(x * f2 - t * sp * 0.7 + ph * 1.7);
        const i = row + x;
        const rx = Math.abs(x + 0.5 - mx - wob);
        if (rx < reflHalf && rowInBand < 2) {
          const k = rx / reflHalf;
          const thr = 0.05 + k * 1.1 + rowInBand * 0.55 + hash2(x >> 1, band, flick) * 0.45;
          if (v > thr) {
            const g = v > thr + 0.8 ? 2 : v > thr + 0.35 ? 1 : 0;
            frame[i] = C.glint[Math.min(g, brightCap)];
            continue;
          }
        }
        if (rowInBand === 0) {
          if (v > 1.3) frame[i] = hi;
          else if (v > 0.95) frame[i] = C.wave[1];
          else if (v > 0.7 && d > 0.35) frame[i] = C.wave[0];
        } else if (rowInBand === 1) {
          if (v > 1.3) frame[i] = C.wave[1];
          else if (v < -1.35) frame[i] = C.trough;
        } else if (v < -1.15) {
          frame[i] = C.trough;
        }
      }
    }
  }

  // Swells roll in from the foreground and break on the foot of the cliff.
  const CREST_PERIOD = 4.4, CRESTS = 2;
  function crestRow(t, k) {
    const p = (t / CREST_PERIOD + k / CRESTS) % 1;
    const e = 1 - (1 - p) * (1 - p);
    const start = H + 2, end = L.base - 14;
    return { p, y: Math.round(start - (start - end) * e), seed: Math.floor(t / CREST_PERIOD + k / CRESTS) * 7 + k };
  }
  const crestPresent = (x, seed) => vnoise(x * 0.07 + seed * 13.1, seed) > 0.3;

  function updateCrests(t) {
    for (let k = 0; k < CRESTS; k++) {
      const { y, seed } = crestRow(t, k);
      const prev = crestPrev[k];
      if (prev !== undefined && y < prev) {
        for (let x = 0; x < W; x++) {
          const b = bottom[x];
          if (b >= y && b < prev && crestPresent(x, seed)) impact(x, b);
        }
      }
      crestPrev[k] = y;
    }
  }

  function drawCrests(t) {
    for (let k = 0; k < CRESTS; k++) {
      const { p, y: y0, seed } = crestRow(t, k);
      if (y0 <= L.horizon + 1 || y0 >= H + 2) continue;
      const near = (y0 - L.horizon) / (H - L.horizon);
      for (let x = 0; x < W; x++) {
        if (!crestPresent(x, seed)) continue;
        const y = y0 + Math.round(Math.sin(x * 0.09 + seed * 1.7) * (near > 0.6 ? 1.2 : 0.6));
        if (y <= L.horizon + 1) continue;
        if (y < L.base && hash2(x, y, seed) < (L.base - y) / 13) continue;   // swell fades in open water
        const foamy = hash2(x >> 1, seed, 5) < 0.2 + 0.5 * p;
        if (y - 1 > L.horizon) frame[(y - 1) * W + x] = C.trough;
        if (y < H) frame[y * W + x] = foamy ? C.foam[1] : C.wave[3];
        if (y + 1 < H) frame[(y + 1) * W + x] = foamy && near > 0.8 ? C.foam[2] : C.wave[2];
        if (near > 0.75 && y + 2 < H) frame[(y + 2) * W + x] = C.wave[1];
      }
    }
  }

  // ---------- foam + spray ----------
  function addFoam(x, y, v) {
    if (x < 0 || x >= W || y < L.horizon || y >= H) return;
    const i = (y - L.horizon) * W + x;
    foam[i] = Math.min(1.6, foam[i] + v);
  }

  function impact(x, y) {
    const big = tip[x] === 1;
    surge[x] = Math.max(surge[x], 2 + Math.random() * 3);
    for (let k = -1; k <= 2; k++) {
      if (Math.random() < 0.65) addFoam(x + (Math.random() < 0.3 ? (Math.random() < 0.5 ? -1 : 1) : 0), y + k, 0.35 + Math.random() * 0.75);
    }
    if (Math.random() < (big ? 0.95 : 0.1)) {
      const n = big ? 6 + Math.floor(Math.random() * 7) : 1 + Math.floor(Math.random() * 2);
      for (let j = 0; j < n; j++) {
        spray.push({
          x: x + Math.random() - 0.5, y: y - 1, y0: y,
          vx: (Math.random() - 0.5) * 22, vy: -(26 + Math.random() * (big ? 70 : 30)),
          life: 0,
        });
      }
    }
  }

  function updateFoam(dt, t) {
    const rows = H - L.horizon;
    // a restless lace of foam always clings to the waterline
    for (let x = 0; x < W; x++) {
      const b = bottom[x];
      if (b < L.horizon) continue;
      const s = 0.5 + 0.5 * Math.sin(t * 1.9 + x * 0.45);
      addFoam(x, b + 1, dt * 1.1 * s);
      if (Math.random() < dt * 0.8) addFoam(x, b + 2 + Math.floor(Math.random() * 3), 0.6);
      surge[x] = Math.max(0, surge[x] - dt * 4);
    }
    const keep = Math.exp(-dt * 0.75);
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < W; x++) {
        const i = y * W + x;
        const l = x > 0 ? foam[i - 1] : foam[i], r = x < W - 1 ? foam[i + 1] : foam[i];
        const u = y > 0 ? foam[i - W] : foam[i], d = y < rows - 1 ? foam[i + W] : foam[i];
        foamTmp[i] = (foam[i] * 0.7 + (l + r) * 0.11 + (u + d) * 0.04) * keep;
      }
    }
    const swap = foam; foam = foamTmp; foamTmp = swap;
  }

  function drawFoam(t) {
    const hz = L.horizon, flick = Math.floor(t * 4);
    for (let y = hz + 1; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const v = foam[(y - hz) * W + x];
        if (v < 0.16) continue;
        const i = y * W + x;
        if (fg[i] && y < bottom[x] - surge[x]) continue;
        const n = hash2(x, y, flick) * 0.55;
        if (v > 0.8 + n) frame[i] = C.foam[0];
        else if (v > 0.38 + n) frame[i] = bayer(x, y) < 0.75 ? C.foam[1] : C.foam[2];
        else if (v > 0.16 + n * 0.5 && bayer(x, y) < 0.5) frame[i] = C.foam[2];
      }
    }
  }

  function updateSpray(dt) {
    for (let k = spray.length - 1; k >= 0; k--) {
      const p = spray[k];
      p.life += dt;
      p.vy += 150 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.vy > 0 && p.y >= p.y0) {
        addFoam(Math.round(p.x), Math.round(p.y0) + 1, 0.5);
        spray.splice(k, 1);
      }
    }
  }

  function drawSpray() {
    for (const p of spray) {
      const x = Math.round(p.x), y = Math.round(p.y);
      if (x < 0 || y < 0 || x >= W || y >= H) continue;
      frame[y * W + x] = p.life < 0.45 ? C.foam[0] : C.foam[1];
      if (p.life < 0.25 && y + 1 < H) frame[(y + 1) * W + x] = C.foam[1];
    }
  }

  // ---------- rain ----------
  const SLANT = 0.3;   // pixels sideways per pixel of fall
  function newDrop(initial) {
    const near = Math.random() < 0.42;
    return {
      x: Math.random() * (W + H * SLANT + 10),
      y: initial ? Math.random() * H : -2 - Math.random() * 24,
      v: near ? 200 + Math.random() * 70 : 125 + Math.random() * 45,
      len: near ? 4 + Math.floor(Math.random() * 2) : 2 + Math.floor(Math.random() * 2),
      near,
      end: near ? L.horizon + 2 + Math.random() * (H - L.horizon - 2) : Math.random() * H,
    };
  }

  function updateRain(dt) {
    for (let k = 0; k < drops.length; k++) {
      const d = drops[k];
      d.y += d.v * dt;
      d.x -= d.v * SLANT * dt;
      if (d.y >= d.end) {
        const x = Math.round(d.x), y = Math.round(d.end);
        if (d.near && x >= 0 && x < W && y < H && !(fg[y * W + x] && y <= bottom[x])) {
          if (ripples.length < 160) ripples.push({ x, y, life: 0 });
        }
        drops[k] = newDrop(false);
      }
    }
    for (let k = ripples.length - 1; k >= 0; k--) {
      ripples[k].life += dt;
      if (ripples[k].life > 0.24) ripples.splice(k, 1);
    }
  }

  function drawRain(near) {
    const base = near ? 0.4 : 0.2;
    for (const d of drops) {
      if (d.near !== near) continue;
      for (let s = 0; s < d.len; s++) {
        const x = Math.round(d.x + s * SLANT), y = Math.round(d.y - s);
        if (x < 0 || y < 0 || x >= W || y >= H) continue;
        const i = y * W + x;
        const lit = y < L.horizon ? beamAt(x, y) : 0;
        frame[i] = lit > 0.04
          ? mix(frame[i], C.rainLit, Math.min(0.95, base + lit * 0.8))
          : mix(frame[i], C.rain, s === 0 && near ? base + 0.15 : base);
      }
    }
    if (!near) return;
    for (const r of ripples) {
      const i = r.y * W + r.x;
      if (r.life < 0.1) {
        if (r.y > 0) frame[i - W] = mix(frame[i - W], C.foam[1], 0.7);
      } else {
        if (r.x > 0) frame[i - 1] = mix(frame[i - 1], C.foam[1], 0.55);
        if (r.x < W - 1) frame[i + 1] = mix(frame[i + 1], C.foam[1], 0.55);
      }
    }
  }

  // ---------- chimney smoke ----------
  function updateSmoke(dt) {
    smokeTimer -= dt;
    if (smokeTimer <= 0) {
      smokeTimer = 0.22;
      smoke.push({ x: L.smokeX + Math.random() - 0.5, y: L.smokeY, vx: -3 - Math.random() * 3, vy: -5 - Math.random() * 3, life: 0, max: 2.6 + Math.random() });
    }
    for (let k = smoke.length - 1; k >= 0; k--) {
      const p = smoke[k];
      p.life += dt;
      p.vx -= dt * 2.2;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.life > p.max) smoke.splice(k, 1);
    }
  }

  function drawSmoke() {
    for (const p of smoke) {
      const a = 0.5 * (1 - p.life / p.max);
      const size = p.life > 1 ? 2 : 1;
      const x0 = Math.round(p.x), y0 = Math.round(p.y);
      for (let y = y0; y < y0 + size; y++) {
        for (let x = x0; x < x0 + size; x++) {
          if (x < 0 || y < 0 || x >= W || y >= H) continue;
          const lv = Math.floor(a * 4 + bayer(x, y)) / 4;
          if (lv > 0) frame[y * W + x] = mix(frame[y * W + x], C.smoke, lv);
        }
      }
    }
  }

  function drawWindows(t) {
    const flicker = Math.sin(t * 7.3) * Math.sin(t * 2.9) + (Math.sin(t * 23.1) > 0.97 ? -0.6 : 0);
    const shift = flicker < -0.35 ? 1 : 0;
    for (const [x, y, tone] of windowGlass) frame[y * W + x] = C.win[Math.min(3, tone + shift)];
  }

  function buildVignette() {
    vignette = new Uint8Array(W * H);
    const cx = W / 2, cy = H / 2, R = Math.hypot(cx, cy);
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const d = Math.hypot(x + 0.5 - cx, y + 0.5 - cy) / R;
        const a = Math.max(0, d - 0.62) * 1.1;
        vignette[y * W + x] = clamp(Math.floor(a * 7 + bayer(x, y) - 0.3), 0, 3);
      }
    }
  }
  const VIGNETTE_ALPHA = [0, 0.1, 0.2, 0.3];

  // ---------- frame ----------
  function render(t) {
    frame.set(sky);
    drawStars(t);
    for (const c of clouds) drawCloud(c);
    drawBeam();
    drawSea(t);
    drawCrests(t);
    drawRain(false);
    for (let k = 0; k < fgIdx.length; k++) frame[fgIdx[k]] = fg[fgIdx[k]];
    drawWindows(t);
    drawFoam(t);
    drawSpray();
    drawSmoke();
    drawLanternGlow();
    drawRain(true);
    for (let i = 0; i < vignette.length; i++) {
      if (vignette[i]) frame[i] = mix(frame[i], C.black, VIGNETTE_ALPHA[vignette[i]]);
    }
    ctx.putImageData(image, 0, 0);
  }

  function update(dt, t) {
    updateClouds(dt, t);
    updateBeam(t);
    updateCrests(t);
    updateFoam(dt, t);
    updateSpray(dt);
    updateRain(dt);
    updateSmoke(dt);
  }

  // ---------- sizing: integer device-pixel scale so every art pixel stays square ----------
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const pw = Math.max(1, Math.round(window.innerWidth * dpr));
    const ph = Math.max(1, Math.round(window.innerHeight * dpr));
    const scale = Math.max(1, Math.round(Math.min(pw / 150, ph / 180)));
    W = Math.max(120, Math.min(640, Math.ceil(pw / scale)));
    H = Math.max(140, Math.min(640, Math.ceil(ph / scale)));
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = (W * scale) / dpr + 'px';
    canvas.style.height = (H * scale) / dpr + 'px';

    image = ctx.createImageData(W, H);
    frame = new Uint32Array(image.data.buffer);
    computeLayout();
    buildSky();
    const rng = mulberry32(1337);
    buildStars(rng);
    buildClouds(rng);
    buildForeground();
    buildVignette();
    foam = new Float32Array(W * (H - L.horizon));
    foamTmp = new Float32Array(W * (H - L.horizon));
    surge = new Float32Array(W);
    crestPrev = [];
    spray = [];
    ripples = [];
    smoke = [];
    drops = [];
    const n = Math.round((W * H) / 125);
    for (let k = 0; k < n; k++) drops.push(newDrop(true));
  }

  let clock = 0, last = performance.now(), pendingResize = false;
  window.addEventListener('resize', () => { pendingResize = true; });

  function tick(now) {
    if (pendingResize) { pendingResize = false; resize(); }
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    clock += dt;
    update(dt, clock);
    render(clock);
    requestAnimationFrame(tick);
  }

  resize();
  // settle the waterline foam so the first frame already looks lived-in
  for (let k = 0; k < 90; k++) { clock += 1 / 30; update(1 / 30, clock); }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
