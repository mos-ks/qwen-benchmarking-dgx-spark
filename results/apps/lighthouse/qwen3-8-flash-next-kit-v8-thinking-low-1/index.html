<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lighthouse at Night</title>
<style>
  html, body { margin: 0; height: 100%; background: #06071a; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="pixel-kit.js"></script>
<script>
(function () {
  "use strict";
  const R = PK.ramps, S = PK.skies;
  const BEAM = ["#33406f", "#8593c8", "#ffe9a8"];
  const FOAM = ["#9fc4dc", "#eaf6ff"];

  const rain = PK.drift({ n: 70, seed: 7, area: [0, 0, 1, 1], vx: [-14, -10], vy: [95, 125], len: [3, 5] });
  let bg = null, props = null, G = {}, view = null, ctx = null;

  function build(v) {
    const W = v.W, H = v.H;
    const hz = Math.round(H * 0.62);
    const moon = { x: Math.round(W * 0.24), y: Math.round(H * 0.15), r: Math.max(5, Math.round(H * 0.045)) };

    bg = PK.layer(W, H, () => {
      PK.gradient(0, 0, W, hz + 2, S.night);
      PK.glow(moon.x, moon.y, Math.round(moon.r * 2.6), "#3d4a7a", 0.4);
      PK.disc(moon.x, moon.y, moon.r, "#c9d3e6");
      PK.disc(moon.x - Math.round(moon.r * 0.3), moon.y - Math.round(moon.r * 0.3), Math.max(1, moon.r - 2), "#e9eef8");
      PK.px(moon.x + 1, moon.y - 1, "#ffffff");
      PK.disc(moon.x + 2, moon.y + 1, Math.max(1, Math.round(moon.r * 0.25)), "#a6b2cc");
      PK.disc(moon.x - Math.round(moon.r * 0.5), moon.y + 2, Math.max(1, Math.round(moon.r * 0.2)), "#b3bed6");
    });

    const rnd = PK.rng(99);
    const stars = [];
    for (let i = 0; i < 55; i++) {
      const sx = Math.floor(rnd() * W), sy = Math.floor(rnd() * (hz - 6));
      if (Math.hypot(sx - moon.x, sy - moon.y) < moon.r + 4) continue;
      stars.push({ x: sx, y: sy, p: rnd() });
    }
    const clouds = [
      { x0: Math.round(W * 0.10), y: moon.y - 2, s: 1.0, sp: 2.2 },
      { x0: Math.round(W * 0.55), y: moon.y + 4, s: 0.8, sp: 1.5 },
      { x0: Math.round(W * 0.78), y: hz - 5, s: 1.2, sp: 3.0 },
    ];

    const cliffW = Math.max(50, Math.min(W - 8, Math.round(H * 0.95)));
    const cliffX = Math.round(W * 0.5 - cliffW / 2);
    const prof = (u) => {
      const main = Math.min(1, u / 0.3, (1 - u) / 0.15);
      const spur = Math.max(0, Math.min(1, (u - 0.02) / 0.1, (0.42 - u) / 0.1)) * 0.78;
      return Math.max(main, spur);
    };

    const towerU = 0.56;
    const tW = Math.max(9, Math.round(H * 0.1)) | 1;
    const wT = Math.max(5, Math.round(tW * 0.55) | 1);
    const cx = Math.round(cliffX + cliffW * towerU);
    const roomH = 7, rh = 3;
    const lamp = { x: cx, y: 0 };

    props = PK.layer(W, H, () => {
      const rb1 = PK.rock(Math.round(W * 0.1), H + 3, Math.max(10, Math.round(H * 0.1)), H * 0.14, R.nightStone, { seed: 33 });
      const rb2 = PK.rock(Math.round(W * 0.86), H + 3, Math.max(12, Math.round(H * 0.12)), H * 0.17, R.nightStone, { seed: 52 });
      const rb3 = PK.rock(cliffX + cliffW - Math.round(H * 0.06), H + 2, Math.max(10, Math.round(H * 0.09)), H * 0.11, R.nightStone, { seed: 64 });
      const cliff = PK.rock(cliffX, H + 4, cliffW, H * 0.58, R.nightStone, { profile: prof, seed: 17 });

      // --- tower platform ---
      const ti0 = Math.round(cliffW * towerU - (tW / 2 + 2)), ti1 = Math.round(cliffW * towerU + (tW / 2 + 2));
      let py = 0;
      for (let gx = cliffX + ti0; gx <= cliffX + ti1; gx++) py = Math.max(py, cliff.top(gx));
      PK.rect(cliffX + ti0 - 1, py, ti1 - ti0 + 3, 2, R.nightStone[2]);
      PK.rect(cliffX + ti0 - 1, py, ti1 - ti0 + 3, 1, R.nightStone[3]);
      PK.rect(cliffX + ti0 - 1, py + 2, ti1 - ti0 + 3, 1, R.nightStone[0]);

      // --- striped tower ---
      const towerH = Math.round(H * 0.3);
      const topY = py - towerH;
      const rn = PK.rng(5);
      for (let d = 0; d <= towerH; d++) {
        const y = py - d;
        const f = d / towerH;
        const half = Math.round((tW + (wT - tW) * f) / 2);
        let ramp = Math.floor(d / 4) % 2 ? R.whitePaint : R.brickRed;
        if (d < 2) ramp = R.nightStone; // stone plinth
        for (let o = -half; o <= half; o++) {
          let c;
          if (o === -half || o === half) c = R.nightStone[0];
          else if (o === -half + 1) c = ramp[3];
          else if (o === half - 1) c = ramp[1];
          else c = ramp[2];
          if (d >= 2 && rn() < 0.04) c = ramp[1];
          PK.px(cx + o, y, c);
        }
      }
      // small lit window mid-tower
      const wy = py - Math.round(towerH * 0.55);
      PK.rect(cx - 1, wy, 2, 2, R.warmLight[3]);
      PK.px(cx - 1, wy - 1, R.nightStone[0]); PK.px(cx + 2, wy, R.nightStone[0]);

      // --- lantern room ---
      const deckW = wT + 4;
      const roomTop = topY - 2 - roomH;
      lamp.y = roomTop + Math.round(roomH / 2);
      // glass room with mullions and glowing core
      for (let y = roomTop; y < topY - 2; y++) {
        for (let o = -Math.floor(wT / 2); o <= Math.floor(wT / 2); o++) {
          const dy = y - lamp.y, dist = Math.abs(o) + Math.abs(dy);
          let c;
          if (dist <= 1) c = "#fff6cc";
          else if (dist <= 3) c = R.warmLight[3];
          else if (dist <= 4) c = R.warmLight[2];
          else c = (o % 2 === 0) ? R.nightStone[0] : R.glaze[1];
          PK.px(cx + o, y, c);
        }
      }
      // deck
      PK.rect(cx - Math.floor(deckW / 2), topY - 2, deckW, 1, R.nightStone[3]);
      PK.rect(cx - Math.floor(deckW / 2), topY - 1, deckW, 1, R.nightStone[1]);
      // railing around the room
      const railY = topY - 2 - rh;
      PK.rect(cx - Math.floor(deckW / 2), railY, deckW, 1, R.nightStone[3]);
      for (let o = -Math.floor(deckW / 2); o <= Math.floor(deckW / 2); o += 2)
        PK.px(cx + o, railY + 1, R.nightStone[2]), PK.px(cx + o, railY + 2, R.nightStone[2]);
      // dome
      const dn = PK.rng(8);
      for (let k = 0; k < 3; k++) {
        const w = Math.max(1, wT + 1 - k * 2), h = Math.floor(w / 2);
        PK.rect(cx - h, roomTop - 1 - k, w, 1, k === 0 ? R.nightStone[3] : R.nightStone[2]);
        if (dn() < 0.7) PK.px(cx - h, roomTop - 1 - k, R.nightStone[4]);
      }
      PK.px(cx, roomTop - 4, R.warmLight[2]); // finial

      // --- keeper's cottage on the left spur ---
      const ccx = Math.round(cliffX + cliffW * 0.28);
      const cW = Math.max(11, Math.round(H * 0.12) | 1), cHh = Math.max(5, Math.round(H * 0.07));
      const half = Math.floor(cW / 2);
      let cy = 0;
      for (let gx = ccx - half - 1; gx <= ccx + half + 1; gx++) cy = Math.max(cy, cliff.top(gx));
      const wallTop = cy - cHh;
      for (let x = -half; x <= half; x++) {
        for (let y = wallTop; y < cy; y++) {
          let c = R.nightStone[2];
          if (x === -half || x === half || y === cy - 1) c = R.nightStone[0];
          else if (x === -half + 1) c = R.nightStone[3];
          else if (y === wallTop + 1) c = R.nightStone[3];
          if (rn() < 0.06) c = R.nightStone[1];
          PK.px(ccx + x, y, c);
        }
      }
      const ay = wallTop - Math.max(3, Math.round(cHh * 0.8));
      PK.poly([[ccx - half - 1, wallTop], [ccx, ay], [ccx + half + 1, wallTop]], "#181d33");
      PK.poly([[ccx - half, wallTop], [ccx, ay], [ccx, wallTop]], "#262c48");
      PK.line(ccx, ay, ccx - half, wallTop, R.nightStone[3]);
      PK.rect(ccx - half - 1, wallTop, cW + 3, 1, R.nightStone[0]);
      // chimney
      PK.rect(ccx + Math.round(half * 0.5), ay + 2, 2, wallTop - ay - 2, R.nightStone[2]);
      PK.rect(ccx + Math.round(half * 0.5), ay + 2, 2, 1, R.nightStone[3]);
      // lit windows and door
      PK.glow(ccx - 3, wallTop + Math.round(cHh / 2), 3, "#7a5a30", 0.4);
      PK.glow(ccx + 2, wallTop + Math.round(cHh / 2), 3, "#7a5a30", 0.4);
      PK.rect(ccx - 4, wallTop + 1, 2, 2, R.warmLight[3]);
      PK.rect(ccx + 2, wallTop + 1, 2, 2, R.warmLight[3]);
      PK.rect(ccx - 1, cy - 3, 2, 3, "#101424");
      PK.px(ccx - 1, cy - 2, R.warmLight[1]);

      G.breakers = [];
      for (const rk of [cliff, rb1, rb2, rb3]) {
        for (let i = 0; i < rk.w; i++) {
          const gx = rk.x + i, y = rk.top(gx);
          if (y > hz + 2 && y < H - 2) G.breakers.push({ x: gx, y });
        }
      }
    });

    G = Object.assign(G, { W, H, hz, moon, stars, clouds, lamp });
    rain.setArea([0, -6, W, H]);
  }

  function cloud(c, t) {
    const span = view.W + 80;
    const x = Math.round(((c.x0 + t * c.sp) % span + span) % span) - 40;
    const a = Math.round(8 * c.s), b = Math.max(1, Math.round(3 * c.s));
    ctx.globalAlpha = 0.92;
    PK.ellipse(x, c.y, a, b, "#20264c");
    PK.ellipse(x - a + b, c.y + 1, Math.max(2, a - b), b, "#262c52");
    PK.ellipse(x + a - b, c.y + 1, Math.max(2, a - b), b, "#1b2144");
    PK.ellipse(x - Math.round(b), c.y - b, Math.max(2, a - 2 * b), b, "#343b68");
    ctx.globalAlpha = 1;
  }

  view = PK.fit(document.getElementById("c"), 150, (v) => { build(v); ctx = v.ctx; });

  PK.loop((t, dt) => {
    PK.blit(bg);
    for (const s of G.stars)
      PK.px(s.x, s.y, Math.sin(t * (0.8 + s.p * 2) + s.p * 6) > 0.6 ? "#ffffff" : "#7d87b8");
    for (const c of G.clouds) cloud(c, t);
    const a = -Math.PI / 2 - 1.3 * Math.sin(t * 0.28);
    const len = view.W * 1.15;
    PK.beam(G.lamp.x, G.lamp.y, a, len, 0.12, BEAM, 0.5 + 0.06 * Math.sin(t * 3));
    PK.beam(G.lamp.x, G.lamp.y, a + Math.PI, len, 0.12, BEAM, 0.4);
    PK.sea(0, G.hz, view.W, view.H, t, R.nightWater, 5);
    PK.blit(props);
    for (const b of G.breakers) PK.foam(b.x, b.x + 1, b.y, t, FOAM, 3000 + b.x);
    PK.glow(G.lamp.x, G.lamp.y, 7, "#8a6a3a", 0.4);
    PK.disc(G.lamp.x, G.lamp.y, 2, "#ffe9a8");
    PK.px(G.lamp.x, G.lamp.y, "#fff6cc");
    rain.step(dt);
    rain.streaks(["#33436f", "#93a8d8"]);
  });
})();
</script>
</body>
</html>
