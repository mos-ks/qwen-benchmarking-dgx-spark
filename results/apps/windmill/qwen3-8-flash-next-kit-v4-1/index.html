<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windmill in a Tulip Field at Sunset</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #31214f; overflow: hidden; }
  body { position: relative; }
  #scene { image-rendering: pixelated; image-rendering: crisp-edges; display: block; position: absolute; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
"use strict";

const H = 128;
const BASE_W = 192;
const VPX = 86, VPY = 44;
let scale = 1;
const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");
canvas.width = BASE_W; canvas.height = H;
ctx.imageSmoothingEnabled = false;

function fit() {
  const vw = window.innerWidth, vh = window.innerHeight;
  scale = Math.max(1, Math.ceil(Math.max(vw / BASE_W, vh / H) - 0.005));
  canvas.style.width = (BASE_W * scale) + "px";
  canvas.style.height = (H * scale) + "px";
  canvas.style.left = "0px";
  canvas.style.top = "0px";
}

function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const C = {
  sky:  ["#31214f","#46295e","#693160","#9c3f5e","#c85550","#e87a45","#f4a04a","#ffc564","#ffd98c","#ffe9b4"],
  sun:  ["#ffe9b4","#ffd98c","#f4a04a"],
  far:  "#4a3568",
  tree: "#33274f",
  water:["#27436b","#3f628c","#5d8bb5","#8fb9da","#e8a56a","#ffd08a","#fff0c2"],
  path: ["#5e4a38","#7d654a","#a18663","#c9ab7f","#e3cd9f"],
  field:["#173425","#234a2e","#35693a","#4d8a45","#6fae57","#94c96f","#bde08b"],
  wall: ["#331b12","#4d2b1c","#6e4028","#8f5733","#b1794a","#d8a874","#f2cd9c"],
  cap:  ["#171233","#2b2140","#46375f","#6d5a86","#9d87ae"],
  rail: ["#22130d","#3a2114","#5e3a22","#8a5a33"],
  door: ["#20120c","#38200f","#52301a","#6e4322"],
  win:  ["#1a0f08","#38200f","#c98f2e","#ffe08a"],
  sail: ["#171021","#2c2136","#5c4a5e","#8a7784","#e6dcc8"],
  tulip:[["#1c0f26","#47102b","#a01c35","#e23a50","#ff8091","#ffc0cb"],
         ["#1c1706","#4d3a08","#a07a12","#e8b71f","#ffd75e","#fff3b8"],
         ["#1f0f22","#4d1448","#a02c86","#e052b8","#f79ade","#ffc8ef"]],
  trunk:"#2b4a28",
  cloud:["#7a4a78","#b06078","#e89468","#ffd9a0"],
  bird: "#2a1f38",
};

// ---------- primitives ----------
const px = (x, y, c) => { ctx.fillStyle = c; ctx.fillRect(x | 0, y | 0, 1, 1); };
const rx = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x | 0, y | 0, w | 0, h | 0); };

function disc(cx, cy, r, c) {
  for (let y = -r; y <= r; y++)
    for (let x = -r; x <= r; x++)
      if (x * x + y * y <= r * r + r * 0.8) px(cx + x, cy + y, c);
}

// ---------- layout (recomputed on resize) ----------
const HZ = 46;
const MILL = { cx: 60, top: 27, base: 95 };
const SUN  = { y: 39, r: 9 };
const CANAL = { xL: 12, xR: 40 };
const ROWS = [];
(function () {
  const r = mulberry32(7);
  const y0 = 52, y1 = 124;
  for (let i = 0; i < 15; i++) {
    const t = i / 14;
    ROWS.push({ y: Math.round(y0 + (y1 - y0) * Math.pow(t, 1.75)),
                p: Math.pow(t, 1.1),
                kind: i % 3,
                ph: r() * 6.283 });
  }
})();
const ROW_Y0 = ROWS[0].y;
let sunX;
function layout() {
  sunX = 120;
}
const clouds = (function () { const r = mulberry32(3); const a = [];
  for (let i = 0; i < 4; i++) a.push({ fx: r(), y: 7 + i * 7, s: 1.1 + r() * 1.3, sp: 0.7 + r() * 0.8 });
  return a; })();
const birds = (function () { const r = mulberry32(5); const a = [];
  for (let i = 0; i < 3; i++) a.push({ fx: r(), y: 10 + i * 6, sp: 5.5 + r() * 3, ph: r() * 6.283 });
  return a; })();

// ---------- sky ----------
function drawSky() {
  for (let y = 0; y < HZ; y++) {
    const band = y < HZ * 0.6 ? Math.min(7, (y / (HZ * 0.6) * 8) | 0) : 7 + ((y - HZ * 0.6) / (HZ * 0.4) * 2) | 0;
    rx(0, y, BASE_W, 1, C.sky[Math.min(9, band)]);
  }
  for (let i = 1; i < 9; i++) {
    const yc = Math.round(HZ * i / 9);
    for (let y = yc - 1; y <= yc + 1; y++)
      for (let x = 0; x < BASE_W; x++)
        if (((x + y) & 1) && y >= 0 && y < HZ) px(x, y, C.sky[i]);
  }
  for (let r = 15; r >= 11; r--)
    for (let y = SUN.y - r; y <= SUN.y + r; y++) {
      if (y < 0 || y >= HZ) continue;
      for (let x = sunX - r; x <= sunX + r; x++) {
        const d = Math.hypot(x - sunX, y - SUN.y);
        if (d <= r && d > r - 1 && ((x + y) & 1)) px(x, y, C.sun[2]);
      }
    }
}

function drawSun() {
  for (let y = -SUN.r - 2; y <= SUN.r + 2; y++)
    for (let x = -SUN.r - 2; x <= SUN.r + 2; x++) {
      const d = Math.hypot(x, y);
      if (d > SUN.r + 1 || y > 2) continue;
      let c = C.sun[2];
      if (d < SUN.r - 2) c = C.sun[0];
      else if (d < SUN.r) c = C.sun[1];
      else if (((x + y) & 1)) c = C.sun[1];
      px(sunX + x, SUN.y + y, c);
    }
}

// ---------- clouds ----------
function puff(cx, cy, r, tone) {
  for (let y = -r; y <= r; y++)
    for (let x = -r; x <= r; x++) {
      if (x * x + y * y > r * r + r * 0.8) continue;
      const under = y >= 0 && (x * x + (y - 1) * (y - 1)) > (r - 1) * (r - 1);
      const top = y <= -1 && (x * x + (y + 1) * (y + 1) <= r * r + r * 0.8);
      px(cx + x, cy + y, under ? C.cloud[tone - 1] : (top ? C.cloud[Math.min(3, tone)] : C.cloud[tone]));
    }
}
function drawClouds(t) {
  for (const c of clouds) {
    const span = BASE_W + 80;
    const x = ((c.fx * BASE_W + t * c.sp) % span + span) % span - 40;
    const s = c.s;
    puff(x, c.y, Math.round(3 * s), 2);
    puff(x - 4 * s, c.y + 1, Math.round(2 * s), 1);
    puff(x + 4 * s, c.y + 1, Math.round(2 * s), 1);
    puff(x + 1, c.y - 1, Math.round(2 * s), 2);
  }
}

// ---------- birds ----------
function drawBirds(t) {
  for (const b of birds) {
    const span = BASE_W + 24;
    const x = ((b.fx * BASE_W + t * b.sp) % span + span) % span - 12;
    const y = b.y + Math.round(Math.sin(t * 2 + b.ph) * 1.5);
    const f = Math.sin(t * 10 + b.ph) > 0;
    px(x, y, C.bird);
    px(x - 1, y + (f ? -1 : 1), C.bird);
    px(x - 2, y + (f ? -2 : 1), C.bird);
    px(x + 1, y + (f ? -1 : 1), C.bird);
    px(x + 2, y + (f ? -2 : 1), C.bird);
  }
}

// ---------- far bank ----------
function drawFarBank() {
  for (let x = 0; x < BASE_W; x++) {
    const h = 3 + Math.round(Math.sin(x * 0.11) * 1.2 + Math.sin(x * 0.43) * 0.8);
    rx(x, HZ - h, 1, h, C.far);
    if (((x * 7919) % 5) === 0) px(x, HZ - h, "#5c437a");
  }
  const r = mulberry32(11);
  const n = Math.round(BASE_W / 14);
  for (let i = 0; i < n; i++) {
    const bx = Math.round(r() * BASE_W), by = HZ - (4 + Math.round(r() * 3)), bh = 2 + Math.round(r() * 3);
    rx(bx, by - bh, 1, bh, C.tree);
    disc(bx, by - bh - 1, 1 + Math.round(r()), C.tree);
  }
}

// ---------- canal ----------
function drawCanal(t) {
  const xL = CANAL.xL, xR = CANAL.xR;
  const edge = (y) => {
    const p = (y - HZ) / (H - HZ);
    return [xL + (2 - xL) * p, xR + (58 - xR) * p];
  };
  for (let y = HZ; y <= H + 2; y++) {
    const [xl, xr] = edge(y);
    for (let x = Math.round(xl); x <= Math.round(xr); x++) {
      const e = Math.min(x - xl, xr - x);
      let c = C.water[1];
      if (e < 1.5) c = C.water[0];
      else if (((x + y * 2 + Math.floor(t * 4)) % 13) === 0) c = C.water[2];
      px(x, y, c);
    }
  }
  // windmill reflection: warm tower band with ripple gaps
  const reflTop = HZ + 1, reflBot = HZ + 15;
  for (let y = reflTop; y <= reflBot; y++) {
    const [xl, xr] = edge(y);
    const p = (y - HZ) / (H - HZ);
    const wob = Math.round(Math.sin(t * 3 + y * 0.9) * (1 + p * 2));
    const w = Math.max(3, Math.round(8 - (y - reflTop) * 0.3));
    const shade = y - reflTop < 5 ? C.water[4] : (y - reflTop < 10 ? C.water[3] : C.water[2]);
    for (let x = MILL.cx - w; x <= MILL.cx + w; x++) {
      const xx = x + wob;
      if (xx < xl + 1 || xx > xr - 1) continue;
      if (((x + y + Math.floor(t * 5)) % 3) === 0) continue;
      px(xx, y, shade);
    }
    if (((y + Math.floor(t * 4)) % 4) === 0) { px(MILL.cx + wob - w - 1, y, C.water[3]); px(MILL.cx + wob + w + 1, y, C.water[3]); }
  }
  // sky glow reflection along the far edge of the water
  for (let y = HZ + 1; y <= HZ + 3; y++) {
    const [xl, xr] = edge(y);
    for (let x = Math.round(xl); x <= Math.round(xr); x++)
      if (((x + y + Math.floor(t * 2)) % 7) === 0) px(x, y, C.water[3]);
  }
  // sun glitter column
  const r = mulberry32(21);
  for (let y = HZ + 1; y <= H; y++) {
    const [xl, xr] = edge(y);
    const p = (y - HZ) / (H - HZ);
    const cx = Math.max(xl + 1, Math.min(xr - 2, sunX));
    const g = Math.round(cx + (r() - 0.5) * (2 + p * 7));
    const on = ((y + Math.floor(t * 6)) % 3 === 0) || r() > 0.55;
    if (on) px(g, y, r() > 0.5 ? C.water[6] : C.water[5]);
    if (((y + Math.floor(t * 3)) % 5) === 0) px(g + 2, y, C.water[4]);
  }
  // horizontal ripple lines across the whole water
  for (let y = HZ + 4; y <= H; y += 3) {
    const [xl, xr] = edge(y);
    const off = Math.round((t * 8 + y) % 6);
    for (let x = Math.round(xl + 1); x <= Math.round(xr - 1); x++)
      if (((x + off) % 6) < 3) px(x, y, C.water[3]);
  }
  // banks: grass edge on the left, towpath on the right
  for (let y = HZ; y <= H; y++) {
    const [xl, xr] = edge(y);
    const xli = Math.round(xl), xri = Math.round(xr);
    rx(xli - 3, y, 2, 1, C.field[1]); px(xli - 1, y, C.field[0]);
    px(xli - 3, y, ((y * 7919) % 3 === 0) ? C.field[2] : C.field[1]);
    rx(xri + 1, y, 1, 1, C.field[0]);
    rx(xri + 2, y, 2, 1, C.path[1]); px(xri + 2, y, C.path[2]);
  }
}

// ---------- path ----------
function pathEdges(y) {
  const p = (y - HZ) / (H - HZ);
  return [96 + (76 - 96) * p, 186 + (126 - 186) * p];
}
function drawPath(t) {
  for (let y = HZ; y <= H; y++) {
    const [xl, xr] = pathEdges(y);
    for (let x = Math.round(xl); x <= Math.round(xr); x++) {
      const e = Math.min(x - xl, xr - x);
      let c = C.path[2];
      if (e < 1) c = C.path[1];
      else if (e > (xr - xl) / 2 - 1) c = C.path[3];
      px(x, y, c);
    }
  }
  const r = mulberry32(31);
  for (let i = 0; i < 40; i++) {
    const y = HZ + 2 + Math.round(r() * (H - HZ - 3));
    const [xl, xr] = pathEdges(y);
    const x = Math.round(xl + r() * (xr - xl));
    px(x, y, r() > 0.6 ? C.path[4] : C.path[0]);
  }
}

// ---------- tulips ----------
function drawTulip(x, y, s, ph, kind, t) {
  const R = C.tulip[kind];
  const sway = Math.round(Math.sin(t * 1.7 + ph) * s * 0.9);
  const topY = y - Math.round(4.4 * s);
  // ground shadow
  if (s >= 2) px(x - 1, y + 1, C.field[0]);
  // stem
  for (let i = 0; i <= Math.round(4 * s); i++) {
    const f = i / Math.max(1, Math.round(4 * s));
    px(x + Math.round(sway * f * f), y - i, C.trunk);
  }
  const tx = x + sway;
  // leaves
  px(x - s, y - Math.round(1.6 * s), C.trunk);
  px(x - s, y - Math.round(2.4 * s), C.trunk);
  px(x + s, y - Math.round(1 * s), C.trunk);
  if (s >= 3) px(x - s - 1, y - Math.round(2 * s), C.field[2]);
  // bulb: dark base, mid body, petal separation lines, lit top
  const bw = Math.max(1, Math.round(1.4 * s)), bh = Math.max(2, Math.round(2 * s));
  for (let dy = -bh; dy <= 0; dy++) {
    const w = dy === 0 ? Math.max(0, bw - 1) : bw;
    rx(tx - w, topY + dy, w * 2 + 1, 1, R[2]);
  }
  px(tx - bw, topY - 1, R[1]);
  px(tx + bw, topY - 1, R[3]);
  px(tx, topY - bh, R[3]);
  px(tx, topY - bh + 1, R[4]);
  px(tx - 1, topY - 1, R[1]);
  px(tx, topY, R[1]);
  if (s >= 2) {
    px(tx - 1, topY - bh, R[1]);
    px(tx + 1, topY - bh, R[1]);
    px(tx + bw - 1, topY - bh + 1, R[4]);
    px(tx - bw, topY, R[0]);
    px(tx, topY - 1, R[5]);
  }
}

function rowEdges(y, p) {
  const f = Math.max(0, (y - VPY) / (H - VPY));
  let xl = Math.round(VPX + (10 - VPX) * f);
  let xr = Math.round(VPX + (182 - VPX) * f);
  const [pl, pr] = pathEdges(y);
  xl = Math.max(xl, Math.round(pl) + 1);
  xr = Math.min(xr, Math.round(pr) - 1);
  const half = Math.max(1, Math.round(2.5 * (0.45 + 0.55 * p)));
  return [xl - half, xr + half];
}

function drawTulips(t) {
  for (const row of ROWS) {
    const s = Math.max(1, Math.round(0.8 + 2.2 * row.p));
    const step = Math.max(4, Math.round(11 - 6 * row.p));
    const [xl, xr] = rowEdges(row.y, row.p);
    for (let x = xl + 1; x <= xr; x += step)
      drawTulip(x, row.y, s, row.ph + x * 0.55, row.kind, t);
  }
}

// ---------- windmill ----------
function drawWindmill(t) {
  const cx = MILL.cx, top = MILL.top, base = MILL.base;
  const wHalf = 8 + Math.round((base - top) * 0.155);
  for (let x = cx - wHalf - 3; x <= cx + wHalf + 5; x++) {
    px(x, base + 1, C.field[0]);
    if (((x + 1) & 1)) px(x, base + 2, C.field[1]);
  }
  for (let y = top; y <= base; y++) {
    const f = (y - top) / (base - top);
    const half = 8 + f * (wHalf - 8);
    for (let x = cx - half; x <= cx + half; x++) {
      const e = Math.min(x - (cx - half), (cx + half) - x);
      let c = C.wall[3];
      if (e < 1) c = C.wall[1];
      else if (e > half - 1) c = (x > cx) ? C.wall[2] : C.wall[4];
      if (e < 3 && x < cx) c = (e === 2) ? C.wall[4] : C.wall[3];
      if (e < 3 && x > cx) c = C.wall[2];
      if (x > cx + half * 0.6) c = C.wall[2];
      if (x > cx + half * 0.85) c = C.wall[1];
      px(x, y, c);
    }
    const off = ((y - top) % 6 < 3) ? 0 : 2;
    if (((y - top) % 3) === 2) {
      for (let x = cx - half; x <= cx + half; x++) {
        const m = ((Math.round(x) - cx + off) % 4 + 4) % 4;
        px(x, y, m === 0 ? C.wall[2] : C.wall[3]);
      }
    }
    if (y > top + 6 && ((y * 7919) % 23) === 0) px(cx - 2 + ((y * 7) % 5), y, C.wall[4]);
  }
  for (let x = cx - 7; x <= cx + 7; x++) px(x, base - 21, C.wall[2]);
  const fy = top + 20;
  for (let x = cx - 10; x <= cx + 10; x++) px(x, fy, C.wall[1]);
  for (let x = cx - 10; x <= cx + 10; x += 2) px(x, fy - 1, C.wall[4]);
  // door
  const dw = 3, dh = 14, dy0 = base - dh;
  rx(cx - dw - 1, dy0 - 1, 2 * dw + 3, 1, C.wall[2]);
  px(cx - dw - 1, base, C.wall[2]); px(cx + dw + 1, base, C.wall[2]);
  for (let y = dy0; y <= base; y++) {
    const wr = (y === dy0) ? dw - 1 : dw;
    rx(cx - wr, y, wr * 2 + 1, 1, C.door[2]);
    rx(cx - wr, y, 1, 1, C.door[1]);
    rx(cx + wr, y, 1, 1, C.door[3]);
  }
  for (let y = dy0 + 2; y <= base - 1; y += 3) rx(cx, y, 1, 2, C.door[0]);
  px(cx + dw - 1, base - 7, C.win[2]);
  // window
  const wy = base - 30;
  rx(cx - 3, wy - 3, 7, 1, C.wall[2]);
  rx(cx - 4, wy - 2, 1, 5, C.wall[2]); rx(cx + 4, wy - 2, 1, 5, C.wall[2]);
  rx(cx - 3, wy + 4, 7, 1, C.wall[2]);
  rx(cx - 3, wy - 2, 7, 5, C.win[2]);
  px(cx - 3, wy - 2, C.win[1]); px(cx + 3, wy + 2, C.win[3]);
  rx(cx, wy - 2, 1, 5, C.win[1]);
  rx(cx - 3, wy, 7, 1, C.win[1]);
  for (let x = cx - 4; x <= cx + 4; x++) px(x, wy + 5, C.wall[1]);
  // cap
  for (let y = top - 5; y <= top; y++) {
    const f = (top - y) / 5;
    const half = Math.round(9 - f * 6);
    for (let x = cx - half; x <= cx + half; x++) {
      const e = Math.min(x - (cx - half), (cx + half) - x);
      let c = C.cap[2];
      if (e < 1) c = C.cap[1];
      else if (e > half - 1) c = C.cap[3];
      if (f >= 0.8 && ((x + y) & 1)) c = C.cap[4];
      px(x, y, c);
    }
  }
  rx(cx - 9, top, 19, 1, C.cap[1]);
  px(cx, top - 6, C.cap[4]); px(cx - 1, top - 6, C.cap[3]);
  // rail balcony
  const ry = top + 21;
  rx(cx - 11, ry, 23, 1, C.rail[2]);
  rx(cx - 11, ry + 1, 23, 1, C.rail[1]);
  for (let x = cx - 10; x <= cx + 10; x += 2) px(x, ry - 1, C.rail[3]);
  px(cx - 11, ry - 1, C.rail[0]); px(cx + 11, ry - 1, C.rail[0]);

  drawSails(t);
}

function drawSails(t) {
  const hub = { x: MILL.cx, y: MILL.top + 12 };
  const L = 20, HALF = 4;
  const ang = t * 0.8 + Math.PI / 4;
  const cells = new Map();
  const put = (x, y, c) => { const k = x + "," + y; if (!cells.has(k)) cells.set(k, c); };
  for (let i = 0; i < 4; i++) {
    const a = ang + i * Math.PI / 2;
    const ux = Math.cos(a), uy = Math.sin(a);
    const pxv = -uy, pyv = ux;
    // sail cloth (light), drawn first so wood overlays it
    for (let s = 3; s <= L; s++)
      for (let o = -HALF + 1; o <= HALF - 1; o++)
        put(Math.round(hub.x + ux * s + pxv * o), Math.round(hub.y + uy * s + pyv * o), o < 0 ? C.sail[2] : C.sail[3]);
    // two rim rails (staggered so the four sails read distinctly)
    for (let s = (i % 2) + 2; s <= L; s += 2) {
      put(Math.round(hub.x + ux * s - pxv * HALF), Math.round(hub.y + uy * s - pyv * HALF), C.sail[1]);
      put(Math.round(hub.x + ux * s + pxv * HALF), Math.round(hub.y + uy * s + pyv * HALF), C.sail[0]);
    }
    // lattice rungs
    for (let s = 3; s <= L; s += 4) {
      const o0 = -HALF - (i % 2) + 1, o1 = HALF - 1 - (i % 2);
      for (let o = o0; o <= o1; o++)
        put(Math.round(hub.x + ux * s + pxv * o), Math.round(hub.y + uy * s + pyv * o), C.sail[4]);
    }
    // central spine
    for (let s = 2; s <= L; s++)
      put(Math.round(hub.x + ux * s), Math.round(hub.y + uy * s), C.sail[0]);
    // tip cap
    for (let o = -HALF; o <= HALF; o++)
      put(Math.round(hub.x + ux * L + pxv * o), Math.round(hub.y + uy * L + pyv * o), C.sail[0]);
  }
  for (const [k, c] of cells) { const i = k.indexOf(","); px(+k.slice(0, i), +k.slice(i + 1), c); }
  // hub
  disc(hub.x, hub.y, 2, C.sail[0]);
  px(hub.x - 1, hub.y - 1, C.sail[2]); px(hub.x, hub.y - 2, C.sail[2]);
  px(hub.x, hub.y, C.sail[3]);
}

// ---------- frame ----------
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let start = null;
function frame(ts) {
  if (start === null) start = ts;
  const t = reduceMotion ? 0 : (ts - start) / 1000;
  drawSky();
  drawSun();
  drawClouds(t);
  drawBirds(t);
  drawFarBank();
  drawCanal(t);
  drawPath(t);
  drawTulips(t);
  drawWindmill(t);
  const vw = window.innerWidth, vh = window.innerHeight;
  const s2 = Math.max(1, Math.ceil(Math.max(vw / BASE_W, vh / H) - 0.005));
  if (s2 !== scale) {
    scale = s2;
    canvas.style.width = (BASE_W * scale) + "px";
    canvas.style.height = (H * scale) + "px";
  }
  canvas.style.left = Math.round((vw - BASE_W * scale) / 2) + "px";
  canvas.style.top = Math.round((vh - H * scale) / 2) + "px";
  requestAnimationFrame(frame);
}
layout();
fit();
window.addEventListener("resize", fit);
requestAnimationFrame(frame);
</script>
</body>
</html>
