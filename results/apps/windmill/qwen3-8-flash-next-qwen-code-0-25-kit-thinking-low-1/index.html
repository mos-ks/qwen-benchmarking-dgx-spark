<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Windmill in a tulip field at sunset</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1c1740;          /* matches the top of the sky: no white flash, no letterbox seams */
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: manipulation;
  }
  .cap {
    position: fixed;
    left: 12px;
    bottom: 10px;
    z-index: 2;
    font: 500 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #ffd9a8;
    opacity: 0.62;
    text-shadow: 0 1px 0 #150f0c, 0 0 6px rgba(20, 12, 30, 0.9);
    pointer-events: none;
    user-select: none;
  }
  .cap em { font-style: normal; color: #f4756a; }
  noscript {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    color: #ffd9a8;
    font: 500 13px/1.5 ui-monospace, monospace;
  }
</style>
</head>
<body>
<canvas id="scene" aria-label="Pixel-art Dutch windmill turning its sails above a tulip field at sunset" role="img"></canvas>
<p class="cap">Windmill &amp; tulips <em>&#183;</em> sunset</p>
<noscript>This animated pixel-art scene needs JavaScript enabled.</noscript>
<script src="pixel-kit.js"></script>
<script src="scene.js"></script>
</body>
</html>
