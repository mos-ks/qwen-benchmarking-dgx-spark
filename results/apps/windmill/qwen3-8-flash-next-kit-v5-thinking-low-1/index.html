<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windmill in the Tulip Field at Sunset</title>
<style>
  html, body { margin: 0; height: 100%; background: #191c3a; overflow: hidden; }
  canvas { display: block; }
  .caption {
    position: fixed; left: 0; right: 0; bottom: 10px; text-align: center;
    font: 11px/1.4 ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: 2px; text-transform: uppercase;
    color: rgba(255, 226, 200, 0.45); text-shadow: 0 1px 0 rgba(10, 8, 30, 0.8);
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="caption">Windmill &middot; Tulip Field &middot; Sunset</div>
<script src="pixel-kit.js"></script>
<script>
"use strict";
const R = PK.ramps;
PK.light = { x: 1, y: -1 }; // low sun on the right

// ---- palettes (5 shades dark -> light where applicable) ------------------------------------
const SKY   = ["#232a58", "#3c3672", "#6a4378", "#a85478", "#d86a62", "#f08a58", "#f8bc78"];
const WATER = ["#241f46", "#3e3260", "#744a6c", "#c07a68", "#f4c088"]; // far rows light, near dark
const BRICK = ["#38111a", "#6e1e24", "#a63230", "#c95244", "#ea8a62"];
const CAPG  = ["#122e2c", "#1c4438", "#2c6048", "#3f8458", "#6fae66"]; // green thatched cap
const WOOD  = ["#2b1a14", "#4a2c1f", "#6e4430", "#9a6646", "#c79a6b"];
const SAIL  = { base: "#e2cca2", lit: "#fff2cc", shade: "#9a8258", dark: "#5e4a30" };
const GRASS = ["#1c3a22", "#2f6030", "#4d8a3c", "#78b84a", "#a8d868"];
const SOIL  = ["#241612", "#33221a", "#46301f", "#5c4028"];
const TULIPS = [
  ["#7c1024", "#c22a2e", "#ef6a4a"], // red
  ["#8a5a12", "#dfa01e", "#ffdc70"], // yellow
  ["#7a1f5e", "#c04a90", "#f58ac0"], // pink
];
const FAR   = ["#4a3a5c", "#a05a64", "#b08a4e", "#9a5a88"]; // far fields: soil, rose, gold, mauve
const CLOUD = { sh: "#5e4a76", mid: "#a8627c", lit: "#e08e78", rim: "#ffcf9a" };
const BIRD_C = "#37294e";
const SILHOUETTE = "#443860";

// ---- scene state (rebuilt on every resize) ---------------------------------------------------
let L = null, skyLayer = null, scnLayer = null, clouds = [], birds = [], pollen = null;

function buildScene(v) {
  const W = v.W, H = v.H;
  const rnd = PK.rng(20261010);
  L = { W, H };
  L.horizon  = Math.round(H * 0.52);
  L.dikeY    = Math.round(H * 0.635);   // far bank: windmill ground line / canal top
  L.canalBot = Math.round(H * 0.705);
  L.fieldTop = L.canalBot;
  L.vpx = Math.round(W * 0.52);
  L.millX = Math.round(W * 0.40);
  L.sunX = Math.round(W * 0.68);
  L.sunR = Math.max(6, Math.round(Math.min(W, H) * 0.06));
  L.sunY = L.horizon - Math.round(L.sunR * 0.45);
  L.mh = Math.max(34, Math.min(64, Math.round(Math.min(H * 0.30, W * 0.36))));
  L.sailL = Math.round(L.mh * 0.80);

  // windmill key geometry (needed by the live sail drawing too)
  L.towerH = Math.round(L.mh * 0.80);
  L.capH   = Math.max(7, L.mh - L.towerH);
  L.capY   = L.dikeY - L.towerH;
  L.hubX   = L.millX + 1;
  L.hubY   = L.capY - Math.round(L.capH * 0.40);

  // clouds
  clouds = [];
  const nClouds = Math.max(4, Math.round(W / 55));
  for (let i = 0; i < nClouds; i++) {
    const blobs = [];
    const n = 4 + Math.floor(rnd() * 3);
    let bw = 0;
    for (let b = 0; b < n; b++) {
      const w = 5 + Math.floor(rnd() * 11), h = 2 + Math.floor(rnd() * 3);
      blobs.push({ dx: bw + Math.floor(rnd() * 3) - 1, dy: Math.floor(rnd() * 3), w, h });
      bw += w - 2;
    }
    clouds.push({
      x: rnd() * (W + 40) - 20, y: Math.round(H * (0.05 + rnd() * 0.28)),
      sp: 1.5 + rnd() * 2.5, blobs, w: bw,
    });
  }

  // birds
  birds = [];
  for (let i = 0; i < 5; i++) {
    birds.push({
      x: rnd() * W, y: H * (0.06 + rnd() * 0.24),
      sp: 7 + rnd() * 7, ph: rnd() * 6.28, fl: 5 + rnd() * 3,
    });
  }

  // pollen / petals drifting over the field
  pollen = PK.drift({
    n: 16, seed: 77,
    area: [0, L.dikeY, W, H], vx: [-9, -4], vy: [-2, 2], len: [1, 1],
  });

  // perspective tulip rows: anchor x at the bottom edge, converging to (vpx, vpy)
  const vpy = L.fieldTop + 2;
  const step = Math.max(8, Math.round(W / 18));
  const dist = (H - 3) - vpy;
  L.rows = [];
  let ri = 0;
  for (let xb = -0.25 * W; xb < 1.25 * W; xb += step) {
    const col = TULIPS[(ri + (rnd() < 0.3 ? 1 : 0)) % 3];
    const tulips = [];
    for (let tt = 0.04; tt < 0.99; ) {
      const s = tt < 0.34 ? 3 : tt < 0.68 ? 2 : 1;
      tulips.push({ t: tt, s, seed: rnd() * 6.28 });
      tt += (s * 2.4 + 3) / dist;
    }
    L.rows.push({ xb, col, tulips });
    ri++;
  }
  L.vpy = vpy;

  skyLayer = PK.layer(W, H, () => drawSky(W, H, rnd));
  scnLayer = PK.layer(W, H, () => drawScenery(W, H));
}

// ---- sky layer -------------------------------------------------------------------------------
function drawSky(W, H, rnd) {
  PK.gradient(0, 0, W, L.horizon + 2, SKY);
  // sun: dithered halo then disc, half sunk behind the far fields
  PK.glow(L.sunX, L.sunY, L.sunR * 3.4, "#d86a50", 0.5);
  PK.glow(L.sunX, L.sunY, L.sunR * 2.1, "#f8ac6c", 0.75);
  PK.disc(L.sunX, L.sunY, L.sunR, "#ffcf88");
  PK.disc(L.sunX - 1, L.sunY - 1, Math.max(2, L.sunR - 2), "#ffedbe");
  // first faint stars high up
  const s = PK.rng(5);
  for (let i = 0; i < Math.round(W / 6); i++) {
    const x = Math.floor(s() * W), y = Math.floor(s() * H * 0.16);
    if (s() < 0.5) PK.px(x, y, "#8a7aa8");
  }
}

// ---- scenery layer (static): far fields, dike, windmill, banks, soil -------------------------
function drawScenery(W, H) {
  const rnd = PK.rng(99);
  // far fields between horizon and the dike, converging to the vanishing point
  PK.rect(0, L.horizon + 1, W, L.dikeY - L.horizon - 1, FAR[0]);
  const bandH = L.dikeY - 4 - (L.horizon + 1);
  const stripes = Math.max(3, Math.round(bandH / 2));
  for (let i = 0; i < stripes; i++) {
    const y = L.horizon + 1 + Math.round((i / stripes) * bandH);
    const c = FAR[1 + (i + (rnd() < 0.35 ? 1 : 0)) % 3];
    for (let x = 0; x < W; x++) if (PK.bayer(x, y) > 0.18) PK.px(x, y, c);
  }
  // furrows converging to the vanishing point through the far fields
  for (let fx = -0.2 * W; fx < 1.2 * W; fx += 7) {
    const x0 = Math.round(fx);
    for (let yy = L.horizon + 2; yy < L.dikeY - 4; yy++) {
      const t = (yy - (L.horizon + 2)) / Math.max(1, L.dikeY - 6 - (L.horizon + 2));
      const xx = Math.round(x0 + (L.vpx - x0) * t);
      if (xx >= 0 && xx < W) PK.px(xx, yy, FAR[0]);
    }
  }
  drawFarBank(W);
  drawFarBackground(W);
  drawWindmill(L.millX, L.dikeY, L.mh);
  drawNearBankAndField(W, rnd);
}

// ---- far background: tree line, reeds, a distant mill ----------------------------------------
function drawFarBackground(W) {
  const rnd = PK.rng(4242);
  const y0 = L.horizon;
  // tree line clusters
  let x = 0;
  while (x < W) {
    x += 4 + Math.floor(rnd() * 10);
    const r = 1 + Math.floor(rnd() * 2);
    PK.disc(x, y0 - r, r, SILHOUETTE);
    if (rnd() < 0.3) { // reed tuft
      for (let k = 1; k <= 2 + Math.floor(rnd() * 3); k++) PK.px(x + 2, y0 - k, SILHOUETTE);
      PK.px(x + 2, y0 - 4 - Math.floor(rnd() * 2), "#5a4a74");
    }
  }
  // tiny distant windmill, its sails a static cross
  const mx = Math.round(W * 0.16), my = y0;
  for (let j = 0; j < 9; j++) {
    const hw = Math.max(1, Math.round(2.5 - j * 0.15));
    PK.rect(mx - hw, my - 2 - j, hw * 2 + 1, 1, SILHOUETTE);
  }
  PK.line(mx, my - 12, mx, my - 20, SILHOUETTE);
  PK.line(mx - 4, my - 14, mx + 4, my - 22, SILHOUETTE);
  PK.line(mx + 4, my - 14, mx - 4, my - 22, SILHOUETTE);
}

// ---- canal banks -------------------------------------------------------------------------------
function drawFarBank(W) {
  for (let x = 0; x < W; x++) {
    const lit = PK.bayer(x, L.dikeY) > 0.4;
    PK.px(x, L.dikeY - 3, GRASS[1]);
    PK.px(x, L.dikeY - 2, lit ? GRASS[2] : GRASS[1]);
    PK.px(x, L.dikeY - 1, lit ? GRASS[3] : GRASS[2]);
  }
}
function drawNearBankAndField(W, rnd) {
  // near bank edge
  for (let x = 0; x < W; x++) {
    const lit = PK.bayer(x, L.canalBot) > 0.5;
    PK.px(x, L.canalBot, lit ? GRASS[2] : GRASS[1]);
    PK.px(x, L.canalBot + 1, GRASS[1]);
    PK.px(x, L.canalBot + 2, GRASS[0]);
  }
  // soil body with dither
  for (let y = L.canalBot + 3; y < L.H; y++) {
    for (let x = 0; x < W; x++) {
      const b = PK.bayer(x, y);
      PK.px(x, y, b < 0.3 ? SOIL[0] : b < 0.75 ? SOIL[1] : SOIL[2]);
    }
  }
  // furrow lines converging to the vanishing point
  for (const row of L.rows) {
    const x0 = Math.round(row.xb);
    for (let y = L.H - 1; y > L.vpy + 1; y--) {
      const t = (L.H - 3 - y) / Math.max(1, (L.H - 3) - L.vpy);
      const xx = Math.round(x0 + (L.vpx - x0) * t);
      if (xx >= 0 && xx < W) PK.px(xx, y, SOIL[0]);
    }
  }
}

// ---- windmill (static parts) -------------------------------------------------------------------
function drawWindmill(x, baseY, mh) {
  const rnd = PK.rng(31);
  const bw = Math.max(16, Math.round(mh * 0.52));
  const tw = Math.max(9, Math.round(mh * 0.30));
  const towerH = L.towerH, capY = L.capY, capH = L.capH;

  // dirt patch the mill stands on, with a path to the door and a contact shadow
  PK.ellipse(x, baseY - 1, Math.round(bw * 0.75) + 3, 3, SOIL[1]);
  PK.ellipse(x - 1, baseY - 2, Math.round(bw * 0.72), 2, SOIL[2]);
  PK.ellipse(x - Math.round(bw * 0.3), baseY - 2, Math.round(bw * 0.4), 2, SOIL[0]); // shadow, left (away from sun)
  PK.rect(x - 2, baseY - 3, 5, 3, SOIL[2]); // path stub below the door
  PK.px(x - 2, baseY - 3, SOIL[1]); PK.px(x + 2, baseY - 3, SOIL[1]);

  // brick plinth
  PK.rect(x - bw / 2 - 2, baseY - 3, bw + 4, 3, BRICK[0]);
  PK.rect(x - bw / 2 - 2, baseY - 3, bw + 4, 1, BRICK[2]);

  // tapered brick tower, shaded: sun from the right
  for (let j = 0; j < towerH; j++) {
    const y = baseY - 3 - j;
    const hw = Math.round((bw + (tw - bw) * (j / (towerH - 1))) / 2);
    for (let i = -hw; i <= hw; i++) {
      const u = (i + hw) / Math.max(1, 2 * hw); // 0 left -> 1 right
      let c = BRICK[2];
      if (i === -hw) c = BRICK[0];
      else if (u < 0.18) c = BRICK[1];
      else if (u > 0.82) c = BRICK[3];
      else if (u > 0.93) c = BRICK[4];
      if (c === BRICK[2] && rnd() < 0.07) c = rnd() < 0.6 ? BRICK[1] : BRICK[3];
      if ((baseY - 3 - j) % 4 === 0 && PK.bayer(x + i, y) < 0.25 && c === BRICK[2]) c = BRICK[1];
      PK.px(x + i, y, c);
    }
  }
  const hwAt = (y) => Math.round((bw + (tw - bw) * ((baseY - 3 - y) / (towerH - 1))) / 2);

  // gallery (balcony) at ~45% height
  const gy = baseY - Math.round(towerH * 0.45);
  const gw = hwAt(gy);
  PK.rect(x - gw - 3, gy, 2 * gw + 6, 2, WOOD[1]);
  PK.rect(x - gw - 3, gy, 2 * gw + 6, 1, WOOD[3]);
  for (let i = -gw - 2; i <= gw + 2; i += 3) PK.px(x + i, gy - 1, WOOD[2]); // railing posts
  PK.line(x - gw, gy + 2, x - gw + 2, gy + 5, WOOD[0]); // struts
  PK.line(x + gw, gy + 2, x + gw - 2, gy + 5, WOOD[0]);

  // cap: rounded thatched dome
  const rim = tw / 2 + 2;
  for (let k = 0; k <= capH; k++) {
    const y = capY - k;
    const f = k / capH;
    const hw = Math.round(rim * (1 - 0.72 * f * f));
    for (let i = -hw; i <= hw; i++) {
      const u = (i + hw) / Math.max(1, 2 * hw);
      let c = CAPG[1];
      if (i === -hw || k === capH) c = CAPG[0];
      else if (u > 0.7) c = CAPG[3];
      if (k === 0) c = CAPG[0];
      PK.px(x + i, y, c);
    }
  }
  PK.line(x + Math.round(rim * 0.55), capY - 1, x + Math.round(rim * 0.4), capY - capH + 1, CAPG[4]); // sunlit rib
  PK.px(x, capY - capH - 1, WOOD[3]); // finial stock
  PK.px(x, capY - capH - 2, WOOD[4]);

  // tailpole down to the right (sun side), with struts
  const tx0 = x + Math.round(tw / 2) + 1, ty0 = capY + 3;
  const tx1 = x + Math.round(bw / 2) + Math.round(mh * 0.22), ty1 = baseY - 4;
  PK.line(tx0, ty0, tx1, ty1, WOOD[0]);
  PK.line(tx0 + 1, ty0, tx1 + 1, ty1, WOOD[2]);
  for (let f = 0.15; f < 1; f += 0.18) {
    const px2 = tx0 + (tx1 - tx0) * f, py2 = ty0 + (ty1 - ty0) * f;
    PK.line(px2 - 2, py2 - 1, px2 + 2, py2 + 1, WOOD[1]);
  }

  // door (arched, lit seam) and step
  const dw = Math.max(5, Math.round(bw * 0.34)), dh = Math.max(6, Math.round(towerH * 0.24));
  const dx = x - Math.round(dw / 2);
  PK.rect(dx, baseY - 3 - dh, dw, dh, WOOD[1]);
  PK.rect(dx, baseY - 3 - dh, 1, dh, WOOD[0]);
  PK.rect(dx + dw - 1, baseY - 3 - dh, 1, dh, WOOD[0]);
  PK.rect(dx + 1, baseY - 4 - dh, dw - 2, 1, WOOD[0]); // arch top
  PK.rect(dx + dw - 2, baseY - 3 - dh + 1, 1, dh - 1, WOOD[3]); // sunlit right seam
  PK.rect(dx - 1, baseY - 3, dw + 2, 1, WOOD[3]); // step

  // windows: small lit squares with mullions and a warm glow
  const win = (wy, n) => {
    const hw2 = hwAt(wy);
    const wx = x - 1;
    PK.glow(x, wy, 4, "#f2a33a", 0.28);
    PK.rect(wx, wy, n, n, R.warmLight[2]);
    PK.rect(wx, wy, 1, n, R.warmLight[1]);
    PK.px(wx + 1, wy, R.warmLight[3]);
    PK.px(wx + Math.floor(n / 2), wy, R.warmLight[0]); // mullion
    PK.px(wx + Math.floor(n / 2), wy + 1, R.warmLight[0]);
    PK.rect(wx - 1, wy + n, n + 2, 1, WOOD[1]); // sill
  };
  win(baseY - 3 - Math.round(towerH * 0.62), 3);
  win(baseY - 3 - Math.round(towerH * 0.84), 3);
}

// ---- live drawing ------------------------------------------------------------------------------
function drawCloud(cx, cy, blobs) {
  for (const b of blobs) PK.rect(cx + b.dx, cy + b.dy, b.w, b.h, CLOUD.sh);
  for (const b of blobs) PK.rect(cx + b.dx + 1, cy + b.dy - 1, b.w - 1, b.h, CLOUD.mid);
  for (const b of blobs) PK.rect(cx + b.dx + 2, cy + b.dy - 2, Math.max(1, b.w - 2), Math.max(1, b.h - 1), CLOUD.lit);
  for (const b of blobs) {
    if (b.dy <= 1) {
      PK.rect(cx + b.dx + b.w - 1, cy + b.dy - 1, 1, b.h, CLOUD.rim); // sunlit right rim
      PK.px(cx + b.dx + b.w, cy + b.dy - 1, CLOUD.rim);
    }
  }
}

const BIRD_UP = ["x...x", ".x.x."];
const BIRD_DN = [".x.x.", "x...x"];
const BIRD_PAL = { x: BIRD_C };

function drawBirds(t) {
  for (const b of birds) {
    const bx = Math.round(((b.x + t * b.sp) % (L.W + 20)) - 10);
    const by = Math.round(b.y + Math.sin(t * 0.5 + b.ph) * 2);
    PK.sprite(Math.sin(t * b.fl + b.ph) > 0 ? BIRD_UP : BIRD_DN, BIRD_PAL, bx, by);
  }
}

function drawWater(t) {
  PK.sea(0, L.dikeY, L.W, L.canalBot, t, WATER);
  // sunset glint on the canal below the sun
  const depth = L.canalBot - L.dikeY;
  for (let k = 0; k < depth; k++) {
    const y = L.dikeY + k;
    const wob = Math.round(Math.sin(t * 2.2 + k * 0.8) * 2);
    for (let dx = -L.sunR; dx <= L.sunR; dx++) {
      const x = L.sunX + dx + wob;
      if (x < 0 || x >= L.W) continue;
      const a = (1 - Math.abs(dx) / L.sunR) * (1 - (k / depth) * 0.55);
      if (PK.bayer(x, y + Math.floor(t * 6)) < a * 0.85)
        PK.px(x, y, a > 0.55 ? "#ffedbe" : "#f4b878");
    }
  }
}

function drawReeds(t) {
  const rnd = PK.rng(808);
  for (let x = 2; x < L.W; x += 7 + Math.floor(rnd() * 5)) {
    const h = 2 + Math.floor(rnd() * 3);
    const sw = Math.round(Math.sin(t * 1.6 + x) * 0.9);
    for (let k = 0; k < h; k++) PK.px(x + (k > 1 ? sw : 0), L.canalBot - 1 - k, "#1c4438");
    PK.px(x + sw, L.canalBot - 1 - h, "#3f8458");
  }
}

function drawTulip(x, y, s, col, sway) {
  const stemH = 2 * s + 1;
  const sw = Math.max(1, Math.round(s * 0.5));
  PK.rect(x - (sw >> 1), y - stemH, sw, stemH + 1, GRASS[1]);
  if (s >= 2) {
    PK.line(x, y - 1, x - s, y - s, GRASS[2]);
    PK.line(x + sw - 1, y - 2, x + s, y - s - 1, GRASS[1]);
  } else {
    PK.line(x, y - 1, x - 1, y - 2, GRASS[2]);
  }
  const fx = x + sway, fy = y - stemH;
  const fh = 2 * s;
  PK.rect(fx - s, fy - fh + 1, s * 2 + 1, fh, col[1]);
  for (let k = 0; k < s; k++) PK.px(fx, fy - fh + 1 + k, col[0]); // petal seam
  PK.px(fx - s, fy - fh + 1, col[0]);
  PK.px(fx + s, fy - fh + 1, col[2]);
  PK.rect(fx + s, fy - fh + 2, 1, fh - 2, col[2]); // sunlit right edge
  PK.px(fx - s, fy, col[0]);
}

function drawField(t) {
  for (const row of L.rows) {
    for (const tp of row.tulips) {
      const x = Math.round(row.xb + (L.vpx - row.xb) * tp.t);
      const y = Math.round((L.H - 3) + (L.vpy - (L.H - 3)) * tp.t);
      if (x < -4 || x >= L.W + 4) continue;
      const sway = Math.round(Math.sin(t * 1.9 + tp.seed) * (0.5 + 0.55 * tp.s));
      drawTulip(x, y, tp.s, row.col, sway);
    }
  }
}

function drawSails(t) {
  const hubX = L.hubX, hubY = L.hubY, len = L.sailL;
  for (let k = 0; k < 4; k++) {
    const a = t * 0.42 + (k * Math.PI) / 2;
    const ca = Math.cos(a), sa = Math.sin(a);
    const pxx = -sa, pyy = ca; // perpendicular (windward side)
    const pt = (f, o) => [hubX + ca * len * f + pxx * o, hubY + sa * len * f + pyy * o];
    const lit = ca - sa > 0; // sun from upper right
    const cRail = lit ? SAIL.lit : SAIL.base;
    // whip / stock, 2 px wide
    const [x0, y0] = pt(0, 0), [x1, y1] = pt(1, 0);
    PK.line(x0, y0, x1, y1, SAIL.dark);
    const [x0b, y0b] = pt(0, 1), [x1b, y1b] = pt(1, 1);
    PK.line(x0b, y0b, x1b, y1b, lit ? WOOD[2] : WOOD[1]);
    // lattice panel: bright outer rails, dark rungs so the frame reads as open lattice
    const [a1x, a1y] = pt(0.22, 3), [a2x, a2y] = pt(1, 3);
    const [b1x, b1y] = pt(0.22, 7), [b2x, b2y] = pt(1, 7);
    PK.line(a1x, a1y, a2x, a2y, lit ? SAIL.base : SAIL.shade);
    PK.line(b1x, b1y, b2x, b2y, cRail);
    const nRungs = Math.max(4, Math.round(len / 3.5));
    for (let r = 0; r <= nRungs; r++) {
      const f = 0.22 + (0.78 * r) / nRungs;
      const [rx, ry] = pt(f, 1);
      const [rx2, ry2] = pt(f, 7);
      PK.line(rx, ry, rx2, ry2, r % 2 ? SAIL.dark : SAIL.shade);
    }
  }
  PK.disc(hubX, hubY, 2, "#241a12");
  PK.px(hubX - 1, hubY - 1, WOOD[3]);
}

// ---- frame loop ----------------------------------------------------------------------------------
PK.fit(document.getElementById("c"), 150, buildScene);
PK.loop((t, dt) => {
  if (!L) return;
  PK.blit(skyLayer);
  drawBirds(t);
  for (const c of clouds) {
    const cx = Math.round(((c.x + t * c.sp) % (L.W + c.w + 40)) - c.w - 20);
    drawCloud(cx, c.y, c.blobs);
  }
  PK.blit(scnLayer);
  drawWater(t);
  drawReeds(t);
  drawField(t);
  pollen.step(dt);
  pollen.dots(["#f0c8a0", "#e8a8b0", "#f8e0b8"]);
  drawSails(t);
});
</script>
</body>
