# A harder full-stack app: accounts and sessions, per-user privacy, keyset pagination, lost-update
# protection and idempotent retries, plus a web UI. Each hidden mode targets one concern a "looks done"
# app gets wrong (403 instead of 404, offset paging that drops ties, last write wins, retries that
# duplicate), so partial credit shows which ones the agent handled.

- id: notes-fullstack
  input: |
    Build the team notes app described in README.md, with tests.
  tags: [coding, fullstack, http, sqlite, auth, ui, greenfield, hard]
  vars:
    scaffold: fs_notes
  expect:
    workspace_commands:
      - run: [python3, -I, "hidden-tests/notes_hidden_test.py", auth]
        must_exit: 0
        weight: 1
      - run: [python3, -I, "hidden-tests/notes_hidden_test.py", isolation]
        must_exit: 0
        weight: 1
      - run: [python3, -I, "hidden-tests/notes_hidden_test.py", pagination]
        must_exit: 0
        weight: 1
      - run: [python3, -I, "hidden-tests/notes_hidden_test.py", concurrency]
        must_exit: 0
        weight: 1
      - run: [python3, -I, "hidden-tests/notes_hidden_test.py", idempotency]
        must_exit: 0
        weight: 1
      - run: [python3, -I, "hidden-tests/notes_hidden_test.py", restart]
        must_exit: 0
        weight: 1
      - run: ["python3", "-I", "hidden-tests/notes_hidden_test.py", ui]
        must_exit: 0
        weight: 3
      - run: ["python3", "-I", "-c", "import pathlib,sys;t=[p for p in pathlib.Path('tests').rglob('*') if p.is_file() and p.name!='.keep' and '__pycache__' not in p.parts];print('own tests:',[str(p) for p in t]);sys.exit(0 if t else 1)"]
        must_exit: 0
        weight: 1
