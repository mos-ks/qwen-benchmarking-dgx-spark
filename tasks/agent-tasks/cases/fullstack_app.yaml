# A full-stack app from a README contract: one process serving a JSON API, SQLite persistence and a
# web UI. Hidden tests start the app the README way, exercise the API, restart it, and drive the UI
# in a real browser, so "looks done" without working end to end scores low.

- id: plants-fullstack
  input: |
    Build the plant care app described in README.md, with tests.
  tags: [coding, fullstack, http, sqlite, ui, greenfield, hard]
  vars:
    scaffold: fs_plants
  expect:
    workspace_commands:
      - run: [python3, -I, "hidden-tests/plants_hidden_test.py", create]
        must_exit: 0
        weight: 1
      - run: [python3, -I, "hidden-tests/plants_hidden_test.py", validation]
        must_exit: 0
        weight: 1
      - run: [python3, -I, "hidden-tests/plants_hidden_test.py", water]
        must_exit: 0
        weight: 1
      - run: [python3, -I, "hidden-tests/plants_hidden_test.py", sort]
        must_exit: 0
        weight: 1
      - run: [python3, -I, "hidden-tests/plants_hidden_test.py", delete]
        must_exit: 0
        weight: 1
      - run: [python3, -I, "hidden-tests/plants_hidden_test.py", restart]
        must_exit: 0
        weight: 1
      - run: ["python3", "-I", "hidden-tests/plants_hidden_test.py", ui]
        must_exit: 0
        weight: 3
      - run: ["python3", "-I", "-c", "import pathlib,sys;t=[p for p in pathlib.Path('tests').rglob('*') if p.is_file() and p.name!='.keep'];print('own tests:',[str(p) for p in t]);sys.exit(0 if t else 1)"]
        must_exit: 0
        weight: 1
